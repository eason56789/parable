/* ==================================================================
   send / run
   ================================================================== */
function sync() {
  const has = !!(ta.value.trim() || ATTS.length);
  const stop = !!(busy && !has);
  sd.innerHTML = ic(stop ? 'stop' : 'send');
  // 附件还在上传时也禁用发送（上传失败的会被移出列表）
  sd.disabled = (!stop && !has) || ATTS.some(a => a.loading);
  sd.title = stop ? (S.lang === 'zh' ? '终止本轮' : 'Stop this turn')
    : (S.lang === 'zh' ? '发送' : 'Send');
}

// 首条消息尚无会话 id 时点停止：先记标记，拿到 sessionId 后补发 interrupt
let pendingInterrupt = false;

let runStarting = false;

/** 把编辑时暂时摘下的消息节点原样插回去（服务端从未截断）。 */
function restorePendingEdit() {
  const pe = pendingEdit;
  if (!pe) return;
  pendingEdit = null;
  const parent = pe.parent;
  if (!parent || !pe.nodes || !pe.nodes.length) return;
  const ref = pe.anchor && pe.anchor.parentNode === parent ? pe.anchor.nextSibling : parent.firstChild;
  pe.nodes.forEach(n => { try { parent.insertBefore(n, ref); } catch (e) {} });
}

async function run(q) {
  if (busy || runStarting) return;
  if (!modelOk()) {
    toast(t('select_model'));
    document.querySelectorAll('.pop.open').forEach(p => p.classList.remove('open'));
    renderMM();
    $('#mm').classList.add('open');
    return;
  }
  if (ATTS.some(a => a.loading)) { toast(t('att_uploading')); return; }

  // 编辑用户消息时只在本地藏起尾部；真正 DELETE 放到发送这一刻。删除失败
  // 就把节点和草稿都还回去，历史不会因为“点了编辑又取消”而永久截断。
  if (pendingEdit) {
    const pe = pendingEdit;
    if (!conv || !conv.id || pe.sid !== conv.id || pe.gen !== convGen) {
      // 会话已经不是当初编辑的那个：节点还原，别让消息凭空消失。
      restorePendingEdit();
    } else {
      runStarting = true;
      try {
        await api('/sessions/' + pe.sid + '/messages', { method: 'DELETE', body: { from: pe.from } });
        pendingEdit = null;
      } catch (e) {
        restorePendingEdit();
        ta.value = q;
        fit();
        sync();
        toast(e.message);
        runStarting = false;
        return;
      }
      runStarting = false;
    }
  }

  const atts = ATTS.slice();
  ATTS = [];
  renderAtts();
  resetTurn();
  pendingInterrupt = false;

  const title = q ? q.slice(0, 28) : (atts[0] ? atts[0].name : '附件');
  if (!conv) {
    conv = { id: null, title, workspace: '', pendingText: q || '' };
    document.body.classList.add('chat');
    $('#ttl').textContent = noEmoji(title);
    apply();
  } else if (!conv.id) {
    conv.pendingText = q || '';
  }

  const userNode = uMsg(q, null, atts);
  const gen = convGen;
  const mySid = conv.id || null;
  // 只有这个窗口允许 session.start / turn.start 认领会话 id。
  awaitingSession = true;
  pendingSid = mySid;
  expectBubble = true;
  busy = true;
  sig = { stop: false };
  sync();
  // 事件丢失自愈：核对服务端是否还在跑这一轮。
  startTurnProbe();

  try {
    const res = await api('/chat', {
      method: 'POST',
      body: {
        session_id: mySid || '',
        text: q,
        attachments: atts.filter(a => a.path).map(a => ({ path: a.path, name: a.name, size: a.size })),
        model: S.model,
        permission_mode: S.perm,
        // 契约：永远发 0-3，0 = 显式关闭思考
        thinking_level: Math.max(0, Math.min(3, +S.lvl || 0)),
        plan_mode: !!S.plan
      }
    });
    // 等待期间用户切走/新建会话：这个响应不属于当前界面。
    if (gen !== convGen || !conv) return;
    if (res && res.sessionId) {
      if (!conv.id) {
        conv.id = res.sessionId;
        conv.title = title;
        $('#ttl').textContent = noEmoji(title);
        addRc({ id: conv.id, t: title, ts: Date.now() });
        loadSessions(true);
        refreshGoalBadge();
        // 绑定之前到达的增量被归属守卫挡在 DOM 外，只进了 SHADOW。这里补一次
        // 重放，否则开头的思考块 / 工具卡 / 正文会整段缺失。只在本轮还没画过
        // 任何内容时才做，避免和已经渲染的部分重复。
        const sh = SHADOW[conv.id];
        if (!curA && sh && ((sh.events || []).length || (sh.text || '').trim())) {
          startTurnUI();
          (sh.events || []).forEach(replayEvent);
          if ((sh.text || '').trim()) {
            curStream = null;
            renderBlocks(curA.querySelector('.ab'), sh.text);
            curText = (curText || '') + sh.text;
            follow();
          }
          delete SHADOW[conv.id];
        }
      } else if (conv.id !== res.sessionId) {
        // 迟到的 session.start 曾把界面绑到上一次失败尝试的会话上。POST 响应
        // 才是本轮真正的会话，强制改绑，否则本轮回答的事件会被归属守卫全丢。
        conv.id = res.sessionId;
        ignoreSid = '';
        addRc({ id: conv.id, t: conv.title || title, ts: Date.now() });
        loadSessions(true);
        refreshGoalBadge();
      }
      // 上一次失败尝试可能把本会话标成了 ignoreSid，这里自愈。
      if (ignoreSid && ignoreSid === conv.id) ignoreSid = '';
      // 首条消息期间按了停止：现在才有会话 id，补发 interrupt。用本轮冻结的
      // 目标 id，不能用“当前” conv.id，否则切走后会中断别的会话。
      if (pendingInterrupt) {
        pendingInterrupt = false;
        api('/interrupt', { method: 'POST', body: { session_id: mySid || conv.id } }).catch(() => {});
      }
      // turn.start 若在断线时丢了，这里补一次轮询。
      startTurnProbe();
    }
  } catch (e) {
    if (gen !== convGen || !conv) return;   // 会话已切走，别把错误画进新会话
    busy = false;
    expectBubble = false;
    stopSpin(curA);
    sync();
    // 服务端还没接住这条消息（没有 turn.start / curA）时整体回滚到发送前：
    // 撤掉乐观气泡，把文字和附件还给输入框。已经开始的轮次保留气泡。
    const started = !!curA || !!(conv.id && INFLIGHT[conv.id]);
    if (!started) {
      if (userNode && userNode.isConnected) userNode.remove();
      ATTS = atts;
      renderAtts();
      if (!ta.value.trim()) { ta.value = q; fit(); }
      resetTurn();
      // 这次尝试被整体回滚 = 服务端不会为它建会话。立刻关掉认领窗口，否则
      // 15 秒内迟到的 session.start 会把界面绑到一个已经丢弃的会话上。
      awaitingSession = false;
      pendingSid = null;
      toast(e.message);
      follow();
    } else {
      toast(e.message);
      if (!curA) curA = aMsg(null, false, Date.now());
      const p = document.createElement('p');
      p.style.color = '#f87171';
      p.dataset.err = '1';
      p.textContent = '⚠ ' + e.message;
      if (curA) curA.querySelector('.ab').append(p);
      follow();
    }
  } finally {
    if (conv && conv.id) {
      awaitingSession = false;
      pendingSid = null;
    } else {
      // 新会话的 id 可能晚于响应到达：留一个短窗口给 session.start，不能
      // 立刻关死，否则事件会被归属守卫全部丢掉。带 !busy 门控：15 秒内用户
      // 可能已经重发了一轮，那个新窗口有自己的清理逻辑，别被旧定时器掐掉。
      setTimeout(() => {
        if (gen === convGen && !busy && (!conv || !conv.id)) {
          awaitingSession = false;
          pendingSid = null;
        }
      }, 15000);
    }
  }
}

/* ------------------------------------------------ /compact 与 /goal 命令 */
/* 插件命令（来自 /plugins 的命令模板，{{input}} 为斜杠后的参数） */
let PLUGIN_CMDS = [];
async function loadPluginCmds() {
  try {
    const r = await api('/plugins');
    PLUGIN_CMDS = (r.plugins || []).filter(p => p.enabled)
      .flatMap(p => (p.commands || []).filter(c => c.template));
  } catch (e) { PLUGIN_CMDS = []; }
}
loadPluginCmds();
let COMPACTING = false;
async function runCompact() {
  const z = S.lang === 'zh';
  if (COMPACTING) return;
  if (!conv || !conv.id) { toast(z ? '先发一条消息建立会话' : 'Start a chat first'); return; }
  COMPACTING = true;
  // 压缩要走一次摘要模型调用，几秒到几十秒——先挂一条进度，别让界面像没反应。
  const note = document.createElement('div');
  note.className = 'cnote';
  note.innerHTML = '<i class="sp"></i><span class="cntx"></span>';
  const t0 = Date.now();
  const paint = () => {
    const el = note.querySelector('.cntx');
    if (el) el.textContent = (z ? '正在压缩上下文… ' : 'Compacting context… ') + Math.round((Date.now() - t0) / 1000) + 's';
  };
  paint();
  feed.append(note);
  chat.scrollTop = chat.scrollHeight;
  const tick = setInterval(paint, 1000);
  try {
    const r = await api('/sessions/' + conv.id + '/compact', { method: 'POST' });
    clearInterval(tick);
    note.remove();
    const folded = r.folded || 0;
    if (!folded) {
      toast(z ? '没有可压缩的早期消息（保留最近几条）' : 'Nothing to compact yet (recent turns kept)');
      return;
    }
    await openSession(conv.id);
    const done = document.createElement('div');
    done.className = 'cnote';
    done.innerHTML = '<b>' + (z ? '上下文已压缩' : 'Context compacted') + '</b><span>' +
      (z ? ('折叠 ' + folded + ' 条早期消息 · ' + (r.before || '?') + ' → ' + (r.after || '?') + ' 条')
         : ('folded ' + folded + ' old messages · ' + (r.before || '?') + ' → ' + (r.after || '?') + ' messages')) +
      '</span>';
    feed.prepend(done);
  } catch (e) {
    clearInterval(tick);
    note.remove();
    toast(e.message);
  } finally { COMPACTING = false; }
}

/**
 * /clear：服务端与本地一起清。DELETE /api/sessions/:id/messages
 * body {from: 0}（TruncateReq.from=0，to 缺省 = 截到末尾）。
 */
async function clearConv() {
  // 生成中清空会让 curA 指向被删掉的节点，这一轮的输出既看不见也存不下。
  if (busy) { toast(S.lang === 'zh' ? '生成中无法清空对话' : 'Cannot clear while a turn is running'); return; }
  try {
    if (conv && conv.id) {
      await api('/sessions/' + conv.id + '/messages', { method: 'DELETE', body: { from: 0 } });
    }
    releaseFeedBlobs();
    feed.innerHTML = '';
    resetTurn();
    // 服务端已从 0 截断：之前暂存的编辑下标全部失效，别再拿它去 DELETE。
    pendingEdit = null;
    // 会话本身还在，但这一轮的在途标记全部作废。
    expectBubble = false;
    awaitingSession = false;
    pendingSid = null;
    stopTurnProbe();
    toast(t('clear'));
  } catch (e) { toast(e.message); }
}

/** /status：GET /api/status 渲染成一条对话内的状态卡片。 */
async function runStatus() {
  const z = S.lang === 'zh';
  let txt;
  try {
    const r = await api('/status');
    txt = (z ? '服务状态' : 'Server status') + '\n' +

      '· ' + (z ? '思考强度' : 'thinking') + ': ' + t('l' + (r.thinkingLevel != null ? r.thinkingLevel : 2)) + '\n' +
      '· ' + (z ? '工作区' : 'workspace') + ': ' + (r.workspace || '-');
  } catch (e) { toast(e.message); return; }

function goalStatusLabel(s) {
  const z = S.lang === 'zh';
  return s === 'paused' ? (z ? '已暂停' : 'paused')
    : s === 'complete' ? (z ? '已完成' : 'complete')
    : (z ? '进行中' : 'active');
}

async function runGoal(arg) {
  const z = S.lang === 'zh';
  if (!conv || !conv.id) { toast(z ? '先发一条消息建立会话' : 'Start a chat first'); return; }
  try {
    if (!arg) {
      const r = await api('/sessions/' + conv.id + '/goal');
      if (r.goal) {
        toast('◎ ' + goalStatusLabel(r.goal.status) + ' · ' + r.goal.objective.slice(0, 60) +
          ' · 第 ' + (r.goal.rounds + 1) + '/' + r.goal.max_rounds + ' 轮');
      } else {
        toast(z ? '当前没有持久目标。用 /goal <目标> 设置' : 'No goal. Use /goal <objective>');
      }
      refreshGoalBadge();
      return;
    }
    const action = ['pause', 'resume', 'clear'].includes(arg) ? arg : 'set';
    await api('/sessions/' + conv.id + '/goal', {
      method: 'POST',
      body: action === 'set' ? { action: 'set', objective: arg } : { action }
    });
    toast(action === 'clear' ? (z ? '目标已清除' : 'Goal cleared')
      : action === 'pause' ? (z ? '目标已暂停' : 'Goal paused')
      : action === 'resume' ? (z ? '目标已恢复' : 'Goal resumed')
      : (z ? '目标已设置，完成前会自动续跑' : 'Goal set — it will keep working on it'));
    refreshGoalBadge();
  } catch (e) { toast(e.message); }
}

/** 刷新输入框上方的持久目标徽标。 */
async function refreshGoalBadge() {
  const el = $('#goalbar');
  if (!el) return;
  if (!conv || !conv.id) { el.className = ''; el.innerHTML = ''; return; }
  const sid = conv.id, gen = convGen;
  try {
    const r = await api('/sessions/' + sid + '/goal');
    // 旧会话的 goal 不能画进新会话，按钮更不能拿新 conv.id 去暂停/清除。
    if (gen !== convGen || !conv || conv.id !== sid) return;
    if (!r.goal) { el.className = ''; el.innerHTML = ''; return; }
    const g = r.goal;
    const z = S.lang === 'zh';
    el.className = 'on' + (g.status !== 'active' ? ' ' + g.status : '');
    el.innerHTML = '<span class="gdot"></span><b>' + (z ? '目标' : 'Goal') + ' · ' + goalStatusLabel(g.status) + '</b><span class="gt"></span>' +
      (g.status === 'active'
        ? '<button data-g="pause">' + (z ? '暂停' : 'Pause') + '</button>'
        : g.status === 'paused' ? '<button data-g="resume">' + (z ? '继续' : 'Resume') + '</button>' : '') +
      '<button data-g="clear">' + (z ? '清除' : 'Clear') + '</button>';
    el.querySelector('.gt').textContent = g.objective +
      (g.max_rounds ? ' · 第 ' + (g.rounds + 1) + '/' + g.max_rounds + ' 轮' : '');
    el.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        if (gen !== convGen || !conv || conv.id !== sid) return;
        runGoal(b.dataset.g);
      };
    });
  } catch (e) { /* 会话未建立等场景静默 */ }
}

/** Stop the in-flight turn; first-message turns defer until the session id exists. */
function stopTurn() {
  if (sig) sig.stop = true;
  if (conv && conv.id) api('/interrupt', { method: 'POST', body: { session_id: conv.id } }).catch(() => {});
  else pendingInterrupt = true;
}

function send(force) {
  const q = ta.value.trim();
  // run() 正在提交「编辑消息」的截断请求：此时 busy 还是 false，若放行会
  // 先清空输入框再被 runStarting 挡下，用户刚打的字就凭空消失了。
  if (runStarting) {
    toast(S.lang === 'zh' ? '正在提交上一条编辑，请稍候' : 'Committing your previous edit…');
    return;
  }
  if (busy) {
    if (!q && !ATTS.length) { stopTurn(); return; }
    if (!conv || !conv.id) {
      toast(S.lang === 'zh' ? '首条消息还在建立会话，等它开始后再补充' : 'Wait for the first turn to create the session');
      return;
    }
    if (ATTS.some(a => a.loading)) { toast(t('att_uploading')); return; }
    let mode = S.followupMode === 'steer' ? 'steer' : 'queue';
    if (force === 'toggle') mode = mode === 'steer' ? 'queue' : 'steer';
    if (mode === 'steer' && ATTS.length) {
      mode = 'queue';
      toast(S.lang === 'zh' ? '引导暂不支持附件，已改为排队' : 'Steer cannot carry attachments; queued instead');
    }
    sendPending(q, ATTS.slice(), mode);
    return;
  }
  if (!q && !ATTS.length) return;
  // 附件还在上传：提示并保留输入，不吞掉用户文字
  if (ATTS.some(a => a.loading)) { toast(t('att_uploading')); return; }
  // 插件命令：/name <参数> → 展开模板后作为提示词发送
  for (const pc of (PLUGIN_CMDS || [])) {
    const re = new RegExp('^/' + pc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s+([\\s\\S]*))?$', 'i');
    const m = q.match(re);
    if (m && !ATTS.length) {
      ta.value = '';
      fit();
      slClose();
      run(pc.template.replace(/\{\{\s*input\s*\}\}/g, (m[1] || '').trim()));
      return;
    }
  }
  // 斜杠命令不进模型：/compact 压缩上下文；/goal 持久目标；/status 服务状态
  const cmd = q.match(/^\/(compact|goal|status)(?:\s+([\s\S]*))?$/i);
  if (cmd && !ATTS.length) {
    ta.value = '';
    fit();
    slClose();
    const k = cmd[1].toLowerCase();
    if (k === 'compact') runCompact();
    else if (k === 'status') runStatus();
    else runGoal((cmd[2] || '').trim());
    return;
  }
  ta.value = '';
  fit();
  slClose();
  run(q);
}


const fit = () => {
  ta.style.height = '24px';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
};

ta.addEventListener('input', () => { fit(); sync(); slRender(); });
ta.addEventListener('keydown', e => {
  if (SLOPEN) {
    if (e.key === 'ArrowDown') { e.preventDefault(); slIdx = (slIdx + 1) % slItems.length; slPaint(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); slIdx = (slIdx - 1 + slItems.length) % slItems.length; slPaint(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && !e.isComposing)) {
      e.preventDefault(); slPick(slItems[slIdx]); return;
    }
    if (e.key === 'Escape') { e.preventDefault(); slClose(); return; }
  }
  if (e.key === 'Escape' && pendingEdit) {
    e.preventDefault();
    restorePendingEdit();
    ta.value = '';
    fit();
    sync();
    return;
  }
  // 发送键策略（设置 → 通用）：enter = Enter 发送 / Ctrl+Enter 切换；
  // ctrl = Ctrl+Enter 发送，裸 Enter 与 Shift+Enter 都换行。
  if (e.key === 'Enter' && !e.isComposing) {
    if (S.enterMode === 'ctrl') {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey) { e.preventDefault(); send(''); }
      return;
    }
    if (!e.shiftKey) {
      e.preventDefault();
      send((e.ctrlKey || e.metaKey) ? 'toggle' : '');
    }
  }
});
sd.onclick = () => send();

feed.addEventListener('click', e => {
  // ---- 用户消息 ----
  const ue = e.target.closest('[data-ue]');
  if (ue) { if (persisted(ue.closest('.u'))) editUser(ue.closest('.u')); return; }
  const uc = e.target.closest('[data-uc]');
  if (uc) {
    const m = uc.closest('.u');
    // 优先复制存储的原文（未被 emoji 过滤、未丢 Markdown 空白）。
    copyText(m ? (m.dataset.raw != null ? m.dataset.raw : m.querySelector('.ub').innerText) : '');
    return;
  }
  const ud = e.target.closest('[data-ud]');
  if (ud) { if (persisted(ud.closest('.u'))) deleteMsg(ud.closest('.u')); return; }

  // ---- agent 消息 ----
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.closest('.a'), k = b.dataset.a;
  if (k !== 'copy' && !persisted(a)) return;
  if (k === 'copy') {
    copyText(a.dataset.raw != null ? a.dataset.raw : a.querySelector('.ab').innerText);
  } else if (k === 're' && !busy && conv && conv.id) {
    regenFrom(a);
  } else if (k === 'edit') {
    openAgentEditor(a);
  } else if (k === 'del') {
    deleteMsg(a);
  }
});

/**
 * Copy text to the clipboard. Resolves true on success (toast 已复制 unless
 * silent), false on failure (toast 复制失败 — never fake success).
 */
function copyText(s, silent) {
  const ok = () => { if (!silent) toast(t('copied')); return true; };
  const fail = () => { toast(t('copy_fail')); return false; };
  const legacy = () => {
    try {
      const t2 = document.createElement('textarea');
      t2.value = s;
      t2.style.cssText = 'position:fixed;opacity:0';
      document.body.append(t2);
      t2.select();
      const done = document.execCommand('copy');
      t2.remove();
      return done ? ok() : fail();
    } catch (x) { return fail(); }
  };
  try {
    return navigator.clipboard.writeText(s).then(ok, legacy);
  } catch (x) {
    return Promise.resolve(legacy());
  }
}

/** Collapse `el` to zero height and remove it. */
function collapseGone(el, done) {
  el.style.overflow = 'hidden';
  el.style.height = el.offsetHeight + 'px';
  void el.offsetHeight;
  el.style.transition = 'height .32s cubic-bezier(.4,0,.2,1),opacity .26s,margin .32s,padding .32s';
  el.style.height = '0px';
  el.style.opacity = '0';
  el.style.margin = '0';
  el.style.padding = '0';
  setTimeout(() => { el.remove(); if (done) done(); }, 330);
}

/**
 * Delete a message from the thread and from the session store.
 * A user bubble is one stored message; an assistant bubble spans a whole
 * group of them (assistant steps + merged tool results), so its range is
 * [mi, miEnd). Deleting the visible bubble deletes exactly that range.
 */
async function deleteMsg(el) {
  if (!el || busy) return;   // 生成中不动消息，避免与在途下标错位
  const z = S.lang === 'zh';
  // 删除不可恢复，确认一下
  if (!(await confirmBox(z ? '确定删除这条消息？' : 'Delete this message?'))) return;
  // 确认框是异步的：期间可能切走会话、也可能有新一轮开跑。先冻结目标会话与
  // 代际，绝不拿旧下标去删另一个会话的消息。
  const sid = conv && conv.id, gen = convGen;
  if (busy || gen !== convGen) return;
  // 有一条“待发送的编辑”时，下标基线会变；先把它撤回，删除才落在真实下标上。
  if (pendingEdit) { restorePendingEdit(); ta.value = ''; fit(); sync(); }
  const idx = el.dataset.mi;
  let from, to;
  if (sid && idx != null && idx !== 'null') {
    from = +idx;
    to = el.dataset.miEnd != null && el.dataset.miEnd !== 'null' ? +el.dataset.miEnd : from + 1;
  } else {
    // 没有存储下标：未落库的尾部空泡按「最后一条已打标消息之后到末尾」删
    // （to 缺省 = 截到末尾，服务端本就没有这些内容，等于对账）；其余情况
    // （纯本地、会话未建立）保持只动本地，和旧行为一致。
    const v = tailVirtualFrom(el);
    if (!sid || v == null) { collapseGone(el, restamp); return; }
    from = v;
    to = null;
  }
  try {
    await api('/sessions/' + sid + '/messages', {
      method: 'DELETE',
      body: to != null ? { from, to } : { from }
    });
  } catch (e) {
    // 服务端没删成就别动 DOM：界面少一条、库里还在，之后每条下标都错一位，
    // 再点删除就会删到相邻的消息上。
    toast(e.message);
    restamp();
    return;
  }
  // await 之后可能已经切走：新会话的视图由 openSession 负责，这里不能再碰。
  if (gen !== convGen || !conv || conv.id !== sid) return;
  if (to == null) {
    // 虚拟尾巴：el 及其后全部是未落库的空气泡，一起折叠（范围是「到末尾」）。
    const doomed = [];
    for (let n = el; n; n = n.nextElementSibling) doomed.push(n);
    doomed.forEach((x, i) => i === 0 ? collapseGone(x, restamp) : x.remove());
    return;
  }
  collapseGone(el, restamp);
}

/**
 * Edit a user message in place. The text goes back into the composer and the
 * tail is hidden locally only: the server history is truncated when the edited
 * message is actually sent, so canceling / switching away never loses messages.
 */
function editUser(el) {
  if (!el || busy) return;
  if (pendingEdit) restorePendingEdit();
  const idx = el.dataset.mi;
  if (!conv || !conv.id || idx == null || idx === 'null') { toast(t('toast')); return; }
  const c = el.querySelector('.ub').cloneNode(true);
  c.querySelectorAll('.uatt').forEach(n => n.remove());
  ta.value = c.innerText;
  fit();
  sync();
  ta.focus();
  // 记住原始位置，DELETE 失败或用户按 Esc 时按原顺序插回。
  const nodes = [el];
  let n = el.nextElementSibling;
  while (n) { const nx = n.nextElementSibling; nodes.push(n); n = nx; }
  const parent = el.parentNode, anchor = el.previousElementSibling;
  nodes.forEach(x => x.remove());
  pendingEdit = { sid: conv.id, gen: convGen, from: +idx, nodes, parent, anchor };
  toast(t('editmsg'));
}

/**
 * Edit an agent message's answer text in place and persist it.
 * Only the prose is editable: thinking blocks and tool cards are execution
 * history — folding them into the text would turn tool output into the
 * agent's own words once saved.
 */
function editAgent(el) {
  if (!el || busy) return;
  const body = el.querySelector('.ab');
  const idx = el.dataset.mi;
  const miEnd = el.dataset.miEnd;
  const fallback = [...body.children]
    .filter(k => !k.classList.contains('ec') && !k.classList.contains('th') && !k.classList.contains('tgrp'))
    .map(k => k.innerText).join('\n\n').trim();
  const current = (el.dataset.raw || fallback).trim();
  // 执行过程（思考块、工具卡片、工具运行组）原样保留，只换正文。
  const keep = [...body.children].filter(k =>
    k.classList.contains('ec') || k.classList.contains('th') || k.classList.contains('tgrp'));
  const box = document.createElement('textarea');
  box.className = 'tx';
  box.value = current;
  box.style.cssText = 'width:100%;font:14px/1.6 var(--sans);margin:6px 0;resize:vertical';

  // 高度按「实际渲染后的内容」算，而不是按换行数：一段没有换行的长文本
  // 会自动折成十几行，只给 1 行高的话编辑框几乎没法用。
  // scrollHeight 要等元素进了文档才有值，所以先挂上去再量。
  const autosize = () => {
    box.style.height = 'auto';
    const min = 44;                                   // 至少两行
    const max = Math.round(window.innerHeight * 0.6); // 别把整屏撑满
    const h = Math.max(min, Math.min(box.scrollHeight + 2, max));
    box.style.height = h + 'px';
    box.style.overflowY = box.scrollHeight + 2 > max ? 'auto' : 'hidden';
  };

  body.innerHTML = '';
  body.append(box);
  autosize();
  box.addEventListener('input', autosize);
  const bar = document.createElement('div');
  bar.className = 'macts';
  bar.style.cssText = 'opacity:1;transform:none;justify-content:flex-start';
  bar.innerHTML = '<button class="btn" data-save>' + t('save') + '</button>' +
                  '<button class="btn" data-cancel>' + t('close') + '</button>';
  body.append(bar);
  box.focus();
  const rebuild = (text) => {
    body.innerHTML = '';
    keep.forEach(k => body.append(k));
    renderBlocks(body, text);
  };
  let saving = false;
  const save = async () => {
    if (saving) return;
    const v = box.value;
    // 快照会话：保存期间可能用命令面板切走，不能把 PATCH 打到新会话上。
    const sid = conv && conv.id;
    const btn = bar.querySelector('[data-save]');
    if (sid && idx != null && idx !== 'null') {
      saving = true;
      btn.disabled = true;
      try {
        await api('/sessions/' + sid + '/messages/' + idx, {
          method: 'PATCH',
          body: { text: v, ...(miEnd != null && miEnd !== 'null' ? { to: +miEnd } : {}) }
        });
      } catch (err) {
        saving = false;
        btn.disabled = false;
        toast(err.message);
        return;
      }
      saving = false;
      btn.disabled = false;
      if (!conv || conv.id !== sid) return;   // 已切走，别再改旧 DOM
    }
    // 只有确认落库后才更新界面与原始文本，否则用户会以为改成功了。
    el.dataset.raw = v;
    rebuild(v);
    toast(t('saved'));
  };
  bar.querySelector('[data-save]').onclick = save;
  bar.querySelector('[data-cancel]').onclick = () => rebuild(current);
  box.onkeydown = ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
    if (ev.key === 'Escape') { ev.preventDefault(); rebuild(current); }
  };
}

/**
 * Truncate the thread from `el` on and re-run the model on what's left — the
 * history then ends with the user's question again and the reply is a fresh
 * generation (POST /chat with retry: nothing new is appended).
 */
async function regenFrom(el) {
  if (!el || busy || !conv || !conv.id) return;
  // 有待发送的编辑时先撤回：否则重跑的 DELETE 与编辑的 DELETE 会各截各的。
  if (pendingEdit) { restorePendingEdit(); ta.value = ''; fit(); sync(); }
  const idx = el.dataset.mi;
  let from;
  if (idx == null || idx === 'null') {
    // 未落库的尾部空气泡（模型零产出 / 失败）：按「最后一条已落库消息之后」
    // 重跑——这正是重新生成的语义，不必对着「还没落库」干等。
    const v = tailVirtualFrom(el);
    if (v == null) { toast(t('toast')); return; }
    from = v;
  } else {
    from = +idx;
  }
  // 冻结会话和代际：DELETE 与 /chat 之间用户可能切走，绝不能把 retry 发到
  // 另一个会话（旧代码在 .then 里读全局 conv.id，等于把别人的最后一条回答重跑）。
  const sid = conv.id, gen = convGen;
  // 摘除前记住原位置：失败时按原顺序插回。直接 append 会把旧尾巴排到
  // 期间新增的气泡之后，问答顺序整个颠倒。
  const anchor = el.previousElementSibling;
  const nodes = [];
  let n = el;
  while (n) { const nx = n.nextElementSibling; nodes.push(n); n = nx; }
  nodes.forEach(x => x.remove());
  resetTurn();
  busy = true;
  sig = { stop: false };
  sync();
  let deleted = false;
  try {
    await api('/sessions/' + sid + '/messages', {
      method: 'DELETE', body: { from }
    });
    deleted = true;
    if (gen !== convGen || !conv || conv.id !== sid) return;
    await api('/chat', {
      method: 'POST',
      body: {
        session_id: sid,
        text: '',
        retry: true,
        model: S.model,
        permission_mode: S.perm,
        thinking_level: Math.max(0, Math.min(3, +S.lvl || 0))
      }
    });
    if (gen !== convGen || !conv || conv.id !== sid) return;
    // POST 成功后再开轮询：DELETE/POST 之间服务端没有 turn 在跑，过早轮询
    // 会被 /turn/running 的 false 误判成“已经收尾”。
    startTurnProbe();
    restamp();
  } catch (err) {
    if (gen !== convGen || !conv || conv.id !== sid) return;
    busy = false;
    stopTurnProbe();
    sync();
    if (deleted) {
      // 截断已经成功、只是重跑失败：按服务端状态重放，不能把已删除的旧气泡
      // 塞回来（否则下一次编辑/删除会按旧下标改错消息）。
      toast(err.message);
      await openSession(sid);
    } else {
      // 删除失败时把刚摘下的气泡按原位置插回，避免“点重新生成失败后对话少了一半”。
      const ref = (anchor && anchor.parentNode === feed) ? anchor.nextSibling : null;
      nodes.forEach(x => { try { feed.insertBefore(x, ref); } catch (e) {} });
      toast(err.message);
    }
  }
}


/** 弹出「编辑 Agent 消息」窗口：可以改这一轮里工具调用的名字/参数、工具返回、以及正文。 */
async function openAgentEditor(el) {
  if (!el || busy || !conv || !conv.id) return;
  const idx = el.dataset.mi;
  if (idx == null || idx === 'null') { toast(t('toast')); return; }
  const from = +idx;
  const to = el.dataset.miEnd != null && el.dataset.miEnd !== 'null' ? +el.dataset.miEnd : from + 1;
  // 快照会话：编辑器打开期间用户可能用命令面板切走，保存必须回到原会话。
  const sid = conv.id, gen = convGen;

  let stored = [];
  try {
    const res = await api('/sessions/' + sid + '/messages');
    stored = res.messages || [];
  } catch (e) { toast(e.message); return; }
  if (gen !== convGen || !conv || conv.id !== sid) return;

  const tools = [];
  const byId = {};
  const texts = [];
  let lastStep = from;
  stored.slice(from, to).forEach((m, mi) => {
    if (m.role === 'assistant') lastStep = from + mi;
    normParts(m.parts).forEach(p => {
      if (p.k === 'tool') {
        const it = { id: p.id, step: from + mi, name: p.name, args: p.args, result: null, error: false };
        tools.push(it); byId[p.id] = it;
      } else if (p.k === 'result') {
        const it = byId[p.id];
        if (it) { it.result = p.text; it.error = !!p.error; }
      } else if (p.k === 'text' && m.role === 'assistant') {
        texts.push(p.text);
      }
    });
  });

  let box = $('#medit');
  if (!box) {
    box = document.createElement('div');
    box.id = 'medit';
    box.innerHTML = '<div class="mbox">' +
      '<div class="mhd"><b>' + (S.lang === 'zh' ? '编辑 Agent 消息' : 'Edit agent message') + '</b>' +
      '<button class="ib" data-x>' + ic('x') + '</button></div>' +
      '<div class="mbd"></div>' +
      '<div class="mft"><button class="btn ghost" data-x>' + t('close') + '</button>' +
      '<button class="btn" data-save>' + t('save') + '</button></div>' +
      '</div>';
    document.body.append(box);
    box.addEventListener('click', ev => {
      if (ev.target === box || ev.target.closest('[data-x]')) close();
    });
  }

  const close = () => {
    box.classList.remove('open');
    if (box._esc) { document.removeEventListener('keydown', box._esc, true); box._esc = null; }
  };
  const body = box.querySelector('.mbd');
  body.innerHTML = '';

  const secTools = document.createElement('div');
  const tHead = document.createElement('div');
  tHead.className = 'mst';
  secTools.append(tHead);
  const tList = document.createElement('div');
  secTools.append(tList);
  let seq = 0;
  const syncHead = () => {
    const n = tList.querySelectorAll('.mtool').length;
    tHead.textContent = (S.lang === 'zh' ? '工具调用与返回' : 'Tool calls & results') + '（' + n + '）';
  };
  const mount = it => {
    const card = document.createElement('div');
    card.className = 'mtool';
    card.dataset.tid = it.id;
    card.dataset.step = String(it.step != null ? it.step : lastStep);
    card.innerHTML =
      '<div class="mrow"><input class="mname" value="' + esc(it.name || '') + '" spellcheck="false">' +
      '<label><input type="checkbox" class="merr"' + (it.error ? ' checked' : '') + '>' +
      (S.lang === 'zh' ? '标记为错误' : 'Error') + '</label>' +
      '<button class="ib danger" data-deltool title="' +
      (S.lang === 'zh' ? '删除这条工具调用' : 'Remove this tool call') + '">' + ic('trash') + '</button></div>' +
      '<div class="mlab">' + (S.lang === 'zh' ? '参数（JSON）' : 'Arguments (JSON)') + '</div>' +
      '<textarea class="margs" spellcheck="false"></textarea>' +
      '<div class="mlab">' + (S.lang === 'zh' ? '工具返回（模型看到的内容）' : 'Tool result (what the model saw)') + '</div>' +
      '<textarea class="mres"></textarea>';
    card.querySelector('.margs').value = JSON.stringify(it.args || {}, null, 2);
    card.querySelector('.mres').value = it.result != null ? it.result : '';
    card.querySelector('[data-deltool]').onclick = () => { card.remove(); syncHead(); };
    tList.append(card);
    syncHead();
  };
  tools.forEach(mount);
  const addBtn = document.createElement('button');
  addBtn.className = 'btn ghost madd';
  addBtn.textContent = (S.lang === 'zh' ? '+ 添加工具调用' : '+ Add tool call');
  addBtn.onclick = () => {
    seq += 1;
    mount({ id: 'call_manual_' + Date.now().toString(36) + '_' + seq, step: lastStep, name: 'bash', args: {}, result: '', error: false });
  };
  secTools.append(addBtn);
  body.append(secTools);

  const secText = document.createElement('div');
  secText.innerHTML = '<div class="mst">' + (S.lang === 'zh' ? '模型正文' : 'Assistant text') + '</div>' +
    '<textarea class="mtx" spellcheck="false"></textarea>';
  secText.querySelector('.mtx').value = texts.join('\n\n');
  body.append(secText);

  box.querySelector('[data-save]').onclick = async () => {
    const payloadTools = [];
    for (const card of body.querySelectorAll('.mtool')) {
      let args;
      try { args = JSON.parse(card.querySelector('.margs').value || '{}'); }
      catch (e) {
        card.querySelector('.margs').focus();
        toast(S.lang === 'zh' ? '参数不是合法 JSON' : 'Arguments must be valid JSON');
        return;
      }
      payloadTools.push({
        id: card.dataset.tid,
        step: +card.dataset.step,
        name: card.querySelector('.mname').value.trim(),
        args,
        result: card.querySelector('.mres').value,
        is_error: card.querySelector('.merr').checked
      });
    }
    const save = box.querySelector('[data-save]');
    if (gen !== convGen || !conv || conv.id !== sid) {
      toast(S.lang === 'zh' ? '会话已切换，请重新打开编辑' : 'Session changed; reopen the editor');
      return;
    }
    save.disabled = true;
    try {
      await api('/sessions/' + sid + '/messages/' + from, {
        method: 'PATCH',
        body: { to, text: secText.querySelector('.mtx').value, tools: payloadTools }
      });
      close();
      toast(t('saved'));
      await openSession(sid);
    } catch (e) {
      toast(e.message);
    } finally { save.disabled = false; }
  };

  box.classList.add('open');
  box.querySelector('.mtx').focus();
  if (box._esc) document.removeEventListener('keydown', box._esc, true);
  box._esc = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(); }
  };
  document.addEventListener('keydown', box._esc, true);
}

/* ---------------------------------------------------------------- attachments */
const fileIn = $('#fileIn');
$('#attbtn').onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ''; };

/**
 * 选择 / 拖入文件后先上传到 POST /api/attachments?name=<encodeURIComponent>，
 * 成功后把返回的 {path, kind, name, size} 存进 ATTS；发送时 chat 请求带
 * [{path, name, size}]（Attachment serde 结构）。上传失败 toast 并从列表移除，
 * 阻止发送。不再依赖浏览器 File.path（该字段根本不存在）。
 */
async function addFiles(list) {
  for (const f of [...list]) {
    if (ATTS.length >= 6) break;
    if (ATTS.some(x => x.name === f.name && x.size === f.size)) continue;
    const att = { name: f.name, size: f.size, type: f.type, path: '', kind: 'file', loading: true, url: null };
    ATTS.push(att);
    renderAtts();
    sync();
    try {
      const res = await fetch('/api/attachments?name=' + encodeURIComponent(f.name), {
        method: 'POST',
        headers: { 'X-Parable-Token': TOKEN },
        body: f
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.path) {
        throw new Error((data && data.error) || (res.status + ' ' + res.statusText));
      }
      att.path = data.path;
      att.kind = data.kind || 'file';
      att.loading = false;
      // 图片附件本地预览：objectURL 只在浏览器内存里，刷新前有效
      if (att.kind === 'image' && typeof URL.createObjectURL === 'function') {
        att.url = URL.createObjectURL(f);
        OBJ_URLS.add(att.url);
      }
    } catch (e) {
      const i = ATTS.indexOf(att);
      if (i >= 0) ATTS.splice(i, 1);
      renderAtts();
      sync();
      toast(t('att_fail') + e.message);
      continue;
    }
    renderAtts();
    sync();
  }
}

/**
 * 释放即将被移除的消息气泡里的 blob 图片。
 * 流式消息的缩略图挂在 <img src="blob:..."> 上，节点删掉后浏览器不会自动
 * 回收，切一次会话就漏一批；这里在清空 feed 之前统一 revoke。
 */
function releaseFeedBlobs() {
  feed.querySelectorAll('img[src^="blob:"]').forEach(im => {
    const u = im.getAttribute('src');
    if (!u) return;
    try { URL.revokeObjectURL(u); } catch (e) {}
    OBJ_URLS.delete(u);
  });
}

function renderAtts() {
  const el = $('#atts');
  el.innerHTML = ATTS.map((a, i) =>
    '<span class="att' + (a.loading ? ' upl' : '') + '">' +
    (a.url ? '<img class="attimg" alt="">' : ic('file')) +
    '<b></b>' + (a.loading ? '<span class="upltxt">…</span>' : '') +

/* ==================================================================
   sidebar / sessions
   ================================================================== */
function fmtAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - (ts || 0)) / 1000));
  if (s < 60) return t('ago_now');
  if (s < 3600) return t('ago_m').replace('{n}', Math.floor(s / 60));
  if (s < 86400) return t('ago_h').replace('{n}', Math.floor(s / 3600));
  return t('ago_d').replace('{n}', Math.floor(s / 86400));
}

/**
 * Order the session list.
 *
 * Uses CSS `order` instead of re-appending the nodes: Chromium restarts a
 * CSS animation when its element is moved in the DOM, so re-appending made
 * the whole column flash again after every sort (the "second wave" the user
 * saw after deleting a conversation).
 */
/* ------------------------------------------------------------ 侧边栏（ZCode）
   参考 ZCode 的 workspace-sidebar-navigation：
   - workspace → task 二级；项目行可折叠，任务首屏 5 条，「显示更多」每次 +5；
   - 顶部视图切换「项目 / 分组 / 时间线」，滑块 pill 与 ZCode 的 shell+active 一致；
   - Pinned 固定在切换条下方、普通列表上方；归档单独一段，默认收起；
   - 正在跑的会话（INFLIGHT）永远置顶，层内按更新时间倒序。
   偏好落在 localStorage，刷新后视图/折叠/展开条数都保留。 */
const SB = {
  view: 'projects',
  open: {},      // key → false 表示折叠
  limit: {},     // key → 当前显示条数
  archOpen: false,
  cache: new Map(),
};
try {
  const raw = JSON.parse(localStorage.getItem('parable-sidebar') || '{}');
  if (raw.view) SB.view = raw.view;
  SB.open = raw.open || {};
  SB.limit = raw.limit || {};
  SB.archOpen = !!raw.archOpen;
} catch (e) { /* 隐私模式：用默认值 */ }

function sbSave() {
  try {
    localStorage.setItem('parable-sidebar', JSON.stringify({
      view: SB.view, open: SB.open, limit: SB.limit, archOpen: SB.archOpen,
    }));
  } catch (e) {}
}

/** 工作区名：取路径最后一段（ZCode 的项目行也是只显示项目名）。 */
function wsName(ws) {
  const p = String(ws || '').replace(/[\\/]+$/, '');
  const seg = p.split(/[\\/]/).pop() || p;
  return seg || t('sb_all');
}

/** 一个会话行。节点按 id 复用：刷新时只改文字/状态，不重建 DOM。 */
function sbNode(c) {
  let d = SB.cache.get(c.id);
  if (!d) {
    d = document.createElement('div');
    d.className = 'rc';
    d.dataset.id = c.id;
    d.innerHTML = '<span class="rci">' + ic('pin') + '</span><span class="rct"></span>' +
      '<span class="rcmeta"><span class="rcdt"></span><span class="rcd"></span></span>';
    d.onclick = () => openSession(c.id);
    d.oncontextmenu = e => {
      e.preventDefault();
      e.stopPropagation();
      openChatMenu(CONVS.find(x => x.id === c.id) || c, d, e.clientX, e.clientY);
    };
    d.classList.add('in');
    setTimeout(() => d.classList.remove('in'), 520);
    SB.cache.set(c.id, d);
  }
  d.dataset.ts = c.ts || Date.now();
  d.querySelector('.rct').textContent = noEmoji(c.t || '');
  d.querySelector('.rcd').textContent = fmtAgo(+d.dataset.ts);
  d.classList.toggle('pin', !!c.pin && !c.arch);
  d.classList.toggle('arch', !!c.arch);
  if (c.pin && !c.arch) d.dataset.pinAt = c.pinAt || c.ts || '';
  else delete d.dataset.pinAt;
  d.classList.toggle('on', !!conv && conv.id === c.id);
  return d;
}

/** 段标题（可点击折叠）。 */
function sbHead(key, label, n, extra) {
  const h = document.createElement('div');
  h.className = 'rch';
  if (SB.open[key] === false) h.classList.add('closed');
  h.innerHTML = '<span class="rcht"></span><span class="rchn"></span><span class="rchc">' + ic('chevr') + '</span>';
  h.querySelector('.rcht').textContent = label;
  h.querySelector('.rchn').textContent = n;
  h.onclick = () => { SB.open[key] = SB.open[key] === false; sbSave(); renderSidebar(); };
  if (extra) extra(h);
  return h;
}

function sbSorted(list) {
  return list.slice().sort((a, b) =>
    ((INFLIGHT[b.id] ? 1 : 0) - (INFLIGHT[a.id] ? 1 : 0)) || ((b.ts || 0) - (a.ts || 0)));
}

/** 项目视图里的一段：项目行 + 任务行 + 显示更多。 */
function sbProj(ws, list) {
  const key = 'ws:' + (ws || '');
  const wrap = document.createElement('div');
  wrap.className = 'sbproj';
  const head = document.createElement('button');
  head.className = 'sbph' + (SB.open[key] === false ? ' closed' : '');
  head.innerHTML = '<span class="sbpi">' + ic('folder') + '</span><b></b><span class="sbpn"></span><span class="sbchev">' + ic('chevr') + '</span>';
  head.querySelector('b').textContent = wsName(ws);
  head.querySelector('.sbpn').textContent = list.length;
  head.onclick = e => {
    e.stopPropagation();
    SB.open[key] = SB.open[key] === false;
    sbSave();
    renderSidebar();
  };
  wrap.append(head);
  if (SB.open[key] !== false) {
    const tasks = document.createElement('div');
    tasks.className = 'sbptasks';
    const lim = SB.limit[key] || 5;
    sbSorted(list).slice(0, lim).forEach(c => tasks.append(sbNode(c)));
    wrap.append(tasks);
    if (list.length > lim) {
      const more = document.createElement('button');
      more.className = 'sbmore';
      more.textContent = t('show_more') + '（' + Math.min(lim, list.length) + '/' + list.length + '）';
      more.onclick = e => {
        e.stopPropagation();
        SB.limit[key] = lim + 5;
        sbSave();
        renderSidebar();
      };
      wrap.append(more);
    }
  }
  return wrap;
}

/** 纯列表的一段（分组视图 / 时间线视图共用）。 */
function sbList(key, list, label) {
  const box = document.createElement('div');
  box.className = 'rcg';
  if (label) box.append(sbHead(key, label, list.length));
  if (SB.open[key] === false) return box;
  const lim = SB.limit[key] || (key === 'tl' ? 20 : 12);
  const host = document.createElement('div');
  host.className = 'rcg';
  sbSorted(list).slice(0, lim).forEach(c => host.append(sbNode(c)));
  box.append(host);
  if (list.length > lim) {
    const more = document.createElement('button');
    more.className = 'sbmore';
    more.textContent = t('show_more') + '（' + Math.min(lim, list.length) + '/' + list.length + '）';
    more.onclick = e => {
      e.stopPropagation();
      SB.limit[key] = lim + 5;
      sbSave();
      renderSidebar();
    };
    box.append(more);
  }
  return box;
}

function renderSidebar() {
  const p = $('#rcp'), g = $('#sbgroups'), a = $('#rca');
  if (!p || !g || !a) return;
  // 删掉的会话：连同缓存节点一起清掉，避免缓存无限增长
  for (const [id, el] of SB.cache) {
    if (!CONVS.some(c => c.id === id)) { el.remove(); SB.cache.delete(id); }
  }
  p.innerHTML = '';
  g.innerHTML = '';
  a.innerHTML = '';

  const live = CONVS.filter(c => !c.arch);
  $('#sbcount').textContent = String(live.length);
  document.querySelectorAll('#sbtabs .sv').forEach(b => b.classList.toggle('on', b.dataset.v === SB.view));

  // Pinned：固定在切换条下方、所有列表之上（ZCode 的 Pinned 也是这个位置）
  const pinned = live.filter(c => c.pin);
  if (pinned.length) {
    p.hidden = false;
    p.append(sbHead('pin', t('pinned'), pinned.length));
    if (SB.open.pin !== false) sbSorted(pinned).forEach(c => p.append(sbNode(c)));
  } else {
    p.hidden = true;
  }

  if (SB.view === 'projects') {
    const byWs = new Map();
    live.filter(c => !c.pin).forEach(c => {
      const k = c.ws || '';
      if (!byWs.has(k)) byWs.set(k, []);
      byWs.get(k).push(c);
    });
    // 最近用过的项目排前面
    [...byWs.entries()]
      .sort((x, y) => (Math.max(...x[1].map(c => c.ts || 0)) - Math.max(...y[1].map(c => c.ts || 0))))
      .forEach(([ws, list]) => g.append(sbProj(ws, list)));
    if (!byWs.size && !pinned.length) {
      const e = document.createElement('div');
      e.className = 'dempty';
      e.textContent = t('dk_none_session');
      g.append(e);
    }
  } else if (SB.view === 'grouped') {
    const byG = new Map();
    live.filter(c => !c.pin).forEach(c => {
      const k = c.grp || '';
      if (!byG.has(k)) byG.set(k, []);
      byG.get(k).push(c);
    });
    [...byG.entries()].sort((x, y) =>
      (Math.max(...x[1].map(c => c.ts || 0)) - Math.max(...y[1].map(c => c.ts || 0)))
    ).forEach(([grp, list]) => g.append(sbList('grp:' + grp, list, grp || t('ungrouped'))));
  } else {
    g.append(sbList('tl', live.filter(c => !c.pin), t('view_timeline')));
  }

  // 归档：单独一段，默认收起
  const arch = CONVS.filter(c => c.arch);
  if (arch.length) {
    a.hidden = false;
    a.append(sbHead('arch', t('archd'), arch.length));
    if (SB.archOpen) sbSorted(arch).forEach(c => a.append(sbNode(c)));
  } else {
    a.hidden = true;
  }

  // 服务端分页的「加载更多」（超过 200 条时才出现）
  if (sessLimited) {
    const btn = document.createElement('button');
    btn.className = 'rcmore';
    btn.textContent = t('sb_more_srv') + '（' + CONVS.length + '/' + sessTotal + '）';
    btn.onclick = async () => { sessLimit = Math.min(sessLimit + 200, 1000); await loadSessions(true); };
    g.append(btn);
  }
}

/** 给已落库但仍在运行的气泡补回「工作中」计时条。openSession 复用它时用。 */
function ensureWorkBar(a) {

/**
 * 事件缓冲兜底去重：如果最后一条已落库的 assistant 步已经包含缓冲里的
 * thinking / tool_call，就把这一段从 SHADOW 里剪掉。正常情况下
 * `step.persisted` 已经清空；这里防 SSE 丢事件那一次窗口。
 */
function dropPersistedShadow(msgs, sh) {
  if (!sh || !msgs || !msgs.length) return;
  const lastAsst = [...msgs].reverse().find(m => m.role === 'assistant');
  if (!lastAsst) return;
  const parts = normParts(lastAsst.parts);
  const tools = new Set(parts.filter(p => p.k === 'tool').map(p => p.id));
  let cut = -1;
  (sh.events || []).forEach((e, i) => {
    if (e.type === 'tool.call' && tools.has(e.callId)) cut = i;
  });
  if (cut >= 0) {
    const persistedCalls = new Set((sh.events || []).slice(0, cut + 1)
      .filter(e => e.type === 'tool.call').map(e => e.callId));
    sh.events = (sh.events || []).slice(cut + 1)
      .filter(e => !(e.type === 'tool.progress' && persistedCalls.has(e.callId)));
  } else {
    const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    const storedThink = norm(parts.filter(p => p.k === 'think').map(p => p.text).join('\n\n'));
    let shadowThink = '';
    let i = 0;
    for (; i < (sh.events || []).length; i++) {
      const e = sh.events[i];
      if (e.type !== 'reasoning.delta') break;
      shadowThink += e.text || '';
    }
    if (storedThink && shadowThink && storedThink.includes(norm(shadowThink))) {
      sh.events = (sh.events || []).slice(i);
    }
  }
  if ((sh.text || '').trim()) {
    const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    const storedText = norm(parts.filter(p => p.k === 'text').map(p => p.text).join('\n\n'));
    if (storedText && storedText.includes(norm(sh.text))) sh.text = '';
  }
}
async function openSession(id, focusMsg) {
  const my = ++openTok;
  // 代际立刻递增：所有还在路上的旧会话请求从这一刻起都不能再写 DOM。
  const gen = convGen;
  convGen++;
  qsReset(true);
  stopTurnProbe();   // 上一个会话的轮询不能再对新会话下结论
  expectBubble = false;
  try {
    const res = await api('/sessions/' + id + '/messages');
    if (my !== openTok) return;
    go(null);
    if (busy && sig) sig.stop = true;
    busy = false;
    pendingInterrupt = false;
    // busy 变了发送键的图标也得跟着变，否则切到别的对话还挂着停止键
    sync();
    if (document.body.classList.contains('chat')) {
      feed.classList.add('fo');
      $('#ttl').classList.add('fo');
      await sleep(A(300));
      if (my !== openTok) return;
    }
    conv = { id, title: (CONVS.find(c => c.id === id) || {}).t || '' };
    ignoreSid = '';
    // 加载成功才丢弃「待发送的编辑」：失败时还得留在原视图里（见 catch）。
    pendingEdit = null;
    releaseFeedBlobs();
    feed.innerHTML = '';
    resetTurn();
    document.body.classList.add('chat');
    $('#ttl').textContent = noEmoji(conv.title);
    document.querySelectorAll('.rc.on').forEach(e => e.classList.remove('on'));
    const el = [...document.querySelectorAll('.rc')].find(e => e.dataset.id === id);
    if (el) el.classList.add('on');

    const msgs = res.messages || [];
    // Rebuild the transcript as one continuous flow: user text bubbles, and
    // assistant turns whose thinking / tool cards / answer keep their order.
    const cardById = {};
    let pendingAsk = null;
    let a = null, ab = null, aTs = 0;
    let aHasTool = false;
    const ensureA = () => {
      if (!a) { a = aMsg(null, false, aTs); ab = a.querySelector('.ab'); aHasTool = false; }
      return ab;
    };
    const closeA = () => {
      // 操作条交给末尾的 restamp()：拿到存储下标才显示，避免灰色不可点。
      if (a) { setActs(a, true); a = null; ab = null; aHasTool = false; }
    };

    for (const m of msgs) {
      aTs = m.created_at || aTs;
      const parts = normParts(m.parts);
      const results = parts.filter(p => p.k === 'result');
      const texts = parts.filter(p => p.k === 'text');

      if (m.role === 'user') {
        // A user message is either the human's question, or a batch of tool results.
        if (texts.length) {
          closeA();
          uMsg(texts.map(x => x.text).join('\n\n'), null, [], m.created_at);
        }
        results.forEach((r, i) => {
          const display = (m.displays && m.displays[i]) ||
            { kind: 'plain', text: r.text || '' };
          let card = cardById[r.id];
          if (!card) {
            card = toolCard(ensureA(), r.id, 'tool', '');
            cardById[r.id] = card;
          }
          fillToolCard(card, display, !r.error, card.querySelector('.fi b').textContent);
          if (pendingAsk && pendingAsk.callId === r.id) pendingAsk = null;
        });
        continue;
      }

      for (const p of parts) {
        if (p.k === 'think') {
          if (S.think === false) continue;
          if (S.toolThink === false && aHasTool) continue;
          const th = document.createElement('div');
          th.className = 'th';
          th.innerHTML = '<button class="thh"><span></span>' + ic('chev') +
            '</button><div class="thb"><div class="thbody"></div></div>';
          bindThink(th);
          th.querySelector('.thh span').textContent = t('thought').replace('{n}', 1);
          th.querySelector('.thbody').textContent = p.text || '';
          fitThink(th);
          ensureA().append(th);
        } else if (p.k === 'tool') {
          aHasTool = true;
          const card = toolCard(ensureA(), p.id, p.name, toolDesc(p.name, p.args || {}));
          card.dataset.args = JSON.stringify(p.args || {});
          cardById[p.id] = card;
          // ask_user 落库的是 tool_use（问题/选项在 args 里）。如果它还在
          // 等回答（后面没有对应 tool_result），切回会话时要把底部问答面板
          // 重新接上；否则问题看起来凭空消失了。
          if (p.name === 'ask_user') {
            const args = p.args || {};
            const q = String(args.question || '').trim();
            if (q) {
              const opts = Array.isArray(args.options) ? args.options : [];
              pendingAsk = { callId: p.id, question: q, options: opts, card };
              fillToolCard(card, { kind: 'ask', question: q, options: opts }, true,
                toolDesc('ask_user', args));
              card.classList.add('collapsed');
              card.querySelector('.st-tx').textContent = t('q_wait');
            }
          }
        } else if (p.k === 'text') {
          // 与实时视图一致：走整块 markdown 渲染（instant，无逐字动画），
          // 不再用 inline() 拍平 —— 否则代码块/列表在历史里全变成纯文本。
          renderBlocks(ensureA(), p.text || '');
        }
      }
    }
    closeA();
    // 所有已落库工具卡都登记到全局映射：复用旧气泡或接收后续 tool.result 时
    // 都能命中同一张卡，不会凭空再建一张。
    toolEls = { ...cardById };
    feed.classList.remove('fo');
    $('#ttl').classList.remove('fo');
    stick = true;
    chat.scrollTop = chat.scrollHeight;
    apply();
    refreshGoalBadge();
    // 从搜索结果跳进来：滚动到命中的那条消息并高亮一下。
    // restamp 是异步的（下标回填要拉一次存储），所以等它跑完再定位。
    await restamp();
    // restamp 之后还有多次 await 与 DOM 写入：这里必须再验一次代际，
    // 否则用户在定位/重放期间切走，旧会话的内容会画进新会话。
    if (my !== openTok || gen !== convGen) return;
    if (focusMsg != null) {
      const hit = [...feed.querySelectorAll('[data-mi]')]
        .find(n => n.dataset.mi === String(focusMsg));
      if (hit) {
        hit.scrollIntoView({ block: 'center', behavior: 'smooth' });
        hit.classList.add('flash');
        setTimeout(() => hit.classList.remove('flash'), 1600);
      }
    }
    // 切走期间这个会话的 turn 可能还在跑（SHADOW 记账 / INFLIGHT 在途标记）。
    // 只有确实还在跑时才恢复流式 UI；否则会留下一个永远停不下来的停止键 +
    // 「工作中」计时条——那一轮早在后台收尾了。
    const sh = SHADOW[id];
    if (sh) dropPersistedShadow(msgs, sh);
    const running = !!INFLIGHT[id] || !!(sh && !sh.ended);
    if (running) {
      busy = true;
      sig = { stop: false };
      sync();
      const asRun = [...feed.querySelectorAll(':scope > .a')];
      const lastA = asRun.length ? asRun[asRun.length - 1] : null;
      const last = msgs.length ? msgs[msgs.length - 1] : null;
      const lastParts = last ? normParts(last.parts) : [];
      const lastNewUser = !!(last && last.role === 'user' && lastParts.some(p => p.k === 'text'));
      const sawStored = !lastNewUser && !!(lastA && lastA.querySelector('.ec'));
      turnSawTool = sawStored;
      const live = !!(sh && (((sh.events || []).length) || (sh.text || '').trim()));
      // 存储里已经有当前这轮的 assistant 步（工具正在跑、ask_user 正在等回答）
      // 且没有未落库的尾巴时，复用最后一条气泡；再 startTurnUI() 会凭空多出
      // 一条空白/重复气泡。
      const canReuse = !live && !!(lastA && last &&
        (last.role === 'assistant' ||
         (last.role === 'user' && lastParts.some(p => p.k === 'result'))));
      if (canReuse) {
        curA = lastA;
        curText = '';
        curStream = null;
        curThinkEl = null;
        turnT0 = Date.now();
        ensureWorkBar(curA);
        wkStart_(curA);
        setActs(curA, false);
        const ts = curA.querySelector('.ts');
        if (ts) ts.classList.add('hide');
      } else {
        startTurnUI();
        turnSawTool = sawStored;
        // 刚重放出来的回答不该挂「重新生成 / 编辑 / 删除」按钮；
        // turn.end 时 restamp() 会按存储下标补回来。
        if (asRun.length > 1) setActs(asRun[asRun.length - 2], false);
        // 先按序重放在途事件：思考块与工具卡片必须回到原位，否则切回来
        // 只剩最后一段正文，思考过程看起来被截断。
        if (sh && sh.events && sh.events.length) {
          for (const e of sh.events) replayEvent(e);
        }
        // 在途文本作为已提交块直接渲染，不逐字动画——逐字会让几百个字符
        // 各自排队 1 秒的 pop，视觉上像卡住。
        // 关键：不要在这里清 curThinkEl。刚重放出来的思考块还开着，清掉它之后
        // 没有任何代码会调用 finishThink，头部就永久停在「思考中…」；留着让
        // 后续 text.delta / turn.end 收它。
        if (sh && (sh.text || '').trim()) {
          let need = sh.text;
          // 该 turn 已经结束（在别的会话里收的尾）：这段文本多半已落库，
          // 重复渲染会让回答出现两遍。按空白归一化后做后缀包含判断。
          if (sh.ended) {
            try {
              const msgs2 = (await api('/sessions/' + id + '/messages')).messages || [];
              if (my !== openTok || gen !== convGen) return;
              const flat = msgs2.filter(m => m.role === 'assistant')
                .map(m => normParts(m.parts).filter(x => x.k === 'text').map(x => x.text).join('\n\n'))
                .join('\n\n')
                .replace(/\s+/g, ' ');
              if (flat.includes(need.trim().replace(/\s+/g, ' '))) need = '';
            } catch (e) { /* 存储读不到就照常补渲染，宁可多不可少 */ }
          }
          if (need.trim()) {
            // await 之后 curA 可能已被 resetTurn() 清掉，别对 null 解引用。
            if (!curA || my !== openTok || gen !== convGen) return;
            curStream = null;
            renderBlocks(curA.querySelector('.ab'), need);
            curText = (curText || '') + need;
            follow();
          }
          delete SHADOW[id];
        }
      }
      // 收尾事件万一丢了（INFLIGHT 过时），3 秒内由轮询核对纠正回来。
      startTurnProbe();
      // 切回来时如果 ask_user 还在等服务端回答，把问题重新接管到底部输入框；
      // 否则工具卡显示「等待回答」但用户没有可输入的入口，看起来就是问题消失了。
      if (pendingAsk && QBOX.active !== pendingAsk.callId) {
        openAskSurface({
          callId: pendingAsk.callId,
          question: pendingAsk.question,
          options: pendingAsk.options
        }, pendingAsk.card, true);
      }
    } else if (sh) {
      // 后台已经收尾：只补没落库的尾巴，不恢复停止键与计时条。
      let need = (sh.text || '').trim();
      if (need) {
        try {
          const msgs = (await api('/sessions/' + id + '/messages')).messages || [];
          if (my !== openTok || gen !== convGen) return;
          const flat = msgs.filter(m => m.role === 'assistant')
            .map(m => normParts(m.parts).filter(x => x.k === 'text').map(x => x.text).join('\n\n'))
            .join('\n\n')
            .replace(/\s+/g, ' ');
          if (flat.includes(need.replace(/\s+/g, ' '))) need = '';
        } catch (e) { /* 存储读不到就照常补渲染，宁可多不可少 */ }
      }
      if (need) {
        if (my !== openTok || gen !== convGen) return;
        const asDone = [...feed.querySelectorAll(':scope > .a')];
        const aDone = asDone[asDone.length - 1];
        if (aDone) renderBlocks(aDone.querySelector('.ab'), need);
      }
      delete SHADOW[id];
    }
    qLoad();
  } catch (e) {
    // 加载失败：当前会话没变，把代际、待发送编辑和 busy 都还原，
    // 否则界面上会凭空少一截消息，或者发送键永远停在「停止」。
    if (convGen === gen + 1) convGen--;
    if (pendingEdit) restorePendingEdit();
    if (busy && !(conv && conv.id && INFLIGHT[conv.id])) { busy = false; sync(); }
    stopTurnProbe();
    toast(e.message);
  }
}

/**
 * Re-derive the store indices of every rendered message.
 *
 * One assistant bubble spans several stored messages (assistant steps plus the
 * merged tool-result messages between them), so each node carries the range
 * [mi, miEnd) and — for assistant bubbles — the concatenated answer text in
 * `raw`. Edit / delete / regenerate all address the store by these stamps,
 * which is why every mutation and every finished turn re-runs this.
 */
async function restamp() {
  if (!conv || !conv.id) return;
  const sid = conv.id, gen = convGen;
  let msgs;
  try {
    msgs = (await api('/sessions/' + sid + '/messages')).messages || [];
  } catch (e) { return; }
  // 请求在途时用户可能切走：旧会话的下标绝不能写到新会话的 DOM 上。
  if (gen !== convGen || !conv || conv.id !== sid) return;
  const nodes = [...feed.children]
    .filter(n => n.classList.contains('u') || n.classList.contains('a'));
  nodes.forEach(n => { delete n.dataset.mi; delete n.dataset.miEnd; delete n.dataset.raw; });
  // 下标回填成功后重新点亮编辑/删除/重试按钮（渲染时 idx 未知会先挂 .off）
  const light = n => n.querySelectorAll('.ib.off').forEach(b => b.classList.remove('off'));
  let ni = 0;
  for (let i = 0; i < msgs.length && ni < nodes.length; i++) {
    const m = msgs[i];
    const tx = normParts(m.parts).filter(p => p.k === 'text');
    if (m.role === 'user' && tx.length) {
      // 存储里遇到下一条提问，说明上一个 .a 气泡的区间到此结束。必须先把
      // 指针推进到下一个 .u 节点：否则配对会永远停在第一条回答上，第二轮
      // 之后的所有消息都拿不到 data-mi，编辑/删除/重跑全部失效。
      while (ni < nodes.length && !nodes[ni].classList.contains('u')) ni++;
      if (ni >= nodes.length) break;
      const node = nodes[ni];
      node.dataset.mi = i;
      node.dataset.miEnd = i + 1;
      // restamp 会先清掉 raw；用户消息的原文在存储里，补回来供复制使用。
      node.dataset.raw = tx.map(x => x.text).join('\n\n');
      light(node);
      ni++;
    } else {
      const node = nodes[ni];
      if (!node || !node.classList.contains('a')) break;   // DOM 与存储脱节，别乱贴
      if (node.dataset.mi === undefined) {
        node.dataset.mi = i;
        node.dataset.raw = '';
      }
      node.dataset.miEnd = i + 1;
      light(node);
      if (m.role === 'assistant' && tx.length) {
        const add = tx.map(x => x.text).join('\n\n');
        node.dataset.raw = node.dataset.raw ? node.dataset.raw + '\n\n' + add : add;
      }
    }
  }
  // 配对循环可能在中途 break（DOM 与存储短暂不同步），剩下的节点就永远
  // 停在 .off——看起来像按钮坏了。只要回填到了存储下标，这条消息就是
  // 可编辑/重试/删除的，所以兜底点亮。
  nodes.forEach(n => {
    if (n.dataset.mi === undefined) return;
    const ac = n.querySelector('.acts');
    if (ac) ac.classList.add('show');
    n.querySelectorAll('.acts .ib.off').forEach(b => b.classList.remove('off'));
  });
}

/**
 * turn.end 兜底：以存储为准重渲染最后一个助手气泡的答案文本。
 * 流式期间在途文本只活在 DOM 里——切换会话、SSE 断连重连、渲染中的任何
 * 异常都可能让尾部丢失。收尾时存储已经完整，直接对齐它，保证用户看到的
 * 最终答案不缺尾巴。错误提示（红字）和压缩提示（内联样式）保留不删。
 */
async function reconcileTail() {
  if (!conv || !conv.id) return;
  const sid = conv.id, gen = convGen;
  try {
    const msgs = (await api('/sessions/' + sid + '/messages')).messages || [];
    // 切会话后旧响应必须丢弃，否则会把 A 的最终答案写进 B 的最后一个气泡。
    if (gen !== convGen || !conv || conv.id !== sid) return;
    // 从尾部收集最后一条用户提问之后所有 assistant 的文本——正是最后一个
    // 气泡对应的存储范围，不依赖 restamp 的异步回填。
    const txts = [];
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      const parts = normParts(m.parts);
      if (m.role === 'user') {
        if (parts.some(p => p.k === 'text')) break;   // 问句边界，停
        continue;                                     // 工具结果批次，继续向上
      }
      const t = parts.filter(p => p.k === 'text').map(p => p.text).join('\n\n');
      if (t.trim()) txts.unshift(t);
    }
    const want = txts.filter(Boolean).join('\n\n');
    const as = [...feed.querySelectorAll(':scope > .a')];
    const lastA = as[as.length - 1];
    if (!lastA || !want.trim()) return;
    const ab = lastA.querySelector('.ab');
    if (!ab) return;
    [...ab.children].forEach(k => {
      const c = k.classList;
      if (k.style && k.style.color) return;           // 错误/提示行保留
      // 过程节点保留：工具卡、思考块、工具运行组（组壳内的卡片随壳保留）
      if (!c.contains('ec') && !c.contains('th') && !c.contains('tgrp')) k.remove();
    });
    renderBlocks(ab, want);
  } catch (e) { /* 存储读取失败就放弃校正 */ }
}

/**
 * Neutral Msg JSON -> an ordered list of parts.
 * Keeping document order matters: the model interleaves thinking, tool calls
 * and text, and the transcript must reproduce that sequence.
 */
function normParts(v) {
  const out = [];
  if (!v) return out;
  const key = v.User ? 'User' : (v.Assistant ? 'Assistant' : null);
  if (!key) return out;
  for (const p of (v[key] || [])) {
    if (typeof p === 'string') { out.push({ k: 'text', text: p }); continue; }
    if (p.Text !== undefined) out.push({ k: 'text', text: p.Text });
    else if (p.Thinking) {
      out.push({ k: 'think', text: typeof p.Thinking === 'string' ? p.Thinking : (p.Thinking.text || '') });
    } else if (p.ToolUse) {
      out.push({ k: 'tool', id: p.ToolUse.id, name: p.ToolUse.name, args: p.ToolUse.args || {} });
    } else if (p.ToolResult) {
      out.push({
        k: 'result',
        id: p.ToolResult.id,
        text: p.ToolResult.content || '',
        error: !!p.ToolResult.is_error
      });
    }
  }
  return out;
}

/** Short human label for a tool call, derived from its arguments. */
/** 工具调用的中文短语（5–15 字）：卡片标题只用它，完整参数进展开区。 */
function toolDesc(name, args) {
  args = args || {};
  const clean = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  const base = p => {
    const s = clean(p).replace(/\\/g, '/');
    const b = s.split('/').filter(Boolean).pop() || s;
    return b.length > 12 ? b.slice(0, 11) + '…' : b;
  };
  const tail = (s, n) => { s = clean(s); return s.length > n ? s.slice(0, n) + '…' : s; };
  const cmd = clean(args.command || args.cmd || '');
  if (name === 'bash' || name === 'shell') {
    const c = ' ' + cmd.toLowerCase() + ' ';
    const has = re => re.test(c);
    let d = '';
    if (has(/\bdate\b|get-date/)) d = '查看系统时间';
    else if (has(/\bpwd\b/)) d = '查看当前目录';
    else if (has(/\bls\b|dir |get-childitem/)) d = '列出目录文件';
    else if (has(/\bcat\b|type |head |tail |get-content/)) d = '查看文件内容';
    else if (has(/\brg\b|grep|select-string|findstr/)) d = '搜索文本内容';
    else if (has(/\bfind\b|where /)) d = '查找匹配文件';
    else if (has(/cargo build/)) d = '编译 Rust 项目';
    else if (has(/cargo test/)) d = '运行 Rust 测试';
    else if (has(/cargo run/)) d = '启动 Rust 程序';
    else if (has(/git status/)) d = '查看 Git 状态';
    else if (has(/git diff|git log/)) d = '查看代码改动';
    else if (has(/git (commit|push|add)/)) d = '提交代码改动';
    else if (has(/(npm|pnpm|yarn|bun) (install|i)\b/)) d = '安装项目依赖';
    else if (has(/(npm|pnpm|yarn|bun) (run )?build/)) d = '构建前端项目';
    else if (has(/(npm|pnpm|yarn|bun) (run )?test|vitest|jest/)) d = '运行前端测试';
    else if (has(/\bpython|\bpy -/)) d = '运行 Python 脚本';
    else if (has(/\bnode\b/)) d = '运行 Node 脚本';
    else if (has(/curl|invoke-webrequest|invoke-restmethod/)) d = '请求网络接口';
    else if (has(/mkdir|new-item -itemtype directory/)) d = '创建新目录';
    else if (has(/\brm\b|remove-item|del /)) d = '删除指定文件';
    else if (has(/\bcp\b|copy-item/)) d = '复制目标文件';
    else if (has(/\bmv\b|move-item/)) d = '移动目标文件';
    else if (has(/\becho\b|write-output/)) d = '输出文本内容';
    else if (has(/tasklist|get-process|\bps\b/)) d = '查看进程列表';
    else if (has(/whoami/)) d = '查看当前用户';
    else if (has(/ping /)) d = '测试网络连通';
    else {
      const tok = cmd.split(/[\s|;&]+/)[0].replace(/[^\w.-]/g, '');
      d = tok ? ('执行 ' + tok.slice(0, 8) + ' 命令') : '执行终端命令';
    }
    return d;
  }
  if (name === 'read_file') return '读取 ' + base(args.path);
  if (name === 'write_file') return '写入 ' + base(args.path);
  if (name === 'edit_file') return '修改 ' + base(args.path);
  if (name === 'list_dir') return args.path && args.path !== '.' ? ('列出 ' + base(args.path) + ' 目录') : '列出目录内容';
  if (name === 'glob') return '查找匹配文件';
  if (name === 'grep') return '搜索文件内容';
  if (name === 'web_search') return '搜索 ' + tail(args.query, 10);
  if (name === 'web_fetch') return '打开网页链接';
  if (name === 'todo_write') return '更新任务清单';
  if (name === 'ask_user') return '询问用户问题';
  if (name === 'spawn_agent') return '派发子智能体';
  if (name === 'agent_wait') return '等待子智能体';
  if (name === 'agent_list') return '查看智能体列表';
  if (name === 'agent_interrupt') return '停止子智能体';
  if (name === 'team_task_create') return '创建团队任务';
  if (name === 'team_task_list') return '查看任务列表';
  if (name === 'team_task_get') return '读取任务详情';
  if (name === 'team_task_update') return '更新任务状态';
  if (name === 'computer_screenshot') return '截取桌面屏幕';
  if (name === 'computer_axtree') return '读取界面结构';
  if (name === 'computer_click') return '点击界面元素';
  if (name === 'computer_type') return '输入界面文本';
  if (name === 'computer_key') return '发送快捷键';
  if (name === 'computer_scroll') return '滚动界面内容';
  if (name === 'computer_navigate') return '打开网页地址';
  return '调用 ' + (name || '工具') + ' 工具';
}

/** 卡片标题沿用旧入口名，内容换成中文说明。 */
function toolTitle(name, args) {
  const d = toolDesc(name, args);
  return d.length > 15 ? d.slice(0, 15) : d;
}

function runLabel(state, tool) {
  const zh = S.lang === 'zh';
  const cmd = tool === 'bash' || tool === 'shell';
  if (state === 'run') return zh ? (cmd ? '正在运行命令' : '正在运行') : 'Running';
  if (state === 'err') return zh ? (cmd ? '命令失败' : '运行失败') : 'Failed';
  return zh ? (cmd ? '已运行命令' : '已运行') : 'Ran';
}

/* ---------------------------------------------------------------- context menu */

/** 文件回退：列出该会话的检查点，一键恢复该轮改动前的文件状态。 */
async function openRewind(c) {
  const z = S.lang === 'zh';
  let list = [];
  try {
    const r = await api('/sessions/' + c.id + '/checkpoints');
    list = r.checkpoints || [];
  } catch (e) { toast(e.message); return; }
  const ov = document.createElement('div');
  ov.className = 'mdl';
  ov.innerHTML = '<div class="mdlc"><div class="mdlh"><h3>' + t('rw_title') + '</h3>' +
    '<button class="ib" data-x>' + ic('x') + '</button></div>' +
    '<div class="mdlb"><p style="opacity:.65;font-size:12px;margin:0 0 10px">' + t('rw_hint') + '</p>' +
    (list.length ? list.map((cp, i) =>
      '<div class="rwrow" data-i="' + i + '">' +
      '<div style="flex:1;min-width:0"><b>' + esc(new Date(cp.ts).toLocaleString()) + '</b>' +
      '<span class="rwf">' + esc(cp.turn) + '</span>' +
      '<div style="opacity:.6;font-size:11px">' + esc((cp.files || []).join('  ')) + '</div></div>' +
      '<button class="btn" data-rw="' + i + '">' + t('rw_do') + '</button></div>'
    ).join('') : '<p style="opacity:.6">' + t('rw_empty') + '</p>') +
    '</div></div></div>';
  document.body.append(ov);
  requestAnimationFrame(() => ov.classList.add('open'));
  const close = () => { ov.classList.remove('open'); setTimeout(() => ov.remove(), 200); };
  ov.querySelector('[data-x]').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelectorAll('[data-rw]').forEach(b => {
    b.onclick = async () => {
      const cp = list[+b.dataset.rw];
      b.disabled = true;
      try {
        const r = await api('/sessions/' + c.id + '/rewind', { method: 'POST', body: { turn: cp.turn } });
        toast((t('rw_done') || '').replace('{n}', (r.files || []).length));
        close();
      } catch (e) { toast(e.message); b.disabled = false; }
    };
  });
}

function renameChat(c, el) {
  const box = el && el.querySelector('.rct');
  if (!box || box.querySelector('.rc-in')) return;
  const old = c.t, inp = document.createElement('input');
  inp.className = 'rc-in';
  inp.value = old;
  inp.spellcheck = false;
  box.textContent = '';
  box.append(inp);
  inp.focus();
  inp.select();
  let done = false;
  const fin = ok => {
    if (done) return;
    done = true;
    const v = inp.value.trim(), nt = ok && v ? v : old;
    box.textContent = nt;
    if (nt === old) return;
    api('/sessions/' + c.id, { method: 'PATCH', body: { title: nt } })
      .then(() => {
        c.t = nt;
        const cc = CONVS.find(x => x.id === c.id);
        if (cc) cc.t = nt;
        toast(t('cm_renamed') || 'renamed');
      })
      .catch(err => {
        // 服务端没改成功就回滚标题，不能让侧栏和刷新后的结果对不上。
        c.t = old;
        box.textContent = old;
        if (conv && conv.id === c.id) $('#ttl').textContent = old;
        toast(err.message);
      });
  };
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); fin(true); }
    else if (e.key === 'Escape') { e.preventDefault(); fin(false); }
  };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = () => fin(true);
}

function deleteChat(c, el) {
  if (!el) return;
  // 删除会话不可恢复，先确认（双语）。只有服务端真的删掉才动 UI，否则
  // 刷新后会话又回来，甚至后续消息写回一个已删的会话。
  confirmBox(t('cf_del_chat')).then(async ok => {
    if (!ok) return;
    const prevPE = el.style.pointerEvents;
    el.style.pointerEvents = 'none';
    try {
      await api('/sessions/' + c.id, { method: 'DELETE' });
    } catch (e) {
      el.style.pointerEvents = prevPE;
      toast(e.message);
      return;
    }
    el.style.height = el.offsetHeight + 'px';
    void el.offsetHeight;
    el.classList.add('out');
    setTimeout(() => {
      el.style.height = '0px';
      el.style.paddingTop = '0px';
      el.style.paddingBottom = '0px';
    }, A(360));
    setTimeout(() => {
      el.remove();
      CONVS = CONVS.filter(x => x.id !== c.id);
      SB.cache.delete(c.id);
      renderSidebar();
      if (conv && conv.id === c.id) newChat();
    }, A(760));
  });
}

CM.addEventListener('click', e => {
  if (!cmTarget) return;
  const { c, el } = cmTarget;
  const item = e.target.closest('[data-cm]');
  if (!item) return;
  const k = item.dataset.cm;
  const cp = s => { copyText(s); };
  if (k === 'pin') {
    const on = !c.pin;
    c.pin = on;
    c.pinAt = on ? Date.now() : undefined;
    const cc = CONVS.find(x => x.id === c.id);
    if (cc) { cc.pin = on; cc.pinAt = c.pinAt; }
    renderSidebar();
    api('/sessions/' + c.id, { method: 'PATCH', body: { pinned: on } }).catch(() => {});
  } else if (k === 'arch') {
    // 走专用端点而不是 PATCH：后端会按 dsh 的 session-active 语义
    // 拒绝归档正在运行的会话，归档成功才动 DOM。
    const toArch = !(c.arch || el.classList.contains('arch'));
    closeChatMenu();
    api('/sessions/' + c.id + (toArch ? '/archive' : '/unarchive'), { method: 'POST', body: {} })
      .then(() => {
        c.arch = toArch;
        c.pin = toArch ? false : c.pin;
        const cc = CONVS.find(x => x.id === c.id);
        if (cc) { cc.arch = toArch; if (toArch) cc.pin = false; }
        el.classList.remove('in');
        // 归档当前打开的会话时清空选中（和服务端 session-active 语义一致）
        if (toArch && conv && conv.id === c.id) newChat();
        renderSidebar();
        toast(t(toArch ? 'arch_done' : 'unarch_done'));
      })
      .catch(err => toast(err.message));
    return;
  } else if (k === 'rename') {
    closeChatMenu();
    setTimeout(() => renameChat(c, el), 0);
    return;
  } else if (k === 'delete') {
    closeChatMenu();
    deleteChat(c, el);
    return;
  } else if (k === 'cid') {
    cp(c.id || '');
  } else if (k === 'rewind') {
    closeChatMenu();
    openRewind(c);
    return;
  } else if (k === 'set') {
    closeChatMenu();
    openSet();
    return;
  }
  closeChatMenu();
});

async function exportChat() {
  if (!conv) { toast(t('export_none')); return; }
  const title = $('#ttl').textContent || 'conversation';
  let md = '# ' + title + '\n\n';
  // 优先用服务端存储拼装（完整、与落盘一致）；失败降级为当前 DOM 快照
  let fromServer = false;
  if (conv.id) {
    try {
      const r = await api('/sessions/' + conv.id + '/messages');
      for (const m of (r.messages || [])) {
        const txt = normParts(m.parts).filter(p => p.k === 'text')
          .map(p => p.text).join('\n\n').trim();
        if (!txt) continue;
        md += (m.role === 'user' ? '## You\n\n' : '## Parable\n\n') + txt + '\n\n';
        fromServer = true;
      }
    } catch (e) { /* 降级 DOM */ }
  }
  if (!fromServer) {
    const walk = feed.querySelectorAll('.u, .a');
    walk.forEach(el => {
      if (el.classList.contains('u')) {
        md += '## You\n\n' + el.querySelector('.ub').innerText + '\n\n';
      } else {
        md += '## Parable\n\n' + el.querySelector('.ab').innerText + '\n\n';
      }
    });
  }
  try {
    const b = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.md';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast(t('exported'));
  } catch (err) { toast(t('toast')); }
}

/* ---- 搜索：会话内消息（服务端全文检索） ---- */
let cmdHits = [], cmdHitTimer = 0, cmdHitSeq = 0;

/** 高亮命中片段（服务端用 \u0001 包住命中段）。 */
function markExcerpt(s) {
  const parts = String(s || '').split('\u0001');
  return parts.map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

/** 拉取消息搜索结果（防抖 + 竞态丢弃）。 */
function cmdSearchMessages(q) {
  const seq = ++cmdHitSeq;
  if (cmdHitTimer) clearTimeout(cmdHitTimer);
  if (!q) { cmdHits = []; renderCmd(); return; }
  cmdHitTimer = setTimeout(async () => {
    try {
      const r = await api('/search/messages?q=' + encodeURIComponent(q));
      if (seq !== cmdHitSeq) return;   // 已有更新的查询，丢弃这次结果
      cmdHits = (r && r.hits) || [];
    } catch (e) {
      if (seq !== cmdHitSeq) return;
      cmdHits = [];
    }
    renderCmd();
  }, 180);
}

function renderCmd() {
  const q = cmdIn.value.trim();
  const ql = q.toLowerCase();
  const acts = cmdActions().filter(a => !ql || a.t.toLowerCase().includes(ql) || a.id.includes(ql));
  const cs = CONVS.filter(c => !c.arch && (!ql || (c.t || '').toLowerCase().includes(ql))).slice(0, 12);
  let html = '';
  cmdItems = [];
  if (acts.length) {
    html += '<div class="cmdg">' + t('actions') + '</div>';
    acts.forEach(a => {
      cmdItems.push({ run: a.run });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic(a.icon) + '</span><span class="tx2">' + esc(a.t) + '</span>' +
        (a.k ? '<span class="kb">' + a.k + '</span>' : '') + '</div>';
    });
  }
  if (cs.length) {
    html += '<div class="cmdg">' + t('rec') + '</div>';
    cs.forEach(c => {
      cmdItems.push({ run: () => openSession(c.id) });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic('chat') + '</span><span class="tx2">' + esc(c.t) + '</span>' +
        '<span class="kb">' + fmtAgo(c.ts) + '</span></div>';
    });
  }
  // 会话内消息命中
  if (ql && cmdHits.length) {
    html += '<div class="cmdg">' + t('in_msgs') + '</div>';
    cmdHits.slice(0, 20).forEach(h => {
      cmdItems.push({ run: () => openSession(h.session_id, h.index) });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic(h.role === 'user' ? 'search' : 'chat') + '</span>' +
        '<span class="tx2"><span class="cmi">' + markExcerpt(h.excerpt) + '</span>' +
        '<span class="cms">' + esc(h.session_title || '') + '</span></span></div>';
    });
  }
  if (!cmdItems.length) html = '<div class="cmdempty">' + t('noresult') + '</div>';
  cmdL.innerHTML = html;
  cmdIdx = 0;
  cmdPaint();
}

function cmdPaint() {
  cmdL.querySelectorAll('.cmdi').forEach(el => el.classList.toggle('on', +el.dataset.ci === cmdIdx));
  const el = cmdL.querySelector('.cmdi.on');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

}

  else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdItems.length) { cmdIdx = (cmdIdx - 1 + cmdItems.length) % cmdItems.length; cmdPaint(); } }
  else if (e.key === 'Enter') { e.preventDefault(); const it = cmdItems[cmdIdx]; closeCmd(); it && it.run(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmd(); }
});

/** 按供应商分组（模型清单里 value 形如 provider/model）。 */
function pkGroups() {
  const map = new Map();
  MODELS.forEach(m => {
    const id = (m.value || '').split('/')[0];
    if (!map.has(id)) map.set(id, { id: id, name: m.provider || id, models: [] });
    map.get(id).models.push(m);
  });
  return [...map.values()];
}

      '<button class="pkmanage" data-pkmanage="1">' + esc(t('pk_manage')) + '</button>';

/** 渲染并绑定一个模型选择器（主输入框弹层 / 侧聊浮动菜单共用）。 */
function pkRenderInto(root) {
  if (!root) return;
  if (!MPROV.length) loadProviders();
  root.innerHTML = pkHtml();
  // 弹层内容填完尺寸才算得出来：填完立刻重新定位一次，否则会按宽度 0 摆到屏幕外。
  if (root.__place) requestAnimationFrame(root.__place);
  root.onclick = e => {
    e.stopPropagation();
    if (e.target.closest('[data-pkmanage]')) {
      if (root.id === 'mm') root.classList.remove('open'); else root.remove();
      openSet();
      tab = 'm'; nav(); panel();
      return;
    }
    const p = e.target.closest('[data-pkp]');
    if (p) { PKP.sel = p.dataset.pkp; pkRenderInto(root); return; }
    const b = e.target.closest('[data-m]');
    if (!b) return;
    S.model = b.dataset.m;
    apply();
    refreshModelChip();
    spChromeAll();
    if (root.id === 'mm') root.classList.remove('open'); else root.remove();
    if (root.__place) requestAnimationFrame(root.__place);
  };
  root.oninput = e => {
    if (!e.target.matches('[data-pklv]')) return;
    S.lvl = +e.target.value;
    apply();
    const tx = root.querySelector('[data-pklvtx]');
    if (tx) tx.textContent = t('l' + S.lvl);
    spChromeAll();
  };
}

/** 按导航搜索词过滤分类按钮。 */
let navQ = '';
function navFilter() {
  const q = (navQ || '').trim().toLowerCase();
  let shown = 0;
  $('#snav').querySelectorAll('button[data-t]').forEach(b => {
    // 只按分类名过滤会让「搜说明里的词」找不到；用完整索引。
    const hit = !q || tabIndex(b.dataset.t).includes(q);
    b.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  // 每个分组独立显示/隐藏：组内一个都没命中就把组标题也藏起来。
  $('#snav').querySelectorAll('.sgrp').forEach(g => {
    let any = 0;
    let n = g.nextElementSibling;
    while (n && n.tagName === 'BUTTON') {
      if (n.style.display !== 'none') any++;
      n = n.nextElementSibling;
    }
    g.style.display = any ? '' : 'none';
  });
  // 命中的分类自动切过去，免得还要再点一次
  if (q && shown) {
    const first = [...$('#snav').querySelectorAll('button[data-t]')].find(b => b.style.display !== 'none');
    if (first && first.dataset.t !== tab) {
      tab = first.dataset.t;
      $('#snav').querySelectorAll('button[data-t]').forEach(b => b.classList.toggle('on', b === first));
      panel();
    }
  }
  // 面板内的命中项高亮并滚到可见位置
  markHits();
}

  p.querySelectorAll('.sr,.card,.mp-field,.skr,.memc').forEach(e => e.classList.remove('hit'));
  const q = (navQ || '').trim().toLowerCase();

}
