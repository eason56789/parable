.sph2{padding:16px 16px 8px;font:600 14px var(--serif)}
.sph3{margin:0;padding:14px 16px 6px;color:var(--fg2);font:11.5px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.spempty{padding:26px 16px;color:var(--fg2);font-size:12.5px;text-align:center;line-height:1.6}
.spbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:.5px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.spbar input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);font:12.5px var(--sans);outline:0}
.spbar input:focus{border-color:var(--fg2)}
.spbtn{border:1px solid var(--line);background:var(--input);color:var(--fg);border-radius:8px;padding:6px 11px;font:12.5px var(--sans);cursor:pointer;flex:none;transition:background-color calc(.2s * var(--animd))}
.spbtn:hover{background:var(--hov)}
/* 内置浏览器工具栏：导航钮 + 药丸地址栏 */
.spbnav{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:.5px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.spnav{border:1px solid var(--line);background:var(--input);color:var(--fg2);border-radius:8px;padding:6px 8px;cursor:pointer;flex:none;display:grid;place-items:center;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.spnav:hover{background:var(--hov);color:var(--fg)}
.spnav:active{transform:scale(.94)}
.spnav.pri{color:var(--accent);border-color:var(--accent)}
.spnav svg{width:14px;height:14px}
#spb-url{flex:1;min-width:0;padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--input);color:var(--fg);font:12.5px var(--mono);outline:0;transition:border-color .15s,box-shadow .15s}
#spb-url:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.spbhint{padding:6px 10px;color:var(--fg2);font-size:11px;opacity:.75}
.spbtxt{margin:6px 10px 10px}
.spbtxt summary{cursor:pointer;color:var(--fg2);font-size:11.5px}
.spbtxt pre{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:11px;opacity:.7;max-height:220px;overflow:auto}
.spbtn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.spbtn:disabled{opacity:.45;cursor:default}
/* 文件面板 */
.sptree{font:12.5px var(--sans)}
.sprow{display:flex;align-items:center;gap:6px;padding:3px 16px;cursor:pointer;color:var(--fg);white-space:nowrap}
.sprow:hover{background:var(--hov)}
.sprow svg{width:14px;height:14px;flex:none;color:var(--fg2)}
.sprow .nm{overflow:hidden;text-overflow:ellipsis}
.sprow .sz{margin-left:auto;color:var(--fg2);font-size:11px;padding-left:10px}
.spfile{padding:10px 16px 30px}
.spfile pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 var(--mono);color:var(--fg)}
.spfmeta{padding:6px 16px;color:var(--fg2);font-size:11.5px;border-bottom:.5px solid var(--line)}
/* 审查面板 */
.spgit{padding:8px 0}
.spgf{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font:12.5px var(--mono)}
.spgf:hover{background:var(--hov)}
.spgf .st{flex:none;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font:700 10px var(--sans);color:#fff}
.spgf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.spgf.add .st{background:var(--uch2)}.spgf.mod .st{background:var(--uch3)}.spgf.del .st{background:var(--uch4)}.spgf.new .st{background:var(--uch5)}
.spdiff{margin:0 0 12px;border:.5px solid var(--line);border-radius:9px;overflow:hidden;font:12px/1.55 var(--mono)}
.spdiff .hh{padding:5px 11px;background:var(--hov);color:var(--fg2);font-size:11px}
.spdiff .dl{display:flex;padding:0 10px;white-space:pre-wrap;word-break:break-word}
.spdiff .dl .sg{flex:none;width:12px;color:var(--fg2)}
.spdiff .dl.p{background:color-mix(in srgb,var(--uch2) 14%,transparent)}
.spdiff .dl.p .sg{color:var(--uch2)}
.spdiff .dl.m{background:color-mix(in srgb,var(--uch4) 14%,transparent)}
.spdiff .dl.m .sg{color:var(--uch4)}
/* 终端面板 */
.spterm{padding:0;display:flex;flex-direction:column;height:100%}
.spterm .log{padding:10px 14px;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;flex:1;min-height:0;overflow:auto;color:var(--fg)}
.spterm .cmd{display:flex;gap:8px;align-items:center;padding:9px 12px;border-top:.5px solid var(--line);background:var(--bg)}
.spterm .cmd input{flex:1;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);font:12.5px var(--mono);outline:0}
.spterm .cmd input:focus{border-color:var(--fg2)}
.spterm .pr{color:var(--fg2);font:12px var(--mono);flex:none}
/* 浏览器面板 */
.spbrow{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.spbrow img{width:100%;border-radius:9px;border:.5px solid var(--line);display:block;background:var(--hov)}
.spbrow pre{margin:0;padding:10px;border-radius:9px;background:var(--hov);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
/* 辅助对话面板 */
.spsc{padding:0;display:flex;flex-direction:column;height:100%}
.spsc .msgs{flex:1;min-height:0;overflow:auto;padding:12px 12px 4px;font:13px/1.6 var(--sans);display:flex;flex-direction:column}
.spsc .m{margin-bottom:10px;white-space:pre-wrap;word-break:break-word;max-width:100%}
/* 用户气泡跟主对话一样是「按内容收缩、靠右」，不是整条横杠 */
.spsc .m.u{align-self:flex-end;width:fit-content;max-width:82%;background:var(--bubble);border-radius:12px;padding:7px 12px;margin:2px 0 10px}
.spsc .m.a{color:var(--fg)}
.spsc .m.err{color:var(--uch4)}
.spcbar{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:8px 10px 10px}
.spcbar .sbtn{padding:4px 9px;font-size:11.5px}
.spsc .in{border-top:.5px solid var(--line);padding:9px 10px;display:flex;gap:8px;align-items:flex-end}
.spsc .in textarea{flex:1;min-width:0;resize:none;max-height:110px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--fg);font:13px var(--sans);outline:0}
.spsc .in textarea:focus{border-color:var(--fg2)}
.spsc .pm{padding:8px 12px;margin:0 12px 8px;border:.5px solid var(--line);border-radius:9px;background:var(--hov);font-size:12px}
.spsc .pm .cmd{font:12px var(--mono);word-break:break-all;margin-bottom:6px}
.spsc .pm button{border:1px solid var(--line);background:var(--input);color:var(--fg);border-radius:7px;padding:4px 10px;font:12px var(--sans);cursor:pointer;margin-right:6px}
.spsc .pm button:hover{background:var(--fg);color:var(--bg)}
/* 后台智能体对话（侧栏只读视图） */
.spag{display:flex;flex-direction:column;height:100%;min-height:0}
.spagh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:11px 14px;border-bottom:.5px solid var(--line);background:var(--side)}
.spag .nm{font:600 13px var(--sans);color:var(--fg);word-break:break-all}
.spag .rl,.spag .ro{font:11px var(--sans);color:var(--fg2);border:.5px solid var(--line);border-radius:20px;padding:1px 7px;white-space:nowrap}
.spag .ro{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.spag .tk{flex:1 0 100%;font:12px/1.5 var(--sans);color:var(--fg2);white-space:pre-wrap;word-break:break-word;max-height:4.5em;overflow:hidden}
.spagm{flex:1;min-height:0;overflow:auto;padding:14px 16px 48px}
.spagm .msg{animation:none}
.spagm .a{font-size:calc(var(--fs) - 1px)}
.dag{cursor:pointer}
.dag:hover{border-color:var(--fg2);background:var(--hov)}

@media(max-width:760px){#sdp{position:absolute;z-index:31;top:0;bottom:0;right:0;width:min(420px,100vw)!important;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.spmax #sdp{position:fixed;inset:46px 0 0 0;width:100vw!important}}

/* ============ 使用统计 ============ */
.ug{display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;padding:38px 44px 60px}
@media(max-width:760px){.ug{padding:22px 20px 40px}}
.ug-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.ug-h h2{margin:0;font:600 26px var(--serif)}
.ug-h p{margin:5px 0 0;color:var(--fg2);font-size:13px;line-height:1.5}
.ug-ha{display:flex;align-items:center;gap:8px;flex:none}
/* 顶部概览格 */
.ug-sum{display:grid;grid-template-columns:repeat(4,1fr);border:.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
@media(max-width:900px){.ug-sum{grid-template-columns:repeat(4,1fr)}}
@media(max-width:620px){.ug-sum{grid-template-columns:repeat(2,1fr)}}
.ug-sum>div{padding:18px 16px;text-align:center;border-left:.5px solid var(--line);border-top:.5px solid var(--line)}
.ug-sum>div:nth-child(4n+1){border-left:0}
.ug-sum>div:nth-child(-n+4){border-top:0}
@media(max-width:620px){
  .ug-sum>div:nth-child(4n+1){border-left:.5px solid var(--line)}
  .ug-sum>div:nth-child(2n+1){border-left:0}
  .ug-sum>div:nth-child(-n+4){border-top:.5px solid var(--line)}
  .ug-sum>div:nth-child(-n+2){border-top:0}
}
.ug-sum b{display:block;font:600 22px var(--serif);color:var(--fg);letter-spacing:-.01em}
.ug-sum span{display:block;margin-top:4px;color:var(--fg2);font-size:11.5px}
/* 常用模型 / 峰值时段：概览下方的两条高亮 */
.ug-hl{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:-6px;padding:12px 16px;border:.5px solid var(--line);border-radius:12px;background:var(--hov)}
.ug-hl-i{display:flex;align-items:baseline;gap:8px;min-width:0}
.ug-hl-i>span{color:var(--fg2);font:11.5px var(--sans);white-space:nowrap}
.ug-hl-i>b{font:500 13px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ug-hl-i>em{font-style:normal;font:11.5px var(--mono);color:var(--fg2);white-space:nowrap}
.ug-card{border:.5px solid var(--line);border-radius:14px;background:var(--bg);padding:18px 20px 20px}
.ug-card>h3{margin:0 0 14px;font:500 14px var(--sans);color:var(--fg)}
.ug-ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ug-ch h3{margin:0;font:500 14px var(--sans);color:var(--fg)}
/* 分段切换（复用 .seg） */
.ug-seg{display:flex;background:var(--hov);border-radius:9px;padding:3px;flex:none}
.ug-seg button{border:0;background:none;color:var(--fg2);border-radius:7px;padding:5px 12px;font:12px var(--sans);cursor:pointer;transition:background-color calc(.3s * var(--animd)),color calc(.3s * var(--animd))}
.ug-seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* 热力图 */
.ug-hm{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ug-hmw{display:flex;flex-direction:column;gap:3px;flex:none}
.ug-hmc{width:11px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--fg2) 12%,transparent)}
.ug-hmc.l1{background:color-mix(in srgb,var(--uch1) 30%,transparent)}
.ug-hmc.l2{background:color-mix(in srgb,var(--uch1) 50%,transparent)}
.ug-hmc.l3{background:color-mix(in srgb,var(--uch1) 72%,transparent)}
.ug-hmc.l4{background:var(--uch1)}
.ug-hmc.void{background:transparent}
.ug-hmm{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:3px;flex:1;min-width:520px}
.ug-hmm .ug-hmc{width:auto;aspect-ratio:1;height:auto}
.ug-hml{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:3px;margin-top:6px;flex:1;min-width:520px}
.ug-hml span{font-size:10px;color:var(--fg2);white-space:nowrap;overflow:hidden}
/* 图表 */
.ug-chart{width:100%;display:block;overflow:visible}
.ug-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}
.ug-lg{display:flex;align-items:center;gap:6px;font:12px var(--sans);color:var(--fg2)}
.ug-lg i{width:8px;height:8px;border-radius:50%;flex:none}
.ug-mu{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.ug-mu-l{flex:1;min-width:240px;display:flex;flex-direction:column;gap:9px}
.ug-mu-r{flex:1;min-width:240px;display:flex;flex-direction:column;gap:2px}
.ug-mu-i{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-bottom:.5px solid var(--line)}
.ug-mu-i:last-child{border-bottom:0}
.ug-mu-i i{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.ug-mu-i b{flex:1;font:12.5px var(--mono);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ug-mu-i em{font-style:normal;font:12px var(--sans);color:var(--fg2)}
.ug-mu-i span{font:11.5px var(--sans);color:var(--fg2);min-width:64px;text-align:right}
.ug-empty{padding:40px 0;text-align:center;color:var(--fg2);font-size:13px}
/* Token 构成：输入 / 输出 / 缓存读 / 缓存写 一条堆叠条 + 图例 */
.ug-comp{display:flex;flex-direction:column;gap:14px}
.ug-cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--hov)}
.ug-cbar i{display:block;height:100%;transition:width calc(.5s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-cbar i+i{box-shadow:-1px 0 0 var(--bg)}
.ug-cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px 18px}
.ug-cleg>div{display:flex;align-items:baseline;gap:7px;min-width:0}
.ug-cleg i{width:8px;height:8px;border-radius:2px;flex:none;align-self:center}
.ug-cleg b{font:12.5px var(--mono);color:var(--fg);font-weight:500}
.ug-cleg em{font-style:normal;font:11.5px var(--sans);color:var(--fg2);margin-left:auto;white-space:nowrap}
.ug-cleg span{font:11.5px var(--sans);color:var(--fg2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 活跃时段：24 小时柱状图 + 星期条 */
.ug-act{display:grid;grid-template-columns:1fr;gap:18px}
.ug-hours{display:flex;align-items:flex-end;gap:2px;height:96px;padding-bottom:2px;border-bottom:.5px solid var(--line)}
.ug-hour{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.ug-hour i{display:block;width:100%;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--uch1) 55%,transparent);
    transition:height calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1),background-color calc(.2s * var(--animd))}
.ug-hour:hover i{background:var(--uch1)}
.ug-hour.zero i{background:color-mix(in srgb,var(--fg2) 12%,transparent)}
.ug-hour b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;padding:2px 6px;border-radius:5px;
    background:var(--fg);color:var(--bg);font:10.5px var(--mono);white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity calc(.18s * var(--animd))}
.ug-hour:hover b{opacity:1}
.ug-haxis{display:flex;justify-content:space-between;margin-top:5px;color:var(--fg2);font:10.5px var(--mono)}
.ug-wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.ug-wday{text-align:center}
.ug-wday .b{height:7px;border-radius:4px;background:color-mix(in srgb,var(--uch1) 22%,transparent);overflow:hidden}
.ug-wday .b i{display:block;height:100%;border-radius:4px;background:var(--uch1);transition:width calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-wday span{display:block;margin-top:6px;color:var(--fg2);font:11px var(--sans)}
.ug-wday em{display:block;font:10.5px var(--mono);color:var(--fg2);font-style:normal;margin-top:2px}
/* 高活跃时段提示 */
.ug-peaks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)}
.ug-peak{display:flex;align-items:baseline;gap:7px;font:12px var(--sans);color:var(--fg2)}
.ug-peak b{font:500 12.5px var(--mono);color:var(--fg)}
.ug-peak em{font-style:normal;font:11px var(--mono);color:var(--fg2)}
/* 用量最高的会话 */
.ug-ts{display:flex;flex-direction:column;gap:1px}
.ug-ts-r{display:flex;align-items:center;gap:10px;padding:9px 8px;margin:0 -8px;border-radius:9px;cursor:pointer;
    transition:background-color calc(.2s * var(--animd))}
.ug-ts-r:hover{background:var(--hov)}
.ug-ts-r .rank{flex:none;width:20px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
.ug-ts-r .nm{flex:1;min-width:0}
.ug-ts-r .nm b{display:block;font:12.5px var(--sans);color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ug-ts-r .nm small{display:block;margin-top:2px;color:var(--fg2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ug-ts-r .bar{flex:none;width:110px;height:5px;border-radius:3px;background:var(--hov);overflow:hidden}
.ug-ts-r .bar i{display:block;height:100%;border-radius:3px;background:var(--uch1);transition:width calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-ts-r .val{flex:none;min-width:82px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
@media(max-width:700px){.ug-ts-r .bar{display:none}}

/* ============ 命令面板 ============ */
#cmdk{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;padding:11vh 20px 20px;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity calc(.32s * var(--animd)) ease,background-color calc(.32s * var(--animd)) ease,backdrop-filter calc(.32s * var(--animd)) ease}
#cmdk.open{display:flex;opacity:1;pointer-events:auto;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cmdb{width:min(600px,100%);background:var(--input);border:.5px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden;opacity:0;transform:translateY(-10px) scale(.98);transition:opacity calc(.3s * var(--animd)) ease,transform calc(.34s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
#cmdk.open .cmdb{opacity:1;transform:none}
.cmdin{width:100%;border:0;background:none;outline:0;color:var(--fg);font:16px var(--sans);padding:16px 18px;border-bottom:.5px solid var(--line)}
.cmdl{max-height:min(420px,52vh);overflow-y:auto;padding:6px}
/* 搜索结果逐条淡入（重渲染时先淡出再淡入） */
.cmdl .cmdi,.cmdl .cmdg,.cmdl .cmdempty{animation:cmdi calc(.34s * var(--animd)) ease both}
@keyframes cmdi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cmdl.out .cmdi,.cmdl.out .cmdg,.cmdl.out .cmdempty{animation:cmdo calc(.2s * var(--animd)) ease both}
@keyframes cmdo{from{opacity:1}to{opacity:0;transform:translateY(-3px)}}
.cmi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmi mark{background:transparent;color:var(--accent);font-weight:600}
.cms{display:block;font-size:11.5px;color:var(--fg2);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
/* 搜索跳转命中的消息：高亮一下 */
.msg.flash{animation:msgflash 1.6s ease}
@keyframes msgflash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:10px}
  70%{background:color-mix(in srgb,var(--accent) 12%,transparent)}100%{background:transparent}}
.cmdg{padding:8px 10px 4px;font-size:11.5px;color:var(--fg2);letter-spacing:.02em}
.cmdi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmdi:hover{background:var(--hov)}
.cmdi.on{background:var(--hov)}
.cmdi .ic2{width:20px;height:20px;display:grid;place-items:center;color:var(--fg2);flex:none}
.cmdi .ic2 svg{width:16px;height:16px}
.cmdi .tx2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdi .kb{flex:none;font:11px var(--mono);color:var(--fg2);border:.5px solid var(--line);border-radius:5px;padding:1px 6px}
.cmdempty{padding:28px;text-align:center;color:var(--fg2);font-size:13px}
.cmdf{padding:8px 14px;border-top:.5px solid var(--line);display:flex;gap:14px;color:var(--fg2);font-size:11.5px}
.cmdf b{font:11px var(--mono);border:.5px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}

/* ============ 斜杠菜单 ============ */
#sl{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--input);border:.5px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.22);padding:6px;display:none;max-height:284px;overflow-y:auto;z-index:20}
#sl.open{display:block}
#sl .cmdi{font-size:13px;padding:8px 10px}
#sl .kb{font:11px var(--mono);color:var(--fg2)}

/* ============ 附件 ============ */
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#atts:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--hov);border-radius:8px;padding:4px 8px;font:12.5px var(--sans);max-width:230px}
.att svg{width:14px;height:14px;color:var(--fg2);flex:none}
.att b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{cursor:pointer;color:var(--fg2);display:grid;place-items:center;border-radius:4px;padding:0 1px;font-size:13px;line-height:1}
.att .x:hover{color:var(--fg);background:var(--line)}
/* 图片附件的小缩略图（输入框 chip 与用户气泡共用） */
.att .attimg{width:18px;height:18px;border-radius:4px;object-fit:cover;flex:none}
.uatt .att .attimg{width:34px;height:34px;border-radius:6px}
.att.upl{opacity:.6}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-8px}

/* ============ 回到最新 ============ */
#jump{position:absolute;right:20px;bottom:calc(var(--ch,150px) + 16px);width:34px;height:34px;border-radius:50%;background:var(--input);border:.5px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.16);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity calc(.3s * var(--animd)),transform calc(.35s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:6;color:var(--fg2)}
#jump.on{opacity:1;pointer-events:auto;transform:none}
#jump:hover{color:var(--fg)}
#jump svg{width:17px;height:17px}

/* ============ 快捷键面板 ============ */
#kbd{position:fixed;inset:0;z-index:96;display:none;place-items:center;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#kbd.open{display:grid}
.kbdc{width:min(540px,92vw);background:var(--bg);border-radius:16px;padding:22px 24px 16px;box-shadow:0 24px 70px rgba(0,0,0,.34);animation:rise calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.kbdc h2{margin:0 0 4px;font:600 20px var(--serif)}
.kbdc p{margin:0 0 14px;color:var(--fg2);font-size:12.5px}
.kbr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:13.5px}
.kbr:last-child{border:0}
.kbr kbd{font:11.5px var(--mono);background:var(--hov);border:.5px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.kbdc .btn{margin-top:14px;width:100%}
/* ===== 记忆页 ===== */
.mempg{display:flex;flex-direction:column;gap:0}
.mempg .hd{margin-bottom:6px}
.memrow{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:24px;padding:18px 0;border-bottom:.5px solid var(--line)}
.memrow>div>small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.memtb{display:flex;align-items:center;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
.memtb .fl{flex:1}
.msearch{width:220px;max-width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--fg);font:13px var(--sans);outline:0}
.msearch:focus{border-color:var(--accent)}
.memc{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:.5px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--bg);transition:border-color .2s}
.memc .mtx{flex:1;min-width:0;line-height:1.7;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.mmeta{display:block;font:11.5px var(--mono);color:var(--fg2);margin-top:8px}
.mtag{flex:none;padding:2px 8px;border-radius:6px;font-size:11.5px;margin-top:2px;white-space:nowrap}
.t-pref{background:color-mix(in srgb,var(--c1) 15%,transparent);color:var(--c1)}
.t-proj{background:color-mix(in srgb,var(--c3) 15%,transparent);color:var(--c3)}
.t-fact{background:color-mix(in srgb,var(--c2) 15%,transparent);color:var(--c2)}
.memc.ed{flex-direction:column;align-items:stretch;border-color:var(--accent)}
.memc textarea{width:100%;min-height:76px;resize:vertical;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);font:13.5px/1.55 var(--sans);outline:0}
.mer{display:flex;align-items:center;gap:8px}
.mer select{width:auto;padding:6px 28px 6px 10px}
.mer .fl{flex:1}
.memft{display:flex;justify-content:space-between;color:var(--fg2);font-size:12px;margin-top:16px}
.memft a{cursor:pointer;text-decoration:underline}
.memft a:hover{color:#e5534b}
#mlist.off{opacity:.45}
.memnone{padding:34px;text-align:center;color:var(--fg2);border:1px dashed var(--line);border-radius:12px}
.memc .ib{width:28px;height:28px;flex:none}
/* ===== 技能页 ===== */
.skpg{display:flex;flex-direction:column}
.sktb{display:flex;align-items:center;gap:14px;margin:8px 0 22px;flex-wrap:wrap}
.scope{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.scope svg{width:15px;height:15px;color:var(--fg2)}
.scope select{border:0;background:none;color:var(--fg);font:13px var(--sans);outline:0;cursor:pointer}
.vd{width:1px;height:16px;background:var(--line)}
.skn{font-weight:500}
.skn em{font-style:normal;color:var(--fg2);font-weight:400;margin-left:4px}
.skq{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:min(280px,100%);color:var(--fg2)}
.skq svg{width:15px;height:15px;flex:none}
.skq input{border:0;background:none;outline:0;color:var(--fg);font:13px var(--sans);width:100%}
.diag{border:1px solid color-mix(in srgb,#e0a000 55%,transparent);background:color-mix(in srgb,#e0a000 10%,transparent);border-radius:10px;margin-bottom:10px;font-size:13px}
.diag .dh{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer}
.diag .dh svg{width:14px;height:14px;flex:none}
.diag .dh svg:first-child{transition:transform .2s}
.diag.open .dh svg:first-child{transform:rotate(90deg)}
.diag .dh svg:nth-child(2){color:#e0a000}
.dbody{display:none;padding:0 14px 12px 36px;color:var(--fg2);font:12px/1.8 var(--mono);word-break:break-all}
.diag.open .dbody{display:block}
.sksh{display:flex;align-items:center;gap:8px;margin:26px 0 14px;position:relative}
.sksh:first-child{margin-top:6px}
.sksh b{font-weight:600}
.sksh em{font-style:normal;color:var(--fg2);font-size:12px}
.sksh .fl{flex:1}
.sksh .ib{border:1px solid var(--line);width:30px;height:30px}
.sksh .ib svg{width:15px;height:15px}
.sksh .ib.spin svg{animation:skspin .8s linear infinite}
@keyframes skspin{to{transform:rotate(360deg)}}
.skl{border:.5px solid var(--line);border-radius:14px;background:var(--hov);overflow:hidden}
.skr .skt b{font-size:13.5px}
.skr{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:.5px solid var(--line)}
.skr:last-child{border:0}
.skr.ed{cursor:pointer}
.skr:hover{background:var(--hov)}
.sktile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font:600 12px var(--sans)}
.sktile.n{background:var(--bg);color:var(--fg2);border:.5px solid var(--line)}
.sktile svg{width:18px;height:18px}
.skt{flex:1;min-width:0}
.skt b{display:block;font-weight:500}
.skt span{display:block;color:var(--fg2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skmenu{position:absolute;right:0;top:38px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:4px;z-index:5;min-width:170px;display:none}
.skmenu.on{display:block}
.skmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font:13px var(--sans);color:var(--fg)}
.skmenu button:hover{background:var(--hov)}
.sknone{padding:30px;text-align:center;color:var(--fg2)}
.skq2{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;width:min(260px,100%);color:var(--fg2)}
.skq2 svg{width:15px;height:15px;flex:none}
.skq2 input{border:0;background:none;outline:0;color:var(--fg);font:13px var(--sans);width:100%}
@media(max-width:760px){
  .memrow{grid-template-columns:1fr;gap:8px}
  .sktb{gap:10px}
  .skq,.skq2{margin-left:0;width:100%}
  .msearch{width:100%}
  .memtb .fl{display:none}
}
/* ===== 使用统计（设置页 → 用量） ===== */
.ug{display:flex;flex-direction:column;gap:18px;max-width:1000px;margin:0 auto}
.mempg,.skpg{max-width:1000px;margin:0 auto;display:flex;flex-direction:column}
.mempg .hd,.skpg .hd{margin-bottom:6px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:12px}
.hd h2{margin:0;font:600 26px var(--serif)}
.hd p{margin:6px 0 0;color:var(--fg2);font-size:13px}
.ug .hd{margin-bottom:0}
.ug-ha{display:flex;align-items:center;gap:10px;flex:none}
.lr{font-size:12px;color:var(--fg2);white-space:nowrap}
.ug .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--input);
  color:var(--fg);border-radius:8px;padding:6px 12px;font:12.5px var(--sans);cursor:pointer}
.ug .btn:hover{background:var(--hov)}
.ug .btn svg{width:14px;height:14px}
.ug-sum{display:flex;border:.5px solid var(--line);border-radius:14px;overflow:hidden}
.ug-sum>div{flex:1;min-width:0;padding:16px 10px;text-align:center;border-left:.5px solid var(--line)}
.ug-sum>div:first-child{border-left:0}
.ug-sum b{display:block;font:600 21px var(--serif);white-space:nowrap}
.ug-sum span{display:block;margin-top:3px;color:var(--fg2);font-size:11.5px}
.card{border:.5px solid var(--line);border-radius:14px;padding:16px 18px 18px;position:relative;background:var(--bg)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h3{margin:0;font:500 14px var(--sans)}
.ch em{font:12px var(--mono);color:var(--fg2);font-style:normal}
.seg{display:inline-flex;background:var(--hov);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--fg2);border-radius:7px;padding:5px 12px;
  font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rowh>b{font-weight:500;font-size:13px}
/* 热力图 */
.hmg{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));column-gap:2px}
.hmc{display:grid;grid-auto-rows:10px;row-gap:2px}
.hmc i{display:block;width:100%;height:10px;aspect-ratio:auto;border-radius:2px;border:1px solid transparent;
  background:color-mix(in srgb,var(--fg2) 11%,transparent);transition:transform .12s}
.hmc i:hover{transform:scale(1.18);border-color:var(--fg2)}
.hmc i.u{border-color:var(--line)}
.hmc i.l1{background:color-mix(in srgb,var(--uch1) 28%,transparent)}
.hmc i.l2{background:color-mix(in srgb,var(--uch1) 50%,transparent)}
.hmc i.l3{background:color-mix(in srgb,var(--uch1) 74%,transparent)}
.hmc i.l4{background:var(--uch1)}
.hmc i.n{visibility:hidden}
.hmc.col:hover i.u{border-color:var(--fg2)}
.hml{margin-top:8px;font-size:10.5px;color:var(--fg2)}
.hml span{white-space:nowrap;overflow:hidden}
.hlg{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;
  font-size:11px;color:var(--fg2)}
.hlg i{width:11px;height:11px;border-radius:3px;display:block;
  background:color-mix(in srgb,var(--fg2) 11%,transparent)}
.hlg i.l1{background:color-mix(in srgb,var(--uch1) 28%,transparent)}
.hlg i.l2{background:color-mix(in srgb,var(--uch1) 50%,transparent)}
.hlg i.l3{background:color-mix(in srgb,var(--uch1) 74%,transparent)}
.hlg i.l4{background:var(--uch1)}
/* 趋势图 */
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:12px;color:var(--fg2)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{position:relative}
.tw svg{width:100%;display:block;overflow:visible}
.tip{position:absolute;top:0;pointer-events:none;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);
  min-width:190px;opacity:0;transform:translateX(-50%);transition:opacity .12s;z-index:3}
.tip .t{font-weight:500;margin-bottom:5px}
.tip div.r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip div.r>span{display:flex;align-items:center;gap:6px;color:var(--fg2)}
.tip i{width:8px;height:8px;border-radius:50%}
.tip code{font:12px var(--mono)}
/* 模型环图 */
.pie{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.pie svg{width:200px;height:200px;flex:none}
.pl{flex:1;min-width:240px}
.pl>div{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:.5px solid var(--line)}
.pl>div:last-child{border:0}
.pl i{width:8px;height:8px;border-radius:50%;flex:none}
.pl b{flex:1;font:500 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{font-style:normal;font-size:12px;color:var(--fg2)}
.pl span{min-width:52px;text-align:right;font:12px var(--mono)}
/* Token 构成 */
.cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--hov)}
.cbar i{display:block;height:100%}
.cbar i+i{box-shadow:-1px 0 0 var(--bg)}
.cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;
  margin-top:14px;font-size:12px;color:var(--fg2)}
.cleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.cleg b{font:500 12.5px var(--mono);color:var(--fg);margin-left:4px}
/* 活跃时段 */
.hrs{display:flex;align-items:flex-end;gap:2px;height:90px;border-bottom:.5px solid var(--line)}
.hrs i{flex:1;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--uch1) 50%,transparent)}
.hrs i.pk{background:var(--uch1)}
.hrs i:hover{background:var(--uch1)}
.hax{display:flex;justify-content:space-between;margin-top:5px;font:10.5px var(--mono);color:var(--fg2)}
/* 用量最高的会话 */
.ts{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line)}
.ts:last-child{border:0}
.ts:hover{background:var(--hov)}
.ts .k{width:18px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
.ts .n{flex:1;min-width:0}
.ts .n b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .n small{color:var(--fg2);font-size:11px}
.ts .bar{width:110px;height:5px;border-radius:3px;background:var(--hov);overflow:hidden}
.ts .bar i{display:block;height:100%;background:var(--uch1)}
.ts .v{min-width:70px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
.ld{padding:60px 0;text-align:center;color:var(--fg2)}
.ld b{display:block;color:var(--fg);font-weight:500;margin-bottom:6px}
.ug-empty{padding:40px 0;text-align:center;color:var(--fg2);font-size:13px}
@media(max-width:760px){
  .ug-sum{flex-wrap:wrap}
  .ug-sum>div{flex:1 1 33%;border-top:.5px solid var(--line)}
  .hmg{grid-template-columns:repeat(26,minmax(0,1fr))}
  .ts .bar{display:none}
  .pie{gap:20px}
  .pie svg{width:160px;height:160px}
}

/* ---------------------------------------------------------- 右上角悬浮窗
   后台智能体 / 后台终端 / 目标与任务阶段。收起时只占三枚小胶囊，展开是
   一张贴着右上角的面板；不参与布局，所以不会挤压聊天区。 */
#dock{position:absolute;top:8px;right:14px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#dock.set-hide{display:none}
.dbar{display:flex;gap:3px;pointer-events:auto;background:var(--bg);border:.5px solid var(--line);border-radius:11px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.05);opacity:.94;backdrop-filter:blur(8px)}
.dpill{height:25px;display:flex;align-items:center;gap:4px;padding:0 7px;border:0;background:none;border-radius:8px;color:var(--fg2);cursor:pointer;font:500 11px var(--sans);transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.dpill:hover{background:var(--hov);color:var(--fg)}
.dpill.on{background:var(--hov);color:var(--fg)}
.dpill b{font-variant-numeric:tabular-nums;font-weight:600}
.dpill.live{color:var(--accent)}
.dpill svg{width:13px;height:13px}
.dpanel{pointer-events:auto;width:346px;max-height:min(62vh,540px);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);border:.5px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.16);animation:dpin calc(.18s * var(--animd)) ease-out}
@keyframes dpin{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.dpanel[hidden]{display:none}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:.5px solid var(--line);flex:none}
.dhead .dtitle{flex:1;font:500 12px var(--sans);color:var(--fg)}
.dhead button{border:0;background:none;color:var(--fg2);cursor:pointer;padding:3px;border-radius:6px;display:grid;place-items:center}
.dhead button:hover{background:var(--hov);color:var(--fg)}
.dbody{overflow:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.drow{border:.5px solid var(--line);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;background:var(--input)}
.drow .dt{display:flex;align-items:center;gap:6px;font:500 12px var(--sans);min-width:0}
.drow .dt .dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dt .dm{margin-left:auto;color:var(--fg2);font:400 10.5px var(--mono);flex:none}
.dsub{font:11px/1.5 var(--mono);color:var(--fg2);white-space:pre-wrap;word-break:break-word;max-height:96px;overflow:hidden}
.dempty{padding:20px 8px;text-align:center;color:var(--fg2);font-size:12px;line-height:1.6}
.dact{display:flex;gap:6px;align-items:center}
.dact button{border:.5px solid var(--line);background:none;border-radius:7px;padding:2px 8px;font-size:11px;color:var(--fg2);cursor:pointer}
.dact button:hover{background:var(--hov);color:var(--fg)}
.dterm{display:flex;gap:6px;flex:none}
.dterm input{flex:1;min-width:0;border:.5px solid var(--line);background:var(--input);color:var(--fg);border-radius:7px;padding:4px 8px;font:12px var(--mono);outline:none}
.dterm input:focus{border-color:var(--accent)}
.dterm button{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:0 10px;font-size:11.5px;cursor:pointer;flex:none}
.dsec{font:500 11px var(--sans);color:var(--fg2);padding:3px 2px 0}
.dtask{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5}
.dtask i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line);flex:none;margin-top:3px;display:grid;place-items:center;font-size:9px;font-style:normal;color:#fff}
.dtask i.done{background:var(--accent);border-color:var(--accent)}
.dtask i.run{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,119,87,.18)}
.dtask span.done{color:var(--fg2);text-decoration:line-through}
.dstage{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);padding:2px 2px 6px}
.dstage b{color:var(--fg);font-weight:500}
.dgoal{font-size:12.5px;line-height:1.6;color:var(--fg);word-break:break-word}
.dmeta{display:flex;gap:10px;flex-wrap:wrap;font:11px var(--mono);color:var(--fg2)}

/* ------------------------------------------------------------- 侧边栏头部 */
#sbhead{display:flex;align-items:center;gap:6px;padding:10px 10px 2px;flex:none}
#sbhead .sbt{font:500 12px var(--sans);color:var(--fg2);flex:1}
#sbhead .sbc{font:10.5px var(--mono);color:var(--fg2);opacity:.85}
.sbi{width:22px;height:22px;border:0;background:none;color:var(--fg2);border-radius:6px;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity calc(.15s * var(--animd)),background-color calc(.15s * var(--animd))}
#sbhead:hover .sbi,#sbhead:focus-within .sbi{opacity:.7}
.sbi:hover{background:var(--hov);color:var(--fg);opacity:1}
.sbi svg{width:14px;height:14px}
#sbtabs{display:flex;gap:2px;margin:4px 10px 6px;padding:2px;border-radius:9px;background:var(--hov);flex:none}
.sv{flex:1;border:0;background:none;border-radius:7px;padding:3px 0;font:500 11px var(--sans);color:var(--fg2);cursor:pointer;transition:background-color calc(.25s * var(--animd)),color calc(.25s * var(--animd)),box-shadow calc(.25s * var(--animd))}
.sv.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.sbproj{display:flex;flex-direction:column}
.sbph{display:flex;align-items:center;gap:7px;padding:6px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg);font:500 12px var(--sans);width:100%}
.sbph:hover{background:var(--hov)}
.sbph .sbpi{color:var(--fg2);display:grid;place-items:center;flex:none}
.sbph .sbpi svg{width:15px;height:15px}
.sbph b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sbph .sbpn{font:10px var(--mono);color:var(--fg2);flex:none}
.sbph .sbchev{color:var(--fg2);display:grid;place-items:center;flex:none;transition:transform calc(.3s * var(--animd))}
.sbph .sbchev svg{width:12px;height:12px}
.sbph.closed .sbchev{transform:rotate(-90deg)}
.sbptasks{display:flex;flex-direction:column;padding-left:6px}
.sbmore{border:0;background:none;color:var(--fg2);font:11px var(--sans);padding:4px 10px 6px 16px;cursor:pointer;text-align:left;border-radius:6px}
.sbmore:hover{color:var(--fg);background:var(--hov)}
.rcg .rch{cursor:pointer;display:flex;align-items:center;gap:6px}
.rcg .rch .rchn{font:10px var(--mono);opacity:.8}
.rcg .rch .rchc{margin-left:auto;transition:transform calc(.3s * var(--animd));display:grid;place-items:center}
.rcg .rch .rchc svg{width:11px;height:11px}
.rcg .rch.closed .rchc{transform:rotate(-90deg)}

.spdep{display:flex;flex-direction:column;gap:2px}
.spdr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--line);font-size:12.5px}
.spdr span{color:var(--fg2)}
.spdr b{margin-left:auto;font-weight:500;font-family:var(--mono);font-size:12px}
.spdr:last-of-type{border-bottom:0}
.spdcmd{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--hov);font:12px var(--mono);color:var(--fg2);overflow-x:auto;white-space:nowrap}
.spdhint{margin:12px 0 0;color:var(--fg2);font-size:12px;line-height:1.6}

/* Wave-2：MCP / Hooks / Profiles 行 */
.mcprow { display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:6px 0; }
.mcprow select, .mcprow input { background:var(--bg); border:1px solid var(--line); border-radius:8px; color:inherit; padding:4px 8px; font-size:12px; }
.mcpdot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#8a8a85; margin:0 4px; }
.mcpdot.ok { background:#5aa264; }
.mcpdot.off { background:#8a8a85; }
.profon { font-size:12px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 10px; }
.rwf { font-family:var(--mono); font-size:11px; opacity:.5; margin-left:8px; }
.rwrow { display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); padding:10px 0; }
</style>
</head>

const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------------------------------------------------------- icons */
const IC = {

  up:'<path d="M7 9v7H4V9zM7 9l3-5c1.5 0 2 1 1.7 2L11 9h4a1 1 0 011 1.2l-1 5a1 1 0 01-1 .8H7"/>',
  retry:'<path d="M16 10a6 6 0 11-2-4.5M16 3v3h-3"/>',

  stop:'<rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/>',
  tune:'<path d="M3 7h9M15 7h2M3 13h2M8 13h9"/><circle cx="13.5" cy="7" r="1.5"/><circle cx="6.5" cy="13" r="1.5"/>',
  check:'<path d="M5 10.5l3.5 3.5L15 6.5"/>',
  eye:'<path d="M2.5 10S5.5 5 10 5s7.5 5 7.5 5-3 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.4"/>',
  eyeoff:'<path d="M3 3l14 14"/><path d="M7.4 5.6A7.7 7.7 0 0110 5c4.5 0 7.5 5 7.5 5a13 13 0 01-2.2 2.8M5.2 6.4A13 13 0 002.5 10S5.5 15 10 15c.9 0 1.7-.2 2.4-.5"/>',
  trash:'<path d="M4 6h12M8 6V4h4v2M6.5 6l.7 10h5.6l.7-10"/>',
  pin:'<path d="M7.2 3h5.6l-.7 4.1 2.4 2.4H5.5l2.4-2.4z"/><path d="M10 9.5V16"/>',
  user:'<circle cx="10" cy="7.2" r="3.2"/><path d="M4.5 16.5c.9-3 2.9-4.6 5.5-4.6s4.6 1.6 5.5 4.6"/>',
  more:'<circle cx="4.5" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.2" fill="currentColor" stroke="none"/>',
  help:'<circle cx="10" cy="10" r="7"/><path d="M7.9 8a2.1 2.1 0 114 .9c-.4.7-1.1 1-1.5 1.6-.2.3-.3.6-.3.9"/><circle cx="10" cy="14.1" r=".7" fill="currentColor" stroke="none"/>',
  dl:'<path d="M10 3.5v9M6.5 9l3.5 3.5L13.5 9"/><path d="M4 15.5h12"/>',

  plug:'<path d="M7.5 3v3.5M12.5 3v3.5"/><path d="M5 6.5h10V10a5 5 0 01-10 0z"/><path d="M10 15v2.5"/>',

  x:'<path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/>',

  wand:'<path d="M4 16L12 8"/><path d="M11 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/><path d="M15 11l.6 1.2 1.4.8-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.8z"/>',

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/**
 * 去掉 emoji（彩色表情与部分图形符号）。
 *
 * 界面要保持视觉统一：模型回复、工具输出、用户自己起的会话名里都可能带
 * emoji，它们与界面的字形体系格格不入。这里只影响**显示**，不改动存储
 * 的原文 —— 数据仍按原样保留。
 *
 * 只删真正的 emoji 区段。U+2600–27BF（含 ✓ ✗ ★ ⚠）、U+2B00–2BFF 和私用区
 * 里既有状态符号也有 Nerd Font 图标，删掉会让工具输出和正文缺字；行首空白、
 * 连续空格也不能动——否则缩进代码、ASCII 表格、粘贴的代码都会被压平。
 */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{200D}]/gu;
const noEmoji = s => String(s == null ? '' : s).replace(EMOJI_RE, '');

/** 递归去掉对象里所有字符串的 emoji（用于工具卡片的 display 结构）。 */
function stripEmojiDeep(v) {
  if (typeof v === 'string') return noEmoji(v);
  if (Array.isArray(v)) return v.map(stripEmojiDeep);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) out[k] = stripEmojiDeep(v[k]);
    return out;
  }
  return v;
}

const TOKEN = window.__PARABLE_TOKEN
  || new URLSearchParams(location.search).get('token')
  || '';

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'X-Parable-Token': TOKEN }, opts.headers || {});
  let body = opts.body;
  if (body && typeof body !== 'string') {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  // 没有超时的话，一个挂死的请求会让保存按钮、用量页、会话加载永久转圈。
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  const ms = opts.timeout || 180000;
  const timer = ac ? setTimeout(() => { try { ac.abort(); } catch (e) {} }, ms) : null;
  try {
    const res = await fetch('/api' + path, {
      method: opts.method || 'GET',
      headers,
      body,
      signal: ac ? ac.signal : undefined
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
    if (!res.ok) {
      const msg = (data && data.error) ? data.error : (res.status + ' ' + res.statusText);
      throw new Error(msg);
    }
    return data;
  } catch (e) {
    if (e && e.name === 'AbortError') {
      throw new Error(document.documentElement.lang === 'zh-CN' ? '请求超时' : 'Request timed out');
    }
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function beep() {
  try {
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880;
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.25);
    o.start(); o.stop(ac.currentTime + 0.26);
  } catch (e) {}
}

/* ---- 自写的确认框 --------------------------------------------------
   不用 window.confirm：浏览器原生弹窗在 WebView 里样式突兀、无法定制，
   还会阻塞整个渲染进程。改成页面内的一个居中弹层：背景高斯模糊，
   卡片淡入上浮，返回 Promise<boolean>。 */
function confirmBox(message, opts) {
  opts = opts || {};
  const z = S.lang === 'zh';
  const okText = opts.ok || (z ? '确定' : 'Confirm');
  const cancelText = opts.cancel || (z ? '取消' : 'Cancel');
  const wrap = $('#cfm');
  const box = wrap.querySelector('.cfmb');
  box.querySelector('.cfmt').textContent = message || '';
  const okBtn = box.querySelector('[data-cf="1"]');
  const cancelBtn = box.querySelector('[data-cf="0"]');
  okBtn.textContent = okText;
  cancelBtn.textContent = cancelText;
  okBtn.className = 'btn ' + (opts.danger === false ? '' : 'danger');
  cancelBtn.className = 'btn ghost';

  return new Promise(resolve => {
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      wrap.classList.remove('open');
      document.body.classList.remove('modal-open');
      document.removeEventListener('keydown', onKey, true);
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      wrap.onclick = null;
      resolve(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      // 只有焦点在“确定”上时回车才确认；Tab 到“取消”后回车必须是取消，
      // 否则强迫症式连按回车很容易误删。
      else if (e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        finish(document.activeElement === okBtn ? true : document.activeElement === cancelBtn ? false : false);
      }
    };
    okBtn.onclick = () => finish(true);
    cancelBtn.onclick = () => finish(false);
    // 点背景 = 取消
    wrap.onclick = e => { if (e.target === wrap) finish(false); };
    document.addEventListener('keydown', onKey, true);
    document.body.classList.add('modal-open');
    wrap.classList.add('open');
    // 焦点落在确认按钮上，回车直接确认
    setTimeout(() => okBtn.focus(), 60);
  });
}

let pg = null, gt = 0;
async function go(name, force) {
  const el = $('#pg'), my = ++gt;
  if (innerWidth < 760) document.body.classList.add('sc');
  if (!name) {
    el.classList.remove('sw');
    if (pg) { pg = null; el.classList.remove('on'); el.firstChild.className = ''; }
    return;
  }
  if (pg === name && !force) return;
  if (pg) { el.classList.add('sw'); await sleep(A(300)); if (my !== gt) return; }
  pg = name;
  if (name === 'plugins' || name === 'auto' || name === 'team') {
    el.firstChild.className = 'page';
    el.firstChild.innerHTML = '<div class="pload"></div>';
    el.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('sw')));
    const html = name === 'plugins' ? await renderPluginsPage()
      : name === 'auto' ? await renderAutoPage()
      : await renderTeamPage();
    if (my !== gt) return;
    el.firstChild.innerHTML = html;
    if (name === 'plugins') bindPluginsPage(el.firstChild);
    else if (name === 'auto') bindAutoPage(el.firstChild);
    else bindTeamPage(el.firstChild);
    return;
  }
  el.firstChild.className = '';
  const d = PG[S.lang][name] || PG.zh[name];
  el.firstChild.innerHTML = '<h2>' + d[0] + '</h2><p>' + d[1] + '</p>';
  el.classList.add('on');

}

function durLabel(s) {
  s = +s || 0;
  const z = S.lang === 'zh';
  if (s < 60) return s + (z ? ' 秒' : 's');
  if (s < 3600) return Math.round(s / 60) + (z ? ' 分' : 'm');
  return (s / 3600).toFixed(1).replace(/\.0$/, '') + (z ? ' 小时' : 'h');
}
function fmtDT(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString(S.lang === 'zh' ? 'zh-CN' : 'en', { hour12: false });
  } catch (e) { return iso; }
}
function taskTimingLabel(tm) {
  const z = S.lang === 'zh';
  if (!tm || !tm.kind) return '—';
  switch (tm.kind) {
    case 'every': return (z ? '每 ' : 'every ') + durLabel(tm.every_seconds);
    case 'after': return (z ? '' : 'in ') + durLabel(tm.after_seconds) + (z ? '后' : '');
    case 'at': return (z ? '于 ' : 'at ') + fmtDT(tm.at);
    case 'daily': return (z ? '每天 ' : 'daily ') + tm.time + ' · ' + (tm.timeZone || tm.time_zone || '');
    case 'weekly': return (z ? '每' : 'weekly ') + (tm.weekdays || []).join(',') + ' ' + tm.time;
    case 'cron': return 'cron ' + tm.expression;
    default: return tm.kind;
  }
}

function bindAutoPage(root) {
  const z = S.lang === 'zh';
  root.querySelectorAll('.taskrow').forEach(row => {
    const id = row.dataset.id;
    const pr = row.querySelector('.tk-prompt');
    if (pr) pr.onclick = e => {
      if (e.target.closest('button')) return;
      row.classList.toggle('open');
    };
    row.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = async () => {
        const act = b.dataset.act;
        // 删除任务不可恢复，先轻确认
        if (act === 'del' && !(await confirmBox(z ? '确定删除这个任务？' : 'Delete this task?'))) return;
        try {
          if (act === 'del') {
            await api('/schedule/' + id, { method: 'DELETE' });
          } else if (act === 'run') {
            await api('/schedule/' + id + '/run', { method: 'POST' });
            toast(z ? '已触发' : 'Triggered');
          } else {
            await api('/schedule/' + id, { method: 'PATCH', body: { action: act } });
          }
          if (act === 'del' || act !== 'run') go('auto', true);
        } catch (e) { toast(e.message); }
      };
    });
  });
  const kindSel = root.querySelector('#nt-kind');
  const timeInp = root.querySelector('#nt-time');
  const numInp = root.querySelector('#nt-num');
  const unitSel = root.querySelector('#nt-unit');
  const syncKind = () => {
    const isDaily = kindSel.value === 'daily';
    timeInp.style.display = isDaily ? '' : 'none';
    numInp.style.display = isDaily ? 'none' : '';
    unitSel.style.display = isDaily ? 'none' : '';
  };
  kindSel.onchange = syncKind;
  syncKind();
  // 没有活动会话时「投递到当前会话」没有意义：禁用该选项并标注原因
  const tgtSel = root.querySelector('#nt-target');
  const exOpt = tgtSel ? tgtSel.querySelector('option[value="existing"]') : null;
  if (exOpt && !(conv && conv.id)) {
    exOpt.disabled = true;
    exOpt.textContent += z ? '（当前没有会话）' : ' (no active chat)';
  }
  root.querySelector('#nt-add').onclick = async () => {
    const name = root.querySelector('#nt-name').value.trim();
    const prompt = root.querySelector('#nt-prompt').value.trim();
    if (!name || !prompt) { toast(z ? '名称和提示词都要填' : 'Name and prompt are required'); return; }
    const n = Math.max(1, +numInp.value || 1);
    const secs = unitSel.value === 'hour' ? n * 3600 : n * 60;
    let timing;
    if (kindSel.value === 'every') timing = { kind: 'every', every_seconds: Math.max(60, secs) };
    else if (kindSel.value === 'after') timing = { kind: 'after', after_seconds: secs };
    else timing = { kind: 'daily', time: timeInp.value || '09:00', timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
    const tgt = root.querySelector('#nt-target').value;
    if (tgt === 'existing' && !(conv && conv.id)) {
      toast(z ? '当前没有会话，不能投递到当前对话' : 'No active chat to deliver to');
      return;
    }
    try {
      await api('/schedule', {
        method: 'POST',
        body: {
          name, prompt, timing,
          target: tgt === 'existing' ? { kind: 'existing', session_id: (conv && conv.id) || '' } : tgt,
          session_id: (conv && conv.id) || ''
        }
      });
      toast(z ? '任务已创建' : 'Task created');
      go('auto', true);
    } catch (e) { toast(e.message); }
  };
}

const chat = $('#chat'), feed = $('#feed');
let stick = true;
chat.addEventListener('scroll', () => {
  stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90;
  $('#jump').classList.toggle('on', !stick && document.body.classList.contains('chat'));
});
/* 跟随滚动：每个 token 都读一次 scrollHeight 会强制同步布局，几千个 delta 下来
   就是卡死的直接原因。这里合并到下一帧，一帧最多一次。 */
let followPending = false;
const follow = () => {
  if (!stick || followPending) return;
  followPending = true;
  requestAnimationFrame(() => {
    followPending = false;
    if (stick) chat.scrollTop = chat.scrollHeight;
  });
};

  stick = true;
  chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
