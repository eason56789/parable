/* ---- 权限规则（permissions.toml） ----
   规则模型与后端一致：{tool, path, action: allow|deny, exact}。
   - tool: 工具名，* 表示全部
   - path: 路径 / 命令；exact=true 时是字面量（等值匹配），否则是 glob
   - action: allow / deny
   规则优先级高于权限模式：命中 allow 就放行，命中 deny 就拒绝。 */
const RULE_TOOLS = ['*', 'bash', 'read_file', 'write_file', 'edit_file', 'list_dir', 'glob', 'grep', 'web_fetch', 'web_search'];
let RULES = { allow: [], deny: [], ask: [] };
let rulesDirty = false;

async function rulesLoad() {
  try {
    const r = await api('/permissions');
    RULES = { allow: r.allow || [], deny: r.deny || [], ask: r.ask || [] };
  } catch (e) { /* 保持空列表 */ }
}

async function rulesSave() {
  try {
    await api('/permissions', { method: 'POST', body: RULES });
    rulesDirty = false;
    toast(S.lang === 'zh' ? '规则已保存' : 'Rules saved');
  } catch (e) {
    toast(e.message);
  }
}

function rulesRender(host) {
  if (!host) return;
  const z = S.lang === 'zh';
  const row = (name, list, i) => {
    const r = list[i];
    if (!r) return '';
    return '<div class="rrow" data-l="' + name + '" data-i="' + i + '">' +
      '<select data-f="tool">' + RULE_TOOLS.map(x =>
        '<option value="' + x + '"' + (r.tool === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>' +
      '<input data-f="path" value="' + esc(r.path || '') + '" placeholder="' +
      (z ? '路径或 * 通配' : 'path or * wildcard') + '" spellcheck="false">' +
      '<input data-f="cmd" value="' + esc(r.cmd || '') + '" placeholder="' +
      (z ? '命令模式（可选，如 npm *）' : 'cmd pattern (opt, e.g. npm *)') + '" spellcheck="false" style="flex:1.2">' +
      '<select data-f="exact"><option value="0"' + (!r.exact ? ' selected' : '') + '>' + (z ? '通配' : 'glob') + '</option>' +
      '<option value="1"' + (r.exact ? ' selected' : '') + '>' + (z ? '精确' : 'exact') + '</option></select>' +
      '<button class="btn rdel" title="' + (z ? '删除' : 'Delete') + '">' + ic('trash') + '</button></div>';
  };
  const draw = () => {
    host.innerHTML =
      '<div class="rsec"><b>' + (z ? '允许' : 'Allow') + '</b>' +
      RULES.allow.map((_, i) => row('allow', RULES.allow, i)).join('') +
      '<button class="btn rapp" data-a="allow">' + ic('plus') + (z ? '添加' : 'Add') + '</button></div>' +
      '<div class="rsec"><b>' + (z ? '必须询问' : 'Always ask') + '</b>' +
      (RULES.ask || []).map((_, i) => row('ask', RULES.ask, i)).join('') +
      '<button class="btn rapp" data-a="ask">' + ic('plus') + (z ? '添加' : 'Add') + '</button></div>' +
      '<div class="rsec"><b>' + (z ? '拒绝' : 'Deny') + '</b>' +
      RULES.deny.map((_, i) => row('deny', RULES.deny, i)).join('') +
      '<button class="btn rapp" data-a="deny">' + ic('plus') + (z ? '添加' : 'Add') + '</button></div>' +
      '<div class="rfoot"><span class="rfh">' + (z ? '优先级：拒绝 > 必须询问 > 允许 > 权限模式。命令模式只匹配命令串（如 bash + "npm *" 放行所有 npm 开头的命令）。' :
        'Priority: deny > ask > allow > mode. Cmd patterns match the command string only (bash + "npm *" allows every npm command).') + '</span>' +
      '<button class="btn pri" data-save>' + (z ? '保存规则' : 'Save rules') + '</button></div>';
  };
  draw();
  host.oninput = e => {
    const f = e.target.dataset.f;
    if (!f) return;
    const rowEl = e.target.closest('.rrow');
    if (!rowEl) return;
    const list = RULES[rowEl.dataset.l];
    const r = list[+rowEl.dataset.i];
    if (!r) return;
    if (f === 'tool') r.tool = e.target.value;
    else if (f === 'path') r.path = e.target.value;
    else if (f === 'cmd') r.cmd = e.target.value || undefined;
    else if (f === 'exact') r.exact = e.target.value === '1';
    rulesDirty = true;
  };
  host.onchange = host.oninput;
  host.onclick = e => {
    const add = e.target.closest('.rapp');
    if (add) {
      RULES[add.dataset.a].push({ tool: '*', path: '', action: add.dataset.a, exact: false });
      rulesDirty = true;
      draw();
      return;
    }
    const del = e.target.closest('.rdel');
    if (del) {
      const rowEl = del.closest('.rrow');
      RULES[rowEl.dataset.l].splice(+rowEl.dataset.i, 1);
      rulesDirty = true;
      draw();
      return;
    }
    if (e.target.closest('[data-save]')) rulesSave();
  };
  // 拉取现有规则（每次进入都拉，保证与 permissions.toml 一致）
  // 用户已经改过但没保存时不覆盖：dirty 时只更新内存，不重绘 DOM。
  rulesLoad().then(() => { if (!rulesDirty) draw(); });
}

        };
      } else if (c.t === 'rl') {
        ct.className = 'ct rl';
        ct.innerHTML = c.o.map(a =>
          '<button class="ro' + (a === v ? ' on' : '') + '" data-v="' + a + '">' +
          '<span>' + t('p_' + a) + '<small>' + t('d_' + a) + '</small></span></button>'
        ).join('');
        ct.onclick = e => {
          const b = e.target.closest('button');
          if (b) { S.perm = b.dataset.v; apply(); f(); }
        };
      } else if (c.t === 'th') {
        ct.className = 'ct tcs';
        // 「跟随系统」的预览：上浅下深，并且在中段留一小段过渡 ——
        // 硬切在 50% 会在渲染时留下一像素接缝（看着像多了一条白线）。
        ct.innerHTML = [['light', '#faf9f5,#f5f4ed'], ['auto', '#faf9f5 42%,#262624 58%'], ['dark', '#262624,#1f1e1d']]
          .map(([a, g]) => '<button class="tc' + (a === v ? ' on' : '') + '" data-v="' + a + '">' +
            '<i style="background:linear-gradient(160deg,' + g + ')"></i><span>' + t(a) + '</span></button>').join('');
        ct.onclick = e => {
          const b = e.target.closest('button');
          if (b) { S.theme = b.dataset.v; apply(); f(); }
        };
      } else if (c.t === 'sw') {
        ct.className = 'ct sws';
        ct.innerHTML = SW.map(a =>
          '<button data-v="' + a + '" style="background:' + a + '" class="' + (a === v ? 'on' : '') + '"></button>'
        ).join('');
        ct.onclick = e => {
          const b = e.target.closest('button');
          if (b) { S.accent = b.dataset.v; apply(); f(); }
        };
      } else if (c.t === 'rg') {
        // 数值放在滑块右侧（内容列），标签列只留标题
        if (!ct.firstChild) {
          ct.innerHTML = '<input type="range" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '"><span class="rv"></span>';
          ct.querySelector('input').oninput = e => {
            S[c.k] = +e.target.value;
            apply();
            ct.querySelector('.rv').textContent = S[c.k] + c.u;
          };
        }
        ct.firstChild.value = v;
        ct.querySelector('.rv').textContent = v + c.u;
      } else if (c.t === 'rules') {
        // 权限规则：读写 permissions.toml（/api/permissions）
        ct.className = 'ct';
        ct.innerHTML = '<div class="rlist"></div>';
        rulesRender(ct.querySelector('.rlist'));
      } else if (c.t === 'tx' || c.t === 'ta') {
        if (!ct.firstChild) {
          ct.innerHTML = c.t === 'tx'
            ? '<input class="tx">'
            : '<textarea class="tx" rows="4" style="height:auto"></textarea>';
          ct.firstChild.oninput = e => { S[c.k] = e.target.value; apply(); };
        }
        ct.firstChild.value = v;
      } else if (c.t === 'tg') {
        ct.innerHTML = '<button class="tg' + (v ? ' on' : '') + '"></button>';
        ct.firstChild.onclick = () => {
          S[c.k] = !S[c.k];
          // 首次开启系统通知时向浏览器申请权限
          if (c.k === 'notify' && S.notify && 'Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
          }
          apply(); f();
        };
      } else if (c.t === 'rs') {
        ct.className = '';
        ct.innerHTML = '<button class="btn">' + t('reset') + '</button>';
        ct.firstChild.onclick = () => { S = { ...DEF }; apply(); nav(); panel(); };
      } else if (c.t === 'pv') {
        ct.className = '';
        ct.innerHTML = '<button class="btn">' + t('play') + '</button><div id="pv" style="margin-top:12px"></div>';
        ct.firstChild.onclick = () => {
          if (pvs) pvs.stop = true;
          pvs = { stop: false };
          $('#pv').innerHTML = '';
          inline($('#pv'),
            S.lang === 'zh'
              ? '逐字符模糊放大，像墨水在纸上化开。**Each character** settles into focus.'
              : 'Each character blurs in and **settles into focus**, like ink spreading on paper.',
            pvs, false);
        };
      } else if (c.t === 'mcp') {
        ct.className = '';
        ct.innerHTML = '<div class="mcplist"></div>' +
          '<button class="btn" data-mcp-add>' + ic('plus') + t('mcp_add') + '</button>';
        const lst = ct.querySelector('.mcplist');
        const drawMcp = () => {
          fetch('/api/mcp', { headers: { 'X-Parable-Token': TOKEN } }).then(r => r.json()).then(d => {
            const servers = d.servers || [];
            const stMap = {};
            (d.status || []).forEach(x => { stMap[x.id] = x; });
            lst.innerHTML = servers.length ? servers.map(sv => {
              const st = stMap[sv.id] || {};
              return '<div class="mcprow" data-id="' + esc(sv.id) + '">' +
                '<div style="flex:1;min-width:0"><b>' + esc(sv.name) + '</b> <span class="mcpdot ' + (sv.enabled ? (st.connected ? 'ok' : '') : 'off') + '" title="' +
                esc(st.error || '') + '"></span>' +
                '<div style="opacity:.6;font-size:11px;font-family:var(--mono);word-break:break-all">' + esc(sv.command + ' ' + (sv.args || []).join(' ')) + '</div>' +
                (st.tools && st.tools.length ? '<div style="opacity:.5;font-size:11px">' + esc(st.tools.join(', ')) + '</div>' : '') + '</div>' +
                '<button class="btn" data-mcp-c>' + (sv.enabled ? (st.connected ? t('mcp_reconnect') : t('mcp_connect')) : t('mcp_off')) + '</button>' +
                '<button class="btn rdel" data-mcp-del>' + ic('trash') + '</button></div>';
            }).join('') : '<div style="opacity:.55;font-size:12px;padding:6px 0">' + t('mcp_empty') + '</div>';
          });
        };
        drawMcp();
        ct.onclick = async e => {
          const row = e.target.closest('.mcprow');
          if (e.target.closest('[data-mcp-del]') && row) {
            const id = row.dataset.id;
            const d = await (await fetch('/api/mcp', { headers: { 'X-Parable-Token': TOKEN } })).json();
            await api('/mcp', { method: 'POST', body: { servers: (d.servers || []).filter(x => x.id !== id) } });
            drawMcp();
            return;
          }
          if (e.target.closest('[data-mcp-c]') && row) {
            const id = row.dataset.id;
            try {
              const r = await api('/mcp/connect', { method: 'POST', body: { id } });
              const st = (r.status || []).find(x => x.id === id);
              toast(st && st.connected ? (t('mcp_ok') || '').replace('{n}', st.tools.length) : (st && st.error) || t('toast'));
              drawMcp();
            } catch (e2) { toast(e2.message); }
            return;
          }
          if (e.target.closest('[data-mcp-add]')) {
            const name = prompt(t('mcp_pname'), '');
            if (!name) return;
            const cmd = prompt(t('mcp_pcmd'), 'npx -y @modelcontextprotocol/server-filesystem .');
            if (!cmd) return;
            const parts = cmd.split(/\s+/);
            const d = await (await fetch('/api/mcp', { headers: { 'X-Parable-Token': TOKEN } })).json();
            const servers = d.servers || [];
            servers.push({ id: 'mcp_' + Date.now().toString(36), name: name, command: parts[0], args: parts.slice(1), env: [], enabled: true, timeout_ms: 60000 });
            await api('/mcp', { method: 'POST', body: { servers: servers } });
            drawMcp();
          }
        };
      } else if (c.t === 'hooks') {
        ct.className = '';
        ct.innerHTML = '<div class="hklist"></div>' +
          '<button class="btn" data-hk-add>' + ic('plus') + t('hk_add') + '</button>';
        const lst = ct.querySelector('.hklist');
        const EVENTS = ['pre_tool_use', 'post_tool_use', 'stop', 'session_start'];
        const drawHk = () => {
          const hs = S.hooks || [];
          lst.innerHTML = hs.length ? hs.map((h, i) =>
            '<div class="mcprow" data-i="' + i + '">' +
            '<div style="flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap">' +
            '<select data-f="event">' + EVENTS.map(ev =>
              '<option value="' + ev + '"' + (h.event === ev ? ' selected' : '') + '>' + t('hk_' + ev) + '</option>').join('') + '</select>' +
            '<input data-f="matcher" value="' + esc(h.matcher || '*') + '" placeholder="matcher" style="width:90px">' +
            '<input data-f="command" value="' + esc(h.command || '') + '" placeholder="' + t('hk_cmd') + '" style="flex:1;min-width:180px;font-family:var(--mono)"></div>' +
            '<button class="btn rdel" data-hk-del>' + ic('trash') + '</button></div>'
          ).join('') : '<div style="opacity:.55;font-size:12px;padding:6px 0">' + t('hk_empty') + '</div>';
        };
        drawHk();
        ct.oninput = e => {
          const row = e.target.closest('.mcprow');
          if (!row || !e.target.dataset.f) return;
          const h = (S.hooks || [])[+row.dataset.i];
          if (!h) return;
          if (e.target.dataset.f === 'event') h.event = e.target.value;
          else if (e.target.dataset.f === 'matcher') h.matcher = e.target.value;
          else h.command = e.target.value;
          apply();
        };
        ct.onclick = e => {
          if (e.target.closest('[data-hk-del]')) {
            const row = e.target.closest('.mcprow');
            S.hooks.splice(+row.dataset.i, 1);
            apply(); drawHk();
            return;
          }
          if (e.target.closest('[data-hk-add]')) {
            (S.hooks = S.hooks || []).push({ event: 'pre_tool_use', matcher: '*', command: '', timeout_ms: 10000 });
            apply(); drawHk();
          }
        };
      } else if (c.t === 'profiles') {
        ct.className = '';
        ct.innerHTML = '<div class="proflist"></div>' +
          '<button class="btn" data-prof-save>' + ic('plus') + t('prof_save') + '</button>';
        const lst = ct.querySelector('.proflist');
        const drawProf = () => {
          const ps = S.profiles || [];
          lst.innerHTML = ps.length ? ps.map((pf, i) =>
            '<div class="mcprow" data-i="' + i + '">' +
            '<div style="flex:1;min-width:0"><b>' + esc(pf.name) + '</b>' +
            '<div style="opacity:.6;font-size:11px">' + esc((pf.model || t('prof_nomodel')) + ' \u00b7 ' + t('p_' + pf.permission_mode) + ' \u00b7 ' + t('l' + pf.thinking_level)) + '</div></div>' +
            (S.activeProfile === pf.id ? '<span class="profon">' + t('prof_on') + '</span>' : '<button class="btn" data-prof-apply="' + i + '">' + t('prof_apply') + '</button>') +
            '<button class="btn rdel" data-prof-del="' + i + '">' + ic('trash') + '</button></div>'
          ).join('') : '<div style="opacity:.55;font-size:12px;padding:6px 0">' + t('prof_empty') + '</div>';
        };
        drawProf();
        ct.onclick = async e => {
          const applyBtn = e.target.closest('[data-prof-apply]');
          if (applyBtn) {
            const pf = (S.profiles || [])[+applyBtn.dataset.profApply];
            if (!pf) return;
            try {
              const r = await api('/profiles/apply', { method: 'POST', body: { id: pf.id } });
              S.model = r.model; S.perm = r.permission_mode; S.lvl = r.thinking_level; S.activeProfile = pf.id;
              apply(); drawProf(); toast(t('prof_applied'));
            } catch (e2) { toast(e2.message); }
            return;
          }
          const delBtn = e.target.closest('[data-prof-del]');
          if (delBtn) {
            S.profiles.splice(+delBtn.dataset.profDel, 1);
            apply(); drawProf();
            return;
          }
          if (e.target.closest('[data-prof-save]')) {
            const name = prompt(t('prof_pname'), '');
            if (!name) return;
            (S.profiles = S.profiles || []).push({
              id: 'prof_' + Date.now().toString(36), name: name,
              model: S.model, permission_mode: S.perm, thinking_level: S.lvl,
            });
            apply(); drawProf();
          }
        };
      } else if (c.t === 'exp') {
        ct.className = '';
        ct.innerHTML = '<button class="btn">' + t('expAll') + '</button>';
        ct.firstChild.onclick = async () => {
          try {
            const r = await fetch('/api/sessions/export', { headers: { 'X-Parable-Token': TOKEN } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const blob = await r.blob();
            const a = document.createElement('a');
            const cd = r.headers.get('Content-Disposition') || '';
            a.href = URL.createObjectURL(blob);
            a.download = (cd.match(/filename="(.+)"/) || [])[1] || 'parable-sessions.json';
            document.body.append(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          } catch (e) { toast(e.message); }
        };
      } else if (c.t === 'danger') {
        ct.className = '';
        ct.innerHTML = '<button class="btn" style="color:#d4574c;border-color:#d4574c">' + t('dangerBtn') + '</button>';
        ct.firstChild.onclick = async () => {
          if (!(await confirmBox(t('cfClearAll'), { danger: true }))) return;
          try {
            const r = await api('/sessions/clear-all', { method: 'POST' });
            toast((t('dangerDone') || '').replace('{n}', r.deleted != null ? r.deleted : 0));
            loadSessions(true);
            if (conv && conv.id) newChat();
          } catch (e) { toast(e.message); }
        };
      } else if (c.t === 'sp') {
        // Show the exact system text the harness will send to the model server
        // on the next turn of the current session (raw override included).
        // 没有活动会话时禁用按钮（.off），而不是点了才报错。
        ct.className = '';
        ct.innerHTML = '<button class="btn' + (!(conv && conv.id) ? ' off' : '') + '">' + t('sysprev') + '</button>' +
          '<pre id="spp" style="display:none;max-height:280px;overflow:auto;margin-top:12px;' +
          'padding:12px;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;' +
          'font-family:var(--mono,monospace);font-size:12px;line-height:1.5"></pre>';
        ct.firstChild.onclick = async () => {
          if (!(conv && conv.id)) { toast(S.lang === 'zh' ? '先发一条消息建立会话' : 'Start a chat first'); return; }
          const pre = $('#spp');
          pre.style.display = 'block';
          pre.textContent = '…';
          try {
            const r = await api('/sessions/' + conv.id + '/prompt');
            pre.textContent = (r && r.system) ? r.system : t('sysprev_empty');
          } catch (e) { pre.textContent = t('sysprev_fail') + e.message; }
        };
      }
    };
    f();
    body.append(r);
  });
  // 搜索命中的设置项高亮（面板重渲染后要再标一次）
  markHits();
}

function openSet() {
  tab = 'g';
  nav();
  panel();
  $('#modal').classList.add('open');
  // 设置是全屏页；聊天页右上角的悬浮工作台不属于它，不能压在“添加供应商”上。
  const dock = $('#dock');
  if (dock) dock.classList.add('set-hide');
  document.querySelectorAll('.pop.open').forEach(p => p.classList.remove('open'));
}
const closeSet = () => {
  $('#modal').classList.remove('open');
  const dock = $('#dock');
  if (dock) dock.classList.remove('set-hide');
};
$('#modal').onclick = e => { if (e.target.id === 'modal') closeSet(); };

/* ==================================================================
   model settings page (real providers)
   ================================================================== */
const MPAPI = [
  ['anthropic', 'Anthropic Messages (/v1/messages)'],
  ['openai', 'OpenAI Chat Completions (/v1/chat/completions)'],
  ['responses', 'OpenAI Responses (/v1/responses)']
];
let MPROV = [];
let mpSel = null;

function mpCur() { return MPROV.find(x => x.id === mpSel) || MPROV[0]; }
function mpName(p) { return p.name || t('mp_newp'); }

async function loadProviders() {
  try {
    const res = await api('/providers');
    MPROV = res.providers || [];
    if (!mpSel && MPROV.length) mpSel = MPROV[0].id;
    if ($('#mpl')) { mpList(); mpDetail(); }
  } catch (e) { /* ignore */ }
}

function mpRow(p) {
  return '<button class="mp-item' + (p.id === mpSel ? ' on' : '') + '" data-mpsel="' + esc(p.id) + '">' +
    '<span class="mp-ic" style="background:' + esc(p.color || '#4d6bfe') + '">' + esc(p.icon || 'S') + '</span>' +
    '<b>' + esc(mpName(p)) + '</b>' +
    '<span class="mp-dot ' + (p.enabled ? 'on' : 'off') + '"></span></button>';
}

function mpList() {
  const el = $('#mpl');
  if (!el) return;
  el.innerHTML = MPROV.map(mpRow).join('');
}

function mpDetail() {
  const el = $('#mpd');
  if (!el) return;
  const p = mpCur();
  if (!p) { el.innerHTML = '<div class="mp-empty">' + t('mp_empty') + '</div>'; return; }

    ? (p.models || []).map((m, i) =>
        '<div class="mp-row"><span class="mp-mn">' + esc(m.name || m.id) + '</span>' +

        '<button class="ib danger" data-mpmdel="' + i + '" title="' + t('mp_del') + '">' + ic('trash') + '</button>' +

  el.innerHTML =
    '<div class="mp-ph">' +
      '<span class="mp-ic" style="background:' + esc(p.color || '#4d6bfe') + '">' + esc(p.icon || 'S') + '</span>' +
      '<h3 id="mpname">' + esc(mpName(p)) + '</h3>' +
      '<button class="ib" data-mpren title="' + t('mp_rename') + '">' + ic('edit') + '</button>' +
      '<button class="ib danger" data-mppdel="1" title="' + t('mp_del') + '">' + ic('trash') + '</button>' +
      '<button class="tg' + (p.enabled ? ' on' : '') + '" data-mpp="1" title="' + t('mp_enabled') + '"></button>' +
    '</div>' +
    '<div class="mp-field"><label>' + t('mp_base') + '</label>' +
      '<input class="mp-in" data-mpf="baseUrl" value="' + esc(p.base_url || '') + '" placeholder="https://api.example.com/v1" spellcheck="false"></div>' +

      '<select class="mp-in" data-mpf="api">' + MPAPI.map(([v, l]) =>
        '<option value="' + v + '"' + (p.api === v ? ' selected' : '') + '>' + l + '</option>').join('') +
      '</select></div>' +
    '<div class="mp-field"><label><span>API Key</span><a href="#" data-mpgetkey="1">' + t('mp_getkey') + '</a></label>' +

      '<button class="mp-eye" data-mpeye="1" title="API Key">' + ic('eye') + '</button></div></div>' +
    '<div class="mp-field"><label>' + t('mp_name') + '</label>' +
      '<input class="mp-in" data-mpf="name" value="' + esc(mpName(p)) + '" placeholder="' + t('mp_sample') + '"></div>' +
    '<div style="display:flex;gap:8px;margin:14px 0">' +
      '<button class="btn" data-mptest="1">' + t('mp_test') + '</button>' +
      '<button class="btn" data-mprefresh="1">' + t('mp_refresh') + '</button>' +

function renderModelPage(host) {
  host.innerHTML =
    '<div class="mp"><div class="mp-h"><div><h2>' + t('mp_title') + '</h2><p>' + t('mp_desc') + '</p></div>' +

/* ---- 模型编辑弹窗（完整模型信息） ----
   模型 ID、显示名、上下文窗口、最大输出、输入类型（文本/图片）、
   能力（工具调用/扩展思考/结构化输出/原生联网搜索）、推理等级与参数映射。 */
function mpOpenEditor(idx) {
  const p = mpCur();
  const isNew = idx < 0;
  const src = isNew ? {} : ((p.models || [])[idx] || {});
  const d = {
    id: src.id || '',
    name: src.name || src.id || '',
    context: src.context || 128000,
    max_output: src.max_output || 0,
    vision: !!src.vision,
    tools: src.tools !== false,
    thinking: !!src.thinking,
    structured: !!src.structured,
    native_search: !!src.native_search,
    levels: Array.isArray(src.levels) && src.levels.length ? src.levels.slice() : ['low', 'high'],
    mapping: src.mapping || '',
  };

  const ov = document.createElement('div');
  ov.className = 'mdl';
  document.body.appendChild(ov);
  const close = () => { document.removeEventListener('keydown', escK, true); ov.remove(); };
  const escK = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', escK, true);

  const lvHtml = () => d.levels.map((l, i) =>
    '<input data-lv="' + i + '" value="' + esc(l) + '" spellcheck="false" placeholder="low">' +
    '<button class="ib" data-lvdel="' + i + '" title="remove">' + ic('trash') + '</button>').join('') +
    '<button class="ib" data-lvadd title="add">' + ic('plus') + '</button>';

  const draw = () => {
    ov.innerHTML = '<div class="mdlc">' +
      '<div class="mdlh"><h3>' + (isNew ? t('mp_addm') : t('mp_edit')) + '</h3>' +
      '<button class="ib" data-x title="close">' + ic('x') + '</button></div>' +
      '<div class="mdlb">' +
        '<div class="mp-field"><label>' + t('mp_model_id') + '</label>' +
        '<input class="mp-in" data-f="id" value="' + esc(d.id) + '" placeholder="glm-5.3" spellcheck="false" style="font-family:var(--mono)"></div>' +

        '<div class="mp-field"><label>' + t('mp_ctx') + '</label>' +

          '<button class="ck' + (d.tools ? ' on' : '') + '" data-ck="tools">' + ic('check') + t('mp_tools') + '</button>' +
          '<button class="ck' + (d.thinking ? ' on' : '') + '" data-ck="thinking">' + ic('check') + t('mp_thinking') + '</button>' +
          '<button class="ck' + (d.structured ? ' on' : '') + '" data-ck="structured">' + ic('check') + t('mp_structured') + '</button>' +
          '<button class="ck' + (d.native_search ? ' on' : '') + '" data-ck="native_search">' + ic('check') + t('mp_natsearch') + '</button>' +
        '</div></div>' +
        '<div class="mp-field"><label>' + t('mp_levels') + '</label><div class="lvs" id="lvs">' + lvHtml() + '</div></div>' +
        '<div class="mp-field"><label>' + t('mp_mapping') + '</label>' +
        '<textarea class="mp-in js" data-f="mapping" spellcheck="false" placeholder=\'{"thinking":{"type":"enabled"},"reasoning_effort":"{level}"}\'>' + esc(d.mapping) + '</textarea></div>' +
      '</div>' +
      '<div class="mderr" id="mderr"></div>' +
      '<div class="mdlf"><span class="fl"></span>' +
      '<button class="btn" data-x>' + t('mp_cancel') + '</button>' +
      '<button class="btn pri" data-save>' + t('mp_save') + '</button></div></div>';
  };
  draw();

  ov.onclick = e => {
    const g = k => e.target.closest('[' + k + ']');
    if (g('data-x')) { close(); return; }
    if (g('data-lvadd')) {
      d.levels.push('');
      ov.querySelector('#lvs').innerHTML = lvHtml();
      const ins = ov.querySelectorAll('#lvs input');
      ins[ins.length - 1].focus();
      return;
    }
    if (g('data-lvdel')) {
      d.levels.splice(+g('data-lvdel').dataset.lvdel, 1);
      ov.querySelector('#lvs').innerHTML = lvHtml();
      return;
    }
    const ck = g('data-ck');
    if (ck) {
      const k = ck.dataset.ck;
      d[k] = !d[k];
      ck.classList.toggle('on', d[k]);
      return;
    }
    if (g('data-save')) {
      const err = m => { const el = ov.querySelector('#mderr'); if (el) el.textContent = m; };
      const id = d.id.trim(), name = d.name.trim() || id;
      if (!id) return err(t('mp_err_id'));
      if (!name) return err(t('mp_err_name'));
      const others = (p.models || []).filter((_, j) => j !== idx);
      if (others.some(x => x.id === id)) return err(t('mp_err_dup'));
      const ctx = +d.context;
      if (!(ctx > 0)) return err(t('mp_err_ctx'));
      const out = +d.max_output;
      if (!(out >= 0)) return err(t('mp_err_out'));
      if (d.mapping.trim()) {
        try { JSON.parse(d.mapping); }
        catch (x) { return err(t('mp_err_map') + x.message); }
      }
      const levels = d.levels.map(x => x.trim()).filter(Boolean);
      const m = {
        id: id, name: name, context: ctx, max_output: out,
        vision: d.vision, tools: d.tools, thinking: d.thinking,
        structured: d.structured, native_search: d.native_search,
        levels: levels, mapping: d.mapping.trim(),
        enabled: isNew ? true : (src.enabled !== false),
      };
      // 改 id 等于改名：带上 oldId，后端才会把旧条目摘掉，而不是新增一条。
      if (!isNew && src.id && src.id !== id) m.oldId = src.id;
      const models = (p.models || []).slice();
      if (isNew) models.push(m); else models[idx] = m;
      api('/config', { method: 'PATCH', body: { providers: [{ id: p.id, models: models }] } })
        .then(() => { close(); loadProviders().then(() => { mpList(); mpDetail(); }); toast(t('mp_save')); })
        .catch(x => err(x.message));
      return;
    }
  };
  ov.oninput = e => {
    const f = e.target.dataset.f;
    if (f) d[f] = e.target.value;
    const l = e.target.dataset.lv;
    if (l !== undefined) d.levels[+l] = e.target.value;
    const el = ov.querySelector('#mderr');
    if (el) el.textContent = '';
  };
  setTimeout(() => { const f = ov.querySelector('[data-f=id]'); if (f) f.focus(); }, 40);
}

/* ---- 从上游获取模型列表 ----
   后端 GET /api/providers/{id}/models 会用真 key 去问供应商的清单端点
   （OpenAI / Anthropic / Ollama 各自的格式），这里把结果列出来让用户勾选。 */
function mpFetchUpstream() {
  const p = mpCur();
  if (!p) return;
  toast(t('mp_upstreaming'));
  api('/providers/' + encodeURIComponent(p.id) + '/models')
    .then(r => {
      const list = (r && r.models) || [];
      if (!list.length) { toast(t('mp_upstream_none')); return; }
      mpPickUpstream(list);
    })
    .catch(e => toast(e.message));
}

/** 让用户从上游模型里挑选要添加的。 */
function mpPickUpstream(list) {
  const p = mpCur();
  const have = new Set((p.models || []).map(m => m.id));
  const ov = document.createElement('div');
  ov.className = 'mdl';
  document.body.appendChild(ov);
  const close = () => { document.removeEventListener('keydown', escK, true); ov.remove(); };
  const escK = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', escK, true);

  const picked = new Set(list.filter(m => !have.has(m.id)).map(m => m.id));
  const draw = () => {
    ov.innerHTML = '<div class="mdlc">' +
      '<div class="mdlh"><h3>' + t('mp_fetched').replace('{n}', String(list.length)) + '</h3>' +
      '<button class="ib" data-x title="close">' + ic('x') + '</button></div>' +
      '<div class="mdlb"><div class="cks">' +
      list.map(m => {
        const dis = have.has(m.id);
        const on = picked.has(m.id);
        return '<button class="ck' + (on ? ' on' : '') + '" data-pick="' + esc(m.id) + '"' +
          (dis ? ' disabled' : '') + '>' +
          ic(on ? 'check' : 'plus') + esc(m.name || m.id) +
          (m.context ? ' <small>' + kfmt(m.context) + '</small>' : '') +
          (m.vision ? ' <small>' + t('mp_vision') + '</small>' : '') +
          (m.thinking ? ' <small>' + t('mp_thinking') + '</small>' : '') +
          '</button>';
      }).join('') + '</div></div>' +
      '<div class="mdlf"><span class="fl"></span>' +
      '<button class="btn" data-x>' + t('mp_cancel') + '</button>' +
      '<button class="btn pri" data-save>' + t('mp_import') + '</button></div></div>';
  };
  draw();

  ov.onclick = e => {
    const g = k => e.target.closest('[' + k + ']');
    if (g('data-x')) { close(); return; }
    const pk = g('data-pick');
    if (pk) {
      const id = pk.dataset.pick;
      if (picked.has(id)) picked.delete(id); else picked.add(id);
      draw();
      return;
    }
    if (g('data-save')) {
      const add = list.filter(m => picked.has(m.id)).map(m => ({
        id: m.id, name: m.name || m.id,
        context: m.context || 0,
        vision: !!m.vision, tools: true, thinking: !!m.thinking,
        enabled: true, max_output: 0, levels: [], mapping: '',
        structured: false, native_search: false,
      }));
      if (!add.length) { close(); return; }
      const models = (p.models || []).concat(add);
      api('/config', { method: 'PATCH', body: { providers: [{ id: p.id, models: models }] } })
        .then(() => { close(); loadProviders().then(() => { mpList(); mpDetail(); }); toast(t('mp_imp_done').replace('{n}', String(add.length))); })
        .catch(x => toast(x.message));
      return;
    }
  };
}

function pushProvider(p) {
  api('/config', { method: 'PATCH', body: { providers: [p] } })
    .then(() => loadProviders())
    .then(() => loadModels())
    .catch(e => toast(e.message));
}

/* ==================================================================
   使用统计（settings → usage）
   ------------------------------------------------------------------
   数据全部来自 GET /api/usage：summary / heatmap / daily / models /
   activity / topSessions。没有本地假数据。
   ================================================================== */
const UCH = ['--uch1', '--uch2', '--uch3', '--uch4', '--uch5', '--uch6'];
let ugRange = '30d';
let ugHmMode = 'daily';
let ugModelNames = {};
let ugSnap = null;
let ugLoading = false;
let ugReq = 0;          // 最后一次请求胜出：切范围时旧响应不能覆盖新数据
let ugLastRefresh = null;

/** 大数字格式化：中文用「万 / 亿」，英文用 K / M / B。 */
function fmtBig(n) {
  n = Number(n) || 0;
  const z = S.lang === 'zh';
  if (z) {
    if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 1 : 2).replace(/\.?0+$/, '') + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + ' 万';
    return String(Math.round(n));
  }
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(Math.round(n));
}

function fmtLongMs(ms) {
  const z = S.lang === 'zh';
  const s = Math.round((Number(ms) || 0) / 1000);
  if (!s) return z ? '0 分钟' : '0 min';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  const out = [];
  if (d) out.push(d + (z ? ' 天' : 'd'));
  if (h) out.push(h + (z ? ' 小时' : 'h'));
  if (m || !out.length) out.push(m + (z ? ' 分钟' : 'm'));
  return out.join(' ');
}

/** `2026-11-13` → `11月13日` / `Nov 13`. */
function fmtDay(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length < 3) return String(iso);
  if (S.lang === 'zh') return (+p[1]) + '月' + (+p[2]) + '日';
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return M[(+p[1]) - 1] + ' ' + (+p[2]);
}

function ugModelName(id) {
  if (id === '__legacy__') return t('ug_legacy');
  if (ugModelNames[id]) return ugModelNames[id];
  try {
    for (const p of (MPROV || [])) {
      const m = (p.models || []).find(x => x.id === id);
      if (m) { ugModelNames[id] = m.name || m.id; return ugModelNames[id]; }
    }
  } catch (e) { /* 供应商尚未加载，用裸 id */ }
  return id || '';
}

   三个「整页」设置（模型 / 记忆 / 技能 / 用量）共用同一套留白，

const SP_PAD = 'padding:38px 44px 60px';
function spHead(title, desc, extra) {

/* ==================================================================
   记忆页
   ------------------------------------------------------------------
   数据来自后端 GET /api/memory（~/.parable/memory.json）。每条记忆在
   每一轮都会被注入 system prompt，所以这里的增删改立即影响下一轮对话。
   ================================================================== */
let MEM = [];
let memTag = 'all';
let memQ = '';
let memEdit = null;     // null | 'new' | id
let memFocus = false;   // 只有“刚打开编辑”才抢焦点；增删/刷新不能把焦点从别处拽走
let memLoading = false;
const MTAG = { pref: 'mem_pref', proj: 'mem_proj', fact: 'mem_fact' };

function memMatch(m) {
  const q = memQ.trim().toLowerCase();
  if (memTag !== 'all' && m.tag !== memTag) return false;
  if (!q) return true;
  return (m.text + ' ' + m.tag).toLowerCase().includes(q);
}

function renderMemoryPage(host) {
  host.innerHTML =
    '<div class="mempg" style="' + SP_PAD + '">' +
      spHead(t('mem_title'), t('mem_desc'),
        '<button class="mp-add" data-memadd="1">' + ic('plus') + '<span>' + t('mem_add') + '</span></button>') +
      '<div class="memrow"><div>' + esc(t('mem_enable')) + '<small>' + esc(t('mem_enable_h')) + '</small></div>' +
        '<div><button class="tg' + (S.mem !== false ? ' on' : '') + '" data-memt="mem"></button></div></div>' +
      '<div class="memrow"><div>' + esc(t('mem_auto')) + '<small>' + esc(t('mem_auto_h')) + '</small></div>' +
        '<div><button class="tg' + (S.memAuto ? ' on' : '') + '" data-memt="memAuto"></button></div></div>' +
      '<div class="memtb"><div class="seg" id="mseg"></div><span class="fl"></span>' +
        '<input class="msearch" id="mq" placeholder="' + esc(t('mem_search')) + '" value="' + esc(memQ) + '" spellcheck="false"></div>' +
      '<div id="mlist"></div><div class="memft" id="mft"></div>' +
    '</div>';

  memDraw();
  memLoad();

  host.oninput = e => {
    if (e.target.id === 'mq') { memQ = e.target.value; memDraw(); }
  };
  host.onkeydown = e => {
    if (e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); memSave(); }
      if (e.key === 'Escape') { memEdit = null; memDraw(); }
    }
  };
  host.onclick = e => {
    const g = k => e.target.closest('[' + k + ']');
    if (g('data-memt')) {
      const k = g('data-memt').dataset.memt;
      S[k] = !S[k];
      g('data-memt').classList.toggle('on', S[k]);
      api('/config', { method: 'PATCH', body: { [k]: S[k] } }).catch(() => {});
      memDraw();
      return;
    }
    if (g('data-memadd')) { memEdit = 'new'; memTag = 'all'; memQ = ''; memFocus = true; memDraw(); return; }
    if (g('data-memf')) { memTag = g('data-memf').dataset.memf; memDraw(); return; }
    if (g('data-memedit')) { memEdit = +g('data-memedit').dataset.memedit; memFocus = true; memDraw(); return; }
    if (g('data-memcancel')) { memEdit = null; memDraw(); return; }
    if (g('data-memsave')) { memSave(); return; }
    if (g('data-memdel')) {
      const id = +g('data-memdel').dataset.memdel;
      const m = MEM.find(x => x.id === id);
      confirmBox(t('mem_del_n').replace('{t}', m ? m.text : '')).then(ok => {
        if (!ok) return;
        api('/memory/' + id, { method: 'DELETE' })
          .then(() => { toast(t('mem_deleted')); return memLoad(); })
          .catch(err => toast(err.message));
      });
      return;
    }
    if (g('data-memclear')) {
      confirmBox(t('mem_clear_n').replace('{n}', MEM.length)).then(ok => {
        if (!ok) return;
        api('/memory', { method: 'DELETE' })
          .then(() => { toast(t('mem_cleared')); memEdit = null; return memLoad(); })
          .catch(err => toast(err.message));
      });
      return;
    }
  };
}

function memLoad() {
  if (memLoading) return;
  memLoading = true;
  api('/memory')
    .then(r => { MEM = r.memories || []; memDraw(); })
    .catch(e => {
      const l = document.getElementById('mlist');
      if (l) l.innerHTML = '<div class="memnone">' + esc(e.message) + '</div>';
    })
    .finally(() => { memLoading = false; });
}

function memDraw() {
  const seg = document.getElementById('mseg');
  if (seg) {
    const counts = { all: MEM.length };
    Object.keys(MTAG).forEach(k => { counts[k] = MEM.filter(m => m.tag === k).length; });
    seg.innerHTML = [['all', t('mem_all'), counts.all]]
      .concat(Object.keys(MTAG).map(k => [k, t(MTAG[k]), counts[k]]))
      .map(o => '<button data-memf="' + o[0] + '" class="' + (memTag === o[0] ? 'on' : '') + '">' +
        esc(o[1]) + ' ' + o[2] + '</button>').join('');
  }

  const editBox = m => '<div class="memc ed"><textarea id="mted" placeholder="' + esc(t('mem_ph')) +
    '" spellcheck="false">' + esc(m ? m.text : '') + '</textarea>' +
    '<div class="mer"><select class="mp-in" id="mtag">' +
      Object.keys(MTAG).map(k => '<option value="' + k + '"' +
        ((m ? m.tag : 'pref') === k ? ' selected' : '') + '>' + esc(t(MTAG[k])) + '</option>').join('') +
    '</select><span class="fl"></span>' +
    '<button class="btn" data-memcancel="1">' + esc(t('mem_cancel')) + '</button>' +
    '<button class="btn pri" data-memsave="1">' + esc(t('mem_save')) + '</button></div></div>';

  const vis = MEM.filter(memMatch);
  let h = memEdit === 'new' ? editBox(null) : '';
  h += vis.map(m => m.id === memEdit ? editBox(m)
    : '<div class="memc"><span class="mtag t-' + esc(m.tag) + '">' + esc(t(MTAG[m.tag] || 'mem_fact')) + '</span>' +
      '<div class="mtx">' + esc(m.text) +
      '<span class="mmeta">' + esc(t('mem_updated').replace('{d}', m.ts || '')) + '</span></div>' +
      '<button class="ib" data-memedit="' + m.id + '" title="' + esc(t('edit')) + '">' + ic('edit') + '</button>' +
      '<button class="ib danger" data-memdel="' + m.id + '" title="' + esc(t('mem_delete')) + '">' + ic('trash') + '</button>' +
      '</div>').join('');

  if (!h) h = '<div class="memnone">' + esc(MEM.length ? t('mem_nomatch') : t('mem_none')) + '</div>';

  const list = document.getElementById('mlist');
  if (list) {
    list.className = S.mem === false ? 'off' : '';
    list.innerHTML = h;
  }
  const ft = document.getElementById('mft');
  if (ft) {
    ft.innerHTML = '<span>' + esc(t('mem_count').replace('{n}', MEM.length)) + '</span>' +
      (MEM.length ? '<a data-memclear="1">' + esc(t('mem_clear')) + '</a>' : '');
  }
  const ta = document.getElementById('mted');
  if (ta && memFocus) {
    memFocus = false;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

function memSave() {
  const ta = document.getElementById('mted');
  const sel = document.getElementById('mtag');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  const tag = sel ? sel.value : 'pref';
  const isNew = memEdit === 'new';
  const path = isNew ? '/memory' : '/memory/' + memEdit;
  api(path, { method: isNew ? 'POST' : 'PATCH', body: { text, tag } })
    .then(() => {
      memEdit = null;
      toast(isNew ? t('mem_added') : t('mem_saved'));
      return memLoad();
    })
    .catch(e => toast(e.message));
}

/* ==================================================================
   技能页
   ------------------------------------------------------------------
   后端把技能存在磁盘上：
     用户   ~/.parable/skills/<id>/SKILL.md
     项目   <workspace>/.parable/skills/<id>/SKILL.md
   本页只做 CRUD + 启停；启停写在 .disabled.json，不改用户文件。

let SK = [];
let SKP = [];          // 加载失败的文件
let SKROOTS = { user: '', project: '' };
let skScope = 'user';
let skQ = '';
let skDiagOpen = false;

function renderSkillsPage(host) {
  host.innerHTML =
    '<div class="skpg" style="' + SP_PAD + '">' +
      spHead(t('sk_title'), t('sk_desc')) +
      '<div class="sktb"><label class="scope">' + ic('monitor') +
        '<select id="sksc"><option value="user">' + esc(t('sk_user')) + '</option>' +
        '<option value="project">' + esc(t('sk_project')) + '</option></select></label>' +
        '<i class="vd"></i><span class="skn">' + esc(t('sk_count')) + '<em id="skc"></em></span>' +
        '<label class="skq2">' + ic('search') + '<input id="skq" placeholder="' + esc(t('sk_search')) +
        '" value="' + esc(skQ) + '" spellcheck="false"></label></div>' +
      '<div id="skb"></div>' +
    '</div>';

  const sel = document.getElementById('sksc');
  if (sel) sel.value = skScope;

  skDraw();
  skLoad();

  host.oninput = e => { if (e.target.id === 'skq') { skQ = e.target.value; skDraw(); } };
  host.onchange = e => { if (e.target.id === 'sksc') { skScope = e.target.value; skDraw(); } };
  host.onclick = e => {
    const g = k => e.target.closest('[' + k + ']');
    const menu = document.getElementById('skmenu');
    if (menu && !g('data-skmore')) menu.classList.remove('on');
    if (g('data-skdiag')) { skDiagOpen = !skDiagOpen; g('data-skdiag').classList.toggle('open', skDiagOpen); return; }
    if (g('data-skmore')) { menu.classList.toggle('on'); return; }
    if (g('data-skopen')) { menu.classList.remove('on'); skOpenDir(); return; }
    if (g('data-skadd')) { skEdit(null); return; }
    if (g('data-skref')) {
      const b = g('data-skref');
      b.classList.add('spin');
      skLoad().then(() => {
        b.classList.remove('spin');
        toast(t('sk_reloaded').replace('{n}', SK.filter(x => x.scope === skScope).length));
      });
      return;
    }
    if (g('data-sktg')) {
      const id = g('data-sktg').dataset.sktg;
      const it = SK.find(x => x.scope === skScope && x.id === id);

      api('/skills/' + encodeURIComponent(skScope) + '/' + encodeURIComponent(id) + '/enabled',
          { method: 'POST', body: { enabled: next } })
        .then(() => { it.enabled = next; skDraw(); })
        .catch(err => toast(err.message));
      return;
    }
    if (g('data-skdel')) {
      const id = g('data-skdel').dataset.skdel;
      confirmBox(t('sk_del_n').replace('{n}', id)).then(ok => {
        if (!ok) return;
        api('/skills/' + encodeURIComponent(skScope) + '/' + encodeURIComponent(id), { method: 'DELETE' })
          .then(() => { toast(t('sk_deleted')); return skLoad(); })
          .catch(err => toast(err.message));
      });
      return;
    }
    if (g('data-sked')) { skEdit(g('data-sked').dataset.sked); return; }
  };
}

function skLoad() {
  return api('/skills')
    .then(r => {
      SK = r.skills || [];
      SKP = r.problems || [];
      if (r.roots) SKROOTS = r.roots;
      skDraw();
    })
    .catch(e => {
      const b = document.getElementById('skb');
      if (b) b.innerHTML = '<div class="sknone">' + esc(e.message) + '</div>';
    });
}

function skDraw() {
  const body = document.getElementById('skb');
  if (!body) return;
  const q = skQ.trim().toLowerCase();
  const mine = SK.filter(x => x.scope === skScope);
  const hit = x => !q || (x.id + ' ' + x.name + ' ' + x.description).toLowerCase().includes(q);
  const shown = mine.filter(hit);

  const cEl = document.getElementById('skc');
  if (cEl) cEl.textContent = String(mine.length);

  let h = '';
  // 诊断：只显示当前作用域的坏文件
  const probList = SKP.filter(p => p.scope === skScope);
  if (probList.length) {
    h += '<div class="diag' + (skDiagOpen ? ' open' : '') + '">' +
      '<div class="dh" data-skdiag="1">' + ic('chevr') + ic('warn') +
      esc(t('sk_diag').replace('{n}', probList.length)) + '</div>' +
      '<div class="dbody">' + probList.map(p => esc(p.path) + ' — ' + esc(p.reason)).join('<br>') + '</div></div>';
  }

  h += '<div class="sksh"><b>' + esc(t('sk_installed')) + '</b><em>' + shown.length + '</em>' +
    '<span class="fl"></span>' +
    '<button class="ib" data-skmore="1" title="' + esc(t('sk_more')) + '">' + ic('dots') + '</button>' +
    '<button class="ib" data-skref="1" title="' + esc(t('sk_reload')) + '">' + ic('refresh') + '</button>' +
    '<button class="btn pri" data-skadd="1">+ ' + esc(t('sk_new')) + '</button>' +
    '<div class="skmenu" id="skmenu"><button data-skopen="1">' + esc(t('sk_opendir')) + '</button></div></div>';

  h += '<div class="skl">' + (shown.length
    ? shown.map(x =>
        '<div class="skr ed" data-sked="' + esc(x.id) + '">' +
        '<span class="sktile n">' + ic('wand') + '</span>' +
        '<div class="skt"><b>' + esc(x.name || x.id) + '</b><span>' + esc(x.description) + '</span></div>' +
        '<button class="tg' + (x.enabled ? ' on' : '') + '" data-sktg="' + esc(x.id) + '" title="' + esc(t('sk_enabled')) + '"></button>' +
        '<button class="ib danger" data-skdel="' + esc(x.id) + '" title="' + esc(t('mem_delete')) + '">' + ic('trash') + '</button>' +
        '</div>').join('')
    : '<div class="sknone">' + esc(mine.length ? t('sk_nomatch') : t('sk_none')) + '</div>') + '</div>';

  body.innerHTML = h;
}

function skOpenDir() {
  const p = skScope === 'user' ? SKROOTS.user : SKROOTS.project;
  if (p) toast(p);
}

/* 新建 / 编辑技能：名称、描述、SKILL.md 正文 */
function skEdit(id) {
  const isNew = !id;
  const src = isNew ? null : SK.find(x => x.scope === skScope && x.id === id);
  const d = {
    name: src ? src.id : '',
    description: src ? src.description : '',
    body: src ? (src.body || '') : '# ' + t('sk_title') + '\n\n1. \n'
  };

  const ov = document.createElement('div');
  ov.className = 'mdl';
  document.body.appendChild(ov);

  // 不能叫 `esc`，会遮蔽全局的 HTML 转义函数。
  const close = () => { document.removeEventListener('keydown', onKey, true); ov.remove(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);

  ov.innerHTML = '<div class="mdlc"><div class="mdlh"><h3>' + esc(isNew ? t('sk_create') : t('sk_edit')) +
    '</h3><button class="ib" data-x title="' + esc(t('close')) + '">' + ic('x') + '</button></div>' +
    '<div class="mdlb">' +
      '<div class="mp-field"><label>' + esc(t('sk_name')) + '</label>' +
        '<input class="mp-in" id="skn1" value="' + esc(d.name) + '" placeholder="' + esc(t('sk_name_ph')) +
        '" spellcheck="false" style="font-family:var(--mono)"></div>' +
      '<div class="mp-field"><label>' + esc(t('sk_desc_f')) + '</label>' +
        '<input class="mp-in" id="skd1" value="' + esc(d.description) + '" placeholder="' + esc(t('sk_desc_ph')) + '"></div>' +
      '<div class="mp-field"><label>' + esc(t('sk_body')) + '</label>' +
        '<textarea class="mp-in js" id="skb1" spellcheck="false" style="min-height:200px">' + esc(d.body) + '</textarea></div>' +
    '</div><div class="mderr" id="mderr"></div>' +
    '<div class="mdlf"><span class="fl"></span>' +
      '<button class="btn" data-x>' + esc(t('mem_cancel')) + '</button>' +
      '<button class="btn pri" data-save>' + esc(t('mem_save')) + '</button></div></div>';

  const err = m => { const el = ov.querySelector('#mderr'); if (el) el.textContent = m; };

  ov.oninput = () => err('');
  ov.onclick = e => {
    if (e.target.closest('[data-x]')) { close(); return; }
    if (!e.target.closest('[data-save]')) return;
    const name = ov.querySelector('#skn1').value.trim();
    const description = ov.querySelector('#skd1').value.trim();
    const body = ov.querySelector('#skb1').value;
    if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) return err(t('sk_er_name'));
    if (!description) return err(t('sk_er_desc'));
    if (SK.some(x => x.scope === skScope && x.id === name && x.id !== (src && src.id))) {
      return err(t('sk_dup'));
    }
    api('/skills', {
      method: 'POST',
      body: {
        name,
        description,
        body,
        scope: skScope,
        rename_from: (!isNew && src.id !== name) ? src.id : null
      }
    })
      .then(() => { close(); toast(isNew ? t('sk_created') : t('sk_saved')); return skLoad(); })
      .catch(x => err(x.message));
  };
  setTimeout(() => { const f = ov.querySelector('#skn1'); if (f) f.focus(); }, 40);
}

function renderUsagePage(host) {
  host.innerHTML =
    '<div class="ug" style="' + SP_PAD + '"><div class="hd"><div><h2>' + t('ug_title') + '</h2><p>' + t('ug_desc') + '</p></div>' +
    '<div class="ug-ha"><span class="lr" id="uglr"></span>' +
    '<button class="btn" data-ugref="1">' + ic('refresh') + '<span>' + t('ug_refresh') + '</span></button></div></div>' +
    '<div id="ugbody"><div class="ld"><b>' + t('ug_loading') + '</b>' + t('ug_loading_h') + '</div></div></div>';
  loadUsage();
}

async function loadUsage() {
  const body = document.getElementById('ugbody');
  if (!body) return;
  // 不再用 ugLoading 拦请求：快速切换 7d/30d 时旧请求会先返回，把新范围
  // 的数据盖掉。递增令牌，只认最后一次发出的请求。
  const my = ++ugReq;
  ugLoading = true;
  try {
    const s = await api('/usage?range=' + encodeURIComponent(ugRange));
    if (my !== ugReq || !body.isConnected) return;
    ugSnap = s;
    ugLastRefresh = new Date();
    paintUsage(body, s);
  } catch (e) {
    if (my !== ugReq || !body.isConnected) return;
    body.innerHTML = '<div class="ld"><b>' + t('ug_refresh') + ' ✗</b>' + esc(e.message || String(e)) + '</div>';
  } finally {
    if (my === ugReq) ugLoading = false;
  }
}

/* ------------------------------------------------------------ 主渲染 */

function paintUsage(body, s) {
  if (!body) return;
  const sum = s.summary || {};
  const daily = s.daily || [];
  const models = s.models || [];
  const lr = document.getElementById('uglr');
  if (lr && ugLastRefresh) {
    lr.textContent = t('ug_updated').replace('{t}', ugLastRefresh.toTimeString().slice(0, 8));
  }

  // ---- 顶部概览（与附件一致的 5 项）
  const strip = '<div class="ug-sum">' + [
    [fmtBig(sum.totalTokens), t('ug_total')],
    [fmtBig(sum.peakDayTokens), t('ug_peak')],
    [fmtLongMs(sum.longestSessionMs), t('ug_longest')],
    [String(sum.currentStreakDays || 0) + (S.lang === 'zh' ? ' 天' : 'd'), t('ug_streak_now')],
    [String(sum.longestStreakDays || 0) + (S.lang === 'zh' ? ' 天' : 'd'), t('ug_streak_max')]
  ].map(x => '<div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>').join('') + '</div>';

  // ---- 热力图卡
  const heat = '<div class="card" id="hc"><div class="ch"><h3>' + t('ug_activity') + '</h3>' +
    '<div class="seg" id="hs">' +
      [['daily', 'ug_daily'], ['weekly', 'ug_weekly'], ['cumulative', 'ug_cumulative']]
        .map(m => '<button data-ughm="' + m[0] + '" class="' + (ugHmMode === m[0] ? 'on' : '') + '">' +
          t(m[1]) + '</button>').join('') +
    '</div></div>' + heatHtml() + heatLegend() + '</div>';

  // ---- 时间范围 + 趋势图
  const seg = '<div class="seg" id="rg">' + [['7d', 'ug_7d'], ['30d', 'ug_30d'], ['all', 'ug_all']]
    .map(r => '<button data-ugrange="' + r[0] + '" class="' + (ugRange === r[0] ? 'on' : '') + '">' +
      t(r[1]) + '</button>').join('') + '</div>';
  const trendCard = '<div class="card"><div class="ch"><h3>' + t('ug_trend') + '</h3>' +
    '<em>' + t('ug_days_n').replace('{n}', daily.length) + '</em></div>' +
    '<div class="rowh"><b>' + t('ug_range') + '</b>' + seg + '</div>' +
    '<div class="tw" id="ugtw" style="margin-top:12px"></div></div>';

  // ---- 其余四张卡
  const pieCard = ugPie(models);
  const compCard = ugComposition(sum);
  const hoursCard = ugActivity(s.activity || {});
  const topCard = ugTopSessions(s.topSessions || []);

  body.innerHTML = '<div class="ug">' + strip + heat + trendCard + pieCard + compCard + hoursCard + topCard + '</div>';
  drawTrend(daily);
}

/* ------------------------------------------------------------ 热力图 */

function heatLevelCell(level, total, tip) {
  return '<i class="l' + level + (total > 0 ? ' u' : '') + '"' +
    (tip ? ' title="' + esc(tip) + '"' : '') + '></i>';
}

function heatHtml() {
  const hm = (ugSnap && ugSnap.heatmap) || { weeks: [] };
  const weeks = hm.weeks || [];
  if (!weeks.length) return '<div class="ug-empty">' + t('ug_empty') + '</div>';

  // daily：直接按后端算好的分位等级上色
  if (ugHmMode === 'daily') {
    const cols = weeks.map(w => {
      const days = w.days || [];
      return '<div class="hmc">' + days.map(d => {
        if (!d) return '<i class="n"></i>';
        const tip = fmtDay(d.date) + '\n' + fmtBig(d.totalTokens) + ' ' + t('ug_tokens') +
          ' · ' + t('ug_turns_n').replace('{n}', d.turnCount || 0);
        return heatLevelCell(d.level || 0, d.totalTokens, tip);
      }).join('') + '</div>';
    }).join('');
    return '<div class="hmg">' + cols + '</div>' + heatMonths(weeks);
  }

  // weekly / cumulative：把每天聚合成列值，再按列重新定级
  const totals = weeks.map(w => (w.days || []).reduce((a, d) => a + (d ? d.totalTokens : 0), 0));
  const turns = weeks.map(w => (w.days || []).reduce((a, d) => a + (d ? d.turnCount : 0), 0));
  const cum = arr => arr.reduce((a, v) => { a.push((a.length ? a[a.length - 1] : 0) + v); return a; }, []);
  const series = ugHmMode === 'weekly' ? totals : cum(totals);
  const tseries = ugHmMode === 'weekly' ? turns : cum(turns);
  const mx = Math.max(1, ...series);
  const lvOf = v => (v <= 0 ? 0 : Math.min(4, Math.max(1, Math.ceil(v / mx * 4))));

  const cols = weeks.map((w, i) => {
    const days = w.days || [];
    const last = days.filter(Boolean).slice(-1)[0];
    // 只给每列最后 N 格着色（累计量画成从下往上生长的条）
    const filled = ugHmMode === 'weekly' ? 7 : Math.max(1, Math.round(series[i] / mx * 7));
    const lv = lvOf(series[i]);
    const tip = (ugHmMode === 'weekly'
      ? fmtDay(last && last.date)
      : t('ug_hm_total').replace('{d}', fmtDay(last && last.date))) +
      '\n' + fmtBig(series[i]) + ' ' + t('ug_tokens') +
      ' · ' + t('ug_turns_n').replace('{n}', tseries[i] || 0);
    return '<div class="hmc col" title="' + esc(tip) + '">' + days.map((d, j) => {
      const on = j >= 7 - filled && series[i] > 0;
      return heatLevelCell(on ? lv : 0, on ? 1 : 0, '');
    }).join('') + '</div>';
  }).join('');
  return '<div class="hmg">' + cols + '</div>' + heatMonths(weeks);
}

function heatMonths(weeks) {
  // 月份标签：同月合并，只保留最近 12 个
  const ms = [];
  weeks.forEach(w => {
    const first = (w.days || []).filter(Boolean)[0];
    if (!first) return;
    const k = first.date.slice(0, 7);
    const last = ms[ms.length - 1];
    if (last && last.k === k) last.s++;
    else ms.push({ k, s: 1, t: S.lang === 'zh' ? (+k.slice(5)) + '月' : fmtDay(first.date).replace(/\s?\d+$/, '') });
  });
  ms.forEach((m, i) => { if (i < ms.length - 12) m.t = ''; });
  if (!ms.length) return '';
  return '<div class="hmg hml">' + ms.map(m =>
    '<span style="grid-column:span ' + m.s + '">' + esc(m.t) + '</span>').join('') + '</div>';
}

function heatLegend() {
  return '<div class="hlg"><span>' + t('ug_less') + '</span>' +
    '<i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>' +
    '<span>' + t('ug_more') + '</span></div>';
}

/* ------------------------------------------------------------ 趋势折线图 */

function drawTrend(daily) {
  const tw = document.getElementById('ugtw');
  if (!tw) return;
  const n = ugRange === '7d' ? 7 : ugRange === '30d' ? 30 : daily.length;
  const rd = ugRange === 'all' ? daily : daily.slice(-n);
  if (!rd.length) { tw.innerHTML = '<div class="ug-empty">' + t('ug_empty') + '</div>'; return; }

  // 区间内 token 最多的前 5 个模型各画一条线
  const acc = {};
  rd.forEach(d => (d.models || []).forEach(m => { acc[m.modelId] = (acc[m.modelId] || 0) + m.totalTokens; }));
  const top = Object.keys(acc).sort((a, b) => acc[b] - acc[a]).slice(0, 5);

  const W = 800, H = 240, pl = 40, pr = 24, pt = 12, pb = 28;
  const cnt = rd.length;
  const mx = Math.max(1, ...rd.map(d => d.totalTokens));
  const X = i => pl + (cnt === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (cnt - 1));
  const Y = v => pt + (1 - v / mx) * (H - pt - pb);

  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const y = pt + k * (H - pt - pb) / 4;
    grid += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y +
      '" stroke="var(--line)" stroke-dasharray="3 3"/>';
    grid += '<text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--fg2)">' +
      esc(fmtBig(mx * (1 - k / 4))) + '</text>';
  }
  const step = cnt <= 7 ? 1 : Math.ceil(cnt / 6);
  let xl = '';
  rd.forEach((d, i) => {
    if (i % step === 0 || i === cnt - 1) {
      xl += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--fg2)">' +
        esc(fmtDay(d.date)) + '</text>';
    }
  });

  const lines = top.map((mid, k) =>
    '<path d="' + rd.map((d, i) => {
      const hit = (d.models || []).find(m => m.modelId === mid);
      const v = hit ? hit.totalTokens : 0;
      return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1);
    }).join('') + '" fill="none" stroke="var(' + UCH[k % UCH.length] + ')" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/>').join('');

  const legend = '<div class="lg">' + top.map((mid, k) =>
    '<span><i style="background:var(' + UCH[k % UCH.length] + ')"></i>' +
    esc(ugModelName(mid)) + '</span>').join('') + '</div>';

  tw.innerHTML = legend + '<svg viewBox="0 0 ' + W + ' ' + H + '">' + grid + xl + lines +
    '<line id="ugvl" y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--fg2)" stroke-opacity=".5" visibility="hidden"/>' +
    '</svg><div class="tip" id="ugtp"></div>';

  const svg = tw.querySelector('svg');
  const tp = document.getElementById('ugtp');
  const vl = document.getElementById('ugvl');
  tw.onmousemove = e => {
    const b = svg.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width * W;
    let i = Math.round((x - pl) / ((W - pl - pr) / Math.max(1, cnt - 1)));
    i = Math.max(0, Math.min(cnt - 1, i));
    const d = rd[i];
    const rows = (d.models || []).slice().sort((a, b2) => b2.totalTokens - a.totalTokens).slice(0, 6);
    tp.innerHTML = '<div class="t">' + esc(fmtDay(d.date)) + ' · ' +
      esc(fmtBig(d.totalTokens)) + ' ' + esc(t('ug_tokens')) + '</div>' +
      (rows.length
        ? rows.map(r => '<div class="r"><span><i style="background:var(' +
            UCH[(top.indexOf(r.modelId) + 6) % UCH.length] + ')"></i>' +
            esc(ugModelName(r.modelId)) + '</span><code>' + esc(fmtBig(r.totalTokens)) + '</code></div>').join('')
        : '<div style="color:var(--fg2)">' + t('ug_empty') + '</div>');
    tp.style.left = Math.max(14, Math.min(86, X(i) / W * 100)) + '%';
    tp.style.opacity = 1;
    vl.setAttribute('x1', X(i));
    vl.setAttribute('x2', X(i));
    vl.setAttribute('visibility', 'visible');
  };
  tw.onmouseleave = () => {
    if (tp) tp.style.opacity = 0;
    if (vl) vl.setAttribute('visibility', 'hidden');
  };
}

/* ------------------------------------------------------------ 模型环图 */

function ugPie(models) {
  if (!models.length) {
    return '<div class="card"><div class="ch"><h3>' + t('ug_model_usage') + '</h3></div>' +
      '<div class="ug-empty">' + t('ug_empty') + '</div></div>';
  }
  const total = models.reduce((a, m) => a + m.totalTokens, 0) || 1;
  const top = models.slice(0, 6).map((m, i) => ({
    n: ugModelName(m.modelId), v: m.totalTokens, c: 'var(' + UCH[i % UCH.length] + ')'
  }));
  const rest = models.slice(6).reduce((a, m) => a + m.totalTokens, 0);
  if (rest > 0) top.push({ n: t('ug_other'), v: rest, c: 'var(--fg2)' });

  const R = 70, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = top.map(m => {
    const len = m.v / total * C;
    const s = '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + m.c + '" stroke-width="24" ' +
      'stroke-dasharray="' + Math.max(0, len - 2) + ' ' + (C - Math.max(0, len - 2)) + '" ' +
      'stroke-dashoffset="' + (-off) + '" transform="rotate(-90 100 100)">' +
      '<title>' + esc(m.n) + ' ' + (m.v / total * 100).toFixed(1) + '%</title></circle>';
    off += len;
    return s;
  }).join('');

  return '<div class="card"><div class="ch"><h3>' + t('ug_model_usage') + '</h3>' +
    '<em>' + esc(top[0].n) + ' · ' + (top[0].v / total * 100).toFixed(0) + '%</em></div>' +
    '<div class="pie"><svg viewBox="0 0 200 200">' + arcs +
    '<text x="100" y="98" text-anchor="middle" font-size="22" font-weight="600" fill="var(--fg)">' +
    esc(fmtBig(total)) + '</text>' +
    '<text x="100" y="118" text-anchor="middle" font-size="11" fill="var(--fg2)">' +
    esc(t('ug_tokens')) + '</text></svg>' +
    '<div class="pl">' + top.map(m =>
      '<div><i style="background:' + m.c + '"></i><b>' + esc(m.n) + '</b>' +
      '<em>' + esc(fmtBig(m.v)) + ' ' + esc(t('ug_tokens')) + '</em>' +
      '<span>' + (m.v / total * 100).toFixed(m.v / total >= 0.1 ? 0 : 1) + '%</span></div>').join('') +
    '</div></div></div>';
}

/* ------------------------------------------------------------ Token 构成 */

function ugComposition(sum) {
  const parts = [
    ['ug_comp_in', sum.inputTokens || 0, 'var(--uch1)'],
    ['ug_comp_out', sum.outputTokens || 0, 'var(--uch5)'],
    ['ug_comp_cr', sum.cacheReadTokens || 0, 'var(--uch2)'],
    ['ug_comp_cw', sum.cacheCreationTokens || 0, 'var(--uch3)']
  ].filter(p => p[1] > 0);
  if (!parts.length) {
    return '<div class="card"><div class="ch"><h3>' + t('ug_comp') + '</h3></div>' +
      '<div class="ug-empty">' + t('ug_comp_none') + '</div></div>';
  }
  const total = parts.reduce((a, p) => a + p[1], 0) || 1;
  const hit = Math.round((sum.cacheHitRate || 0) * 100);
  return '<div class="card"><div class="ch"><h3>' + t('ug_comp') + '</h3>' +
    '<em>' + t('ug_cache_hit') + ' ' + hit + '%</em></div>' +
    '<div class="cbar">' + parts.map(p =>
      '<i style="width:' + Math.max(1, p[1] / total * 100) + '%;background:' + p[2] + '"></i>').join('') + '</div>' +
    '<div class="cleg">' + parts.map(p =>
      '<div><i style="background:' + p[2] + '"></i>' + t(p[0]) + '<b>' + esc(fmtBig(p[1])) + '</b></div>').join('') +

/* ------------------------------------------------------------ 活跃时段 */

function ugActivity(act) {
  const hours = act.hours || [];
  if (!hours.length) {
    return '<div class="card"><div class="ch"><h3>' + t('ug_act') + '</h3></div>' +
      '<div class="ug-empty">' + t('ug_empty') + '</div></div>';
  }
  const vals = hours.map(h => h.tokens || 0);
  // 全零时画一排 3% 的细线没有意义，直接给空状态。
  if (!vals.some(v => v > 0)) {
    return '<div class="card"><div class="ch"><h3>' + t('ug_act') + '</h3></div>' +
      '<div class="ug-empty">' + t('ug_empty') + '</div></div>';
  }
  const mx = Math.max(1, ...vals);
  const pk = vals.indexOf(Math.max(...vals));
  const hasPeak = act.peakHour != null && Math.max(...vals) > 0;
  return '<div class="card"><div class="ch"><h3>' + t('ug_act') + '</h3>' +
    (hasPeak ? '<em>' + t('ug_peak_hour') + ' ' + String(act.peakHour).padStart(2, '0') + ':00 · ' +
      esc(fmtBig(vals[act.peakHour] || 0)) + ' ' + esc(t('ug_tokens')) + '</em>' : '') + '</div>' +
    '<div class="hrs">' + vals.map((v, i) =>
      '<i class="' + (i === pk && v > 0 ? 'pk' : '') + '" style="height:' +
      Math.max(3, v / mx * 100) + '%" title="' + String(i).padStart(2, '0') + ':00 · ' +
      esc(fmtBig(v)) + ' ' + esc(t('ug_tokens')) + '"></i>').join('') + '</div>' +
    '<div class="hax"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>';
}

/* ------------------------------------------------------------ 用量最高的会话 */

function ugTopSessions(list) {
  if (!list.length) {
    return '<div class="card"><div class="ch"><h3>' + t('ug_tops') + '</h3></div>' +
      '<div class="ug-empty">' + t('ug_tops_empty') + '</div></div>';
  }
  const first = Math.max(1, list[0].totalTokens || 1);
  return '<div class="card"><div class="ch"><h3>' + t('ug_tops') + '</h3></div>' + list.map((s, i) =>

$('#sp').addEventListener('click', async e => {

    return;

  const pt = e.target.closest('[data-mpp]');
  if (pt) {

  if (e.target.closest('[data-mpren]')) {

    const h = $('#mpname');

    inp.value = mpName(p);
    inp.style.maxWidth = '260px';
    h.replaceWith(inp);
    inp.focus();
    inp.select();
    let done = false;
    const fin = ok => {
      if (done) return;
      done = true;
      const nn = inp.value.trim();
      if (ok && nn && nn !== mpName(p)) {
        p.name = nn;
        if (!p.icon) p.icon = nn.slice(0, 1).toUpperCase();

      } else {

      }

    inp.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); fin(true); }
      if (e.key === 'Escape') { e.preventDefault(); fin(false); }

      .catch(err => { b.classList.remove('busy'); b.classList.add('bad'); toast(err.message); });

  if (e.target.closest('[data-mpaddm]')) {

  if (e.target.closest('[data-mpup]')) {
    // 从上游拉取模型目录
    mpFetchUpstream();
    return;
  }

  if (e.target.closest('[data-mpaddp]')) {
    const id = 'p' + Date.now();
    api('/config', {
      method: 'PATCH',
      body: {
        providers: [{
          id, name: t('mp_newp'), color: '#64748b', icon: '+', enabled: true,
          base_url: '', api: 'anthropic', key: '', models: []
        }]
      }
    }).then(() => {
      mpSel = id;
      loadProviders().then(() => { mpList(); mpDetail(); });
    }).catch(e => toast(e.message));

  }

  const test = e.target.closest('[data-mptest]');
  if (test) {
    const p = mpCur();
    test.disabled = true;
    const old = test.textContent;
    test.textContent = '…';
    api('/providers/test', { method: 'POST', body: { provider_id: p.id } })
      .then(r => {
        toast((r.ok ? '✓ ' : '✗ ') + r.message + (r.latency_ms ? ' · ' + r.latency_ms + 'ms' : ''));
        if (r.models && r.models.length && (!p.models || !p.models.length)) {
          pushProvider({
            id: p.id,
            models: r.models.map(id => ({ id, name: id, context: 128000, vision: false, thinking: false, enabled: true }))
          });
        }
      })
      .catch(err => toast('✗ ' + err.message))
      .finally(() => {
        test.disabled = false;
        test.textContent = old;
      });
    return;
  }

  if (e.target.closest('[data-mprefresh]')) {
    loadProviders().then(() => { mpList(); mpDetail(); toast(t('mp_refreshed') || 'ok'); });
    return;
  }
});

  // 否则确认“删除”时按 ⌘K 切走会话，后续操作会落到另一个会话上。

    if (busy && sig) {
      stopTurn();
