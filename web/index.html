/** Full render of a markdown-ish string into `cur` (animated unless `inst`). */
async function inline(cur, text, sig, inst, sp0) {
  // 界面统一性：正文里的 emoji 去掉（只影响显示，存储保留原文）
  text = noEmoji(text);
  const an = S.stream && !inst;
  const wait = () => inst ? 0 : sleep(sp0 || S.speed);
  let word = null, inl = null, host = cur;
  const mk = ch => {
    if (!an) {
      const l = cur.lastChild;
      if (l && l.nodeType === 3) { l.data += ch; return l; }
      return document.createTextNode(ch);
    }
    const s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch;
    return s;
  };
  for (let i = 0; i < text.length && !(sig && sig.stop); i++) {
    const tg = text.startsWith('**', i) ? 'strong' : text[i] === '`' ? 'code' : null;
    // Tolerate an unclosed marker: models often write `**标题` with no closing
    // `**`. Treat it as bold and let the newline (or end of text) close it,
    // rather than leaking literal asterisks into the reply.
    const tag = tg;
    if (tag) {
      if (inl && inl.tagName.toLowerCase() === tag) { cur = host; inl = null; }
      else if (!inl) { inl = document.createElement(tag); host.append(inl); cur = inl; }
      else { inl = document.createElement(tag); host.append(inl); cur = inl; }
      if (tag === 'strong') i++;
      word = null;
      continue;
    }
    const ch = text[i];
    if (ch === '\n') {
      if (inl) { cur = host; inl = null; }
      cur.append(document.createElement('br'));
      word = null;
      continue;
    }
    if (!an || /[\s　-〿＀-￯]/.test(ch)) {
      word = null;
      cur.append(mk(ch));
    } else {
      if (!word || word.parentNode !== cur) {
        word = document.createElement('span');
        word.className = 'w';
        cur.append(word);
      }
      word.append(mk(ch));
    }
    if (ch.trim() && !inst) { await wait(); follow(); }
  }
}

/** Incremental *inline* writer: bold / code, carried across chunks. */
function mkInline(host, ink, noanim) {
  return { host, cur: host, ih: host, inl: null, word: null, pend: '', ink: ink || null, noanim: !!noanim };
}
function iwrite(st, text, sig) {
  // 界面统一性：流式正文里的 emoji 去掉
  let s = noEmoji(st.pend + text);
  st.pend = '';
  const an = S.stream && !st.noanim && !PERF.slow;
  const mk = ch => {
    // 动画预算用完（或已判慢）就直接拼文本节点：几千个带 blur 的 span
    // 同时播放会把渲染线程饿死，表现就是「整页定格、只有小球还在动」。
    if (!an || (st.animLeft != null && st.animLeft <= 0)) {
      const l = st.cur.lastChild;
      if (l && l.nodeType === 3) { l.data += ch; return l; }
      return document.createTextNode(ch);
    }
    if (st.animLeft != null) st.animLeft--;
    const e = document.createElement('span');
    e.className = 'c';
    e.textContent = ch;
    // 共享 ink 计数器：整块（列表/提交）一次性渲染时逐字错峰，
    // 否则同帧创建的字符动画全部同步起跑，糊成一片。
    if (st.ink) { e.style.animationDelay = Math.min(st.ink.n * 7, 420) + 'ms'; st.ink.n++; }
    return e;
  };
  for (let i = 0; i < s.length && !(sig && sig.stop); i++) {
    const isBold = s.startsWith('**', i);
    const isCode = s[i] === '`';
    // A marker may straddle two chunks. Only a lone trailing `*` / `` ` `` is
    // ambiguous — hold it for the next chunk instead of emitting it literally.
    if ((s[i] === '*' || s[i] === '`') && i === s.length - 1) {
      st.pend = s[i];
      break;
    }
    if (isBold || isCode) {
      const tag = isBold ? 'strong' : 'code';
      if (st.inl && st.inl.tagName.toLowerCase() === tag) {
        st.cur = st.ih; st.inl = null;
      } else {
        st.inl = document.createElement(tag);
        st.ih.append(st.inl);
        st.cur = st.inl;
      }
      if (isBold) i++;
      st.word = null;
      continue;
    }
    const ch = s[i];
    if (ch === '\n') {
      // A <br> inside <strong>/<code> breaks line-box math and leaves a phantom
      // gap after the inline run. Close the run first, break at the paragraph.
      if (st.inl) { st.cur = st.ih; st.inl = null; }
      st.cur.append(document.createElement('br'));
      st.word = null;
      continue;
    }
    if (!an || /[\s　-〿＀-￯]/.test(ch)) {
      st.word = null;
      st.cur.append(mk(ch));
    } else {
      if (!st.word || st.word.parentNode !== st.cur) {
        st.word = document.createElement('span');
        st.word.className = 'w';
        st.cur.append(st.word);
      }
      st.word.append(mk(ch));
    }
    if (ch.trim()) follow();
  }
}
function iflush(st) {
  if (!st.pend) return;
  const p = st.pend;
  st.pend = '';
  iwrite(st, p + ' ', null);
  const n = st.cur.lastChild;
  if (n && n.nodeType === 3 && n.data.endsWith(' ')) n.data = n.data.slice(0, -1);
  else if (n && n.lastChild && n.lastChild.textContent) {
    const m = n.lastChild;
    if (m.textContent.endsWith(' ')) m.textContent = m.textContent.slice(0, -1);
  }
}

/* ---- block layer: buffers markdown and renders each block with real structure ---- */

function classifyBlock(s) {
  const t = String(s || '').replace(/^\s+/, '');
  if (t.startsWith('```')) return 'code';
  if (/^#{1,6}\s/.test(t)) return 'heading';
  if (/^\s*[-*+]\s+/.test(t)) return 'ul';
  if (/^\s*\d+[.)]\s+/.test(t)) return 'ol';
  if (t.startsWith('>')) return 'quote';
  if (t.startsWith('|')) return 'table';
  return 'p';
}

const FENCE_RE = /^[ \t]*```/;

/**
 * Index of the next blank-line boundary, or -1.
 * Inside an unclosed ``` fence a blank line is part of the code block, not a
 * block boundary — so the scanner tracks fence state line by line and only
 * reports blank lines seen outside a fence. Streaming and final rendering
 * (splitBlocks) share this state machine.
 */
function blankBoundary(s) {
  let open = false, pos = 0;
  const lines = String(s).split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (FENCE_RE.test(line)) {
      open = !open;
    } else if (!open && /^[ \t]*$/.test(line) && pos > 0) {
      return pos - 1;   // index of the newline that closes the previous block
    }
    pos += line.length + 1;
  }
  return -1;
}

function mkStream(host) {
  return {
    host, buf: '', rendered: '', el: null, kind: '', inline: null,
    // 增量扫描状态：fence 跨 chunk 保留；lineStart 是「还没判定过的那一行」的起点。
    fence: false, lineStart: 0,
    // 逐字动画预算。每个字符一个 span + blur 动画，几千个同时跑会把合成线程
    // 拖死（整页定格、只有 CSS 小球还在动的直接原因）。超过预算就直接写文本节点。
    animLeft: ANIM_BUDGET,
    pre: null, codeLines: -1, codeLang: '',
    dirty: false, timer: 0, lastBuild: 0,
  };
}

/** 单个块最多给多少字符加逐字入场动画。 */
const ANIM_BUDGET = 900;
/** 非散文块（列表/表格）整块重渲的最小间隔（ms）。 */
const REBUILD_MS = 120;
/** 全局性能降级：检测到一次同步渲染超时就关掉本轮动画，先把界面救活。 */
const PERF = { slow: false, turn: 0 };

/**
 * 找下一个「空行」块边界，返回上一块最后一个换行的下标（没有则 -1）。
 *
 * 旧实现每次 delta 都把整个缓冲 split 一遍，长回答下是 O(n²)；这里改成
 * 从上次未判定的行继续扫，成本只跟新到的字符有关。fence 状态跨调用保留，
 * 所以代码块里的空行不会被误当成块边界。
 */
function scanBoundary(st) {
  const buf = st.buf;
  for (let i = st.lineStart; i < buf.length; i++) {
    if (buf.charCodeAt(i) !== 10) continue;
    const line = buf.slice(st.lineStart, i);
    if (FENCE_RE.test(line)) {
      st.fence = !st.fence;
    } else if (!st.fence && /^[ \t]*$/.test(line)) {
      // 开头那一串空行不算边界（否则每个 delta 都会切出一个空块）
      if (buf.slice(0, st.lineStart).trim()) return st.lineStart - 1;
    }
    st.lineStart = i + 1;
  }
  return -1;
}

function swrite(st, text, sig) {
  st.buf += text;

  // 提交已经完成的块。guard 防止异常输入（或未来改坏的扫描器）把主线程锁死。
  let i, guard = 0;
  while ((i = scanBoundary(st)) >= 0) {
    if (++guard > 400) break;
    const done = st.buf.slice(0, i);
    st.buf = st.buf.slice(i).replace(/^(?:\n[ \t]*)+/, '');
    st.lineStart = 0;
    st.fence = false;
    st.rendered = '';
    commitBlock(st, done);
    st.el = null;
    st.inline = null;
    st.kind = '';
    st.pre = null;
    st.codeLines = -1;
  }

  if (!st.buf.trim()) {
    if (st.el) { st.el.remove(); st.el = null; st.inline = null; }
    return;
  }

  const k = classifyBlock(st.buf);
  if (k === 'code') { streamCode(st); return; }
  if (k === 'p' && st.el && st.kind === 'p' && st.inline) {
    // 散文：只追加新字符，逐字动画才不会被整块重渲打断。
    const delta = st.buf.slice(st.rendered.length);
    if (delta) iwrite(st.inline, delta, sig);
    st.rendered = st.buf;
    return;
  }
  st.dirty = true;
  scheduleRebuild(st);
}

/** 列表 / 表格 / 标题：整块重渲，但按帧（且至少隔 REBUILD_MS）合并。 */
function scheduleRebuild(st) {
  if (st.timer) return;
  const gap = Math.max(0, REBUILD_MS - (performance.now() - st.lastBuild));
  const run = () => {
    st.timer = 0;
    if (!st.dirty) return;
    st.dirty = false;
    st.lastBuild = performance.now();
    rebuildBlock(st);
  };
  st.timer = gap > 0 ? setTimeout(run, gap) : requestAnimationFrame(run);
}

/**
 * 代码块增量渲染。
 *
 * 旧实现对每个 delta 都重建整个 `<pre>`，一段 500 行的代码会生成 500 ×
 * token 个节点——这就是「流式输出长代码时页面直接定格」的来源。现在只在
 * 行数增加时追加新行，最后一行原地改写。
 */
function codeText(buf) {
  return String(buf)
    .replace(/^[ \t]*```[^\n]*\n?/, '')
    .replace(/\n?[ \t]*```[ \t]*$/, '');
}

function streamCode(st) {
  const text = codeText(st.buf);
  const lang = (st.buf.match(/^[ \t]*```([^\n]*)/) || [, 'code'])[1].trim() || 'code';
  if (!st.el || st.kind !== 'code') {
    if (st.el) { st.el.remove(); st.el = null; }
    const d = document.createElement('div');
    d.className = 'cb';
    const hd = document.createElement('div');
    hd.className = 'ch2';
    hd.innerHTML = '<span class="cb-lang"></span><span class="cbh">' +
      '<button class="cp" data-cp>' + t('copy') + '</button>' +
      '<button class="cp" data-wr>' + t('wrap') + '</button></span>';
    const pre = document.createElement('pre');
    d.append(hd, pre);
    st.host.append(d);
    st.el = d;
    st.kind = 'code';
    st.pre = pre;
    st.codeLines = 0;
    st.codeLang = '';
    hd.querySelector('[data-cp]').onclick = e => {
      copyText(codeText(st.buf), true).then(ok => { if (ok) flash(e.target); });
    };
    hd.querySelector('[data-wr]').onclick = () => pre.classList.toggle('wrapit');
  }
  if (st.codeLang !== lang) {
    st.codeLang = lang;
    st.el.querySelector('.cb-lang').textContent = lang;
  }
  const lines = text.split('\n');
  if (st.codeLines > lines.length) {
    // 内容变短（极少见：正则剥掉围栏后重算）——整块重建一次兜底
    st.pre.innerHTML = '';
    st.codeLines = 0;
  }
  if (lines.length === st.codeLines && st.codeLines > 0) {
    const last = st.pre.lastElementChild;
    if (last) last.firstChild.textContent = lines[lines.length - 1];
    return;
  }
  for (let i = st.codeLines; i < lines.length; i++) {
    const row = document.createElement('div');
    row.className = 'cl';
    const sp = document.createElement('span');
    sp.textContent = lines[i];
    row.append(sp);
    st.pre.append(row);
  }
  st.codeLines = lines.length;
}

function commitBlock(st, text) {
  if (st.el) { st.el.remove(); st.el = null; st.inline = null; }
  if (!text.trim()) return;
  renderBlock(st.host, text, { n: 0 }, true);
}

function rebuildBlock(st) {
  if (st.el) { st.el.remove(); st.el = null; st.inline = null; }
  st.pre = null;
  st.codeLines = -1;
  if (!st.buf.trim()) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'mblk';
  // 流式期间的整块重渲不播动画：列表每个 delta 都会走到这里，
  // 带动画会反复重播；提交时（commitBlock）再一次性错峰入场。
  renderBlock(wrapper, st.buf, null, true);
  st.host.append(wrapper);
  st.el = wrapper;
  st.kind = classifyBlock(st.buf);
  st.rendered = st.buf;
  st.animLeft = ANIM_BUDGET;
  // Prose blocks keep an inline writer so later deltas animate in; the writer
  // targets the inner <p>, not the wrapper.
  st.inline = (st.kind === 'p' && wrapper.children.length === 1 && wrapper.firstElementChild.tagName === 'P')
    ? mkInline(wrapper.firstElementChild) : null;
}

function sflush(st) {
  if (st.timer) {
    clearTimeout(st.timer);
    cancelAnimationFrame(st.timer);
    st.timer = 0;
  }
  st.dirty = false;
  if (st.buf.trim()) commitBlock(st, st.buf);
  st.buf = '';
  st.rendered = '';
  st.el = null;
  st.inline = null;
  st.kind = '';
  st.pre = null;
  st.codeLines = -1;
}

/** Split markdown into blocks on blank lines (fence-aware, see blankBoundary). */
function splitBlocks(text) {
  const lines = String(text || '').split('\n');
  const out = [];
  let start = 0, open = false;
  for (let i = 0; i < lines.length; i++) {
    if (FENCE_RE.test(lines[i])) {
      open = !open;
    } else if (!open && /^[ \t]*$/.test(lines[i])) {
      const done = lines.slice(start, i).join('\n');
      if (done.trim()) out.push(done);
      start = i + 1;
    }
  }
  const tail = lines.slice(start).join('\n');
  if (tail.trim()) out.push(tail);
  return out;
}

/** Render inline markup into `el` (bold / inline code). */
function mdInline(el, text, ink, noanim) {
  // 批量渲染（历史消息、表格、列表）默认不开逐字动画：那些字符不是「刚到的」，
  // 给它们排 1 秒的 pop 只会把切换会话变成几秒白屏。只有实时流才传 noanim=false。
  const st = mkInline(el, ink, noanim === undefined ? true : noanim);
  iwrite(st, String(text || ''), null);
  iflush(st);
}

/** True when every non-empty line looks like a markdown table row. */
function isTable(text) {
  const ls = text.split('\n').map(l => l.trim()).filter(Boolean);
  return ls.length >= 2 && ls.every(l => l.startsWith('|') && l.endsWith('|')) &&
    ls.some(l => /^\|[\s:|-]+\|$/.test(l));
}

function renderTable(host, text) {
  const rows = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parseRow = r => r.slice(1, -1).split('|').map(c => c.trim());
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');
  rows.forEach((r, i) => {
    if (/^\|[\s:|-]+\|$/.test(r)) return; // separator
    const tr = document.createElement('tr');
    const isHead = i === 0;
    parseRow(r).forEach(c => {
      const cell = document.createElement(isHead ? 'th' : 'td');
      mdInline(cell, c);
      tr.append(cell);
    });
    (isHead ? thead : tbody).append(tr);
  });
  tbl.append(thead, tbody);
  host.append(tbl);
}

function renderList(host, text, ordered, ink, noanim) {
  const el = document.createElement(ordered ? 'ol' : 'ul');
  text.split('\n').forEach(line => {
    const m = line.match(ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/);
    const li = document.createElement('li');
    mdInline(li, m ? line.slice(m[0].length) : line.trim(), ink, noanim);
    el.append(li);
  });
  host.append(el);
}

function renderCode(host, text) {
  const body = text.replace(/^```[^\n]*\n?/, '').replace(/```$/, '');
  const d = document.createElement('div');
  d.className = 'cb';
  const hd = document.createElement('div');
  hd.className = 'ch2';
  const lang = (text.match(/^```([^\n]*)/) || [, ''])[1] || 'code';
  hd.innerHTML = '<span>' + esc(lang) + '</span><span class="cbh">' +
    '<button class="cp" data-cp>' + t('copy') + '</button>' +
    '<button class="cp" data-wr>' + t('wrap') + '</button></span>';
  const pre = document.createElement('pre');
  if (S.codeWrap) pre.classList.add('wrapit');
  d.append(hd, pre);
  host.append(d);
  hd.querySelector('[data-cp]').onclick = e => {
    copyText(body, true).then(ok => { if (ok) flash(e.target); });
  };
  hd.querySelector('[data-wr]').onclick = () => pre.classList.toggle('wrapit');
  pre.textContent = body;
  // 行号开关（设置 → 外观）：关闭时不画行号槽
  if (S.codeLineNumbers !== false) numCode(pre);
}

/**
 * Render one markdown block into `host`.
 * A block can mix prose and list rows (models often write
 * `基本信息\n- a\n- b` with no blank line), so multi-line blocks are grouped
 * by line type instead of being classified from the first line alone.
 */
function renderBlock(host, text, ink, noanim = true) {
  const t0 = text.replace(/^\n+|\n+$/g, '');
  if (!t0.trim()) return;
  if (/^```/.test(t0)) {
    // 围栏在块内闭合、后面还跟着散文行（模型常写 ```code``` 紧贴正文）：
    // 拆成代码块 + 后续 prose，别把正文吞进代码里。
    const lns = t0.split('\n');
    let close = -1;
    for (let k = 1; k < lns.length; k++) {
      if (FENCE_RE.test(lns[k])) { close = k; break; }
    }
    if (close >= 0 && close < lns.length - 1) {
      renderCode(host, lns.slice(0, close + 1).join('\n'));
      renderBlock(host, lns.slice(close + 1).join('\n'), ink, noanim);
      return;
    }
    renderCode(host, t0);
    return;
  }
  if (isTable(t0)) { renderTable(host, t0); return; }

  const lines = t0.split('\n');

  // A leading heading line splits off on its own.
  const h = lines[0].match(/^(#{1,6})\s+(.*)$/);
  if (h) {
    const el = document.createElement('h' + Math.min(h[1].length, 4));
    mdInline(el, h[2], ink, noanim);
    host.append(el);
    const rest = lines.slice(1);
    if (rest.join('\n').trim()) renderBlock(host, rest.join('\n'), ink, noanim);
    return;
  }

  // Group consecutive lines of the same kind.
  let i = 0;
  while (i < lines.length) {
    const isUl = /^\s*[-*+]\s+/.test(lines[i]);
    const isOl = /^\s*\d+[.)]\s+/.test(lines[i]);
    if (isUl || isOl) {
      const grp = [];
      while (i < lines.length && (isUl ? /^\s*[-*+]\s+/.test(lines[i]) : /^\s*\d+[.)]\s+/.test(lines[i]))) {
        grp.push(lines[i]);
        i++;
      }
      renderList(host, grp.join('\n'), !isUl, ink, noanim);
      continue;
    }
    if (/^>\s?/.test(lines[i])) {
      const grp = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        grp.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      const bq = document.createElement('blockquote');
      mdInline(bq, grp.join('\n'), ink, noanim);
      host.append(bq);
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
      host.append(document.createElement('hr'));
      i++;
      continue;
    }
    // Fenced code: gather from the opening ``` through the closing ``` (or the
    // end of the block when the fence is never closed) and render as code.
    if (FENCE_RE.test(lines[i])) {
      const grp = [lines[i]];
      i++;
      while (i < lines.length) {
        const l = lines[i];
        grp.push(l);
        i++;
        if (FENCE_RE.test(l)) break;
      }
      renderCode(host, grp.join('\n'));
      continue;
    }
    // Prose run (stops at list / quote / hr / fence openers).
    const grp = [];
    while (i < lines.length
      && !/^\s*[-*+]\s+/.test(lines[i])
      && !/^\s*\d+[.)]\s+/.test(lines[i])
      && !/^>\s?/.test(lines[i])
      && !FENCE_RE.test(lines[i])
      && !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
      grp.push(lines[i]);
      i++;
    }
    const p = document.createElement('p');
    mdInline(p, grp.join('\n'), ink, noanim);
    host.append(p);
  }
}

/** Render a whole markdown document into `host`. */
function renderBlocks(host, text) {
  // 模型常在结尾多吐几个换行；空段落会把操作条顶下去一大截。
  text = String(text == null ? '' : text).replace(/\s+$/, '');
  splitBlocks(text).forEach(b => renderBlock(host, b, { n: 0 }));
}

function flash(b) {
  const o = b.textContent;
  b.textContent = t('copied');
  setTimeout(() => b.textContent = o, 1400);
}

function numCode(pre) {
  if (pre.dataset.num === '1') return;
  pre.dataset.num = '1';
  const txt = pre.textContent;
  pre.innerHTML = txt.split('\n').map(l => '<div class="cl"><span>' + esc(l) + '</span></div>').join('');
}

async function paint(host, text, sig, inst) {
  renderBlocks(host, text);
}

/* ---------------------------------------------------------------- messages */

/** 消息时间：今天 16:55 / 昨天 16:55 / 11-12 16:55。 */
function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  const hm = p(d.getHours()) + ':' + p(d.getMinutes());
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const gap = Math.round((b - a) / 86400000);
  if (gap === 0) return (S.lang === 'zh' ? '今天 ' : 'Today ') + hm;
  if (gap === 1) return (S.lang === 'zh' ? '昨天 ' : 'Yesterday ') + hm;
  return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + hm;
}

function uMsg(q, idx, atts, ts) {
  const d = document.createElement('div');
  d.className = 'u msg';
  if (idx != null) d.dataset.mi = idx;
  const b = document.createElement('div');
  b.className = 'ub';
  if (atts && atts.length) {
    const row = document.createElement('div');
    row.className = 'uatt';
    atts.forEach(a => {
      const s = document.createElement('span');
      s.className = 'att';
      // 图片附件带本地预览缩略图（URL.createObjectURL，随消息一起传入）
      s.innerHTML = (a && a.url ? '<img class="attimg" alt="">' : ic('file')) + '<b></b>';
      const im = s.querySelector('.attimg');
      if (im) im.src = a.url;
      s.querySelector('b').textContent = a.name || '';
      row.append(s);
    });
    b.append(row);
  }
  if (q) {
    // 保存原文：显示层会去 emoji、Markdown 会丢格式，复制必须给用户原样内容。
    d.dataset.raw = q;
    const tx = document.createElement('div');
    tx.textContent = noEmoji(q);
    b.append(tx);
  }
  // 存储下标未知时按钮照常显示：点了先提示「还没落库」，不做灰按钮、也不隐藏。
  const acts = document.createElement('div');
  acts.className = 'macts';
  acts.innerHTML =
    '<button class="ib" data-ue="' + idx + '" title="' + t('editmsg') + '">' + ic('edit') + '</button>' +
    '<button class="ib" data-uc="' + idx + '" title="' + t('copy') + '">' + ic('copy') + '</button>' +
    '<button class="ib danger" data-ud="' + idx + '" title="' + t('delmsg') + '">' + ic('trash') + '</button>';
  d.append(b, acts);
  if (ts) {
    const w = document.createElement('div');
    w.className = 'ts uts';
    w.textContent = fmtWhen(ts);
    d.append(w);
  }
  feed.append(d);
  return d;
}

function aMsg(idx, spin, ts) {
  const d = document.createElement('div');
  d.className = 'a msg';
  if (idx != null) d.dataset.mi = idx;
  // No fixed .th placeholder: reasoning blocks are created in place as they
  // stream, so they land next to the tool call they actually preceded.
  // spin=true 时（正在生成的实时 turn）在回答下方放计时条，收尾时定格用时。
  d.innerHTML =
    '<div class="ab"></div>' +
    (spin ? '<div class="wk on"><i class="wd"></i><span class="wtx">' + esc(t('working')) + '</span></div>' : '') +
    '<div class="arow">' +
    '<div class="acts">' +
    '<button class="ib" data-a="copy" title="' + t('copy') + '">' + ic('copy') + '</button>' +
    '<button class="ib" data-a="re" title="' + t('regen') + '">' + ic('retry') + '</button>' +
    '<button class="ib" data-a="edit" title="' + t('editmsg') + '">' + ic('edit') + '</button>' +
    '<button class="ib danger" data-a="del" title="' + t('delmsg') + '">' + ic('trash') + '</button>' +
    '</div>' +
    '<span class="ts' + (spin ? ' hide' : '') + '">' + esc(fmtWhen(ts)) + '</span>' +
    '</div>';
  feed.append(d);
  return d;
}

/* ---- 生成中计时条：显示「工作中 x 秒」，收尾定格为实际用时 ---- */
let wkTimer = 0, wkStart = 0;

/** 在气泡下方的计时条上显示已用秒数。 */
function wkPaint(a) {
  if (!a) return;
  const el = a.querySelector('.wk');
  if (!el || el.classList.contains('done')) return;
  const sec = wkStart ? Math.max(1, Math.round((Date.now() - wkStart) / 1000)) : 1;
  const tx = el.querySelector('.wtx');
  if (tx) tx.textContent = t('working') + ' ' + sec + ' ' + t('sec_unit');
}

/** 开始计时（turn 开始时调用）。 */
function wkStart_(a) {
  if (!a) return;
  wkStart = Date.now();
  if (wkTimer) clearInterval(wkTimer);
  wkPaint(a);
  wkTimer = setInterval(() => wkPaint(a), 1000);
}

/** 停止计时并定格为最终用时；ms 缺省时用本地计时。 */
function stopSpin(a, ms) {
  if (!a) return;
  if (wkTimer) { clearInterval(wkTimer); wkTimer = 0; }
  const el = a.querySelector('.wk');
  if (el) {
    const total = ms != null ? ms : (wkStart ? Date.now() - wkStart : 0);
    el.classList.remove('on');
    el.classList.add('done');
    const tx = el.querySelector('.wtx');
    if (tx) tx.textContent = t('worked_done').replace('{t}', fmtDur(total));
  }
  wkStart = 0;
}

/**
 * 这条消息在存储里有下标吗？没有就别让编辑/重试/删除静默失效——
 * 给一句明确的提示，而不是把按钮做成灰的或者干脆不显示。
 */
function persisted(n) {
  if (n && n.dataset.mi !== undefined) return true;
  toast(busy
    ? (S.lang === 'zh' ? '这条消息还没落库，等这一轮结束再试' : 'This message is not stored yet — try again once the turn ends')
    : (S.lang === 'zh' ? '这条消息不在存储里（本轮可能没有产出内容）' : 'This message has no stored copy (the turn may have produced nothing)'));
  return false;
}

/**
 * 未落库的「尾部空泡」能推导出一个虚拟删除起点：它之前最近一个已打标
 * 节点的 miEnd，且两者之间不得再夹已打标节点（否则不是纯空尾巴，返回
 * null 走原有提示）。典型场景：模型返回空响应 / 中途失败留下的空气泡
 * ——它们永远不会落库，但删除 / 重新生成仍应可用，范围就是「最后一条
 * 已落库消息之后到末尾」。
 */
function tailVirtualFrom(el) {
  if (!el || !conv || !conv.id || busy) return null;
  let p = el.previousElementSibling;
  while (p && !(p.dataset && p.dataset.mi != null)) p = p.previousElementSibling;
  if (!p || p.dataset.miEnd == null || p.dataset.miEnd === 'null') return null;
  for (let n = p.nextElementSibling; n && n !== el; n = n.nextElementSibling) {
    if (n.dataset && n.dataset.mi != null) return null;
  }
  // el 之后也必须全部未打标：虚拟范围是「到末尾」，后面若还有已落库的
  // 气泡，范围会吞掉它们在存储里的内容，DOM 却把节点留下——绝不允许。
  for (let n = el.nextElementSibling; n; n = n.nextElementSibling) {
    if (n.dataset && n.dataset.mi != null) return null;
  }
  const from = +p.dataset.miEnd;
  return isFinite(from) ? from : null;
}

function setActs(a, on) {
  const ac = a.querySelector('.acts');
  if (ac) ac.classList.toggle('show', on);
  // 时间只在回答结束后出现：实时气泡先藏着，收尾时补上并显形
  const ts = a.querySelector('.ts');
  if (on && ts) {
    if (!ts.textContent) ts.textContent = fmtWhen(Date.now());
    ts.classList.remove('hide');
  }
}

function fmtDur(ms) {  const s = Math.max(1, Math.round(ms / 1000));
  const m = Math.floor(s / 60), r = s % 60;
  return m ? t('dur_m').replace('{n}', m) + ' ' + t('dur_s').replace('{n}', r) : t('dur_s').replace('{n}', s);
}

/** Byte size in a short human form (B / KB / MB). */
function fmtBytes(n) {
  n = +n || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1024 / 1024).toFixed(n < 1024 * 1024 * 10 ? 1 : 0) + ' MB';
}

/**
 * Finalise a thinking block: stop the shimmer and stamp the elapsed time.
 * Must run whenever a block closes — otherwise every earlier block keeps
 * showing "思考中…" and their shimmer animations stack up at different phases,
 * which reads as the highlight sweeping in odd half-passes.
 */
function finishThink(el) {
  if (!el || el.dataset.done === '1') return;
  el.dataset.done = '1';
  el.classList.remove('open');
  const shim = el.querySelector('.shim');
  const sec = thinkStart ? Math.max(1, Math.round((Date.now() - thinkStart) / 1000)) : 1;
  if (shim) {
    shim.className = '';
    shim.textContent = t('thought').replace('{n}', sec);
  }
}

/**
 * 这次收尾能不能折叠「过程」？
 *
 * 正文与过程（思考块/工具卡/工具运行组）的相对顺序有没有被改动过？只要模型
 * 在工具之间说过话（正文先于某个过程节点出现），reconcileTail 的「删正文重渲染」
 * 就会改变时序：原来的「正文 → 工具 → 正文」变成「工具 + 正文」，中断时尤其刺眼。
 * 只有气泡第一个内容节点就是过程节点时，校正才不改变顺序，才允许做。
 */
function foldSafe(a) {
  const ab = a && a.querySelector('.ab');
  if (!ab) return false;
  const kids = [...ab.children];
  // 错误行 / 压缩提示是内联带色的提示，不算正文，也不该影响判断。
  const main = kids.filter(k => !(k.style && k.style.color));
  const proc = main.filter(k =>
    k.classList.contains('ec') || k.classList.contains('th') || k.classList.contains('tgrp'));
  if (!proc.length) return true;      // 本轮没有过程节点：校正无事可做，允许走存储校正
  return main[0] === proc[0];         // 只有过程先行时，校正才不改变时序
}

/* ---- 工具运行组：同一气泡内连续的工具卡折叠为一行可展开统计 ----
 *
 * 对标 ZCode 的 ConsecutiveSummaryGroup（packages/ui/src/ToolCallBlocks/
 * ToolSummaryRow.tsx + v4/conversationAssistantWorkItems.ts）：
 *  - 正文、思考块、问答卡、等待授权的卡都是「边界」，边界之间的连续工具卡
 *    （≥2 张）收进一个 .tgrp 组壳 —— 组头是「已运行N条命令，调用M个工具」，
 *    点击展开原始卡片；单卡不成组，保持原样。
 *  - 组是本轮尾组且 turn 仍在生成时，组头退成最新工具的滚动预览（shimmer
 *    呼吸），收尾（turn.end / 后面来了正文）后回到统计文案；展开态永远显示统计。
 *  - 思考块保持边界地位：toolThink 开启时工具间的思考仍然直接可见，不被吞进组。
 *  - 全程幂等：结构与文案都无变化时零 DOM 写入，MutationObserver 的回环
 *    自然终止。观察者挂主对话流 feed 上，覆盖流式插入、历史回放、删除、
 *    重生成等所有路径，无需在每个渲染点手工调用。
 */

function tgBoundary(el) {
  const c = el.classList;
  if (c.contains('th')) return true;      // 思考块：保持「工具间思考」开关语义
  if (!c.contains('ec')) return true;     // 正文 / steerline / 错误行 / 压缩提示等
  // 需要用户交互的卡片永不折叠：问答卡、正在等待授权的卡
  if (el.dataset.tool === 'ask_user') return true;
  if (el.dataset.st === 'wait') return true;
  if (el.querySelector(':scope > .pm > *')) return true;
  return false;
}

function tgIsCmd(el) {
  const t = el.dataset.tool || '';
  return t === 'bash' || t === 'shell';
}

/** 组头统计文案：「已运行N条命令，调用M个工具」，零项部分省略。 */
function tgStats(cards) {
  const zh = S.lang === 'zh';
  let cmd = 0;
  for (const c of cards) if (tgIsCmd(c)) cmd++;
  const tool = cards.length - cmd;
  const parts = [];
  if (cmd) parts.push(zh
    ? '已运行' + cmd + '条命令'
    : (cmd === 1 ? 'Ran 1 command' : 'Ran ' + cmd + ' commands'));
  if (tool) parts.push(zh
    ? '调用' + tool + '个工具'
    : (tool === 1 ? 'called 1 tool' : 'called ' + tool + ' tools'));
  return parts.join(zh ? '，' : ', ');
}

/** 预览选取：最后一张仍在运行的卡，退化到最后一张。 */
function tgActiveCard(cards) {
  for (let i = cards.length - 1; i >= 0; i--) {
    const st = cards[i].querySelector('.st-tx');
    if (st && st.classList.contains('run')) return cards[i];
  }
  return cards[cards.length - 1];
}

/** 展开的组体粘底跟随：只有原本就在底部时才跟随新内容，用户上翻不抢滚动。 */
function tgFollow(bin) {
  const atBottom = bin.scrollHeight - bin.scrollTop - bin.clientHeight < 48;
  if (atBottom) bin.scrollTop = bin.scrollHeight;
}

/** 刷新组头：运行中（收起态）显示滚动预览，其余显示统计。只写有变化的部分。 */
function tgPaint(g) {
  const bin = g.querySelector('.tgrp-bin');
  const cards = [...bin.children];
  if (!cards.length) return;
  const head = g.querySelector('.tgrp-h');
  const icEl = head.querySelector('.tgrp-ic');
  const k = cards.some(tgIsCmd) ? 'terminal' : (TOOL_ICON[cards[0].dataset.tool] || 'file');
  if (icEl.dataset.k !== k) { icEl.dataset.k = k; icEl.innerHTML = ic(k); }
  const tx = head.querySelector('.tgrp-tx');
  const running = busy && g.parentNode && g === g.parentNode.lastElementChild;
  let want;
  if (running && !g.classList.contains('open')) {
    const act = tgActiveCard(cards);
    const fi = act.querySelector('.fi b');
    want = (fi && fi.textContent) || act.dataset.desc || act.dataset.tool || '';
    tx.classList.add('shim');
  } else {
    want = tgStats(cards);
    tx.classList.remove('shim');
  }
  if (tx.textContent !== want) tx.textContent = want;
}

/**
 * 把一个气泡的连续工具卡折叠成组。四阶段：
 * A 组内出现了边界卡（授权请求复用旧卡把 st 置成 wait 等）→ 整组按原顺序拆回；
 * B 子节点读成逻辑序列（组壳展开成成员卡，与裸卡、边界混排成段）；
 * C ≥2 卡的段落聚合进组壳（复用旧壳保持展开态），单卡段落还原为裸卡；
 * D 刷新组头文案。返回是否有 DOM 变化（false = 本轮零写入）。
 */
function compactToolRuns(ab) {
  let changed = false;
  for (const g of [...ab.children]) {
    if (!g.classList.contains('tgrp')) continue;
    const kids = [...g.querySelector('.tgrp-bin').children];
    if (!kids.some(tgBoundary)) continue;
    for (const card of kids) ab.insertBefore(card, g);
    g.remove();
    changed = true;
  }
  const runs = [];
  const pushCard = (card, g) => {
    const last = runs[runs.length - 1];
    if (last && last.cards) {
      last.cards.push(card);
      if (g && last.gs.indexOf(g) < 0) last.gs.push(g);
    } else {
      runs.push({ cards: [card], gs: g ? [g] : [] });
    }
  };
  for (const el of [...ab.children]) {
    if (el.classList.contains('tgrp')) {
      const bin = el.querySelector('.tgrp-bin');
      const cards = [...bin.children];
      if (cards.length < 2) {
        // 组退化成单卡/空组：拆壳还原，随后按新邻居重新聚合
        for (const card of cards) ab.insertBefore(card, el);
        el.remove();
        changed = true;
        for (const card of cards) pushCard(card, null);
        continue;
      }
      for (const card of cards) pushCard(card, el);
    } else if (!tgBoundary(el)) {
      pushCard(el, null);
    } else {
      runs.push({ b: el });
    }
  }
  for (const run of runs) {
    if (!run.cards) continue;
    const g0 = run.gs[0];
    const anchor = g0 && g0.querySelector('.tgrp-bin').contains(run.cards[0])
      ? g0 : run.cards[0];
    if (run.cards.length >= 2) {
      let g = g0;
      if (!g) {
        g = document.createElement('div');
        g.className = 'tgrp';
        g.innerHTML = '<button class="tgrp-h" type="button"><span class="tgrp-ic"></span>' +
          '<span class="tgrp-tx"></span>' + ic('chev') + '</button>' +
          '<div class="tgrp-b"><div><div class="tgrp-bin"></div></div></div>';
        g.querySelector('.tgrp-h').onclick = () => {
          g.classList.toggle('open');
          if (g.classList.contains('open')) {
            const bin = g.querySelector('.tgrp-bin');
            bin.scrollTop = bin.scrollHeight;
          }
        };
        ab.insertBefore(g, anchor);
        changed = true;
      } else if (g !== anchor && g.nextElementSibling !== anchor) {
        // 组壳必须位于整段首卡之前，否则视觉顺序与运行顺序不一致
        ab.insertBefore(g, anchor);
        changed = true;
      }
      const bin = g.querySelector('.tgrp-bin');
      const binCards = [...bin.children];
      const sameOrder = binCards.length === run.cards.length &&
        binCards.every((c, i) => c === run.cards[i]);
      if (!sameOrder) {
        for (const card of run.cards) {
          bin.append(card);
          tgFollow(bin);
        }
        changed = true;
      }
      for (let i = 1; i < run.gs.length; i++) { run.gs[i].remove(); changed = true; }
    } else if (g0) {
      ab.insertBefore(run.cards[0], g0);
      g0.remove();
      changed = true;
    }
  }
  for (const g of ab.children) {
    if (g.classList.contains('tgrp')) tgPaint(g);
  }
  return changed;
}

/** 主对话流的所有气泡跑一遍折叠；侧聊、团队面板等其他容器不受影响。 */
function tgCompactAll() {
  if (!feed) return;
  for (const ab of feed.querySelectorAll(':scope > .a > .ab')) compactToolRuns(ab);
}

let tgTimer = 0;
function tgSchedule() {
  if (tgTimer) return;
  tgTimer = setTimeout(() => { tgTimer = 0; tgCompactAll(); }, 60);
}

// 卡片插入/删除/授权状态变化最终都会落到 feed 的 DOM 上，观察者统一兜底；
// 折叠自身的移动也会触发回调，但那一轮结构与文案都无变化、零写入，循环终止。
new MutationObserver(tgSchedule).observe(feed, { childList: true, subtree: true });

/* ---------------------------------------------------------------- tool cards */
const TOOL_ICON = {
  read_file:'file', write_file:'edit', edit_file:'edit', list_dir:'folder',
  glob:'search', grep:'search', bash:'terminal', todo_write:'plan',
  ask_user:'ask', web_fetch:'globe', web_search:'search',
  computer_screenshot:'globe', computer_axtree:'search', computer_click:'globe',
  computer_type:'edit', computer_key:'terminal', computer_scroll:'globe',
  computer_navigate:'globe',
  // 智能体团队
  spawn_agent:'user', agent_list:'user', agent_wait:'clock', agent_interrupt:'stop',
  team_task_create:'plan', team_task_list:'plan', team_task_get:'plan', team_task_update:'plan'
};

function toolCard(host, callId, tool, title) {
  const e = document.createElement('div');
  e.className = 'ec msg collapsed';
  e.dataset.call = callId || '';
  e.dataset.tool = tool || '';
  const icon = TOOL_ICON[tool] || 'file';
  e.innerHTML =
    '<div class="eh">' +
      '<span class="st-ic">' + ic(icon) + '</span>' +
      '<span class="st-tx"></span>' +
      '<span class="fi"><b></b></span>' +
      '<span class="diff"></span>' +
      '<span class="ech">' + ic('chev') + '</span>' +
    '</div>' +
    '<div class="dc"><div class="dc-in"></div></div>' +
    '<div class="pm"></div>';
  e.querySelector('.eh').onclick = () => e.classList.toggle('collapsed');
  e.dataset.desc = title || tool || '';
  e.querySelector('.fi b').textContent = e.dataset.desc;
  e.querySelector('.st-tx').textContent = runLabel('run', tool);
  e.querySelector('.st-tx').classList.add('run');
  host.append(e);
  return e;
}

function labelFor(d, tool) {
  if (tool === 'web_search') return t('searched');
  if (tool === 'web_fetch') return t('fetched');
  // 团队工具：状态词比通用的「结果」更贴切
  if (tool === 'spawn_agent') return t('agent_spawned');
  if (tool === 'agent_wait') return t('agent_waited');
  if (tool === 'agent_list') return t('agent_listed');
  if (tool === 'agent_interrupt') return t('agent_stopped');
  if (tool === 'team_task_create') return t('task_created');
  if (tool === 'team_task_list') return t('task_listed');
  if (tool === 'team_task_get') return t('task_read');
  if (tool === 'team_task_update') return t('task_updated');
  if (d && d.kind === 'read') return t('rd');
  if (d && d.kind === 'diff') return t('ed');
  if (d && d.kind === 'shell') return 'shell';
  if (d && d.kind === 'ask') return t('ask_label');
  if (d && d.kind === 'todo') return t('plan_label');
  // plain / 未知类型统一显示「结果」，不再误标成「已编辑」
  return t('done_label');
}

function fillToolCard(e, display, ok, title) {
  if (!e) return;
  const stTx = e.querySelector('.st-tx');
  const diff = e.querySelector('.diff');
  const body = e.querySelector('.dc-in');
  const fi = e.querySelector('.fi b');
  // Cap the header: a card title carrying an error or a long path blows the
  // row apart. The full text is always available in the expanded body.
  const cap = s => {
    s = String(s == null ? '' : s);
    return s.length > 72 ? s.slice(0, 72) + '…' : s;
  };
  // Web tools' stored titles already begin with the verb ("Fetched …",
  // "Searched …") — drop it so the row reads label + subject, not the verb twice.
  const desc = e.dataset.desc || (title ? String(title).replace(/^(Fetched|Searched)\s+/, '') : '');
  if (desc) fi.textContent = cap(desc);
  const toolName = e.dataset.tool || '';
  stTx.classList.remove('run');
  if (ok === false) {
    stTx.textContent = runLabel('err', toolName);
    stTx.style.color = '#f87171';
  } else {
    stTx.textContent = runLabel('done', toolName);
    stTx.style.color = '';
  }
  body.innerHTML = '';
  diff.innerHTML = '';
  // 问答结果到达时撤掉输入面板；否则超时/中断后旧输入框会一直留在卡片上。
  if (display && display.kind === 'ask' && typeof display.answered === 'boolean') {
    const pm = e.querySelector('.pm');
    if (pm) pm.innerHTML = '';
    e.dataset.st = '';
  }

  if (!display || !display.kind) return;
  if (display.kind === 'ask') {
    if (display.answered === true) stTx.textContent = t('q_answered');
    else if (display.answered === false) stTx.textContent = t('q_unanswered');
    else stTx.textContent = t('ask_label');
    stTx.classList.remove('run');
  }

  // 展开区第一行显示完整工具调用（bash 的完整命令在下面的 $ 行里）。
  // 但「内容即全部信息」的工具不重复贴参数：write/edit 的 diff、doc_* 的
  // 规格就是内容本体——write_file 的参数动辄几十 KB 转义文本，纯噪音。
  const argsLoud = display.kind !== 'shell' && display.kind !== 'diff' &&
    !toolName.startsWith('doc_') && e.dataset.args;
  if (argsLoud) {
    let pretty = e.dataset.args;
    try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch (err) {}
    const raw = document.createElement('div');
    raw.className = 'df rawargs';
    raw.textContent = toolName + '(' + pretty + ')';
    body.append(raw);
  }

  // 工具输出里的 emoji 也去掉（只影响显示）
  display = stripEmojiDeep(display);

  if (display.kind === 'read') {
    diff.textContent = t('rdn').replace('{n}', display.total || 0);
    const df = document.createElement('div');
    df.className = 'df';
    df.innerHTML = (display.lines || [])
      .map(l => '<div><i class="ln">' + l.n + '</i>' + esc(l.text) + '</div>')
      .join('');
    body.append(df);
  } else if (display.kind === 'diff') {
    diff.innerHTML = '<span class="add">+' + (display.added || 0) + '</span> <span class="del">-' + (display.removed || 0) + '</span>';
    const df = document.createElement('div');
    df.className = 'df';
    df.innerHTML = (display.lines || []).map(l => {
      const cls = l.sign === '+' ? 'ad' : l.sign === '-' ? 'rm' : '';
      const no = l.old != null ? l.old : (l.new != null ? l.new : '');
      return '<div class="' + cls + '"><i class="ln">' + no + '</i>' + esc(l.text) + '</div>';
    }).join('');
    body.append(df);
  } else if (display.kind === 'shell') {
    const pre = document.createElement('div');
    pre.className = 'df';
    pre.style.whiteSpace = 'pre-wrap';
    pre.textContent = '$ ' + display.command + '\n' + (display.stdout || '') +
      (display.stderr ? '\n[stderr]\n' + display.stderr : '');
    body.append(pre);
  } else if (display.kind === 'ask') {
    const d = document.createElement('div');
    d.className = 'df askcard';
    d.style.padding = '10px 12px';
    const q = document.createElement('div');
    q.className = 'qtext';
    q.textContent = display.question || '';
    d.append(q);
    const opts = (display.options || []).filter(o => String(o || '').trim());
    if (opts.length) {
      const row = document.createElement('div');
      row.className = 'qopts';
      opts.forEach(o => {
        const chip = document.createElement('span');
        chip.className = 'qopt ro';
        chip.textContent = o;
        row.append(chip);
      });
      d.append(row);
    }
    if (display.answered === true) {
      const ans = document.createElement('div');
      ans.className = 'qans';
      const b = document.createElement('b');
      b.textContent = t('your_answer');
      ans.append(b, document.createTextNode(display.answer || ''));
      d.append(ans);
    } else if (display.answered === false) {
      const none = document.createElement('div');
      none.className = 'qunans';
      none.textContent = t('q_unanswered');
      d.append(none);
    }
    body.append(d);
  } else if (display.kind === 'image') {
    diff.textContent = display.media_type === 'image/jpeg' ? 'jpeg' : 'png';
    const d = document.createElement('div');
    d.className = 'df';
    d.style.cssText = 'padding:0;background:#000';
    const img = document.createElement('img');
    img.src = 'data:' + (display.media_type || 'image/png') + ';base64,' + display.data;
    img.style.cssText = 'display:block;width:100%;height:auto;max-height:420px;object-fit:contain;margin:0 auto';
    img.alt = 'screenshot';
    d.append(img);
    body.append(d);
  } else if (display.kind === 'todo') {
    const items = display.todos || [];
    diff.textContent = items.length + ' items';
    const d = document.createElement('div');
    d.className = 'df';
    d.style.padding = '10px 12px';
    d.innerHTML = items.map(x =>
      '<div>' + (x.status === 'completed' ? '☑' : x.status === 'in_progress' ? '▶' : '☐') +
      ' ' + esc(x.content) + '</div>'
    ).join('');
    body.append(d);
  } else {
    const d = document.createElement('div');
    d.className = 'df';
    d.style.padding = '10px 12px';
    d.style.whiteSpace = 'pre-wrap';
    d.textContent = display.text || '';
    body.append(d);
  }
  // Cards stay collapsed: the header line carries the summary and clicking
  // expands. Auto-expanding every card is what produced the tall gaps.
}

/* ---------------------------------------------------------------- ask surface */
/** Bottom-composer takeover for ask_user. The tool card stays collapsed; the
 *  question lives in the composer, which grows vertically to fit it. Controls
 *  fade out while question/options fade in over the same .5s ease-in-out curve,
 *  then the whole animation reverses after the answer is submitted. */
const QBOX = { active: null, h0: 0, closing: false, timer: 0, queue: [] };

function qsReset(instant) {
  const box = $('#comp .box');
  const surf = $('#qsurf');
  if (!box || !surf) return;
  if (instant) {
    clearTimeout(QBOX.timer);
    QBOX.active = null;
    QBOX.closing = false;
    QBOX.queue.length = 0;
    surf.hidden = true;
    surf.classList.remove('show');
    surf.removeAttribute('style');
    box.classList.remove('qask', 'qrestore', 'qsnap');
    box.style.height = '';
    return;
  }
  if (!QBOX.active || QBOX.closing) return;
  // Only the first close request may schedule the restore. tool.result can
  // arrive right after the answer POST and would otherwise clear the pending
  // timer while `closing` is already true, leaving qrestore stuck forever.
  clearTimeout(QBOX.timer);
  QBOX.closing = true;
  surf.classList.remove('show');
  box.classList.add('qrestore');
  box.style.height = (QBOX.h0 || box.offsetHeight) + 'px';
  const dur = 500;
  QBOX.timer = setTimeout(() => {
    surf.hidden = true;
    surf.removeAttribute('style');
    box.classList.remove('qask', 'qrestore', 'qsnap');
    box.style.height = '';
    QBOX.active = null;
    QBOX.closing = false;
    if (QBOX.queue.length) {
      const next = QBOX.queue.shift();
      QBOX.timer = setTimeout(() => openAskSurface(next.ev, next.card, next.instant), dur);
    }
  }, dur);
}

function qsCloseFor(callId, instant) {
  if (QBOX.active === callId) qsReset(!!instant);
}

function openAskSurface(ev, card, instant) {
  // 同一条问题可能既来自恢复的存储，又来自尚未消费的 question 事件；
  // 已经在显示这一题时直接忽略重复请求，别把它排进下一题队列。
  if (QBOX.active === ev.callId) return;
  if (QBOX.active) {
    QBOX.queue.push({ ev, card, instant });
    return;
  }
  const box = $('#comp .box');
  const surf = $('#qsurf');
  const input = $('#qsf-in');
  const send = $('#qsf-send');
  const optsEl = $('#qsf-opts');
  if (!box || !surf || !input || !send || !optsEl) return;
  const snap = !!instant;

  QBOX.active = ev.callId;
  QBOX.closing = false;
  QBOX.h0 = box.offsetHeight;
  const opts = (ev.options || []).map(o => String(o == null ? '' : o).trim()).filter(Boolean);
  $('#qsf-kicker').textContent = t('q_wait');
  $('#qsf-hint').textContent = '';
  $('#qsf-q').textContent = ev.question || '';
  optsEl.innerHTML = '';
  let sending = false;

  const doSend = value => {
    if (sending) return;
    const val = String(value != null ? value : input.value).trim();
    if (!val) { toast(t('q_need')); input.focus(); return; }
    sending = true;
    input.disabled = true;
    send.disabled = true;
    api('/answer', { method: 'POST', body: { call_id: ev.callId, answer: val } })
      .then(r => {
        if (!r || !r.answered) {
          qsReset();
          toast(t('q_closed'));
          if (card) {
            card.querySelector('.st-tx').textContent = t('q_closed');
            card.classList.add('collapsed');
          }
          return;
        }
        qsReset();
        fillToolCard(card, {
          kind: 'ask', question: ev.question, options: opts,
          answer: val, answered: true
        }, true, ev.question);
        follow();
      })
      .catch(err => {
        sending = false;
        input.disabled = false;
        send.disabled = false;
        toast(err.message);
      });
  };

  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'qopt';
    b.dataset.qopt = String(i);
    b.textContent = o;
    b.onclick = e => { e.stopPropagation(); doSend(o); };
    optsEl.append(b);
  });
  send.textContent = t('send_answer');
  send.disabled = false;
  send.onclick = e => { e.stopPropagation(); doSend(); };
  input.value = '';
  input.disabled = false;
  input.placeholder = t('q_hint');
  input.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); doSend(); }
  };

  if (snap) box.classList.add('qsnap');
  surf.hidden = false;
  surf.classList.remove('show');
  box.classList.remove('qrestore');
  box.classList.add('qask');
  box.style.height = QBOX.h0 + 'px';
  void box.offsetHeight;
  const maxH = Math.max(240, Math.min(560, Math.round(innerHeight * .62)));
  surf.style.maxHeight = (maxH - 24) + 'px';
  const target = Math.min(maxH, Math.max(QBOX.h0, surf.scrollHeight + 24));
  box.style.height = target + 'px';
  if (snap) {
    surf.classList.add('show');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        box.classList.remove('qsnap');
        if (QBOX.active === ev.callId && !QBOX.closing) input.focus();
      });
    });
    return;
  }
  requestAnimationFrame(() => {
    if (QBOX.active === ev.callId) surf.classList.add('show');
  });
  setTimeout(() => {
    if (QBOX.active === ev.callId && !QBOX.closing) input.focus();
  }, 500);
}

/** Risk colour chip: shell/network/destructive red, write amber, readonly grey. */
function riskChip(risk) {
  const r = String(risk || '').toLowerCase();
  const cls = (r === 'destructive' || r === 'shell' || r === 'network') ? 'hi'
    : (r === 'write' ? 'md' : 'lo');
  return '<span class="riskchip ' + cls + '">' + esc(r || 'readonly') + '</span>';
}

/**
 * Show the permission panel on a tool card: tool / path / reason / risk /
 * diffPreview, plus a 300s countdown (the backend auto-denies after 300s and
 * emits permission.resolved; the panel closes itself on either signal).
 * `info` comes from a permission.request event ({callId, tool, path, risk,
 * reason, diffPreview}) or a GET /api/pending entry ({id, tool, ...}).
 */
function showPermPanel(e, callId, info) {
  if (!e) return;
  info = info || {};
  const pm = e.querySelector('.pm');
  let html = '<div class="pmwrap"><div class="pmin">' +
    '<div class="pmr"><span class="pmk">tool</span><code>' + esc(info.tool || '') + '</code>' + riskChip(info.risk) + '</div>';
  if (info.path) html += '<div class="pmr"><span class="pmk">path</span><code>' + esc(info.path) + '</code></div>';
  if (info.reason) html += '<div class="preason">' + esc(info.reason) + '</div>';
  if (info.diffPreview) html += '<pre class="pmdiff">' + esc(info.diffPreview) + '</pre>';
  html += '</div>' +
    '<div><span>' + esc(t('wp')) + ' · <b class="ptimer">300</b>s</span>' +
    '<button data-d="once">' + t('a1') + '</button>' +
    '<button data-d="always">' + t('aa') + '</button>' +
    '<button data-d="deny">' + t('dy') + '</button></div></div>';
  pm.innerHTML = html;
  e.dataset.st = 'wait';
  e.querySelector('.st-tx').textContent = t('wt');
  e.classList.remove('collapsed');
  // 倒计时：300s 与后端超时一致，到点先本地收起提示超时拒绝
  const clearTimer = () => { if (e._ptimer) { clearInterval(e._ptimer); e._ptimer = null; } };
  clearTimer();
  let left = 300;
  const timerEl = pm.querySelector('.ptimer');
  e._ptimer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearTimer();
      pm.innerHTML = '';
      if (e.dataset.st === 'wait') {
        e.dataset.st = '';
        e.querySelector('.st-tx').textContent = t('perm_timeout');
      }
    } else if (timerEl) timerEl.textContent = left;
  }, 1000);
  pm.querySelectorAll('button').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.dataset.d;
      api('/permission', { method: 'POST', body: { call_id: callId, decision: d } })
        .then(() => {
          clearTimer();
          pm.innerHTML = '';
          e.querySelector('.st-tx').textContent = d === 'deny' ? t('dnd') : t('perm_run');
        })
        .catch(err => toast(err.message));
    };
  });
}

function qLoad() {

function qEditRow(pid) {
  const p = PENDING.find(x => x.id === pid);

  const row = [...document.querySelectorAll('.qrow')].find(el => el.dataset.pid === pid);
  if (!p || !row) return;
  const z = S.lang === 'zh';

  row.innerHTML = '<span class="qtag ' + kind + '">' +

function qBind() {
  const list = $('#qlist');
  if (!list) return;
  list.addEventListener('click', ev => {
    const row = ev.target.closest('.qrow');
    if (!row || !conv || !conv.id) return;
    const pid = row.dataset.pid;
    if (ev.target.closest('[data-qedit]')) { qEditRow(pid); return; }
    if (ev.target.closest('[data-qcancel]')) { qRender(); return; }
    if (ev.target.closest('[data-qsave]')) {
      const val = (row.querySelector('textarea')?.value || '').trim();
      if (!val) return;
      api('/sessions/' + conv.id + '/pending/' + encodeURIComponent(pid), {
        method: 'PATCH', body: { text: val }
      }).then(r => {
        if (r && r.pending) PENDING = PENDING.map(p => p.id === pid ? r.pending : p);
        qRender();
      }).catch(e => toast(e.message));
      return;
    }
    if (ev.target.closest('[data-qdel]')) {
      api('/sessions/' + conv.id + '/pending/' + encodeURIComponent(pid), { method: 'DELETE' })
        .then(() => qLoad()).catch(e => toast(e.message));
    }
  });
}

/* Queue/steer a message while a turn is running. The text stays in the box
   until the server accepts it; a failed request never loses the draft. */
async function sendPending(q, atts, mode) {
  if (!conv || !conv.id) {
    toast(S.lang === 'zh' ? '首条消息还在建立会话，等它开始后再补充' : 'Wait for the first turn to create the session');
    return;
  }
  const sid = conv.id;
  const z = S.lang === 'zh';
  try {
    const res = await api('/chat', {
      method: 'POST',
      body: {
        session_id: sid,
        text: q,
        attachments: atts.filter(a => a.path).map(a => ({ path: a.path, name: a.name, size: a.size })),
        model: S.model,
        permission_mode: S.perm,
        thinking_level: Math.max(0, Math.min(3, +S.lvl || 0)),
        plan_mode: !!S.plan,
        delivery: mode
      }
    });
    if (!conv || conv.id !== sid) return;
    // Only now remove the accepted draft; anything typed during the request survives.
    const paths = new Set(atts.filter(a => a.path).map(a => a.path));
    ATTS = ATTS.filter(a => !paths.has(a.path));
    renderAtts();
    if (ta.value.trim() === q) { ta.value = ''; fit(); }
    sync();
    const actual = res && res.mode === 'steer' ? 'steer' : 'queue';
    toast(actual === 'steer'
      ? (z ? '已作为引导，等当前步骤结束后注入' : 'Queued as guidance for the next step')
      : (z ? '已加入队列，下一轮自动发送' : 'Added to the next-turn queue'));
    qLoad();
  } catch (e) {
    toast(e.message);
  }
}

/** Handle one server event. */
let sessRefreshAt = 0;   // 他会话事件触发侧边栏静默刷新的去抖时间戳
/** 每个会话的在途文本记账。后端只在每一步流结束时才把文本落库，切走后
 *  text.delta 被 conv 过滤丢弃——没有缓冲的话，切回来时正在生成的那段话
 *  就永远缺失（表现为「输出截断」）。规则：
 *  - text.delta 一律追加（活跃/后台会话都记）；
 *  - tool.result 在后端 fold+落库之后才发出，此刻缓冲里全是已入库内容，清零；
 *  - turn.end 时整个 turn 都已落库，整个缓冲删掉。
 *  于是缓冲里始终只剩「未落库的在途文本」，切回来补渲染不会重复也不会丢。 */
/**
 * 思考区最多显示 8 行；超出时固定看最新内容，并在顶部渐隐/阴影。
 * 放在 renderReasoning 之前，历史重放和实时流共用同一套开合逻辑。
 */
function fitThink(el) {
  if (!el) return;
  const body = el.querySelector('.thbody');
  if (!body) return;
  requestAnimationFrame(() => {
    // 用 max-height 判断，而不是 clientHeight：块刚展开时 grid 还在从 0fr
    // 过渡，clientHeight 会短暂接近 0，短内容会被误判成溢出并套上顶部阴影。
    const maxH = parseFloat(getComputedStyle(body).maxHeight || '0');
    const clipped = maxH > 0 && body.scrollHeight > maxH + 1;
    el.classList.toggle('clipped', clipped);
    if (clipped && el.classList.contains('open')) body.scrollTop = body.scrollHeight;
    // 滚动到顶时去掉顶部渐隐/阴影，让第一行完整可见；离开顶部再恢复。
    el.classList.toggle('top', body.scrollTop <= 1);
  });
}
function bindThink(el) {
  const head = el.querySelector('.thh');
  if (!head) return;
  head.onclick = () => {
    el.dataset.user = '1';
    el.classList.toggle('open');
    fitThink(el);
  };
  const body = el.querySelector('.thbody');
  if (body && !body._thinkScroll) {
    body._thinkScroll = true;
    body.addEventListener('scroll', () => {
      el.classList.toggle('top', body.scrollTop <= 1);
    }, { passive: true });
  }
}

/**
 * 渲染一段思考内容（实时流与切回重放共用）。
 */
function renderReasoning(text) {
  if (!curA) return;
  // 思考强度关掉时供应商仍然会吐 reasoning_content，实时路径已丢弃；重放
  // 路径也要一致，否则切回旧会话会凭空冒出一个个空思考块。
  if (S.lvl === 0 || S.think === false) return;
  // 工具调用之间的思考默认隐藏；首次工具调用前的思考仍然保留。
  if (S.toolThink === false && turnSawTool) return;
  if (!curThinkEl) {
    curThinkEl = document.createElement('div');
    curThinkEl.className = 'th open';
    curThinkEl.innerHTML = '<button class="thh"><span class="shim">' + t('thinking') + '</span>' +
      ic('chev') + '</button><div class="thb"><div class="thbody"></div></div>';
    const thinkEl = curThinkEl;
    bindThink(thinkEl);
    // Append at the current end of the body: reasoning that happens after a
    // tool call belongs visually after that card, not above every card.
    curA.querySelector('.ab').append(curThinkEl);
    if (!thinkStart) thinkStart = Date.now();
  }
  const body = curThinkEl.querySelector('.thbody');
  body.textContent = noEmoji((body.textContent || '') + (text || ''));
  fitThink(curThinkEl);
  follow();
}

/**
 * 重放一条在途事件（切走再切回来时用）。
 *
 * 只重建视图，不重新记账 —— 否则重放会再次写进 SHADOW，越滚越大。
 */
function replayEvent(ev) {
  if (!curA) return;
  switch (ev.type) {
    case 'reasoning.delta':
      renderReasoning(ev.text || '');
      break;
    case 'tool.call': {
      turnSawTool = true;
      finishThink(curThinkEl);
      curThinkEl = null;
      thinkStart = 0;
      curStream = null;
      const card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, ev.title || ev.tool);
      toolEls[ev.callId] = card;
      break;
    }
    case 'tool.result': {
      const card = toolEls[ev.callId];
      fillToolCard(card, ev.display, ev.ok, ev.title);
      break;
    }
    case 'tool.progress': {
      const card = toolEls[ev.callId];
      if (card && ev.chunk != null && ev.chunk !== '') {
        let pre = card.querySelector('.prog');
        if (!pre) {
          pre = document.createElement('pre');
          pre.className = 'prog';
          card.querySelector('.dc-in').append(pre);
        }
        pre.textContent = noEmoji((pre.textContent || '') + ev.chunk);
      }
      break;
    }
  }
}

const SHADOW = {};
/** 在途事件序列：思考块、工具卡片都记一份。切走再切回来时按序重放，
 *  思考过程与工具卡片才不会被截断。
 *  记账规则：
 *  - reasoning.delta 合并进同一条（连续思考块只是一段文本）；
 *  - tool.progress 每个 callId 只留最后一条（增量输出）；
 *  - text.delta 不进序列（正文由 sh.text 单独累加）。 */
function shadowPush(sid, ev) {
  const sh = (SHADOW[sid] ||= { text: '', events: [] });
  if (ev.type === 'text.delta') return;
  if (ev.type === 'step.persisted') {
    // 服务端刚把这一整步（thinking / tool_use / text）写进会话存储。
    // 从此刻起切回来只需从存储重建；再保留流事件就会和存储重画的内容重复。
    sh.events = [];
    sh.text = '';
    sh.persisted = true;
    return;
  }
  if (ev.type === 'tool.result') {
    // 工具结果不放进重放序列：结果本身会随 tool-result 批次落库，
    // 切回来由 openSession 从存储绘制。这里若清空 events 会早于
    // assistant 步落库，造成「切走再回来思考过程只剩一半」。
    return;
  }
  if (ev.type === 'reasoning.delta') {
    const last = sh.events[sh.events.length - 1];
    if (last && last.type === 'reasoning.delta') {
      last.text = (last.text || '') + (ev.text || '');
      return;
    }
    sh.events.push({ type: 'reasoning.delta', text: ev.text || '' });
    return;
  }
  if (ev.type === 'tool.progress') {
    const i = sh.events.findIndex(e => e.type === 'tool.progress' && e.callId === ev.callId);
    if (i >= 0) sh.events.splice(i, 1);
    sh.events.push(ev);
    return;
  }
  sh.events.push(ev);
}
/** 每个会话「turn 在途」标记：turn.start 置位、turn.end 清除。文本还没开始
 *  流时 SHADOW 里没有条目，切回来要靠它恢复流式 UI（否则 sig 还挂着 stop，
 *  后续正文字符会被逐字写入循环全部丢弃）。 */
const INFLIGHT = {};
/** 全局事件序号水位：SSE 事件带单调递增 seq，乱序/重复直接丢弃。 */
let lastSeq = 0;
// conv 未绑定（首条消息在途）期间闯入的他人会话：其事件全部丢弃直到绑定。
let ignoreSid = '';
/* ---------------------------------------------------------------- 合帧
   正文增量的处理原来是「每个 token → 写 DOM → 读 scrollHeight」。两次强制
   同步布局加上每字符一个 span，长回答下主线程会被彻底占满：页面定格、只有
   纯 CSS 的小球还在动，刷新也没用（刷新后重放同一段内容再卡一次）。改成
   一帧合并一次，同样的字符量成本降到十分之一。
   注意：这个队列必须和 sig 的「停止」语义配合——切会话时先 dropText()，
   否则旧会话的尾字符会落进新会话的气泡里。 */
let TXQ = '';
let TXRAF = 0;
function qText(chunk) {
  if (!chunk) return;
  TXQ += chunk;
  if (!TXRAF) TXRAF = requestAnimationFrame(flushText);
}
function flushText() {
  if (TXRAF) { cancelAnimationFrame(TXRAF); TXRAF = 0; }
  const b = TXQ;
  TXQ = '';
  if (!b) return;
  if (!curA) startTurnUI();
  if (!curStream) {
    const p = document.createElement('p');
    curA.querySelector('.ab').append(p);
    curStream = mkStream(p);
  }
  swrite(curStream, b, sig);
  follow();
}
function dropText() {
  TXQ = '';
  if (TXRAF) { cancelAnimationFrame(TXRAF); TXRAF = 0; }
}

/** 把整条消息里所有思考块收尾（不只是 curThinkEl）。 */
function finishAllThink(root) {
  const host = root || curA;
  if (host) host.querySelectorAll('.th').forEach(el => finishThink(el));
  curThinkEl = null;
  thinkStart = 0;
}

function dispatch(ev) {
  if (!ev || !ev.type) return;
  // seq 去重：hello 的 seq=0（falsy）始终放行；重连后在 onopen 里清零水位。
  if (ev.seq && ev.seq <= lastSeq) return;
  if (ev.seq) lastSeq = ev.seq;
  // 侧边栏先于一切会话过滤取事件：它的辅助对话是独立会话，主对话区的
  // 会话隔离不应该把它的事件吃掉。钩子只写侧边栏自己的标签。
  spOnEvent(ev);
  if (ignoreSid && ev.sessionId === ignoreSid) return;
  if (ev.type === 'turn.end') {
    INFLIGHT[ev.sessionId] = false;
    // 只丢「正在看的那个会话」的影子缓冲。别的会话结束时不删：切走期间如果
    // 落库失败或只落了一部分，回来还能从缓冲里补齐；旧代码无条件 delete，
    // 那段正文就永久消失，正是「切会话把思考过程截断」的一半原因。
    if (conv && conv.id === ev.sessionId) delete SHADOW[ev.sessionId];
    else if (SHADOW[ev.sessionId]) SHADOW[ev.sessionId].ended = true;
  }
  // 在途记录必须先于会话过滤：后台会话的增量也要进 SHADOW，切回去才能重放。
  if (ev.type === 'text.delta') {
    (SHADOW[ev.sessionId] ||= { text: '', events: [] }).text += (ev.text || '');
  } else if (ev.type === 'reasoning.delta' || ev.type === 'tool.call' ||
             ev.type === 'tool.result' || ev.type === 'tool.progress' ||
             ev.type === 'step.persisted') {
    // 记下在途事件序列：切走再切回来时按序重放，思考块与工具卡片才不会被截断。
    shadowPush(ev.sessionId, ev);
  }

  // 会话归属守卫：没有绑定会话时，只放行能“认领”的控制事件（session.start /
  // turn.start），正文、思考、工具事件必须先有确定的会话。以前 conv 为 null
  // 时整段过滤器是失效的，后台任务会在欢迎页凭空画出助手气泡。
  const sid = conv && conv.id;
  if (ev.sessionId && ev.sessionId !== sid) {
    if (!sid) {
      const claimable = ev.type === 'session.start' || ev.type === 'turn.start';
      const known = expectBubble && pendingSid && ev.sessionId === pendingSid;
      if (!claimable && !known) {
        if (ev.type === 'turn.end') INFLIGHT[ev.sessionId] = false;
        return;
      }
    } else {
      // 别的会话：turn.start/end 只用于刷新侧边栏，不能碰当前 DOM。
      if (ev.type === 'turn.start' || ev.type === 'turn.end') {
        if (ev.type === 'turn.start') INFLIGHT[ev.sessionId] = true;
        const now = Date.now();
        if (now - sessRefreshAt >= 3000) { sessRefreshAt = now; loadSessions(true); }
      }
      return;
    }
  }

  // 悬浮窗：后台终端的事件不带 sessionId，单独放行；其余只认当前会话。
  if (ev.type === 'term.start' || ev.type === 'term.end') dkEvent(ev);
  else if (conv && conv.id && ev.sessionId === conv.id) dkEvent(ev);

  switch (ev.type) {
    case 'hello':
      // 服务端重启后 seq 从 1 重新开始：旧水位会把新事件全判成重复。用 hello
      // 里的 latest 判断，必要时复位（回放的事件本身仍按 seq 去重）。
      if (ev.latest != null && ev.latest < lastSeq) lastSeq = 0;
      break;

    case 'session.start': {
      // 侧聊（辅助对话）自己开的会话：只让它出现在列表里，主对话区必须原样不动，
      // 否则点开侧聊就会把主对话顶成那个侧聊会话。
      if (ev.side) { loadSessions(true); break; }
      // 已是当前会话：只补标题，不重置 DOM。
      if (conv && conv.id === ev.sessionId) {
        if (!conv.title && ev.title) {
          conv.title = ev.title;
          $('#ttl').textContent = noEmoji(conv.title);
        }
        break;
      }
      // 只有本端刚发出首条消息、还在等会话绑定时才认领。欢迎页/空闲时后台
      // 定时任务开的会话只刷新侧栏，绝不能把主对话切走（旧代码无条件认领）。
      const mine = awaitingSession && !(conv && conv.id) &&
        (!pendingSid || ev.sessionId === pendingSid) && ev.sessionId !== ignoreSid;
      if (!mine) { loadSessions(true); break; }
      const prevT = conv && conv.title;
      conv = { id: ev.sessionId, title: prevT || ev.title || '', workspace: (conv && conv.workspace) || ev.workspace || '' };
      ignoreSid = '';
      awaitingSession = false;
      pendingSid = null;
      $('#ttl').textContent = noEmoji(conv.title || ev.title || '');
      addRc({ id: conv.id, t: conv.title || ev.title || '', ts: Date.now() });
      document.body.classList.add('chat');
      loadSessions(true);
      apply();
      break;
    }

    case 'turn.start':
      INFLIGHT[ev.sessionId] = true;
      if (conv && ev.sessionId === conv.id) {
        turnSawTool = false;
        busy = true;
        if (!sig) sig = { stop: false };
        // 新的一轮开始，上一轮遗留的停止标记必须失效。
        sig.stop = false;
        sync();
        qLoad();
      } else if (!conv || !conv.id) {
        // 新会话兜底绑定：session.start 丢失（断线重连、乱序）时在此认领 id。
        // 只认领文本与在途请求一致的 turn，防止并发定时任务被误绑；认领失败
        // 的一律标记 ignoreSid 丢弃其后续事件。
        const mine = awaitingSession && conv && !conv.id &&
          !!(ev.text || '').trim() && (ev.text || '') === (conv.pendingText || '');
        if (mine) {
          conv.id = ev.sessionId;
          ignoreSid = '';
          awaitingSession = false;
          pendingSid = null;
          busy = true;
          sig = { stop: false };
          addRc({ id: conv.id, t: conv.title || '', ts: Date.now() });
          loadSessions(true);
          sync();
        } else {
          // 还在等本端会话绑定时不能标 ignoreSid：这条很可能就是本端的 turn
          // （文本被模板/注入改写过，所以没匹配上）。标了之后它后面的事件会
          // 被整体丢弃，正文和收尾全没了。
          if (!awaitingSession) ignoreSid = ev.sessionId;
          const now = Date.now();
          if (now - sessRefreshAt >= 3000) { sessRefreshAt = now; loadSessions(true); }
          return;
        }
      } else {
        return;
      }
      // 非本端发起的 turn（定时投递、重试）靠事件里的 text 补用户气泡；
      // 重试的 text 为空，不画气泡。必须在 .a 之前画，顺序才是「问→答」。
      if (!expectBubble && (ev.text || '').trim()) uMsg(ev.text, null, []);
      expectBubble = false;
      if (!curA) startTurnUI();
      // 事件丢失自愈：开始轮询核对服务端的 turn 状态。
      startTurnProbe();
      break;

    case 'events.lost':
      // 服务端承认丢了事件（慢客户端被 broadcast 缓冲甩掉）。
      onEventsLost(ev);
      break;

    case 'reasoning.delta':
      // 思考强度设为「关闭」时，供应商仍会吐 reasoning_content；直接丢弃，
      // 不要造出一个既点不开又没内容的思考块。
      if (S.lvl === 0) break;
      renderReasoning(ev.text || '');
      break;

    case 'text.delta':
      // 正文开始 = 思考结束。这里必须把开着的思考块收尾，否则它的头部会
      // 一直显示「思考中…」，直到 turn.end 才有机会收——而 turn.end 可能
      // 因为断线根本收不到（这就是「回答结束还显示在思考中」的来源之一）。
      if (curThinkEl) { finishThink(curThinkEl); curThinkEl = null; thinkStart = 0; }
      curText += (ev.text || '');
      qText(ev.text || '');
      break;

    case 'tool.call':
      if (!curA) startTurnUI();
      {
        turnSawTool = true;
        // Close the current reasoning/text run so the next delta starts a fresh
        // block *after* this card. Otherwise every thought in the turn piles into
        // one block pinned at the top of the message.
        flushText();
        finishThink(curThinkEl);
        thinkStart = 0;
        curThinkEl = null;
        curStream = null;
        const desc = ev.desc || toolDesc(ev.tool, ev.args);
        const card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, desc);
        card.dataset.args = JSON.stringify(ev.args || {});
        toolEls[ev.callId] = card;
        follow();
      }
      break;

    case 'tool.result':
      {
        if (ev.display && ev.display.kind === 'ask') qsCloseFor(ev.callId);
        const card = toolEls[ev.callId];
        fillToolCard(card, ev.display, ev.ok, ev.title);
        follow();
      }
      break;

    case 'tool.progress':
      // bash 等长工具的 stdout 增量（{callId, chunk}）：懒建 pre 区块持续追加，
      // tool.result 到达时 fillToolCard 会整体重写卡片主体，进度区自然让位。
      {
        const card = toolEls[ev.callId];
        if (card && ev.chunk != null && ev.chunk !== '') {
          let pre = card.querySelector('.prog');
          if (!pre) {
            pre = document.createElement('div');
            pre.className = 'df prog';
            pre.style.cssText = 'white-space:pre-wrap;max-height:240px;overflow:auto';
            card.querySelector('.dc-in').append(pre);
          }
          pre.textContent += /\n$/.test(ev.chunk) ? ev.chunk : ev.chunk + '\n';
          pre.scrollTop = pre.scrollHeight;
          follow();
        }
      }
      break;

    case 'permission.request':
      {
        let card = toolEls[ev.callId];
        if (!card && curA) {
          card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, toolDesc(ev.tool, {}));
          toolEls[ev.callId] = card;
        }
        showPermPanel(card, ev.callId, ev);
        follow();
      }
      break;

    case 'permission.resolved':
      // {id, decision}：anywhere 决策（本端点按钮、超时自动拒绝）都要收面板
      {
        const card = toolEls[ev.id];
        if (card) {
          if (card._ptimer) { clearInterval(card._ptimer); card._ptimer = null; }
          const pm2 = card.querySelector('.pm');
          if (pm2) pm2.innerHTML = '';
          if (card.dataset.st === 'wait') {
            card.dataset.st = '';
            card.querySelector('.st-tx').textContent =
              ev.decision === 'deny' ? t('dnd') : t('perm_run');
          }
        }
      }
      break;

    case 'question':
      {
        let card = toolEls[ev.callId];
        if (!card && curA) {
          card = toolCard(curA.querySelector('.ab'), ev.callId, 'ask_user', ev.question);
          toolEls[ev.callId] = card;
        }
        if (card) {
          const opts = (ev.options || []).map(o => String(o == null ? '' : o).trim()).filter(Boolean);
          // 工具卡保持折叠；问答内容由底部输入框接管。
          fillToolCard(card, { kind:'ask', question: ev.question, options: opts }, true, ev.question);
          card.classList.add('collapsed');
          card.querySelector('.st-tx').textContent = t('q_wait');
          openAskSurface(ev, card);
        }
        follow();
      }
      break;

    case 'status':
      applyStatus(ev);
      break;

    case 'compaction':
      {
        // Surface compaction as a quiet inline notice above the reply.
        const n = ev.compacted || 0;
        const note = document.createElement('p');
        note.style.cssText = 'font:12px var(--sans);color:var(--fg2);margin:0 0 8px;opacity:.75';
        note.textContent = t('compacted').replace('{n}', n);
        if (curA) curA.querySelector('.ab').prepend(note);
      }
      break;

    case 'goal':
      // 目标状态变化（judge 判定、续跑、暂停）时刷新输入框上方的徽标
      refreshGoalBadge();
      break;

    case 'team.task':
    case 'team.mode':
      // 任务板变了：团队页开着就实时刷新
      if (pg === 'team') go('team', true);
      break;

    case 'subagent.start':
    case 'subagent.end':
      // 成员上下线：团队页开着就实时刷新名册
      if (pg === 'team') go('team', true);
      break;

    case 'pending.changed':
      if (conv && conv.id === ev.sessionId) {
        PENDING = ev.pending || [];
        qRender();
      }
      break;

    case 'pending.queued':
      qLoad();
      break;

    case 'queue.started':
      qLoad();
      break;

    case 'steer.drained':
      PENDING = PENDING.filter(p => p.id !== ev.pendingId);
      qRender();
      if (ev.text && curA) {
        const line = document.createElement('div');
        line.className = 'steerline';
        line.textContent = (S.lang === 'zh' ? '引导已注入：' : 'Guidance injected: ') + noEmoji(ev.text);
        curA.querySelector('.ab').append(line);
        follow();
      }
      break;

    case 'steer.fallback':
      qLoad();
      if (ev.items && ev.items.length) {
        toast(S.lang === 'zh' ? '当前轮已结束，引导已转入下一轮队列' : 'Turn ended; guidance moved to the next-turn queue');
      }
      break;

    case 'queue.error':
      qLoad();
      if (ev.message) toast(ev.message);
      break;

    case 'turn.end':
      flushText();
      if (curStream) sflush(curStream);
      // 收全部思考块，而不只是「当前那个」：切会话重放出来的块、历史遗留
      // 的块都在这里统一收尾，界面上不会再有第二个「思考中…」。
      finishAllThink(curA);
      stopTurnProbe();
      if (curA) {
        stopSpin(curA, ev.ms);
        setActs(curA, true);
        // 过程不再挪动 DOM（工具运行组就地折叠，由 MutationObserver 统一收拢）；
        // reconcileTail 会把正文删掉重追加，只在「顺序本来就等价」时才做。
        // 模型在工具之间说过话（或被中断时停在半路）就不动它，保留实时看到的
        // 交错顺序；刷新后由 openSession 按存储顺序重放，折叠结果一致。
        if (foldSafe(curA)) {
          // 以存储为准校正最终答案：流式期间任何丢失（切换会话、SSE 断连、
          // 渲染异常）都在这里兜底补齐，保证收尾视图与存储一致。
          reconcileTail();
        }
        // 空轮次兜底：模型零产出且错误事件丢失（或还没带上后端修复）时，
        // 气泡里什么都没有。补一行说明，别让用户对着一格空气猜。
        const abEmpty = curA.querySelector('.ab');
        if (abEmpty && !abEmpty.textContent.trim() && !abEmpty.querySelector('.ec,.th')) {
          const p = document.createElement('p');
          p.style.opacity = '.55';
          p.textContent = S.lang === 'zh'
            ? '（本轮模型没有返回内容——可能是上游异常，可点右下角重新生成重跑）'
            : '(The model returned no content this turn — click regenerate to retry)';
          abEmpty.append(p);
        }
      }
      busy = false;
      // 本轮已结束：后续（定时投递、重试）的 turn.start 必须能补画用户气泡，
      // 否则“后台任务在本会话跑”时会直接冒出没有提问的回答。
      expectBubble = false;
      sync();
      // 问答等待中若本轮被中断/结束，立即收回底部问答面板。
      if (QBOX.active && !QBOX.closing) qsReset(true);
      // 后台通知（设置 → 通用）：页面隐藏时 turn 结束弹系统通知
      if (S.notify && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(conv && conv.title ? conv.title : 'Parable', {
            body: S.lang === 'zh' ? '本轮已完成' : 'Turn finished',
            tag: 'parable-turn',
            silent: !S.notifySound,
          });
          if (S.notifySound) beep();
        } catch (e) {}
      }
      // 清掉本轮渲染状态：不清理的话下一轮 turn（定时投递、重试）会把回答
      // 续写进上一轮的气泡里，两段回答挤在一个消息中，存储却各归各。
      resetTurn();
      // 回填每条消息对应的存储下标（编辑 / 删除 / 重新生成都按它定位）。
      restamp();
      // agent 可能在本轮用 plugin_create 新增了斜杠命令；turn 结束后重拉一次，
      // 下一次输入框就能识别，不用刷新页面。
      loadPluginCmds();
      qLoad();
      break;

    case 'error':
      if (ev.message) {
        if (ev.fatal) {
          toast(ev.message);
          if (curA && curText.trim() === '') {
            const p = document.createElement('p');
            p.style.color = '#f87171';
            p.textContent = ev.message;
            curA.querySelector('.ab').append(p);
          }
        } else {
          const p = document.createElement('p');
          p.style.color = '#f87171';
          p.textContent = '⚠ ' + ev.message;
          if (curA) curA.querySelector('.ab').append(p);
        }
      }
      if (ev.fatal) { stopSpin(curA); busy = false; expectBubble = false; sync(); }
      break;
  }
}

/* ---------------------------------------------------------------- status bar */
const kfmt = v => {
  v = Number(v) || 0;
  return v < 1000 ? String(v) : (v / 1000).toFixed(v < 10000 ? 1 : 0) + 'K';
};

/** ms → 人类可读时长（毫秒 / 秒 / 分秒），用于模型用时、TTFT 等统计。 */
function fmtMs(ms) {
  ms = Number(ms) || 0;
  if (ms <= 0) return t('dur_s').replace('{n}', 0);
  if (ms < 1000) return ms + ' ' + t('u_ms');
  const s = ms / 1000;
  if (s < 60) return t('dur_s').replace('{n}', Math.round(s * 10) / 10);
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return t('dur_m').replace('{n}', m) + ' ' + t('dur_s').replace('{n}', r);
}

function applyStatus(ev) {
  const turns = ev.turns || 0, steps = ev.steps || 0, tps = ev.tps || 0;
  $('#sb-stats-tx').textContent = turns + ' ' + t('u_turns') + ' ' + steps + ' ' + t('u_steps') + ' · ' + tps + ' tok/s';
  $('#p-stats-top').textContent = turns + ' ' + t('u_turns') + ' ' + steps + ' ' + t('u_steps');
  $('#p-tps').textContent = tps + ' tok/s';
  // 真实计时字段（SSE status / turn.end 的 camelCase 字段）
  $('#p-model-ms').textContent = fmtMs(ev.modelMs || 0);
  $('#p-tool-ms').textContent = fmtMs(ev.toolMs || 0);
  $('#p-ttft').textContent = fmtMs(ev.ttftMs || 0);

  const tk = ev.tokens || {};
  const total = tk.total || 0;
  $('#sb-token-tx').textContent = kfmt(total) + ' tok · ' + t('cache_hit') + ' ' + (tk.cacheHit || 0) + '%';
  $('#p-token-top').textContent = total.toLocaleString() + ' tok';
  $('#p-cache-hit').textContent = (tk.cacheHit || 0) + '%';
  $('#p-uncached').textContent = (tk.uncached || 0).toLocaleString() + ' tok';
  $('#p-cache-read').textContent = (tk.cacheRead || 0).toLocaleString() + ' tok';
  $('#p-output').textContent = (tk.output || 0).toLocaleString() + ' tok';

  const cx = ev.context || {};
  const used = cx.used || 0, limit = cx.limit || 128000;
  const pct = limit ? Math.round((used / limit) * 100) : 0;
  $('#sb-ctx-tx').textContent = pct + '%';
  // 上下文告警色（设置 → Agent 行为 → 告警阈值）：状态栏百分号胶囊变色
  {
    const el = $('#sb-ctx-tx');
    if (el) {
      const warn = S.ctxWarnPct || 80;
      el.style.color = pct >= warn + 10 ? '#d4574c' : pct >= warn ? '#e0a03c' : '';
    }
  }
  $('#p-ctx-pct').textContent = pct + '%';
  $('#p-ctx-val').textContent = '~' + kfmt(used) + ' / ' + kfmt(limit);
  const denom = used || 1;
  $('#p-bar-sys').style.width = ((cx.system || 0) / denom * 100) + '%';
  $('#p-bar-tools').style.width = ((cx.tools || 0) / denom * 100) + '%';
  $('#p-bar-msgs').style.width = ((cx.messages || 0) / denom * 100) + '%';
  $('#p-sys').textContent = '~' + kfmt(cx.system || 0);
  $('#p-tools').textContent = '~' + kfmt(cx.tools || 0);
  $('#p-msgs').textContent = '~' + kfmt(cx.messages || 0);
}

/**

 * and `applyStatus` only overwrites them once a real `status` event arrives —
 * without this a fresh load shows fabricated usage.

  applyStatus({ turns: 0, steps: 0, tps: 0, tokens: {}, context: {} });
}
