<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#faf9f5;--side:#f5f4ed;--fg:#141413;--fg2:#73726c;--line:rgba(31,30,29,.14);--input:#fff;--bubble:#f0eee6;--hov:rgba(31,30,29,.06);--accent:#d97757;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;--serif:"Source Serif 4",ui-serif,Georgia,"Songti SC","Noto Serif CJK SC","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace;--chat:var(--serif);--fs:16px;--w:760px;--blur:8px;--sf:1.5;--cd:calc(.65s * var(--animd));--animd:1;--anim:1;--code-bg:#1e1e1e;--code-fg:#d4d4d4;--code-ln:#6b7280;--uch1:#0b7fff;--uch2:#1e8a3e;--uch3:#9e77ed;--uch4:#e03131;--uch5:#e07b00;--uch6:#0aa7a7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--side:#1f1e1d;--fg:#faf9f5;--fg2:#9c9a92;--line:rgba(222,220,209,.15);--input:#30302e;--bubble:#141413;--hov:rgba(222,220,209,.08);--uch1:#4099ff;--uch2:#46bf72;--uch3:#7b5ce5;--uch4:#ff5c5c;--uch5:#ff8a30;--uch6:#42c8c8}}
:root[data-theme="dark"]{--bg:#262624;--side:#1f1e1d;--fg:#faf9f5;--fg2:#9c9a92;--line:rgba(222,220,209,.15);--input:#30302e;--bubble:#141413;--hov:rgba(222,220,209,.08);--uch1:#4099ff;--uch2:#46bf72;--uch3:#7b5ce5;--uch4:#ff5c5c;--uch5:#ff8a30;--uch6:#42c8c8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);background:var(--side);color:var(--fg);overflow:hidden;transition:background-color calc(.6s * var(--animd)),color calc(.6s * var(--animd));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg{display:block}
#win{height:100%;display:flex;flex-direction:column}
#tb{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 14px;position:relative;user-select:none}
.ib{width:30px;height:30px;border:0;background:none;color:var(--fg2);border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd)),transform calc(.25s * var(--animd))}
.ib:hover{background:var(--hov);color:var(--fg)}.ib:active{transform:scale(.92)}.ib svg{width:18px;height:18px}
.ib.off{opacity:.4;pointer-events:none}
.tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--hov);border-radius:10px;padding:3px;gap:2px}
.tabs b{font-weight:500;padding:4px 16px;border-radius:8px;color:var(--fg2);cursor:pointer;transition:background-color calc(.35s * var(--animd)),color calc(.35s * var(--animd)),box-shadow calc(.35s * var(--animd))}
.tabs b.on{color:var(--fg);background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#body{flex:1;display:flex;min-height:0}
#side{width:280px;flex:none;overflow:hidden;transition:width calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),transform calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1)}
#sin{width:280px;height:100%;display:flex;flex-direction:column;padding:4px 10px 10px;transition:opacity calc(.4s * var(--animd));position:relative}
body.sc #side{width:0}body.sc #sin{opacity:0}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd))}
.nav:hover{background:var(--hov)}.nav svg{width:18px;height:18px;color:var(--fg2)}
#setnav{margin-top:6px;padding-top:10px;border-top:.5px solid var(--line);border-radius:0 0 8px 8px}
.nav .np{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 -2px 0 -1px}.nav .np svg{color:#fff;width:14px;height:14px}
.sh{padding:18px 10px 6px;color:var(--fg2);font-size:12px}
#rcs{flex:1;overflow-y:auto;overflow-x:hidden}
.rcg{display:flex;flex-direction:column}
#rcp[hidden],#rca[hidden]{display:none}
.rch{padding:10px 10px 4px;color:var(--fg2);font-size:12px}
/* 入场用一次性 CSS animation。元素默认就是最终可见状态，动画只叠加一层
   位移+淡化，因此即使动画帧不推进（后台标签页），条目也照常显示。 */
.rc{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;overflow:hidden;cursor:pointer;transition:background-color calc(.2s * var(--animd)),height calc(.3s * var(--animd)) cubic-bezier(.4,0,.2,1),padding calc(.3s * var(--animd)) cubic-bezier(.4,0,.2,1)}
.rc.in{animation:rcIn calc(.55s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
@keyframes rcIn{from{opacity:.35;transform:translateX(-12px)}}
.rc:hover,.rc.on,.rc.menu{background:var(--hov)}
.rc.pin{box-shadow:inset 2px 0 0 var(--accent)}
.rc.arch{opacity:.55}
.rc .rci{display:none;width:14px;height:14px;flex:none;color:var(--fg2)}
.rc.pin .rci{display:block}
.rc .rci svg{width:14px;height:14px}
.rc .rct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 会话过多时的「加载更多」 */
.rcmore{display:block;width:calc(100% - 20px);margin:6px 10px 10px;padding:7px 10px;border:0;border-radius:8px;
  background:var(--hov);color:var(--fg2);font:12px var(--sans);cursor:pointer;
  transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.rcmore:hover{color:var(--fg)}
.rc.unread .rct{font-weight:600}
.rc .rcmeta{display:flex;align-items:center;gap:5px;flex:none;margin-left:auto}
.rc .rcdt{display:none;width:6px;height:6px;border-radius:50%;background:#e5534b}
.rc.unread .rcdt{display:block}
.rc .rcd{color:var(--fg2);font-size:11px;white-space:nowrap}
.rc.out{transform:translateX(120%);opacity:0}
.rc-in{width:100%;padding:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:0}
#cm{position:fixed;z-index:100;min-width:232px;max-width:290px;padding:5px;background:var(--input);color:var(--fg);border:.5px solid var(--line);border-radius:12px;box-shadow:0 18px 52px rgba(0,0,0,.3);opacity:0;transform:scale(.96);transform-origin:top left;pointer-events:none;transition:opacity calc(.16s * var(--animd)),transform calc(.2s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
#cm.open{opacity:1;transform:none;pointer-events:auto}
.cmi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font:13px var(--sans);line-height:1.25;cursor:pointer;white-space:nowrap;position:relative}
.cmi:hover{background:var(--hov)}
.cmi.dis{opacity:.38;pointer-events:none}
.cmi .arr{margin-left:auto;width:14px;height:14px;color:var(--fg2)}
.cmi.danger{color:#e5534b}
.cmi.danger:hover{background:color-mix(in srgb,#e5534b 16%,transparent)}
.csep{height:.5px;margin:5px 7px;background:var(--line)}
.cms{position:absolute;left:calc(100% + 4px);top:0;min-width:150px;padding:5px;background:var(--input);border:.5px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.24);display:none}
.cmi.sub:hover>.cms,.cmi.sub.subopen>.cms{display:block}
.pop{position:absolute;background:var(--input);border:.5px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 32px rgba(0,0,0,.14);opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom;pointer-events:none;transition:opacity calc(.25s * var(--animd)),transform calc(.4s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:40}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop.open>*{animation:miIn calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.pop.open>*:nth-child(2){animation-delay:calc(.03s * var(--animd))}.pop.open>*:nth-child(3){animation-delay:calc(.06s * var(--animd))}
.pop.open>*:nth-child(4){animation-delay:calc(.09s * var(--animd))}.pop.open>*:nth-child(5){animation-delay:calc(.12s * var(--animd))}
.pop.open>*:nth-child(6){animation-delay:calc(.15s * var(--animd))}.pop.open>*:nth-child(7){animation-delay:calc(.18s * var(--animd))}
@keyframes miIn{from{opacity:0;transform:translateY(-5px);filter:blur(3px)}}
.mi{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd)),transform calc(.25s * var(--animd)) cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.mi:hover{background:var(--hov)}.mi:active{transform:scale(.98)}
.mi small{display:block;color:var(--fg2);font-size:12px}.mi svg{width:16px;height:16px;color:var(--accent);flex:none}
#main{flex:1;position:relative;background:var(--bg);border-radius:12px 0 0 0;box-shadow:0 0 0 .5px var(--line);overflow:hidden;transition:background-color calc(.6s * var(--animd))}
#mh{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:4px;z-index:2;opacity:0;transition:opacity calc(.5s * var(--animd));pointer-events:none}
#ttl{max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
body.chat #mh{opacity:1}
#chat{position:absolute;inset:0;overflow-y:auto;padding:56px 20px calc(var(--ch,150px) + 8px);opacity:0;pointer-events:none;transition:opacity calc(.6s * var(--animd))}
body.chat #chat{opacity:1;pointer-events:auto}
/* 顶部渐隐蒙版：滚到标题下方的内容渐渐模糊、变暗融入背景，不再硬切 */
#main::after{content:'';position:absolute;top:0;left:0;right:0;height:52px;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,var(--bg) 0%,color-mix(in srgb,var(--bg) 62%,transparent) 62%,transparent 100%);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  -webkit-mask-image:linear-gradient(to bottom,#000 18%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 18%,transparent 100%)}
.col{max-width:var(--w);margin:0 auto}
.msg{animation:rise calc(.7s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(5px)}}
.u{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin:20px 0 8px}
.ub{background:var(--bubble);border-radius:14px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.55;transition:background-color calc(.6s * var(--animd))}
/* 消息操作条：位于消息下方、靠右，悬停时淡入 */
.macts{display:flex;gap:2px;justify-content:flex-end;align-items:center;opacity:0;transform:translateY(3px);transition:opacity calc(.25s * var(--animd)),transform calc(.3s * var(--animd));margin-top:2px;min-height:28px}
.u:hover .macts,.a:hover .macts,.macts:focus-within{opacity:1;transform:none}
.macts .ib{width:28px;height:28px}.macts .ib svg{width:15px;height:15px}
.macts .ib.danger:hover{color:#e5534b}
.uacts{display:flex;gap:1px;padding-top:3px;opacity:0;transform:translateY(2px);transition:opacity calc(.25s * var(--animd)),transform calc(.3s * var(--animd));flex:none}
.u:hover .uacts{opacity:1;transform:none}
.uacts .ib{width:26px;height:26px}.uacts .ib svg{width:15px;height:15px}
.uatt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.uatt .att{background:var(--input);border:.5px solid var(--line)}
.a{margin:14px 0 26px;font-family:var(--chat);font-size:var(--fs);line-height:1.7}
.ab p{margin:0 0 .9em}.ab ul{margin:0 0 .9em;padding-left:1.4em}.ab li{margin:.25em 0}
.ab strong{font-weight:600}
.ab code{font-family:var(--mono);font-size:.85em;background:var(--hov);border-radius:5px;padding:.1em .38em}
/* —— 块级 markdown —— */
.ab h1,.ab h2,.ab h3,.ab h4{margin:.55em 0 .4em;font-weight:600;line-height:1.35}
.ab h1{font-size:1.32em}.ab h2{font-size:1.18em}.ab h3{font-size:1.06em}.ab h4{font-size:1em}
.ab ol{margin:0 0 .9em;padding-left:1.5em}
.ab blockquote{margin:.4em 0 .9em;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.ab hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.ab table{border-collapse:collapse;margin:.4em 0 .9em;font-size:.92em;max-width:100%;display:block;overflow-x:auto}
.ab th,.ab td{border:1px solid var(--line);padding:5px 11px;text-align:left;vertical-align:top}
.ab th{background:var(--hov);font-weight:600;white-space:nowrap}
.ab tr:nth-child(even) td{background:color-mix(in srgb,var(--hov) 40%,transparent)}
.cb{border:.5px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 .9em;background:var(--side);transition:background-color calc(.6s * var(--animd))}
.ch2{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font:12px var(--sans);color:var(--fg2)}
.cbh{display:flex;gap:2px}
.cp{background:none;border:0;cursor:pointer;color:inherit;padding:3px 8px;border-radius:6px;font:12px var(--sans);transition:background-color calc(.2s * var(--animd))}.cp:hover{background:var(--hov)}
.cb pre{counter-reset:cl;margin:0;padding:4px 0 12px;overflow-x:auto;font:13.5px/1.6 var(--mono);color:var(--code-fg);background:var(--code-bg)}
.cb pre .cl{display:flex;counter-increment:cl;padding-right:14px}
.cb pre .cl::before{content:counter(cl);flex:none;width:2.6em;padding-right:1em;text-align:right;color:var(--code-ln);user-select:none}
.cb pre .cl>span{white-space:pre}
.cb pre.wrapit .cl>span{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.c{display:inline-block;white-space:pre;transform-origin:50% 60%;animation:pop var(--cd) cubic-bezier(.16,.84,.3,1) both}
.w{white-space:nowrap}
@keyframes pop{from{opacity:0;filter:blur(var(--blur));transform:scale(var(--sf))}to{opacity:1;filter:blur(0);transform:scale(1)}}
.th{margin:0 0 10px;font:14px var(--sans);color:var(--fg2)}
.thh{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:4px 0;color:inherit}
.thh svg{width:14px;height:14px;transition:transform calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1)}.th.open .thh svg{transform:rotate(180deg)}
.shim{background:linear-gradient(90deg,var(--fg2) 35%,var(--fg) 50%,var(--fg2) 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim calc(1.8s * var(--animd)) linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.thb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.45s * var(--animd))}
.th.open .thb{grid-template-rows:1fr;opacity:1}
.thb>div{overflow:hidden;border-left:2px solid var(--line);padding-left:12px;margin-left:4px;line-height:1.6}
.wf{margin:0 0 12px}
.wfh{display:flex;align-items:center;gap:5px;padding:3px 0;border:0;background:none;color:var(--fg2);font:13px var(--sans);cursor:pointer;transition:color calc(.2s * var(--animd))}
.wfh:hover{color:var(--fg)}
.wfh svg{width:14px;height:14px;transition:transform calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.wf.open .wfh svg{transform:rotate(180deg)}
.wfb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.45s * var(--animd))}
.wf.open .wfb{grid-template-rows:1fr;opacity:1}
.wfb>div{overflow:hidden}
.wfb .th{margin:8px 0 6px}
.wfb .ec{margin:6px 0}
/* agent 消息的操作条靠左（用户消息的 .macts 靠右） */
.arow{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-top:6px;min-height:30px}
/* /goal 持久目标徽标（输入框上方） */
#goalbar{display:none;align-items:center;gap:8px;margin:0 0 6px;padding:5px 10px;border:.5px solid var(--line);border-radius:9px;background:var(--side);font:12px var(--sans);color:var(--fg2);overflow:hidden;white-space:nowrap}
#goalbar.on{display:flex}
#goalbar .gdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
#goalbar.paused .gdot{background:#c9a227}#goalbar.complete .gdot{background:#3fa34d}
#goalbar b{color:var(--fg);font-weight:600;flex:none}
#goalbar .gt{overflow:hidden;text-overflow:ellipsis;flex:1}
#goalbar button{background:none;border:0;cursor:pointer;color:var(--fg2);font:12px var(--sans);padding:2px 7px;border-radius:6px;flex:none}
#goalbar button:hover{background:var(--hov);color:var(--fg)}
@keyframes spin{to{transform:rotate(360deg)}}
/* 生成中计时条（替代原 Claude 风格小球）：回答下方一行「工作中 x 秒」 */
.wk{display:flex;align-items:center;gap:7px;font:12px var(--sans);color:var(--fg2);margin-top:2px;
    opacity:0;transform:translateY(3px);
    transition:opacity calc(.4s * var(--animd)),transform calc(.4s * var(--animd))}
.wk.on{opacity:1;transform:none}
.wk .wd{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;
    animation:wdp calc(1.6s * var(--animd)) ease-in-out infinite}
@keyframes wdp{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.wk.done .wd{animation:none;opacity:.55;transform:none}
.acts{display:flex;gap:2px;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity calc(.5s * var(--animd)),transform calc(.5s * var(--animd))}
.acts.show{opacity:1;transform:none;pointer-events:auto}.acts .ib{width:28px;height:28px}.acts .ib svg{width:16px;height:16px}
.dn svg{transform:rotate(180deg)}
#comp{position:absolute;left:0;right:0;bottom:50%;transform:translateY(50%);padding:0 20px 14px;isolation:isolate;transition:bottom calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1),transform calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1)}
body.chat #comp{bottom:0;transform:none}
#comp::before{content:"";position:absolute;left:0;right:0;top:-26px;bottom:0;background:linear-gradient(transparent,var(--bg) 26px);opacity:0;transition:opacity calc(.6s * var(--animd));z-index:-1}
body.chat #comp::before{opacity:1}
.gr{display:flex;align-items:center;justify-content:center;gap:14px;font:400 40px/1.25 var(--serif);max-height:130px;margin-bottom:28px;overflow:hidden;transition:max-height calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.5s * var(--animd)),margin calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1)}
body.chat .gr{max-height:0;opacity:0;margin-bottom:0}
.box{position:relative;max-width:var(--w);margin:0 auto;background:var(--input);border:.5px solid var(--line);border-radius:20px;padding:14px 12px 10px 14px;box-shadow:0 4px 24px rgba(0,0,0,.05);transition:box-shadow calc(.4s * var(--animd)),border-color calc(.4s * var(--animd)),background-color calc(.6s * var(--animd))}
.box:focus-within{box-shadow:0 6px 32px rgba(0,0,0,.09);border-color:var(--fg2);border-color:color-mix(in srgb,var(--fg2) 45%,transparent)}
textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;color:inherit;font:16px/1.5 var(--sans);height:24px;max-height:200px;padding:0 4px}
textarea::placeholder{color:var(--fg2)}
.tools{display:flex;align-items:center;gap:2px;margin-top:8px}.tools .fl{flex:1}
.ms{display:flex;gap:4px;align-items:center;border:0;background:none;color:var(--fg2);padding:6px 8px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.ms:hover{background:var(--hov);color:var(--fg)}.ms svg{width:14px;height:14px}
/* 计划模式开启时的可见标识 */
#planflag{display:none;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:12px var(--sans);white-space:nowrap}
#mm{right:0;bottom:calc(100% + 6px);min-width:280px;transform-origin:bottom right}

@media(max-width:760px){#snav{width:auto;flex-direction:row;padding:12px;overflow-x:auto}#snav h3{display:none}#sback .sbx{display:none}.sgrp{display:none}.sphd{padding:22px 20px 4px}.spb{padding:14px 20px 40px}}

.sws button:hover{transform:scale(1.15)}.sws button.on{transform:scale(1.18);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg2)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tx{width:100%;background:var(--input);border:.5px solid var(--line);border-radius:9px;color:inherit;font:inherit;padding:8px 10px;outline:0;resize:vertical;transition:border-color calc(.3s * var(--animd))}.tx:focus{border-color:var(--accent)}

.tc:hover{transform:translateY(-2px)}.tc.on{border-color:var(--accent)}.tc i{display:block;height:52px;border-radius:7px;margin-bottom:6px;border:.5px solid var(--line)}

/* 审查面板 */
.spgit{padding:8px 0}
.spgf{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font:12.5px var(--mono)}
.spgf:hover{background:var(--hov)}
.spgf .st{flex:none;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font:700 10px var(--sans);color:#fff}
.spgf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.spgf.add .st{background:var(--uch2)}.spgf.mod .st{background:var(--uch3)}.spgf.del .st{background:var(--uch4)}.spgf.new .st{background:var(--uch5)}
.spdiff{margin:0 0 12px;border:.5px solid var(--line);border-radius:9px;overflow:hidden;font:12px/1.55 var(--mono)}
.spdiff .hh{padding:5px 11px;background:var(--hov);color:var(--fg2);font-size:11px}
.spdiff .dl{display:flex;padding:0 10px;white-space:pre-wrap;word-break:break-word}
.spdiff .dl .sg{flex:none;width:12px;color:var(--fg2)}
.spdiff .dl.p{background:color-mix(in srgb,var(--uch2) 14%,transparent)}
.spdiff .dl.p .sg{color:var(--uch2)}
.spdiff .dl.m{background:color-mix(in srgb,var(--uch4) 14%,transparent)}
.spdiff .dl.m .sg{color:var(--uch4)}
/* 终端面板 */
.spterm{padding:0;display:flex;flex-direction:column;height:100%}
.spterm .log{padding:10px 14px;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;flex:1;min-height:0;overflow:auto;color:var(--fg)}
.spterm .cmd{display:flex;gap:8px;align-items:center;padding:9px 12px;border-top:.5px solid var(--line);background:var(--bg)}
.spterm .cmd input{flex:1;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);font:12.5px var(--mono);outline:0}
.spterm .cmd input:focus{border-color:var(--fg2)}
.spterm .pr{color:var(--fg2);font:12px var(--mono);flex:none}
/* 浏览器面板 */
.spbrow{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.spbrow img{width:100%;border-radius:9px;border:.5px solid var(--line);display:block;background:var(--hov)}
.spbrow pre{margin:0;padding:10px;border-radius:9px;background:var(--hov);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
/* 辅助对话面板 */
.spsc{padding:0;display:flex;flex-direction:column;height:100%}
.spsc .msgs{flex:1;min-height:0;overflow:auto;padding:12px 12px 8px;font:13px/1.6 var(--sans)}
.spsc .m{margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.spsc .m.u{max-width:86%;background:var(--bubble);border-radius:12px;padding:6px 11px;margin-left:auto}
.spsc .m.a{color:var(--fg)}
.spsc .m.err{color:var(--uch4)}
.spsc .in{border-top:.5px solid var(--line);padding:9px 10px;display:flex;gap:8px;align-items:flex-end}
.spsc .in textarea{flex:1;min-width:0;resize:none;max-height:110px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--fg);font:13px var(--sans);outline:0}
.spsc .in textarea:focus{border-color:var(--fg2)}
.spsc .pm{padding:8px 12px;margin:0 12px 8px;border:.5px solid var(--line);border-radius:9px;background:var(--hov);font-size:12px}
.spsc .pm .cmd{font:12px var(--mono);word-break:break-all;margin-bottom:6px}
.spsc .pm button{border:1px solid var(--line);background:var(--input);color:var(--fg);border-radius:7px;padding:4px 10px;font:12px var(--sans);cursor:pointer;margin-right:6px}
.spsc .pm button:hover{background:var(--fg);color:var(--bg)}
@media(max-width:760px){#sdp{position:absolute;z-index:31;top:0;bottom:0;right:0;width:min(420px,100vw)!important;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.spmax #sdp{position:fixed;inset:46px 0 0 0;width:100vw!important}}

/* ============ 使用统计 ============ */
.ug{display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;padding:38px 44px 60px}
@media(max-width:760px){.ug{padding:22px 20px 40px}}
.ug-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.ug-h h2{margin:0;font:600 26px var(--serif)}
.ug-h p{margin:5px 0 0;color:var(--fg2);font-size:13px;line-height:1.5}
.ug-ha{display:flex;align-items:center;gap:8px;flex:none}
/* 顶部概览格 */
.ug-sum{display:grid;grid-template-columns:repeat(4,1fr);border:.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
@media(max-width:900px){.ug-sum{grid-template-columns:repeat(4,1fr)}}
@media(max-width:620px){.ug-sum{grid-template-columns:repeat(2,1fr)}}
.ug-sum>div{padding:18px 16px;text-align:center;border-left:.5px solid var(--line);border-top:.5px solid var(--line)}
.ug-sum>div:nth-child(4n+1){border-left:0}
.ug-sum>div:nth-child(-n+4){border-top:0}
@media(max-width:620px){
  .ug-sum>div:nth-child(4n+1){border-left:.5px solid var(--line)}
  .ug-sum>div:nth-child(2n+1){border-left:0}
  .ug-sum>div:nth-child(-n+4){border-top:.5px solid var(--line)}
  .ug-sum>div:nth-child(-n+2){border-top:0}
}
.ug-sum b{display:block;font:600 22px var(--serif);color:var(--fg);letter-spacing:-.01em}
.ug-sum span{display:block;margin-top:4px;color:var(--fg2);font-size:11.5px}
/* 常用模型 / 峰值时段：概览下方的两条高亮 */
.ug-hl{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:-6px;padding:12px 16px;border:.5px solid var(--line);border-radius:12px;background:var(--hov)}
.ug-hl-i{display:flex;align-items:baseline;gap:8px;min-width:0}
.ug-hl-i>span{color:var(--fg2);font:11.5px var(--sans);white-space:nowrap}
.ug-hl-i>b{font:500 13px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ug-hl-i>em{font-style:normal;font:11.5px var(--mono);color:var(--fg2);white-space:nowrap}
.ug-card{border:.5px solid var(--line);border-radius:14px;background:var(--bg);padding:18px 20px 20px}
.ug-card>h3{margin:0 0 14px;font:500 14px var(--sans);color:var(--fg)}
.ug-ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ug-ch h3{margin:0;font:500 14px var(--sans);color:var(--fg)}
/* 分段切换（复用 .seg） */
.ug-seg{display:flex;background:var(--hov);border-radius:9px;padding:3px;flex:none}
.ug-seg button{border:0;background:none;color:var(--fg2);border-radius:7px;padding:5px 12px;font:12px var(--sans);cursor:pointer;transition:background-color calc(.3s * var(--animd)),color calc(.3s * var(--animd))}
.ug-seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* 热力图 */
.ug-hm{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ug-hmw{display:flex;flex-direction:column;gap:3px;flex:none}
.ug-hmc{width:11px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--fg2) 12%,transparent)}
.ug-hmc.l1{background:color-mix(in srgb,var(--uch1) 30%,transparent)}
.ug-hmc.l2{background:color-mix(in srgb,var(--uch1) 50%,transparent)}
.ug-hmc.l3{background:color-mix(in srgb,var(--uch1) 72%,transparent)}
.ug-hmc.l4{background:var(--uch1)}
.ug-hmc.void{background:transparent}
.ug-hmm{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:3px;flex:1;min-width:520px}
.ug-hmm .ug-hmc{width:auto;aspect-ratio:1;height:auto}
.ug-hml{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:3px;margin-top:6px;flex:1;min-width:520px}
.ug-hml span{font-size:10px;color:var(--fg2);white-space:nowrap;overflow:hidden}
/* 图表 */
.ug-chart{width:100%;display:block;overflow:visible}
.ug-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}
.ug-lg{display:flex;align-items:center;gap:6px;font:12px var(--sans);color:var(--fg2)}
.ug-lg i{width:8px;height:8px;border-radius:50%;flex:none}
.ug-mu{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.ug-mu-l{flex:1;min-width:240px;display:flex;flex-direction:column;gap:9px}
.ug-mu-r{flex:1;min-width:240px;display:flex;flex-direction:column;gap:2px}
.ug-mu-i{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-bottom:.5px solid var(--line)}
.ug-mu-i:last-child{border-bottom:0}
.ug-mu-i i{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.ug-mu-i b{flex:1;font:12.5px var(--mono);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ug-mu-i em{font-style:normal;font:12px var(--sans);color:var(--fg2)}
.ug-mu-i span{font:11.5px var(--sans);color:var(--fg2);min-width:64px;text-align:right}
.ug-empty{padding:40px 0;text-align:center;color:var(--fg2);font-size:13px}
/* Token 构成：输入 / 输出 / 缓存读 / 缓存写 一条堆叠条 + 图例 */
.ug-comp{display:flex;flex-direction:column;gap:14px}
.ug-cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--hov)}
.ug-cbar i{display:block;height:100%;transition:width calc(.5s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-cbar i+i{box-shadow:-1px 0 0 var(--bg)}
.ug-cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px 18px}
.ug-cleg>div{display:flex;align-items:baseline;gap:7px;min-width:0}
.ug-cleg i{width:8px;height:8px;border-radius:2px;flex:none;align-self:center}
.ug-cleg b{font:12.5px var(--mono);color:var(--fg);font-weight:500}
.ug-cleg em{font-style:normal;font:11.5px var(--sans);color:var(--fg2);margin-left:auto;white-space:nowrap}
.ug-cleg span{font:11.5px var(--sans);color:var(--fg2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 活跃时段：24 小时柱状图 + 星期条 */
.ug-act{display:grid;grid-template-columns:1fr;gap:18px}
.ug-hours{display:flex;align-items:flex-end;gap:2px;height:96px;padding-bottom:2px;border-bottom:.5px solid var(--line)}
.ug-hour{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.ug-hour i{display:block;width:100%;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--uch1) 55%,transparent);
    transition:height calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1),background-color calc(.2s * var(--animd))}
.ug-hour:hover i{background:var(--uch1)}
.ug-hour.zero i{background:color-mix(in srgb,var(--fg2) 12%,transparent)}
.ug-hour b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;padding:2px 6px;border-radius:5px;
    background:var(--fg);color:var(--bg);font:10.5px var(--mono);white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity calc(.18s * var(--animd))}
.ug-hour:hover b{opacity:1}
.ug-haxis{display:flex;justify-content:space-between;margin-top:5px;color:var(--fg2);font:10.5px var(--mono)}
.ug-wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.ug-wday{text-align:center}
.ug-wday .b{height:7px;border-radius:4px;background:color-mix(in srgb,var(--uch1) 22%,transparent);overflow:hidden}
.ug-wday .b i{display:block;height:100%;border-radius:4px;background:var(--uch1);transition:width calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-wday span{display:block;margin-top:6px;color:var(--fg2);font:11px var(--sans)}
.ug-wday em{display:block;font:10.5px var(--mono);color:var(--fg2);font-style:normal;margin-top:2px}
/* 高活跃时段提示 */
.ug-peaks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)}
.ug-peak{display:flex;align-items:baseline;gap:7px;font:12px var(--sans);color:var(--fg2)}
.ug-peak b{font:500 12.5px var(--mono);color:var(--fg)}
.ug-peak em{font-style:normal;font:11px var(--mono);color:var(--fg2)}
/* 用量最高的会话 */
.ug-ts{display:flex;flex-direction:column;gap:1px}
.ug-ts-r{display:flex;align-items:center;gap:10px;padding:9px 8px;margin:0 -8px;border-radius:9px;cursor:pointer;
    transition:background-color calc(.2s * var(--animd))}
.ug-ts-r:hover{background:var(--hov)}
.ug-ts-r .rank{flex:none;width:20px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
.ug-ts-r .nm{flex:1;min-width:0}
.ug-ts-r .nm b{display:block;font:12.5px var(--sans);color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ug-ts-r .nm small{display:block;margin-top:2px;color:var(--fg2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ug-ts-r .bar{flex:none;width:110px;height:5px;border-radius:3px;background:var(--hov);overflow:hidden}
.ug-ts-r .bar i{display:block;height:100%;border-radius:3px;background:var(--uch1);transition:width calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
.ug-ts-r .val{flex:none;min-width:82px;text-align:right;font:11.5px var(--mono);color:var(--fg2)}
@media(max-width:700px){.ug-ts-r .bar{display:none}}

/* ============ 命令面板 ============ */
#cmdk{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;padding:11vh 20px 20px;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity calc(.32s * var(--animd)) ease,background-color calc(.32s * var(--animd)) ease,backdrop-filter calc(.32s * var(--animd)) ease}
#cmdk.open{display:flex;opacity:1;pointer-events:auto;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cmdb{width:min(600px,100%);background:var(--input);border:.5px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden;opacity:0;transform:translateY(-10px) scale(.98);transition:opacity calc(.3s * var(--animd)) ease,transform calc(.34s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
#cmdk.open .cmdb{opacity:1;transform:none}
.cmdin{width:100%;border:0;background:none;outline:0;color:var(--fg);font:16px var(--sans);padding:16px 18px;border-bottom:.5px solid var(--line)}
.cmdl{max-height:min(420px,52vh);overflow-y:auto;padding:6px}
/* 搜索结果逐条淡入（重渲染时先淡出再淡入） */
.cmdl .cmdi,.cmdl .cmdg,.cmdl .cmdempty{animation:cmdi calc(.34s * var(--animd)) ease both}
@keyframes cmdi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cmdl.out .cmdi,.cmdl.out .cmdg,.cmdl.out .cmdempty{animation:cmdo calc(.2s * var(--animd)) ease both}
@keyframes cmdo{from{opacity:1}to{opacity:0;transform:translateY(-3px)}}
.cmi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmi mark{background:transparent;color:var(--accent);font-weight:600}
.cms{display:block;font-size:11.5px;color:var(--fg2);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
/* 搜索跳转命中的消息：高亮一下 */
.msg.flash{animation:msgflash 1.6s ease}
@keyframes msgflash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:10px}
  70%{background:color-mix(in srgb,var(--accent) 12%,transparent)}100%{background:transparent}}
.cmdg{padding:8px 10px 4px;font-size:11.5px;color:var(--fg2);letter-spacing:.02em}
.cmdi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmdi:hover{background:var(--hov)}
.cmdi.on{background:var(--hov)}
.cmdi .ic2{width:20px;height:20px;display:grid;place-items:center;color:var(--fg2);flex:none}
.cmdi .ic2 svg{width:16px;height:16px}
.cmdi .tx2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdi .kb{flex:none;font:11px var(--mono);color:var(--fg2);border:.5px solid var(--line);border-radius:5px;padding:1px 6px}
.cmdempty{padding:28px;text-align:center;color:var(--fg2);font-size:13px}
.cmdf{padding:8px 14px;border-top:.5px solid var(--line);display:flex;gap:14px;color:var(--fg2);font-size:11.5px}
.cmdf b{font:11px var(--mono);border:.5px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}

/* ============ 斜杠菜单 ============ */
#sl{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--input);border:.5px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.22);padding:6px;display:none;max-height:284px;overflow-y:auto;z-index:20}
#sl.open{display:block}
#sl .cmdi{font-size:13px;padding:8px 10px}
#sl .kb{font:11px var(--mono);color:var(--fg2)}

/* ============ 附件 ============ */
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#atts:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--hov);border-radius:8px;padding:4px 8px;font:12.5px var(--sans);max-width:230px}
.att svg{width:14px;height:14px;color:var(--fg2);flex:none}
.att b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{cursor:pointer;color:var(--fg2);display:grid;place-items:center;border-radius:4px;padding:0 1px;font-size:13px;line-height:1}
.att .x:hover{color:var(--fg);background:var(--line)}
/* 图片附件的小缩略图（输入框 chip 与用户气泡共用） */
.att .attimg{width:18px;height:18px;border-radius:4px;object-fit:cover;flex:none}
.uatt .att .attimg{width:34px;height:34px;border-radius:6px}
.att.upl{opacity:.6}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-8px}

/* ============ 回到最新 ============ */
#jump{position:absolute;right:20px;bottom:calc(var(--ch,150px) + 16px);width:34px;height:34px;border-radius:50%;background:var(--input);border:.5px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.16);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity calc(.3s * var(--animd)),transform calc(.35s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:6;color:var(--fg2)}
#jump.on{opacity:1;pointer-events:auto;transform:none}
#jump:hover{color:var(--fg)}
#jump svg{width:17px;height:17px}

/* ============ 快捷键面板 ============ */
#kbd{position:fixed;inset:0;z-index:96;display:none;place-items:center;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#kbd.open{display:grid}
.kbdc{width:min(540px,92vw);background:var(--bg);border-radius:16px;padding:22px 24px 16px;box-shadow:0 24px 70px rgba(0,0,0,.34);animation:rise calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.kbdc h2{margin:0 0 4px;font:600 20px var(--serif)}
.kbdc p{margin:0 0 14px;color:var(--fg2);font-size:12.5px}
.kbr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:13.5px}
.kbr:last-child{border:0}
.kbr kbd{font:11.5px var(--mono);background:var(--hov);border:.5px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.kbdc .btn{margin-top:14px;width:100%}
</style>
</head>
<body>
<div id="win">
  <div id="tb">
    <button class="ib" id="tgl" data-ic="side"></button><button class="ib off" data-ic="back"></button><button class="ib off" data-ic="fwd"></button>
    <button class="ib" id="cmdbtn" data-ic="search" title="命令面板 Ctrl K"></button>
    <button class="ib" id="spbtn" data-ic="panel" title="侧边栏"></button>
  </div>
  <div id="body">
    <div id="scr"></div>
    <aside id="side"><div id="sin">
      <div class="nav" id="nc"><span class="np" data-ic="plus"></span><span data-i="new"></span></div>
      <div class="nav" data-pg="plugins"><span data-ic="plug"></span><span data-i="plugins"></span></div>
      <div class="nav" data-pg="auto"><span data-ic="clock"></span><span data-i="autom"></span></div>

 * 去掉 emoji（彩色表情与部分图形符号）。
 *
 * 界面要保持视觉统一：模型回复、工具输出、用户自己起的会话名里都可能带
 * emoji，它们与界面的字形体系格格不入。这里只影响**显示**，不改动存储
 * 的原文 —— 数据仍按原样保留。
 *
 * 覆盖：U+1F000–1FAFF（主要 emoji 区）、U+2600–27BF（杂项符号与 dingbat，
 * 含 ⚠ ✓ ✗ ★ 等）、U+2B00–2BFF、U+FE0F（emoji 变体选择符）、
 * U+1F1E6–1F1FF（区域指示符，国旗由两个组成）、U+E000–F8FF（私用区，
 * 部分 emoji 字体的补充平面）。
 */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{E000}-\u{F8FF}\u{200D}]/gu;
const noEmoji = s => String(s == null ? '' : s)
  .replace(EMOJI_RE, '')
  // 去掉 emoji 后留下的空档：收敛连续空格，并去掉行首/行尾空白
  .replace(/[ \t]{2,}/g, ' ')
  .replace(/^\s+|\s+$/gm, '');

/** 递归去掉对象里所有字符串的 emoji（用于工具卡片的 display 结构）。 */
function stripEmojiDeep(v) {
  if (typeof v === 'string') return noEmoji(v);
  if (Array.isArray(v)) return v.map(stripEmojiDeep);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) out[k] = stripEmojiDeep(v[k]);
    return out;
  }
  return v;
}

const TOKEN = window.__PARABLE_TOKEN
  || new URLSearchParams(location.search).get('token')
  || '';

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'X-Parable-Token': TOKEN }, opts.headers || {});
  let body = opts.body;
  if (body && typeof body !== 'string') {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers,
    body
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
  if (!res.ok) {
    const msg = (data && data.error) ? data.error : (res.status + ' ' + res.statusText);
    throw new Error(msg);
  }
  return data;
}

/* ---- 自写的确认框 --------------------------------------------------
   不用 window.confirm：浏览器原生弹窗在 WebView 里样式突兀、无法定制，
   还会阻塞整个渲染进程。改成页面内的一个居中弹层：背景高斯模糊，
   卡片淡入上浮，返回 Promise<boolean>。 */
function confirmBox(message, opts) {
  opts = opts || {};
  const z = S.lang === 'zh';
  const okText = opts.ok || (z ? '确定' : 'Confirm');
  const cancelText = opts.cancel || (z ? '取消' : 'Cancel');
  const wrap = $('#cfm');
  const box = wrap.querySelector('.cfmb');
  box.querySelector('.cfmt').textContent = message || '';
  const okBtn = box.querySelector('[data-cf="1"]');
  const cancelBtn = box.querySelector('[data-cf="0"]');
  okBtn.textContent = okText;
  cancelBtn.textContent = cancelText;
  okBtn.className = 'btn ' + (opts.danger === false ? '' : 'danger');
  cancelBtn.className = 'btn ghost';

  return new Promise(resolve => {
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      wrap.classList.remove('open');
      document.removeEventListener('keydown', onKey, true);
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      wrap.onclick = null;
      resolve(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); finish(true); }
    };
    okBtn.onclick = () => finish(true);
    cancelBtn.onclick = () => finish(false);
    // 点背景 = 取消
    wrap.onclick = e => { if (e.target === wrap) finish(false); };
    document.addEventListener('keydown', onKey, true);
    wrap.classList.add('open');
    // 焦点落在确认按钮上，回车直接确认
    setTimeout(() => okBtn.focus(), 60);
  });
}

document.addEventListener('click', e => {
  const x = e.target.closest('[data-toast]');
  if (x) toast(x.dataset.toast);
  const g = e.target.closest('[data-pg]');

let pg = null, gt = 0;
async function go(name, force) {
  const el = $('#pg'), my = ++gt;
  if (innerWidth < 760) document.body.classList.add('sc');
  if (!name) {
    el.classList.remove('sw');
    if (pg) { pg = null; el.classList.remove('on'); el.firstChild.className = ''; }
    return;
  }
  if (pg === name && !force) return;
  if (pg) { el.classList.add('sw'); await sleep(A(300)); if (my !== gt) return; }
  pg = name;
  if (name === 'plugins' || name === 'auto' || name === 'team') {
    el.firstChild.className = 'page';
    el.firstChild.innerHTML = '<div class="pload"></div>';
    el.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('sw')));
    const html = name === 'plugins' ? await renderPluginsPage()
      : name === 'auto' ? await renderAutoPage()
      : await renderTeamPage();
    if (my !== gt) return;
    el.firstChild.innerHTML = html;
    if (name === 'plugins') bindPluginsPage(el.firstChild);
    else if (name === 'auto') bindAutoPage(el.firstChild);
    else bindTeamPage(el.firstChild);
    return;
  }
  el.firstChild.className = '';
  const d = PG[S.lang][name] || PG.zh[name];
  el.firstChild.innerHTML = '<h2>' + d[0] + '</h2><p>' + d[1] + '</p>';
  el.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('sw')));
}

/* ---------------------------------------------------- 自动化（定时任务） */
function durLabel(s) {
  s = +s || 0;
  const z = S.lang === 'zh';
  if (s < 60) return s + (z ? ' 秒' : 's');
  if (s < 3600) return Math.round(s / 60) + (z ? ' 分' : 'm');
  return (s / 3600).toFixed(1).replace(/\.0$/, '') + (z ? ' 小时' : 'h');
}
function fmtDT(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString(S.lang === 'zh' ? 'zh-CN' : 'en', { hour12: false });
  } catch (e) { return iso; }
}
function taskTimingLabel(tm) {
  const z = S.lang === 'zh';
  if (!tm || !tm.kind) return '—';
  switch (tm.kind) {
    case 'every': return (z ? '每 ' : 'every ') + durLabel(tm.every_seconds);
    case 'after': return (z ? '' : 'in ') + durLabel(tm.after_seconds) + (z ? '后' : '');
    case 'at': return (z ? '于 ' : 'at ') + fmtDT(tm.at);
    case 'daily': return (z ? '每天 ' : 'daily ') + tm.time + ' · ' + (tm.timeZone || tm.time_zone || '');
    case 'weekly': return (z ? '每' : 'weekly ') + (tm.weekdays || []).join(',') + ' ' + tm.time;
    case 'cron': return 'cron ' + tm.expression;
    default: return tm.kind;
  }
}

async function renderAutoPage() {
  const z = S.lang === 'zh';
  let tasks = [];
  try { tasks = (await api('/schedule')).tasks || []; } catch (e) {}
  const rows = tasks.map(t => {
    const st = (t.status || 'active').toLowerCase();
    const stl = st === 'active' ? (z ? '运行中' : 'Active') : st === 'paused' ? (z ? '已暂停' : 'Paused') : (z ? '已结束' : 'Ended');
    return '<div class="taskrow col" data-id="' + esc(t.id) + '">' +
      '<div class="tk-top"><b class="tk-name">' + esc(t.name || t.id) + '</b>' +
        '<span class="tk-st ' + st + '">' + stl + '</span>' +
        '<div class="tk-acts">' +
          (st === 'active' ? '<button class="btn" data-act="pause">' + (z ? '暂停' : 'Pause') + '</button>' : '') +
          (st === 'paused' ? '<button class="btn" data-act="resume">' + (z ? '启用' : 'Resume') + '</button>' : '') +
          (st !== 'ended' ? '<button class="btn" data-act="run">' + (z ? '立即运行' : 'Run now') + '</button>' : '') +
          '<button class="btn danger" data-act="del">' + (z ? '删除' : 'Delete') + '</button>' +
        '</div>' +

function bindAutoPage(root) {
  const z = S.lang === 'zh';
  root.querySelectorAll('.taskrow').forEach(row => {
    const id = row.dataset.id;
    const pr = row.querySelector('.tk-prompt');
    if (pr) pr.onclick = e => {
      if (e.target.closest('button')) return;
      row.classList.toggle('open');
    };
    row.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = async () => {
        const act = b.dataset.act;
        // 删除任务不可恢复，先轻确认
        if (act === 'del' && !(await confirmBox(z ? '确定删除这个任务？' : 'Delete this task?'))) return;
        try {
          if (act === 'del') {
            await api('/schedule/' + id, { method: 'DELETE' });
          } else if (act === 'run') {
            await api('/schedule/' + id + '/run', { method: 'POST' });
            toast(z ? '已触发' : 'Triggered');
          } else {
            await api('/schedule/' + id, { method: 'PATCH', body: { action: act } });
          }
          if (act === 'del' || act !== 'run') go('auto', true);
        } catch (e) { toast(e.message); }
      };
    });
  });
  const kindSel = root.querySelector('#nt-kind');
  const timeInp = root.querySelector('#nt-time');
  const numInp = root.querySelector('#nt-num');
  const unitSel = root.querySelector('#nt-unit');
  const syncKind = () => {
    const isDaily = kindSel.value === 'daily';
    timeInp.style.display = isDaily ? '' : 'none';
    numInp.style.display = isDaily ? 'none' : '';
    unitSel.style.display = isDaily ? 'none' : '';
  };
  kindSel.onchange = syncKind;
  syncKind();
  // 没有活动会话时「投递到当前会话」没有意义：禁用该选项并标注原因
  const tgtSel = root.querySelector('#nt-target');
  const exOpt = tgtSel ? tgtSel.querySelector('option[value="existing"]') : null;
  if (exOpt && !(conv && conv.id)) {
    exOpt.disabled = true;
    exOpt.textContent += z ? '（当前没有会话）' : ' (no active chat)';
  }
  root.querySelector('#nt-add').onclick = async () => {
    const name = root.querySelector('#nt-name').value.trim();
    const prompt = root.querySelector('#nt-prompt').value.trim();
    if (!name || !prompt) { toast(z ? '名称和提示词都要填' : 'Name and prompt are required'); return; }
    const n = Math.max(1, +numInp.value || 1);
    const secs = unitSel.value === 'hour' ? n * 3600 : n * 60;
    let timing;
    if (kindSel.value === 'every') timing = { kind: 'every', every_seconds: Math.max(60, secs) };
    else if (kindSel.value === 'after') timing = { kind: 'after', after_seconds: secs };
    else timing = { kind: 'daily', time: timeInp.value || '09:00', timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
    const tgt = root.querySelector('#nt-target').value;
    if (tgt === 'existing' && !(conv && conv.id)) {
      toast(z ? '当前没有会话，不能投递到当前对话' : 'No active chat to deliver to');
      return;
    }
    try {
      await api('/schedule', {
        method: 'POST',
        body: {
          name, prompt, timing,
          target: tgt === 'existing' ? { kind: 'existing', session_id: (conv && conv.id) || '' } : tgt,
          session_id: (conv && conv.id) || ''
        }
      });
      toast(z ? '任务已创建' : 'Task created');
      go('auto', true);
    } catch (e) { toast(e.message); }
  };
}

/** Full render of a markdown-ish string into `cur` (animated unless `inst`). */
async function inline(cur, text, sig, inst, sp0) {
  // 界面统一性：正文里的 emoji 去掉（只影响显示，存储保留原文）
  text = noEmoji(text);
  const an = S.stream && !inst;
  const wait = () => inst ? 0 : sleep(sp0 || S.speed);
  let word = null, inl = null, host = cur;
  const mk = ch => {
    if (!an) {
      const l = cur.lastChild;
      if (l && l.nodeType === 3) { l.data += ch; return l; }
      return document.createTextNode(ch);
    }
    const s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch;
    return s;
  };
  for (let i = 0; i < text.length && !(sig && sig.stop); i++) {
    const tg = text.startsWith('**', i) ? 'strong' : text[i] === '`' ? 'code' : null;
    // Tolerate an unclosed marker: models often write `**标题` with no closing
    // `**`. Treat it as bold and let the newline (or end of text) close it,
    // rather than leaking literal asterisks into the reply.
    const tag = tg;
    if (tag) {
      if (inl && inl.tagName.toLowerCase() === tag) { cur = host; inl = null; }
      else if (!inl) { inl = document.createElement(tag); host.append(inl); cur = inl; }
      else { inl = document.createElement(tag); host.append(inl); cur = inl; }
      if (tag === 'strong') i++;
      word = null;
      continue;
    }
    const ch = text[i];
    if (ch === '\n') {
      if (inl) { cur = host; inl = null; }
      cur.append(document.createElement('br'));
      word = null;
      continue;
    }
    if (!an || /[\s　-〿＀-￯]/.test(ch)) {
      word = null;
      cur.append(mk(ch));
    } else {
      if (!word || word.parentNode !== cur) {
        word = document.createElement('span');
        word.className = 'w';
        cur.append(word);
      }
      word.append(mk(ch));
    }
    if (ch.trim() && !inst) { await wait(); follow(); }
  }
}

/** Incremental *inline* writer: bold / code, carried across chunks. */
function mkInline(host, ink, noanim) {
  return { host, cur: host, ih: host, inl: null, word: null, pend: '', ink: ink || null, noanim: !!noanim };
}
function iwrite(st, text, sig) {
  // 界面统一性：流式正文里的 emoji 去掉
  let s = noEmoji(st.pend + text);
  st.pend = '';
  const an = S.stream && !st.noanim;
  const mk = ch => {
    if (!an) {
      const l = st.cur.lastChild;
      if (l && l.nodeType === 3) { l.data += ch; return l; }
      return document.createTextNode(ch);
    }
    const e = document.createElement('span');
    e.className = 'c';
    e.textContent = ch;
    // 共享 ink 计数器：整块（列表/提交）一次性渲染时逐字错峰，
    // 否则同帧创建的字符动画全部同步起跑，糊成一片。
    if (st.ink) { e.style.animationDelay = Math.min(st.ink.n * 7, 420) + 'ms'; st.ink.n++; }
    return e;
  };
  for (let i = 0; i < s.length && !(sig && sig.stop); i++) {
    const isBold = s.startsWith('**', i);
    const isCode = s[i] === '`';
    // A marker may straddle two chunks. Only a lone trailing `*` / `` ` `` is
    // ambiguous — hold it for the next chunk instead of emitting it literally.
    if ((s[i] === '*' || s[i] === '`') && i === s.length - 1) {
      st.pend = s[i];
      break;
    }
    if (isBold || isCode) {
      const tag = isBold ? 'strong' : 'code';
      if (st.inl && st.inl.tagName.toLowerCase() === tag) {
        st.cur = st.ih; st.inl = null;
      } else {
        st.inl = document.createElement(tag);
        st.ih.append(st.inl);
        st.cur = st.inl;
      }
      if (isBold) i++;
      st.word = null;
      continue;
    }
    const ch = s[i];
    if (ch === '\n') {
      // A <br> inside <strong>/<code> breaks line-box math and leaves a phantom
      // gap after the inline run. Close the run first, break at the paragraph.
      if (st.inl) { st.cur = st.ih; st.inl = null; }
      st.cur.append(document.createElement('br'));
      st.word = null;
      continue;
    }
    if (!an || /[\s　-〿＀-￯]/.test(ch)) {
      st.word = null;
      st.cur.append(mk(ch));
    } else {
      if (!st.word || st.word.parentNode !== st.cur) {
        st.word = document.createElement('span');
        st.word.className = 'w';
        st.cur.append(st.word);
      }
      st.word.append(mk(ch));
    }
    if (ch.trim()) follow();
  }
}
function iflush(st) {
  if (!st.pend) return;
  const p = st.pend;
  st.pend = '';
  iwrite(st, p + ' ', null);
  const n = st.cur.lastChild;
  if (n && n.nodeType === 3 && n.data.endsWith(' ')) n.data = n.data.slice(0, -1);
  else if (n && n.lastChild && n.lastChild.textContent) {
    const m = n.lastChild;
    if (m.textContent.endsWith(' ')) m.textContent = m.textContent.slice(0, -1);
  }
}

/* ---- block layer: buffers markdown and renders each block with real structure ---- */

function classifyBlock(s) {
  const t = String(s || '').replace(/^\s+/, '');
  if (t.startsWith('```')) return 'code';
  if (/^#{1,6}\s/.test(t)) return 'heading';
  if (/^\s*[-*+]\s+/.test(t)) return 'ul';
  if (/^\s*\d+[.)]\s+/.test(t)) return 'ol';
  if (t.startsWith('>')) return 'quote';
  if (t.startsWith('|')) return 'table';
  return 'p';
}

const FENCE_RE = /^[ \t]*```/;

/**
 * Index of the next blank-line boundary, or -1.
 * Inside an unclosed ``` fence a blank line is part of the code block, not a
 * block boundary — so the scanner tracks fence state line by line and only
 * reports blank lines seen outside a fence. Streaming and final rendering
 * (splitBlocks) share this state machine.
 */
function blankBoundary(s) {
  let open = false, pos = 0;
  const lines = String(s).split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (FENCE_RE.test(line)) {
      open = !open;
    } else if (!open && /^[ \t]*$/.test(line) && pos > 0) {
      return pos - 1;   // index of the newline that closes the previous block
    }
    pos += line.length + 1;
  }
  return -1;
}

function mkStream(host) {
  return { host, buf: '', rendered: '', el: null, kind: '', inline: null };
}

function swrite(st, text, sig) {
  st.buf += text;

  // Flush every completed block.
  let i;
  while ((i = blankBoundary(st.buf)) >= 0) {
    const done = st.buf.slice(0, i);
    const rest = st.buf.slice(i).replace(/^\n[ \t]*\n/, '');
    st.buf = rest;
    commitBlock(st, done);
    st.rendered = '';
  }

  if (!st.buf.trim()) {
    if (st.el) { st.el.remove(); st.el = null; st.inline = null; }
    return;
  }

  const k = classifyBlock(st.buf);
  if (!st.el || k !== st.kind) {
    rebuildBlock(st);
    return;
  }
  if (k === 'p' && st.inline) {
    // Prose: append only the new characters so the per-char animation survives.
    const delta = st.buf.slice(st.rendered.length);
    if (delta) iwrite(st.inline, delta, sig);
    st.rendered = st.buf;
  } else {
    rebuildBlock(st);
  }
}

function commitBlock(st, text) {
  if (st.el) { st.el.remove(); st.el = null; st.inline = null; }
  if (!text.trim()) return;
  renderBlock(st.host, text, { n: 0 });
}

function rebuildBlock(st) {
  if (st.el) { st.el.remove(); st.el = null; }
  if (!st.buf.trim()) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'mblk';
  // 流式期间的整块重渲不播动画：列表每个 delta 都会走到这里，
  // 带动画会反复重播；提交时（commitBlock）再一次性错峰入场。
  renderBlock(wrapper, st.buf, null, true);
  st.host.append(wrapper);
  st.el = wrapper;
  st.kind = classifyBlock(st.buf);
  st.rendered = st.buf;
  // Prose blocks keep an inline writer so later deltas animate in; the writer
  // targets the inner <p>, not the wrapper.
  st.inline = (st.kind === 'p' && wrapper.children.length === 1 && wrapper.firstElementChild.tagName === 'P')
    ? mkInline(wrapper.firstElementChild) : null;
}

function sflush(st) {
  if (st.buf.trim()) commitBlock(st, st.buf);
  st.buf = '';
  st.rendered = '';
  st.el = null;
  st.inline = null;
}

/** Split markdown into blocks on blank lines (fence-aware, see blankBoundary). */
function splitBlocks(text) {
  const lines = String(text || '').split('\n');
  const out = [];
  let start = 0, open = false;
  for (let i = 0; i < lines.length; i++) {
    if (FENCE_RE.test(lines[i])) {
      open = !open;
    } else if (!open && /^[ \t]*$/.test(lines[i])) {
      const done = lines.slice(start, i).join('\n');
      if (done.trim()) out.push(done);
      start = i + 1;
    }
  }
  const tail = lines.slice(start).join('\n');
  if (tail.trim()) out.push(tail);
  return out;
}

/** Render inline markup into `el` (bold / inline code). */
function mdInline(el, text, ink, noanim) {
  const st = mkInline(el, ink, noanim);
  iwrite(st, String(text || ''), null);
  iflush(st);
}

/** True when every non-empty line looks like a markdown table row. */
function isTable(text) {
  const ls = text.split('\n').map(l => l.trim()).filter(Boolean);
  return ls.length >= 2 && ls.every(l => l.startsWith('|') && l.endsWith('|')) &&
    ls.some(l => /^\|[\s:|-]+\|$/.test(l));
}

function renderTable(host, text) {
  const rows = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parseRow = r => r.slice(1, -1).split('|').map(c => c.trim());
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');
  rows.forEach((r, i) => {
    if (/^\|[\s:|-]+\|$/.test(r)) return; // separator
    const tr = document.createElement('tr');
    const isHead = i === 0;
    parseRow(r).forEach(c => {
      const cell = document.createElement(isHead ? 'th' : 'td');
      mdInline(cell, c);
      tr.append(cell);
    });
    (isHead ? thead : tbody).append(tr);
  });
  tbl.append(thead, tbody);
  host.append(tbl);
}

function renderList(host, text, ordered, ink, noanim) {
  const el = document.createElement(ordered ? 'ol' : 'ul');
  text.split('\n').forEach(line => {
    const m = line.match(ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/);
    const li = document.createElement('li');
    mdInline(li, m ? line.slice(m[0].length) : line.trim(), ink, noanim);
    el.append(li);
  });
  host.append(el);
}

function renderCode(host, text) {
  const body = text.replace(/^```[^\n]*\n?/, '').replace(/```$/, '');
  const d = document.createElement('div');
  d.className = 'cb';
  const hd = document.createElement('div');
  hd.className = 'ch2';
  const lang = (text.match(/^```([^\n]*)/) || [, ''])[1] || 'code';
  hd.innerHTML = '<span>' + esc(lang) + '</span><span class="cbh">' +
    '<button class="cp" data-cp>' + t('copy') + '</button>' +
    '<button class="cp" data-wr>' + t('wrap') + '</button></span>';
  const pre = document.createElement('pre');
  d.append(hd, pre);
  host.append(d);
  hd.querySelector('[data-cp]').onclick = e => {
    copyText(body, true).then(ok => { if (ok) flash(e.target); });
  };
  hd.querySelector('[data-wr]').onclick = () => pre.classList.toggle('wrapit');
  pre.textContent = body;
  numCode(pre);
}

/**
 * Render one markdown block into `host`.
 * A block can mix prose and list rows (models often write
 * `基本信息\n- a\n- b` with no blank line), so multi-line blocks are grouped
 * by line type instead of being classified from the first line alone.
 */
function renderBlock(host, text, ink, noanim) {
  const t0 = text.replace(/^\n+|\n+$/g, '');
  if (!t0.trim()) return;
  if (/^```/.test(t0)) {
    // 围栏在块内闭合、后面还跟着散文行（模型常写 ```code``` 紧贴正文）：
    // 拆成代码块 + 后续 prose，别把正文吞进代码里。
    const lns = t0.split('\n');
    let close = -1;
    for (let k = 1; k < lns.length; k++) {
      if (FENCE_RE.test(lns[k])) { close = k; break; }
    }
    if (close >= 0 && close < lns.length - 1) {
      renderCode(host, lns.slice(0, close + 1).join('\n'));
      renderBlock(host, lns.slice(close + 1).join('\n'), ink, noanim);
      return;
    }
    renderCode(host, t0);
    return;
  }
  if (isTable(t0)) { renderTable(host, t0); return; }

  const lines = t0.split('\n');

  // A leading heading line splits off on its own.
  const h = lines[0].match(/^(#{1,6})\s+(.*)$/);
  if (h) {
    const el = document.createElement('h' + Math.min(h[1].length, 4));
    mdInline(el, h[2], ink, noanim);
    host.append(el);
    const rest = lines.slice(1);
    if (rest.join('\n').trim()) renderBlock(host, rest.join('\n'), ink, noanim);
    return;
  }

  // Group consecutive lines of the same kind.
  let i = 0;
  while (i < lines.length) {
    const isUl = /^\s*[-*+]\s+/.test(lines[i]);
    const isOl = /^\s*\d+[.)]\s+/.test(lines[i]);
    if (isUl || isOl) {
      const grp = [];
      while (i < lines.length && (isUl ? /^\s*[-*+]\s+/.test(lines[i]) : /^\s*\d+[.)]\s+/.test(lines[i]))) {
        grp.push(lines[i]);
        i++;
      }
      renderList(host, grp.join('\n'), !isUl, ink, noanim);
      continue;
    }
    if (/^>\s?/.test(lines[i])) {
      const grp = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        grp.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      const bq = document.createElement('blockquote');
      mdInline(bq, grp.join('\n'), ink, noanim);
      host.append(bq);
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
      host.append(document.createElement('hr'));
      i++;
      continue;
    }
    // Fenced code: gather from the opening ``` through the closing ``` (or the
    // end of the block when the fence is never closed) and render as code.
    if (FENCE_RE.test(lines[i])) {
      const grp = [lines[i]];
      i++;
      while (i < lines.length) {
        const l = lines[i];
        grp.push(l);
        i++;
        if (FENCE_RE.test(l)) break;
      }
      renderCode(host, grp.join('\n'));
      continue;
    }
    // Prose run (stops at list / quote / hr / fence openers).
    const grp = [];
    while (i < lines.length
      && !/^\s*[-*+]\s+/.test(lines[i])
      && !/^\s*\d+[.)]\s+/.test(lines[i])
      && !/^>\s?/.test(lines[i])
      && !FENCE_RE.test(lines[i])
      && !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
      grp.push(lines[i]);
      i++;
    }
    const p = document.createElement('p');
    mdInline(p, grp.join('\n'), ink, noanim);
    host.append(p);
  }
}

/** Render a whole markdown document into `host`. */
function renderBlocks(host, text) {
  splitBlocks(text).forEach(b => renderBlock(host, b, { n: 0 }));
}

function flash(b) {
  const o = b.textContent;
  b.textContent = t('copied');
  setTimeout(() => b.textContent = o, 1400);
}

function numCode(pre) {
  if (pre.dataset.num === '1') return;
  pre.dataset.num = '1';
  const txt = pre.textContent;
  pre.innerHTML = txt.split('\n').map(l => '<div class="cl"><span>' + esc(l) + '</span></div>').join('');
}

async function paint(host, text, sig, inst) {
  renderBlocks(host, text);
}

/* ---------------------------------------------------------------- messages */
function uMsg(q, idx, atts) {
  const d = document.createElement('div');
  d.className = 'u msg';
  if (idx != null) d.dataset.mi = idx;
  const b = document.createElement('div');
  b.className = 'ub';
  if (atts && atts.length) {
    const row = document.createElement('div');
    row.className = 'uatt';
    atts.forEach(a => {
      const s = document.createElement('span');
      s.className = 'att';
      // 图片附件带本地预览缩略图（URL.createObjectURL，随消息一起传入）
      s.innerHTML = (a && a.url ? '<img class="attimg" alt="">' : ic('file')) + '<b></b>';
      const im = s.querySelector('.attimg');
      if (im) im.src = a.url;
      s.querySelector('b').textContent = a.name || '';
      row.append(s);
    });
    b.append(row);

  if (q) {
    const tx = document.createElement('div');
    tx.textContent = noEmoji(q);
    b.append(tx);
  }
  // 操作条在消息下方、靠右；存储下标未知时禁用编辑/删除（避免静默失效）

  const acts = document.createElement('div');

    '<button class="ib' + off + '" data-ue="' + idx + '" title="' + t('editmsg') + '">' + ic('edit') + '</button>' +
    '<button class="ib" data-uc="' + idx + '" title="' + t('copy') + '">' + ic('copy') + '</button>' +
    '<button class="ib danger' + off + '" data-ud="' + idx + '" title="' + t('delmsg') + '">' + ic('trash') + '</button>';
  d.append(b, acts);
  feed.append(d);
  return d;
}

function aMsg(idx, spin) {
  const d = document.createElement('div');
  d.className = 'a msg';
  if (idx != null) d.dataset.mi = idx;
  // No fixed .th placeholder: reasoning blocks are created in place as they
  // stream, so they land next to the tool call they actually preceded.

  d.innerHTML =

    '<button class="ib' + (idx == null ? ' off' : '') + '" data-a="edit" title="' + t('editmsg') + '">' + ic('edit') + '</button>' +
    '<button class="ib danger' + (idx == null ? ' off' : '') + '" data-a="del" title="' + t('delmsg') + '">' + ic('trash') + '</button>' +

/* ---- 生成中计时条：显示「工作中 x 秒」，收尾定格为实际用时 ---- */
let wkTimer = 0, wkStart = 0;

/** 在气泡下方的计时条上显示已用秒数。 */
function wkPaint(a) {
  if (!a) return;
  const el = a.querySelector('.wk');
  if (!el || el.classList.contains('done')) return;
  const sec = wkStart ? Math.max(1, Math.round((Date.now() - wkStart) / 1000)) : 1;
  const tx = el.querySelector('.wtx');
  if (tx) tx.textContent = t('working') + ' ' + sec + ' ' + t('sec_unit');
}

/** 开始计时（turn 开始时调用）。 */
function wkStart_(a) {
  if (!a) return;
  wkStart = Date.now();
  if (wkTimer) clearInterval(wkTimer);
  wkPaint(a);
  wkTimer = setInterval(() => wkPaint(a), 1000);
}

/** 停止计时并定格为最终用时；ms 缺省时用本地计时。 */
function stopSpin(a, ms) {
  if (!a) return;
  if (wkTimer) { clearInterval(wkTimer); wkTimer = 0; }
  const el = a.querySelector('.wk');
  if (el) {
    const total = ms != null ? ms : (wkStart ? Date.now() - wkStart : 0);
    el.classList.remove('on');
    el.classList.add('done');
    const tx = el.querySelector('.wtx');
    if (tx) tx.textContent = t('worked_done').replace('{t}', fmtDur(total));
  }
  wkStart = 0;
}

function setActs(a, on) {
  const ac = a.querySelector('.acts');
  if (ac) ac.classList.toggle('show', on);
}

function fmtDur(ms) {  const s = Math.max(1, Math.round(ms / 1000));
  const m = Math.floor(s / 60), r = s % 60;
  return m ? t('dur_m').replace('{n}', m) + ' ' + t('dur_s').replace('{n}', r) : t('dur_s').replace('{n}', s);
}

/** Byte size in a short human form (B / KB / MB). */
function fmtBytes(n) {
  n = +n || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1024 / 1024).toFixed(n < 1024 * 1024 * 10 ? 1 : 0) + ' MB';
}

/**
 * Finalise a thinking block: stop the shimmer and stamp the elapsed time.
 * Must run whenever a block closes — otherwise every earlier block keeps
 * showing "思考中…" and their shimmer animations stack up at different phases,
 * which reads as the highlight sweeping in odd half-passes.
 */
function finishThink(el) {
  if (!el || el.dataset.done === '1') return;
  el.dataset.done = '1';
  el.classList.remove('open');
  const shim = el.querySelector('.shim');
  const sec = thinkStart ? Math.max(1, Math.round((Date.now() - thinkStart) / 1000)) : 1;
  if (shim) {
    shim.className = '';
    shim.textContent = t('thought').replace('{n}', sec);
  }
}

function foldFlow(a, ms) {
  if (ms == null) return;
  const ab = a.querySelector('.ab');
  if (!ab) return;
  // Fold the *process* — thinking blocks and tool cards, in the order they ran —
  // into a collapsible, leaving the answer text where it is.
  const kids = [...ab.children];
  const process = kids.filter(k => k.classList.contains('ec') || k.classList.contains('th'));
  if (!process.length) return;
  let w = a.querySelector('.wf');
  if (w) w.remove();
  w = document.createElement('div');
  w.className = 'wf';
  w.innerHTML = '<button class="wfh"><span class="wft"></span>' + ic('chev') + '</button>' +
    '<div class="wfb"><div></div></div>';
  w.querySelector('.wft').textContent = t('worked').replace('{t}', fmtDur(ms));
  const body = w.querySelector('.wfb>div');
  process.forEach(c => body.append(c));
  ab.insertBefore(w, ab.firstChild);
  w.querySelector('.wfh').onclick = () => w.classList.toggle('open');
}

  glob:'search', grep:'search', bash:'terminal', todo_write:'plan',

  computer_screenshot:'globe', computer_axtree:'search', computer_click:'globe',
  computer_type:'edit', computer_key:'terminal', computer_scroll:'globe',
  computer_navigate:'globe',

};

function labelFor(d, tool) {
