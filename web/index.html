function fillToolCard(e, display, ok, title) {
  if (!e) return;
  const stTx = e.querySelector('.st-tx');
  const diff = e.querySelector('.diff');
  const body = e.querySelector('.dc-in');
  const fi = e.querySelector('.fi b');
  // Cap the header: a card title carrying an error or a long path blows the
  // row apart. The full text is always available in the expanded body.
  const cap = s => {
    s = String(s == null ? '' : s);
    return s.length > 72 ? s.slice(0, 72) + '…' : s;
  };
  // Web tools' stored titles already begin with the verb ("Fetched …",
  // "Searched …") — drop it so the row reads label + subject, not the verb twice.
  if (title) fi.textContent = cap(String(title).replace(/^(Fetched|Searched)\s+/, ''));
  const toolName = e.dataset.tool || '';
  if (ok === false) {
    // Only a permission refusal gets the "denied" wording; any other failure
    // is labelled by its tool so the row stays truthful.
    const msg = (display && display.text) || '';
    const denied = /user declined|denied|拒绝/.test(msg);
    stTx.textContent = denied ? t('dnd') : (toolName ? toolName + ' · ' + t('fail') : t('fail'));
    stTx.style.color = '#f87171';
  } else {
    stTx.textContent = labelFor(display, toolName);
    stTx.style.color = '';
  }
  body.innerHTML = '';
  diff.innerHTML = '';

  if (!display || !display.kind) return;

  // 工具输出里的 emoji 也去掉（只影响显示）
  display = stripEmojiDeep(display);

  if (display.kind === 'read') {
    diff.textContent = t('rdn').replace('{n}', display.total || 0);
    const df = document.createElement('div');
    df.className = 'df';
    df.innerHTML = (display.lines || [])
      .map(l => '<div><i class="ln">' + l.n + '</i>' + esc(l.text) + '</div>')
      .join('');
    body.append(df);
  } else if (display.kind === 'diff') {
    diff.innerHTML = '<span class="add">+' + (display.added || 0) + '</span> <span class="del">-' + (display.removed || 0) + '</span>';
    const df = document.createElement('div');
    df.className = 'df';
    df.innerHTML = (display.lines || []).map(l => {
      const cls = l.sign === '+' ? 'ad' : l.sign === '-' ? 'rm' : '';
      const no = l.old != null ? l.old : (l.new != null ? l.new : '');
      return '<div class="' + cls + '"><i class="ln">' + no + '</i>' + esc(l.text) + '</div>';
    }).join('');
    body.append(df);
  } else if (display.kind === 'shell') {
    const pre = document.createElement('div');
    pre.className = 'df';
    pre.style.whiteSpace = 'pre-wrap';
    pre.textContent = '$ ' + display.command + '\n' + (display.stdout || '') +
      (display.stderr ? '\n[stderr]\n' + display.stderr : '');
    body.append(pre);
  } else if (display.kind === 'ask') {
    const d = document.createElement('div');
    d.className = 'df';
    d.style.padding = '10px 12px';
    d.innerHTML = '<b style="display:block"></b><div style="margin-top:8px;color:var(--fg2)"></div>';
    d.querySelector('b').textContent = display.question || '';
    d.querySelector('div').textContent = (display.options || []).join('  ·  ');
    body.append(d);
  } else if (display.kind === 'image') {
    diff.textContent = display.media_type === 'image/jpeg' ? 'jpeg' : 'png';
    const d = document.createElement('div');
    d.className = 'df';
    d.style.cssText = 'padding:0;background:#000';
    const img = document.createElement('img');
    img.src = 'data:' + (display.media_type || 'image/png') + ';base64,' + display.data;
    img.style.cssText = 'display:block;width:100%;height:auto;max-height:420px;object-fit:contain;margin:0 auto';
    img.alt = 'screenshot';
    d.append(img);
    body.append(d);
  } else if (display.kind === 'todo') {
    const items = display.todos || [];
    diff.textContent = items.length + ' items';
    const d = document.createElement('div');
    d.className = 'df';
    d.style.padding = '10px 12px';
    d.innerHTML = items.map(x =>
      '<div>' + (x.status === 'completed' ? '☑' : x.status === 'in_progress' ? '▶' : '☐') +
      ' ' + esc(x.content) + '</div>'
    ).join('');
    body.append(d);
  } else {
    const d = document.createElement('div');
    d.className = 'df';
    d.style.padding = '10px 12px';
    d.style.whiteSpace = 'pre-wrap';
    d.textContent = display.text || '';
    body.append(d);
  }
  // Cards stay collapsed: the header line carries the summary and clicking
  // expands. Auto-expanding every card is what produced the tall gaps.
}

/** Risk colour chip: shell/network/destructive red, write amber, readonly grey. */
function riskChip(risk) {
  const r = String(risk || '').toLowerCase();
  const cls = (r === 'destructive' || r === 'shell' || r === 'network') ? 'hi'
    : (r === 'write' ? 'md' : 'lo');
  return '<span class="riskchip ' + cls + '">' + esc(r || 'readonly') + '</span>';
}

/**
 * Show the permission panel on a tool card: tool / path / reason / risk /
 * diffPreview, plus a 300s countdown (the backend auto-denies after 300s and
 * emits permission.resolved; the panel closes itself on either signal).
 * `info` comes from a permission.request event ({callId, tool, path, risk,
 * reason, diffPreview}) or a GET /api/pending entry ({id, tool, ...}).
 */
function showPermPanel(e, callId, info) {
  if (!e) return;
  info = info || {};
  const pm = e.querySelector('.pm');
  let html = '<div class="pmwrap"><div class="pmin">' +
    '<div class="pmr"><span class="pmk">tool</span><code>' + esc(info.tool || '') + '</code>' + riskChip(info.risk) + '</div>';
  if (info.path) html += '<div class="pmr"><span class="pmk">path</span><code>' + esc(info.path) + '</code></div>';
  if (info.reason) html += '<div class="preason">' + esc(info.reason) + '</div>';
  if (info.diffPreview) html += '<pre class="pmdiff">' + esc(info.diffPreview) + '</pre>';
  html += '</div>' +
    '<div><span>' + esc(t('wp')) + ' · <b class="ptimer">300</b>s</span>' +
    '<button data-d="once">' + t('a1') + '</button>' +
    '<button data-d="always">' + t('aa') + '</button>' +
    '<button data-d="deny">' + t('dy') + '</button></div></div>';
  pm.innerHTML = html;
  e.dataset.st = 'wait';
  e.querySelector('.st-tx').textContent = t('wt');
  e.classList.remove('collapsed');
  // 倒计时：300s 与后端超时一致，到点先本地收起提示超时拒绝
  const clearTimer = () => { if (e._ptimer) { clearInterval(e._ptimer); e._ptimer = null; } };
  clearTimer();
  let left = 300;
  const timerEl = pm.querySelector('.ptimer');
  e._ptimer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearTimer();
      pm.innerHTML = '';
      if (e.dataset.st === 'wait') {
        e.dataset.st = '';
        e.querySelector('.st-tx').textContent = t('perm_timeout');
      }
    } else if (timerEl) timerEl.textContent = left;
  }, 1000);
  pm.querySelectorAll('button').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.dataset.d;
      api('/permission', { method: 'POST', body: { call_id: callId, decision: d } })
        .then(() => {
          clearTimer();
          pm.innerHTML = '';
          e.querySelector('.st-tx').textContent = d === 'deny' ? t('dnd') : t('perm_run');
        })
        .catch(err => toast(err.message));
    };
  });
}

/* ==================================================================
   live turn: the server drives rendering over SSE
   ================================================================== */
let conv = null;          // active session {id, title, ...}
let busy = false;         // a turn is in flight
let sig = null;           // cancellation token for the current turn
let ATTS = [];
const ta = $('#ta'), sd = $('#sd');
let CONVS = [];           // sidebar entries

// per-turn render state
let curA = null;          // current assistant message element
let curStream = null;     // mkStream() state
let curThinkEl = null;    // current .th element
let thinkStart = 0;
let curText = '';         // accumulated assistant text
let toolEls = {};         // callId -> element
let turnT0 = 0;
// run() 已经画好了用户气泡；定时任务 / 重试这些「非本端发起」的 turn 由
// turn.start 事件补画。气泡只画一次。
let expectBubble = false;

function resetTurn() {
  curA = null;
  curStream = null;
  curThinkEl = null;
  curText = '';
  toolEls = {};
  // Without this the thinking timer accumulates across the whole session and
  // reports nonsense like "thought for 1042s".
  thinkStart = 0;
  // Same for the work timer: a turn that never ended must not keep ticking.
  if (wkTimer) { clearInterval(wkTimer); wkTimer = 0; }
  wkStart = 0;
}

function startTurnUI() {
  curA = aMsg(null, true);   // 生成中：气泡带计时条，turn.end/错误时定格用时
  wkStart_(curA);
  curText = '';
  curStream = null;
  curThinkEl = null;
  toolEls = {};
  turnT0 = Date.now();
  stick = true;
  follow();
}

/** Handle one server event. */
let sessRefreshAt = 0;   // 他会话事件触发侧边栏静默刷新的去抖时间戳
/** 每个会话的在途文本记账。后端只在每一步流结束时才把文本落库，切走后
 *  text.delta 被 conv 过滤丢弃——没有缓冲的话，切回来时正在生成的那段话
 *  就永远缺失（表现为「输出截断」）。规则：
 *  - text.delta 一律追加（活跃/后台会话都记）；
 *  - tool.result 在后端 fold+落库之后才发出，此刻缓冲里全是已入库内容，清零；
 *  - turn.end 时整个 turn 都已落库，整个缓冲删掉。
 *  于是缓冲里始终只剩「未落库的在途文本」，切回来补渲染不会重复也不会丢。 */
/**
 * 渲染一段思考内容（实时流与切回重放共用）。
 */
function renderReasoning(text) {
  if (!curA) return;
  if (!curThinkEl) {
    curThinkEl = document.createElement('div');
    curThinkEl.className = 'th open';
    curThinkEl.innerHTML = '<button class="thh"><span class="shim">' + t('thinking') + '</span>' +
      ic('chev') + '</button><div class="thb"><div class="thbody"></div></div>';
    const thinkEl = curThinkEl;
    thinkEl.querySelector('.thh').onclick = () => {
      // 用户点过头的块不再自动收起——人已经接管了这个块的开合
      thinkEl.dataset.user = '1';
      thinkEl.classList.toggle('open');
    };
    // Append at the current end of the body: reasoning that happens after a
    // tool call belongs visually after that card, not above every card.
    curA.querySelector('.ab').append(curThinkEl);
    if (!thinkStart) thinkStart = Date.now();
  }
  const body = curThinkEl.querySelector('.thbody');
  body.textContent = noEmoji((body.textContent || '') + (text || ''));
  follow();
  // 思考过长自动半收起：超过阈值折起（头部状态仍可见），
  // 避免长思考占满整个屏幕。用户手动展开过则不再干预。
  if (!curThinkEl.dataset.user && !curThinkEl.dataset.folded) {
    const txt = body.textContent || '';
    if ((txt.match(/\n/g) || []).length > 8) {
      curThinkEl.classList.remove('open');
      curThinkEl.dataset.folded = '1';
    }
  }
}

/**
 * 重放一条在途事件（切走再切回来时用）。
 *
 * 只重建视图，不重新记账 —— 否则重放会再次写进 SHADOW，越滚越大。
 */
function replayEvent(ev) {
  if (!curA) return;
  switch (ev.type) {
    case 'reasoning.delta':
      renderReasoning(ev.text || '');
      break;
    case 'tool.call': {
      finishThink(curThinkEl);
      curThinkEl = null;
      thinkStart = 0;
      curStream = null;
      const card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, ev.title || ev.tool);
      toolEls[ev.callId] = card;
      break;
    }
    case 'tool.result': {
      const card = toolEls[ev.callId];
      fillToolCard(card, ev.display, ev.ok, ev.title);
      break;
    }
    case 'tool.progress': {
      const card = toolEls[ev.callId];
      if (card && ev.chunk != null && ev.chunk !== '') {
        let pre = card.querySelector('.prog');
        if (!pre) {
          pre = document.createElement('pre');
          pre.className = 'prog';
          card.querySelector('.dc-in').append(pre);
        }
        pre.textContent = noEmoji((pre.textContent || '') + ev.chunk);
      }
      break;
    }
  }
}

const SHADOW = {};
/** 在途事件序列：思考块、工具卡片都记一份。切走再切回来时按序重放，
 *  思考过程与工具卡片才不会被截断。
 *  记账规则：
 *  - reasoning.delta 合并进同一条（连续思考块只是一段文本）；
 *  - tool.progress 每个 callId 只留最后一条（增量输出）；
 *  - text.delta 不进序列（正文由 sh.text 单独累加）。 */
function shadowPush(sid, ev) {
  const sh = (SHADOW[sid] ||= { text: '', events: [] });
  if (ev.type === 'text.delta') return;
  if (ev.type === 'tool.result') {
    // 落库点：此刻之前的内容（思考块、工具卡片）都已入库，切回来从存储
    // 里就能读到，序列里必须清掉，否则重放会和历史消息重复。
    sh.events = [];
    sh.text = '';
    return;
  }
  if (ev.type === 'reasoning.delta') {
    const last = sh.events[sh.events.length - 1];
    if (last && last.type === 'reasoning.delta') {
      last.text = (last.text || '') + (ev.text || '');
      return;
    }
    sh.events.push({ type: 'reasoning.delta', text: ev.text || '' });
    return;
  }
  if (ev.type === 'tool.progress') {
    const i = sh.events.findIndex(e => e.type === 'tool.progress' && e.callId === ev.callId);
    if (i >= 0) sh.events.splice(i, 1);
    sh.events.push(ev);
    return;
  }
  sh.events.push(ev);
}
/** 每个会话「turn 在途」标记：turn.start 置位、turn.end 清除。文本还没开始
 *  流时 SHADOW 里没有条目，切回来要靠它恢复流式 UI（否则 sig 还挂着 stop，
 *  后续正文字符会被逐字写入循环全部丢弃）。 */
const INFLIGHT = {};
/** 全局事件序号水位：SSE 事件带单调递增 seq，乱序/重复直接丢弃。 */
let lastSeq = 0;
// conv 未绑定（首条消息在途）期间闯入的他人会话：其事件全部丢弃直到绑定。
let ignoreSid = '';
function dispatch(ev) {
  if (!ev || !ev.type) return;
  // seq 去重：hello 的 seq=0（falsy）始终放行；重连后在 onopen 里清零水位。
  if (ev.seq && ev.seq <= lastSeq) return;
  if (ev.seq) lastSeq = ev.seq;
  // 侧边栏先于一切会话过滤取事件：它的辅助对话是独立会话，主对话区的
  // 会话隔离不应该把它的事件吃掉。钩子只写侧边栏自己的标签。
  spOnEvent(ev);
  if (ignoreSid && ev.sessionId === ignoreSid) return;
  if (ev.type === 'turn.end') { delete SHADOW[ev.sessionId]; delete INFLIGHT[ev.sessionId]; }
  // Only handle events for the active session (or the initial one).
  // 定时任务等在别的会话里开的 turn（含新建会话、欢迎页 conv 为空的情况）：
  // 静默刷新会话列表，让「⏱ 任务名」对话直接出现在侧边栏，不必手动刷新页面。3 秒去抖。
  // conv.id 为空且 expectBubble（首条消息在途）时放行：turn.start 分支会兜底
  // 绑定会话 id，避免 session.start 丢失后整轮事件被过滤器吃掉。
  if (ev.sessionId && (!conv || (conv.id ? ev.sessionId !== conv.id : !expectBubble)) &&
      (ev.type === 'turn.start' || ev.type === 'turn.end')) {
    if (ev.type === 'turn.start') INFLIGHT[ev.sessionId] = true;
    const now = Date.now();
    if (now - sessRefreshAt >= 3000) {
      sessRefreshAt = now;
      loadSessions(true);
    }
    return;
  }
  if (ev.type === 'text.delta') {
    (SHADOW[ev.sessionId] ||= { text: '', events: [] }).text += (ev.text || '');
  } else if (ev.type === 'reasoning.delta' || ev.type === 'tool.call' ||
             ev.type === 'tool.result' || ev.type === 'tool.progress') {
    // 记下在途事件序列：切走再切回来时按序重放，思考块与工具卡片才不会被截断。
    shadowPush(ev.sessionId, ev);
  }
  // conv.id 为 null（新会话首条消息在途、POST /chat 响应未返回）时不能丢事件：
  // session.start 事件会先到并绑定 id，这里只对「已绑定且不匹配」的会话过滤。
  if (conv && conv.id && ev.sessionId && ev.sessionId !== conv.id) return;

  switch (ev.type) {
    case 'hello':
      break;

    case 'session.start':
      // conv.id 为 null（首条消息在途）时也要认领：服务端在 POST /chat 响应
      // 返回前就会广播 session.start，错过它后续事件会全部被过滤器丢掉。
      if (!conv || conv.id === ev.sessionId || !conv.id) {
        if (conv && !conv.id && ev.sessionId === ignoreSid) break;   // 已标记为他人会话
        const wasNew = !conv || !conv.id;
        const prevT = conv && conv.title;
        conv = { id: ev.sessionId, title: prevT || ev.title || '', workspace: (conv && conv.workspace) || ev.workspace || '' };
        ignoreSid = '';
        $('#ttl').textContent = noEmoji(conv.title || ev.title || '');
        if (wasNew) {
          addRc({ id: conv.id, t: conv.title || ev.title || '', ts: Date.now() });
          loadSessions(true);
        }
        document.body.classList.add('chat');
        apply();
      }
      break;

    case 'turn.start':
      INFLIGHT[ev.sessionId] = true;
      // 新会话兜底绑定：session.start 丢失（断线重连、乱序）时在此认领 id。
      // 只认领文本与在途请求一致的 turn，防止并发定时任务被误绑；认领失败
      // 的一律标记 ignoreSid 丢弃其后续事件。
      if (conv && !conv.id) {
        if ((ev.text || '') === (conv.pendingText || '')) {
          conv.id = ev.sessionId;
          ignoreSid = '';
          addRc({ id: conv.id, t: conv.title || '', ts: Date.now() });
          loadSessions(true);
        } else {
          ignoreSid = ev.sessionId;
          return;
        }
      }
      // 非本端发起的 turn（定时投递、重试）靠事件里的 text 补用户气泡；
      // 重试的 text 为空，不画气泡。必须在 .a 之前画，顺序才是「问→答」。
      if (!expectBubble && (ev.text || '').trim()) uMsg(ev.text, null, []);
      expectBubble = false;
      if (!curA) startTurnUI();
      // 事件丢失自愈：开始轮询核对服务端的 turn 状态。
      startTurnProbe();
      break;

    case 'events.lost':
      // 服务端承认丢了事件（慢客户端被 broadcast 缓冲甩掉）。
      onEventsLost(ev);
      break;

    case 'reasoning.delta':
      // 思考强度设为「关闭」时，供应商仍会吐 reasoning_content；直接丢弃，
      // 不要造出一个既点不开又没内容的思考块。
      if (S.lvl === 0) break;
      renderReasoning(ev.text || '');
      break;

    case 'text.delta':
      if (!curA) startTurnUI();
      if (!curStream) {
        const p = document.createElement('p');
        curA.querySelector('.ab').append(p);
        curStream = mkStream(p);
      }
      swrite(curStream, ev.text || '', sig);
      curText += (ev.text || '');
      follow();
      break;

    case 'tool.call':
      if (!curA) startTurnUI();
      {
        // Close the current reasoning/text run so the next delta starts a fresh
        // block *after* this card. Otherwise every thought in the turn piles into
        // one block pinned at the top of the message.
        finishThink(curThinkEl);
        thinkStart = 0;
        curThinkEl = null;
        curStream = null;
        const card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, ev.title || ev.tool);
        toolEls[ev.callId] = card;
        follow();
      }
      break;

    case 'tool.result':
      {
        const card = toolEls[ev.callId];
        fillToolCard(card, ev.display, ev.ok, ev.title);
        follow();
      }
      break;

    case 'tool.progress':
      // bash 等长工具的 stdout 增量（{callId, chunk}）：懒建 pre 区块持续追加，
      // tool.result 到达时 fillToolCard 会整体重写卡片主体，进度区自然让位。
      {
        const card = toolEls[ev.callId];
        if (card && ev.chunk != null && ev.chunk !== '') {
          let pre = card.querySelector('.prog');
          if (!pre) {
            pre = document.createElement('div');
            pre.className = 'df prog';
            pre.style.cssText = 'white-space:pre-wrap;max-height:240px;overflow:auto';
            card.querySelector('.dc-in').append(pre);
          }
          pre.textContent += /\n$/.test(ev.chunk) ? ev.chunk : ev.chunk + '\n';
          pre.scrollTop = pre.scrollHeight;
          follow();
        }
      }
      break;

    case 'permission.request':
      {
        let card = toolEls[ev.callId];
        if (!card && curA) {
          card = toolCard(curA.querySelector('.ab'), ev.callId, ev.tool, ev.tool);
          toolEls[ev.callId] = card;
        }
        showPermPanel(card, ev.callId, ev);
        follow();
      }
      break;

    case 'permission.resolved':
      // {id, decision}：anywhere 决策（本端点按钮、超时自动拒绝）都要收面板
      {
        const card = toolEls[ev.id];
        if (card) {
          if (card._ptimer) { clearInterval(card._ptimer); card._ptimer = null; }
          const pm2 = card.querySelector('.pm');
          if (pm2) pm2.innerHTML = '';
          if (card.dataset.st === 'wait') {
            card.dataset.st = '';
            card.querySelector('.st-tx').textContent =
              ev.decision === 'deny' ? t('dnd') : t('perm_run');
          }
        }
      }
      break;

    case 'question':
      {
        let card = toolEls[ev.callId];
        if (!card && curA) {
          card = toolCard(curA.querySelector('.ab'), ev.callId, 'ask_user', ev.question);
          toolEls[ev.callId] = card;
        }
        if (card) {
          fillToolCard(card, { kind:'ask', question: ev.question, options: ev.options || [] }, true, ev.question);
          const pm = card.querySelector('.pm');
          pm.innerHTML = '<div><span></span><input class="qin" style="flex:1;min-width:160px;padding:5px 8px;border:.5px solid var(--line);border-radius:8px;background:var(--input);color:inherit">' +
            '<button data-d="send">' + t('send_answer') + '</button></div>';
          pm.querySelector('span').textContent = '';
          const input = pm.querySelector('.qin');
          const sendBtn = pm.querySelector('button');
          const doSend = () => {
            api('/answer', { method: 'POST', body: { call_id: ev.callId, answer: input.value } })
              .then(() => {
                pm.innerHTML = '';
                // 回答回显进问题卡片，事后翻记录能看到自己答了什么
                const body = card.querySelector('.dc-in');
                if (body) {
                  const ans = document.createElement('div');
                  ans.style.cssText = 'margin-top:8px;color:var(--fg)';
                  ans.textContent = t('your_answer') + input.value;
                  body.append(ans);
                }
              })
              .catch(err => toast(err.message));
          };
          sendBtn.onclick = e => { e.stopPropagation(); doSend(); };
          input.onkeydown = e => {
            e.stopPropagation();
            if (e.key === 'Enter') { e.preventDefault(); doSend(); }
          };
          setTimeout(() => input.focus(), 50);
        }
        follow();
      }
      break;

    case 'status':
      applyStatus(ev);
      break;

    case 'compaction':
      {
        // Surface compaction as a quiet inline notice above the reply.
        const n = ev.compacted || 0;
        const note = document.createElement('p');
        note.style.cssText = 'font:12px var(--sans);color:var(--fg2);margin:0 0 8px;opacity:.75';
        note.textContent = t('compacted').replace('{n}', n);
        if (curA) curA.querySelector('.ab').prepend(note);
      }
      break;

    case 'goal':
      // 目标状态变化（judge 判定、续跑、暂停）时刷新输入框上方的徽标
      refreshGoalBadge();
      break;

    case 'team.task':
    case 'team.mode':
      // 任务板变了：团队页开着就实时刷新
      if (pg === 'team') go('team', true);
      break;

    case 'subagent.start':
    case 'subagent.end':
      // 成员上下线：团队页开着就实时刷新名册
      if (pg === 'team') go('team', true);
      break;

    case 'turn.end':
      if (curStream) sflush(curStream);
      finishThink(curThinkEl);
      curThinkEl = null;
      thinkStart = 0;
      stopTurnProbe();
      if (curA) {
        stopSpin(curA, ev.ms);
        setActs(curA, true);
        foldFlow(curA, ev.ms);
        // 以存储为准校正最终答案：流式期间任何丢失（切换会话、SSE 断连、
        // 渲染异常）都在这里兜底补齐，保证收尾视图与存储一致。
        reconcileTail();
      }
      busy = false;
      sync();
      // 清掉本轮渲染状态：不清理的话下一轮 turn（定时投递、重试）会把回答
      // 续写进上一轮的气泡里，两段回答挤在一个消息中，存储却各归各。
      resetTurn();
      // 回填每条消息对应的存储下标（编辑 / 删除 / 重新生成都按它定位）。
      restamp();
      break;

    case 'error':
      if (ev.message) {
        if (ev.fatal) {
          toast(ev.message);
          if (curA && curText.trim() === '') {
            const p = document.createElement('p');
            p.style.color = '#f87171';
            p.textContent = ev.message;
            curA.querySelector('.ab').append(p);
          }
        } else {
          const p = document.createElement('p');
          p.style.color = '#f87171';
          p.textContent = '⚠ ' + ev.message;
          if (curA) curA.querySelector('.ab').append(p);
        }
      }
      if (ev.fatal) { stopSpin(curA); busy = false; sync(); }
      break;
  }
}

/* ---------------------------------------------------------------- status bar */
const kfmt = v => {
  v = Number(v) || 0;
  return v < 1000 ? String(v) : (v / 1000).toFixed(v < 10000 ? 1 : 0) + 'K';
};

/** ms → 人类可读时长（毫秒 / 秒 / 分秒），用于模型用时、TTFT 等统计。 */
function fmtMs(ms) {
  ms = Number(ms) || 0;
  if (ms <= 0) return t('dur_s').replace('{n}', 0);
  if (ms < 1000) return ms + ' ' + t('u_ms');
  const s = ms / 1000;
  if (s < 60) return t('dur_s').replace('{n}', Math.round(s * 10) / 10);
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return t('dur_m').replace('{n}', m) + ' ' + t('dur_s').replace('{n}', r);
}

function applyStatus(ev) {
  const turns = ev.turns || 0, steps = ev.steps || 0, tps = ev.tps || 0;
  $('#sb-stats-tx').textContent = turns + ' ' + t('u_turns') + ' ' + steps + ' ' + t('u_steps') + ' · ' + tps + ' tok/s';
  $('#p-stats-top').textContent = turns + ' ' + t('u_turns') + ' ' + steps + ' ' + t('u_steps');
  $('#p-tps').textContent = tps + ' tok/s';
  // 真实计时字段（SSE status / turn.end 的 camelCase 字段）
  $('#p-model-ms').textContent = fmtMs(ev.modelMs || 0);
  $('#p-tool-ms').textContent = fmtMs(ev.toolMs || 0);
  $('#p-ttft').textContent = fmtMs(ev.ttftMs || 0);

  const tk = ev.tokens || {};
  const total = tk.total || 0;
  $('#sb-token-tx').textContent = kfmt(total) + ' tok · ' + t('cache_hit') + ' ' + (tk.cacheHit || 0) + '%';
  $('#p-token-top').textContent = total.toLocaleString() + ' tok';
  $('#p-cache-hit').textContent = (tk.cacheHit || 0) + '%';
  $('#p-uncached').textContent = (tk.uncached || 0).toLocaleString() + ' tok';
  $('#p-cache-read').textContent = (tk.cacheRead || 0).toLocaleString() + ' tok';
  $('#p-output').textContent = (tk.output || 0).toLocaleString() + ' tok';

  const cx = ev.context || {};
  const used = cx.used || 0, limit = cx.limit || 128000;
  const pct = limit ? Math.round((used / limit) * 100) : 0;
  $('#sb-ctx-tx').textContent = pct + '%';
  $('#p-ctx-pct').textContent = pct + '%';
  $('#p-ctx-val').textContent = '~' + kfmt(used) + ' / ' + kfmt(limit);
  const denom = used || 1;
  $('#p-bar-sys').style.width = ((cx.system || 0) / denom * 100) + '%';
  $('#p-bar-tools').style.width = ((cx.tools || 0) / denom * 100) + '%';
  $('#p-bar-msgs').style.width = ((cx.messages || 0) / denom * 100) + '%';
  $('#p-sys').textContent = '~' + kfmt(cx.system || 0);
  $('#p-tools').textContent = '~' + kfmt(cx.tools || 0);
  $('#p-msgs').textContent = '~' + kfmt(cx.messages || 0);
}

/**
 * Zero the status bar. The markup ships with the demo's placeholder numbers,
 * and `applyStatus` only overwrites them once a real `status` event arrives —
 * without this a fresh load shows fabricated usage.
 */
function resetStatus() {
  applyStatus({ turns: 0, steps: 0, tps: 0, tokens: {}, context: {} });
}

// panel toggles

/* ==================================================================
   send / run
   ================================================================== */
function sync() {
  sd.innerHTML = ic(busy ? 'stop' : 'send');
  // 附件还在上传时也禁用发送（上传失败的会被移出列表）
  sd.disabled = (!busy && !ta.value.trim() && !ATTS.length) || ATTS.some(a => a.loading);
}

// 首条消息尚无会话 id 时点停止：先记标记，拿到 sessionId 后补发 interrupt
let pendingInterrupt = false;

async function run(q) {
  if (busy) return;
  if (ATTS.some(a => a.loading)) { toast(t('att_uploading')); return; }
  const atts = ATTS.slice();
  ATTS = [];
  renderAtts();
  resetTurn();
  pendingInterrupt = false;

  const title = q ? q.slice(0, 28) : (atts[0] ? atts[0].name : '附件');
  if (!conv) {
    conv = { id: null, title, workspace: '', pendingText: q || '' };
    document.body.classList.add('chat');
    $('#ttl').textContent = noEmoji(title);
    apply();
  } else if (!conv.id) {
    conv.pendingText = q || '';
  }

  uMsg(q, null, atts);
  expectBubble = true;
  busy = true;
  sig = { stop: false };
  sync();
  // 事件丢失自愈：核对服务端是否还在跑这一轮。
  startTurnProbe();

  try {
    const res = await api('/chat', {
      method: 'POST',
      body: {
        session_id: conv.id || '',
        text: q,
        attachments: atts.filter(a => a.path).map(a => ({ path: a.path, name: a.name, size: a.size })),
        model: S.model,
        permission_mode: S.perm,
        // 契约：永远发 0-3，0 = 显式关闭思考
        thinking_level: Math.max(0, Math.min(3, +S.lvl || 0)),
        plan_mode: !!S.plan
      }
    });
    if (res && res.sessionId) {
      if (!conv.id) {
        conv.id = res.sessionId;
        conv.title = title;
        $('#ttl').textContent = noEmoji(title);
        addRc({ id: conv.id, t: title, ts: Date.now() });
        loadSessions(true);
        refreshGoalBadge();
      }
      // 首条消息期间按了停止：现在才有会话 id，补发 interrupt
      if (pendingInterrupt) {
        pendingInterrupt = false;
        api('/interrupt', { method: 'POST', body: { session_id: conv.id } }).catch(() => {});
      }
    }
  } catch (e) {
    busy = false;
    expectBubble = false;
    stopSpin(curA);
    sync();
    toast(e.message);
    const p = document.createElement('p');
    p.style.color = '#f87171';
    p.textContent = '⚠ ' + e.message;
    if (curA) curA.querySelector('.ab').append(p);
  }
}

/* ------------------------------------------------ /compact 与 /goal 命令 */
/* 插件命令（来自 /plugins 的命令模板，{{input}} 为斜杠后的参数） */
let PLUGIN_CMDS = [];
async function loadPluginCmds() {
  try {
    const r = await api('/plugins');
    PLUGIN_CMDS = (r.plugins || []).filter(p => p.enabled)
      .flatMap(p => (p.commands || []).filter(c => c.template));
  } catch (e) { PLUGIN_CMDS = []; }
}
loadPluginCmds();
async function runCompact() {
  const z = S.lang === 'zh';
  if (!conv || !conv.id) { toast(z ? '先发一条消息建立会话' : 'Start a chat first'); return; }
  try {
    const r = await api('/sessions/' + conv.id + '/compact', { method: 'POST' });
    toast(z ? ('已压缩 ' + (r.folded || 0) + ' 条旧消息') : ('Compacted ' + (r.folded || 0) + ' old messages'));
    if (r.folded) openSession(conv.id);
  } catch (e) { toast(e.message); }
}

/**
 * /clear：服务端与本地一起清。DELETE /api/sessions/:id/messages
 * body {from: 0}（TruncateReq.from=0，to 缺省 = 截到末尾）。
 */
async function clearConv() {

    if (conv && conv.id) {
      await api('/sessions/' + conv.id + '/messages', { method: 'DELETE', body: { from: 0 } });
    }
    feed.innerHTML = '';
    resetTurn();
    toast(t('clear'));
  } catch (e) { toast(e.message); }
}

/** /status：GET /api/status 渲染成一条对话内的状态卡片。 */
async function runStatus() {
  const z = S.lang === 'zh';
  let txt;
  try {
    const r = await api('/status');
    txt = (z ? '服务状态' : 'Server status') + '\n' +
      '· ' + (z ? '运行时长' : 'uptime') + ': ' + fmtDur(r.uptimeMs || 0) + '\n' +
      '· ' + (z ? '当前模型' : 'model') + ': ' + (r.model || '-') + '\n' +
      '· ' + (z ? '权限模式' : 'permission') + ': ' + t('p_' + (r.permissionMode || 'ask')) + '\n' +
      '· ' + (z ? '思考强度' : 'thinking') + ': ' + t('l' + (r.thinkingLevel != null ? r.thinkingLevel : 2)) + '\n' +
      '· ' + (z ? '工作区' : 'workspace') + ': ' + (r.workspace || '-');
  } catch (e) { toast(e.message); return; }

function goalStatusLabel(s) {
  const z = S.lang === 'zh';
  return s === 'paused' ? (z ? '已暂停' : 'paused')
    : s === 'complete' ? (z ? '已完成' : 'complete')
    : (z ? '进行中' : 'active');
}

async function runGoal(arg) {
  const z = S.lang === 'zh';
  if (!conv || !conv.id) { toast(z ? '先发一条消息建立会话' : 'Start a chat first'); return; }
  try {
    if (!arg) {
      const r = await api('/sessions/' + conv.id + '/goal');
      if (r.goal) {
        toast('◎ ' + goalStatusLabel(r.goal.status) + ' · ' + r.goal.objective.slice(0, 60) +
          ' · 第 ' + (r.goal.rounds + 1) + '/' + r.goal.max_rounds + ' 轮');
      } else {
        toast(z ? '当前没有持久目标。用 /goal <目标> 设置' : 'No goal. Use /goal <objective>');
      }
      refreshGoalBadge();
      return;
    }
    const action = ['pause', 'resume', 'clear'].includes(arg) ? arg : 'set';
    await api('/sessions/' + conv.id + '/goal', {
      method: 'POST',
      body: action === 'set' ? { action: 'set', objective: arg } : { action }
    });
    toast(action === 'clear' ? (z ? '目标已清除' : 'Goal cleared')
      : action === 'pause' ? (z ? '目标已暂停' : 'Goal paused')
      : action === 'resume' ? (z ? '目标已恢复' : 'Goal resumed')
      : (z ? '目标已设置，完成前会自动续跑' : 'Goal set — it will keep working on it'));
    refreshGoalBadge();
  } catch (e) { toast(e.message); }
}

/** 刷新输入框上方的持久目标徽标。 */
async function refreshGoalBadge() {
  const el = $('#goalbar');
  if (!el) return;
  if (!conv || !conv.id) { el.className = ''; el.innerHTML = ''; return; }
  try {
    const r = await api('/sessions/' + conv.id + '/goal');
    if (!r.goal) { el.className = ''; el.innerHTML = ''; return; }
    const g = r.goal;
    const z = S.lang === 'zh';
    el.className = 'on' + (g.status !== 'active' ? ' ' + g.status : '');
    el.innerHTML = '<span class="gdot"></span><b>' + (z ? '目标' : 'Goal') + ' · ' + goalStatusLabel(g.status) + '</b><span class="gt"></span>' +
      (g.status === 'active'
        ? '<button data-g="pause">' + (z ? '暂停' : 'Pause') + '</button>'
        : g.status === 'paused' ? '<button data-g="resume">' + (z ? '继续' : 'Resume') + '</button>' : '') +
      '<button data-g="clear">' + (z ? '清除' : 'Clear') + '</button>';
    el.querySelector('.gt').textContent = g.objective +
      (g.max_rounds ? ' · 第 ' + (g.rounds + 1) + '/' + g.max_rounds + ' 轮' : '');
    el.querySelectorAll('button').forEach(b => {
      b.onclick = () => runGoal(b.dataset.g);
    });
  } catch (e) { /* 会话未建立等场景静默 */ }
}

/** Stop the in-flight turn; first-message turns defer until the session id exists. */
function stopTurn() {
  if (sig) sig.stop = true;
  if (conv && conv.id) api('/interrupt', { method: 'POST', body: { session_id: conv.id } }).catch(() => {});
  else pendingInterrupt = true;
}

function send() {
  if (busy) {
    stopTurn();
    return;
  }
  const q = ta.value.trim();
  if (!q && !ATTS.length) return;
  // 附件还在上传：提示并保留输入，不吞掉用户文字
  if (ATTS.some(a => a.loading)) { toast(t('att_uploading')); return; }
  // 插件命令：/name <参数> → 展开模板后作为提示词发送
  for (const pc of (PLUGIN_CMDS || [])) {
    const re = new RegExp('^/' + pc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s+([\\s\\S]*))?$', 'i');
    const m = q.match(re);
    if (m && !ATTS.length) {
      ta.value = '';
      fit();
      slClose();
      run(pc.template.replace(/\{\{\s*input\s*\}\}/g, (m[1] || '').trim()));
      return;
    }
  }
  // 斜杠命令不进模型：/compact 压缩上下文；/goal 持久目标；/status 服务状态
  const cmd = q.match(/^\/(compact|goal|status)(?:\s+([\s\S]*))?$/i);
  if (cmd && !ATTS.length) {
    ta.value = '';
    fit();
    slClose();
    const k = cmd[1].toLowerCase();
    if (k === 'compact') runCompact();
    else if (k === 'status') runStatus();
    else runGoal((cmd[2] || '').trim());
    return;
  }
  ta.value = '';
  fit();
  slClose();
  run(q);
}

const fit = () => {
  ta.style.height = '24px';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
};

ta.addEventListener('input', () => { fit(); sync(); slRender(); });
ta.addEventListener('keydown', e => {
  if (SLOPEN) {
    if (e.key === 'ArrowDown') { e.preventDefault(); slIdx = (slIdx + 1) % slItems.length; slPaint(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); slIdx = (slIdx - 1 + slItems.length) % slItems.length; slPaint(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && !e.isComposing)) {
      e.preventDefault(); slPick(slItems[slIdx]); return;
    }
    if (e.key === 'Escape') { e.preventDefault(); slClose(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
sd.onclick = send;

feed.addEventListener('click', e => {
  // ---- 用户消息 ----
  const ue = e.target.closest('[data-ue]');
  if (ue) { editUser(ue.closest('.u')); return; }
  const uc = e.target.closest('[data-uc]');
  if (uc) {
    const m = uc.closest('.u');
    copyText(m ? m.querySelector('.ub').innerText : '');
    return;
  }
  const ud = e.target.closest('[data-ud]');
  if (ud) { deleteMsg(ud.closest('.u')); return; }

  // ---- agent 消息 ----
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.closest('.a'), k = b.dataset.a;
  if (k === 'copy') {
    copyText(a.querySelector('.ab').innerText);
  } else if (k === 're' && !busy && conv && conv.id) {
    regenFrom(a);
  } else if (k === 'edit') {
    editAgent(a);
  } else if (k === 'del') {
    deleteMsg(a);
  }
});

/**
 * Copy text to the clipboard. Resolves true on success (toast 已复制 unless
 * silent), false on failure (toast 复制失败 — never fake success).
 */
function copyText(s, silent) {
  const ok = () => { if (!silent) toast(t('copied')); return true; };
  const fail = () => { toast(t('copy_fail')); return false; };
  const legacy = () => {
    try {
      const t2 = document.createElement('textarea');
      t2.value = s;
      t2.style.cssText = 'position:fixed;opacity:0';
      document.body.append(t2);
      t2.select();
      const done = document.execCommand('copy');
      t2.remove();
      return done ? ok() : fail();
    } catch (x) { return fail(); }
  };
  try {
    return navigator.clipboard.writeText(s).then(ok, legacy);
  } catch (x) {
    return Promise.resolve(legacy());
  }
}

/** Collapse `el` to zero height and remove it. */
function collapseGone(el, done) {
  el.style.overflow = 'hidden';
  el.style.height = el.offsetHeight + 'px';
  void el.offsetHeight;
  el.style.transition = 'height .32s cubic-bezier(.4,0,.2,1),opacity .26s,margin .32s,padding .32s';
  el.style.height = '0px';
  el.style.opacity = '0';
  el.style.margin = '0';
  el.style.padding = '0';
  setTimeout(() => { el.remove(); if (done) done(); }, 330);
}

/**
 * Delete a message from the thread and from the session store.
 * A user bubble is one stored message; an assistant bubble spans a whole
 * group of them (assistant steps + merged tool results), so its range is
 * [mi, miEnd). Deleting the visible bubble deletes exactly that range.
 */
async function deleteMsg(el) {
  if (!el || busy) return;   // 生成中不动消息，避免与在途下标错位
  const z = S.lang === 'zh';
  // 删除不可恢复，确认一下
  if (!(await confirmBox(z ? '确定删除这条消息？' : 'Delete this message?', { danger: false }))) return;
  const idx = el.dataset.mi;
  collapseGone(el, restamp);
  if (conv && conv.id && idx != null && idx !== 'null') {
    const from = +idx;
    const to = el.dataset.miEnd != null && el.dataset.miEnd !== 'null' ? +el.dataset.miEnd : from + 1;
    api('/sessions/' + conv.id + '/messages', {
      method: 'DELETE', body: { from, to }
    }).catch(() => {});
  }
}

/**
 * Edit a user message in place. The text is pushed back into the composer and
 * the message — plus everything after it — is dropped from thread and store,
 * so the next send starts a clean branch from here.
 */
function editUser(el) {
  if (!el || busy) return;
  const c = el.querySelector('.ub').cloneNode(true);
  c.querySelectorAll('.uatt').forEach(n => n.remove());
  ta.value = c.innerText;
  fit();
  sync();
  ta.focus();
  const idx = el.dataset.mi;
  if (conv && conv.id && idx != null && idx !== 'null') {
    api('/sessions/' + conv.id + '/messages', {
      method: 'DELETE', body: { from: +idx }
    }).catch(() => {});
  }
  collapseGone(el, restamp);
  let n = el.nextElementSibling;
  while (n) { const nx = n.nextElementSibling; n.remove(); n = nx; }
  toast(t('editmsg'));
}

/**
 * Edit an agent message's answer text in place and persist it.
 * Only the prose is editable: thinking blocks and tool cards are execution
 * history — folding them into the text would turn tool output into the
 * agent's own words once saved.
 */
function editAgent(el) {
  if (!el || busy) return;
  const body = el.querySelector('.ab');
  const idx = el.dataset.mi;
  const miEnd = el.dataset.miEnd;
  const fallback = [...body.children]
    .filter(k => !k.classList.contains('ec') && !k.classList.contains('th') && !k.classList.contains('wf'))
    .map(k => k.innerText).join('\n\n').trim();
  const current = (el.dataset.raw || fallback).trim();
  // 执行过程（思考块、工具卡片，可能收在 .wf 折叠里）原样保留，只换正文。
  const keep = [...body.children].filter(k =>
    k.classList.contains('ec') || k.classList.contains('th') || k.classList.contains('wf'));
  const box = document.createElement('textarea');
  box.className = 'tx';
  box.rows = Math.min(18, current.split('\n').length + 2);
  box.value = current;
  box.style.cssText = 'width:100%;font:14px/1.6 var(--sans);margin:6px 0';
  body.innerHTML = '';
  body.append(box);
  const bar = document.createElement('div');
  bar.className = 'macts';
  bar.style.cssText = 'opacity:1;transform:none;justify-content:flex-start';
  bar.innerHTML = '<button class="btn" data-save>' + t('save') + '</button>' +
                  '<button class="btn" data-cancel>' + t('close') + '</button>';
  body.append(bar);
  box.focus();
  const rebuild = (text) => {
    body.innerHTML = '';
    keep.forEach(k => body.append(k));
    renderBlocks(body, text);
  };
  const save = () => {
    const v = box.value;
    el.dataset.raw = v;
    rebuild(v);
    if (conv && conv.id && idx != null && idx !== 'null') {
      api('/sessions/' + conv.id + '/messages/' + idx, {
        method: 'PATCH',
        body: { text: v, ...(miEnd != null && miEnd !== 'null' ? { to: +miEnd } : {}) }
      }).catch(err => toast(err.message));
    }
    toast(t('saved'));
  };
  bar.querySelector('[data-save]').onclick = save;
  bar.querySelector('[data-cancel]').onclick = () => rebuild(current);
  box.onkeydown = ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
    if (ev.key === 'Escape') { ev.preventDefault(); rebuild(current); }
  };
}

/**
 * Truncate the thread from `el` on and re-run the model on what's left — the
 * history then ends with the user's question again and the reply is a fresh
 * generation (POST /chat with retry: nothing new is appended).
 */
function regenFrom(el) {
  if (!el || busy || !conv || !conv.id) return;
  const idx = el.dataset.mi;
  if (idx == null || idx === 'null') { toast(t('toast')); return; }
  const from = +idx;
  let n = el;
  while (n) { const nx = n.nextElementSibling; n.remove(); n = nx; }
  resetTurn();
  busy = true;
  sig = { stop: false };
  sync();
  api('/sessions/' + conv.id + '/messages', {
    method: 'DELETE', body: { from }
  }).then(() => api('/chat', {
    method: 'POST',
    body: {
      session_id: conv.id,
      text: '',
      retry: true,
      model: S.model,
      permission_mode: S.perm,
      thinking_level: S.lvl
    }
  })).then(() => {
    restamp();
  }).catch(err => {
    busy = false;
    sync();
    toast(err.message);
  });
}


/* ---------------------------------------------------------------- attachments */
const fileIn = $('#fileIn');
$('#attbtn').onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ''; };

/**
 * 选择 / 拖入文件后先上传到 POST /api/attachments?name=<encodeURIComponent>，
 * 成功后把返回的 {path, kind, name, size} 存进 ATTS；发送时 chat 请求带
 * [{path, name, size}]（Attachment serde 结构）。上传失败 toast 并从列表移除，
 * 阻止发送。不再依赖浏览器 File.path（该字段根本不存在）。
 */
async function addFiles(list) {
  for (const f of [...list]) {
    if (ATTS.length >= 6) break;
    if (ATTS.some(x => x.name === f.name && x.size === f.size)) continue;
    const att = { name: f.name, size: f.size, type: f.type, path: '', kind: 'file', loading: true, url: null };
    ATTS.push(att);
    renderAtts();
    sync();
    try {
      const res = await fetch('/api/attachments?name=' + encodeURIComponent(f.name), {
        method: 'POST',
        headers: { 'X-Parable-Token': TOKEN },
        body: f
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.path) {
        throw new Error((data && data.error) || (res.status + ' ' + res.statusText));
      }
      att.path = data.path;
      att.kind = data.kind || 'file';
      att.loading = false;
      // 图片附件本地预览：objectURL 只在浏览器内存里，刷新前有效
      if (att.kind === 'image' && typeof URL.createObjectURL === 'function') {
        att.url = URL.createObjectURL(f);
      }
    } catch (e) {
      const i = ATTS.indexOf(att);
      if (i >= 0) ATTS.splice(i, 1);
      renderAtts();
      sync();
      toast(t('att_fail') + e.message);
      continue;
    }
    renderAtts();
    sync();
  }
}

function renderAtts() {
  const el = $('#atts');
  el.innerHTML = ATTS.map((a, i) =>
    '<span class="att' + (a.loading ? ' upl' : '') + '">' +
    (a.url ? '<img class="attimg" alt="">' : ic('file')) +
    '<b></b>' + (a.loading ? '<span class="upltxt">…</span>' : '') +
    '<span class="x" data-ax="' + i + '">×</span></span>'
  ).join('');
  el.querySelectorAll('.att').forEach((s, i) => {
    const a = ATTS[i];
    const im = s.querySelector('.attimg');
    if (im) im.src = a.url;
    s.querySelector('b').textContent = a.name + (a.loading ? ' · ' + t('att_uploading') : '');
  });
}
$('#atts').onclick = e => {
  const x = e.target.closest('[data-ax]');
  if (x) {
    const gone = ATTS.splice(+x.dataset.ax, 1)[0];
    if (gone && gone.url) { try { URL.revokeObjectURL(gone.url); } catch (err) {} }
    renderAtts();
    sync();
  }
};

document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', e => {

});

/* ==================================================================
   sidebar / sessions
   ================================================================== */
function fmtAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - (ts || 0)) / 1000));
  if (s < 60) return t('ago_now');
  if (s < 3600) return t('ago_m').replace('{n}', Math.floor(s / 60));
  if (s < 86400) return t('ago_h').replace('{n}', Math.floor(s / 3600));
  return t('ago_d').replace('{n}', Math.floor(s / 86400));
}

/**
 * Order the session list.
 *
 * Uses CSS `order` instead of re-appending the nodes: Chromium restarts a
 * CSS animation when its element is moved in the DOM, so re-appending made
 * the whole column flash again after every sort (the "second wave" the user
 * saw after deleting a conversation).
 */
function sortRcs() {
  const p = $('#rcp'), u = $('#rcu'), a = $('#rca');
  if (!p || !u) return;
  const key = e => +(e.dataset.pinAt || e.dataset.ts || 0);
  const pList = [...p.querySelectorAll('.rc')].sort((a, b) => key(b) - key(a));
  const uList = [...u.querySelectorAll('.rc')].sort((a, b) => +(b.dataset.ts || 0) - +(a.dataset.ts || 0));
  const aList = a ? [...a.querySelectorAll('.rc')].sort((a, b) => +(b.dataset.ts || 0) - +(a.dataset.ts || 0)) : [];
  // order 值越小越靠前；用索引取负保证「最新在上」
  pList.forEach((e, i) => { e.style.order = -pList.length + i; });
  uList.forEach((e, i) => { e.style.order = -uList.length + i; });
  aList.forEach((e, i) => { e.style.order = -aList.length + i; });
  p.hidden = !pList.length;
  if (a) a.hidden = !aList.length;
}

function refreshTimes() {
  document.querySelectorAll('#rcs .rc').forEach(el => {
    if (el.dataset.ts) el.querySelector('.rcd').textContent = fmtAgo(+el.dataset.ts);
  });
}

function addRc(c) {
  const d = document.createElement('div');
  d.className = 'rc';
  d.dataset.ts = c.ts || Date.now();
  d.dataset.id = c.id;
  d.innerHTML = '<span class="rci">' + ic('pin') + '</span><span class="rct"></span>' +
    '<span class="rcmeta"><span class="rcdt"></span><span class="rcd"></span></span>';
  d.querySelector('.rct').textContent = noEmoji(c.t);   // 标题里的 emoji 也要去掉
  d.querySelector('.rcd').textContent = fmtAgo(+d.dataset.ts);
  if (c.arch) { d.classList.add('arch'); $('#rca').append(d); }
  else if (c.pin) { d.classList.add('pin'); d.dataset.pinAt = c.pinAt || Date.now(); $('#rcp').append(d); }
  else $('#rcu').append(d);
  // 入场动画：一次性 CSS animation（.in）。sortRcs 用 CSS order 排序、
  // 不移动节点，所以这里不会因重排而重播。
  d.classList.add('in');
  d.onclick = () => openSession(c.id);
  d.oncontextmenu = e => {
    e.preventDefault();
    e.stopPropagation();
    openChatMenu(c, d, e.clientX, e.clientY);
  };
  if (conv && conv.id === c.id) {
    document.querySelectorAll('.rc.on').forEach(x => x.classList.remove('on'));
    d.classList.add('on');
  }
  sortRcs();
  return d;
}

/* 会话列表分页：一次只渲染前 N 条，避免上千个会话把侧栏拖死。 */
let sessLimit = 200;
let sessTotal = 0;
let sessLimited = false;

async function loadSessions(quiet) {
  try {
    const res = await api('/sessions?limit=' + sessLimit);
    const list = res.sessions || [];
    sessTotal = res.total || list.length;
    sessLimited = !!res.limited;
    CONVS = list.map(s => ({
      id: s.id, t: s.title, ts: s.updated_at || s.created_at,
      pin: s.pinned, pinAt: s.updated_at, group: s.group, arch: !!s.archived
    }));
    // 按 dataset.id diff：已存在的节点原位复用（只更新标题/置顶/归档态），
    // 只给真正新增的节点加 .in 入场动画，避免每次刷新整列重播。
    const seen = new Set();
    CONVS.forEach(c => {
      seen.add(c.id);
      let el = document.querySelector('#rcs .rc[data-id="' + c.id + '"]');
      if (el) {
        el.querySelector('.rct').textContent = noEmoji(c.t);
        if (c.ts) el.dataset.ts = c.ts;
        el.classList.remove('in');
        el.classList.toggle('arch', !!c.arch);
        el.classList.toggle('pin', !!c.pin && !c.arch);
        if (c.pin && !c.arch) el.dataset.pinAt = c.pinAt || el.dataset.pinAt || '';
        else delete el.dataset.pinAt;
      } else {
        el = addRc(c);
      }
      // 归档态变化时挪组（置顶/归档互斥）
      const want = c.arch ? $('#rca') : (c.pin ? $('#rcp') : $('#rcu'));
      if (el.parentElement !== want) {
        el.classList.remove('in');
        want.append(el);
      }
    });
    ['rcp', 'rcu', 'rca'].forEach(g => {
      document.querySelectorAll('#' + g + ' .rc').forEach(el => {
        if (!seen.has(el.dataset.id)) el.remove();
      });
    });
    sortRcs();
    refreshTimes();
    renderMoreBtn();
  } catch (e) {
    if (!quiet) toast(e.message);
  }
}

/** 侧栏底部的「加载更多」按钮（还有未显示的会话时才出现）。 */
function renderMoreBtn() {
  const host = $('#rcu');
  if (!host) return;
  let btn = $('#rcmore');
  if (!sessLimited) {
    if (btn) btn.remove();
    return;
  }
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'rcmore';
    btn.className = 'rcmore';
    btn.onclick = async () => {
      sessLimit = Math.min(sessLimit + 200, 1000);
      await loadSessions(true);
    };
    host.parentElement.append(btn);
  }
  const shown = CONVS.length;
  btn.textContent = (S.lang === 'zh' ? '加载更多（' : 'Load more (') +
    shown + '/' + sessTotal + (S.lang === 'zh' ? '）' : ')');
}

let openTok = 0;   // openSession 竞态令牌：连点两个会话时旧请求直接作废
async function openSession(id, focusMsg) {
  const my = ++openTok;
  try {
    const res = await api('/sessions/' + id + '/messages');
    if (my !== openTok) return;
    go(null);
    if (busy && sig) sig.stop = true;
    busy = false;
    pendingInterrupt = false;
    // busy 变了发送键的图标也得跟着变，否则切到别的对话还挂着停止键
    sync();
    if (document.body.classList.contains('chat')) {
      feed.classList.add('fo');
      $('#ttl').classList.add('fo');
      await sleep(A(300));
      if (my !== openTok) return;
    }
    conv = { id, title: (CONVS.find(c => c.id === id) || {}).t || '' };
    ignoreSid = '';
    feed.innerHTML = '';
    resetTurn();
    document.body.classList.add('chat');
    $('#ttl').textContent = noEmoji(conv.title);
    document.querySelectorAll('.rc.on').forEach(e => e.classList.remove('on'));
    const el = document.querySelector('.rc[data-id="' + id + '"]');
    if (el) el.classList.add('on');

    const msgs = res.messages || [];
    // Rebuild the transcript as one continuous flow: user text bubbles, and
    // assistant turns whose thinking / tool cards / answer keep their order.
    const cardById = {};
    let a = null, ab = null;
    const ensureA = () => {
      if (!a) { a = aMsg(); ab = a.querySelector('.ab'); }
      return ab;
    };
    const closeA = () => {
      if (a) { setActs(a, true); a = null; ab = null; }
    };

    for (const m of msgs) {
      const parts = normParts(m.parts);
      const results = parts.filter(p => p.k === 'result');
      const texts = parts.filter(p => p.k === 'text');

      if (m.role === 'user') {
        // A user message is either the human's question, or a batch of tool results.
        if (texts.length) {
          closeA();
          uMsg(texts.map(x => x.text).join('\n\n'), null, []);
        }
        results.forEach((r, i) => {
          const display = (m.displays && m.displays[i]) ||
            { kind: 'plain', text: r.text || '' };
          let card = cardById[r.id];
          if (!card) {
            card = toolCard(ensureA(), r.id, 'tool', '');
            cardById[r.id] = card;
          }
          fillToolCard(card, display, !r.error, card.querySelector('.fi b').textContent);
        });
        continue;
      }

      for (const p of parts) {
        if (p.k === 'think') {
          const th = document.createElement('div');
          th.className = 'th';
          th.innerHTML = '<button class="thh"><span></span>' + ic('chev') +
            '</button><div class="thb"><div class="thbody"></div></div>';
          th.querySelector('.thh').onclick = () => th.classList.toggle('open');
          th.querySelector('.thh span').textContent = t('thought').replace('{n}', 1);
          th.querySelector('.thbody').textContent = p.text || '';
          ensureA().append(th);
        } else if (p.k === 'tool') {
          const card = toolCard(ensureA(), p.id, p.name, toolTitle(p.name, p.args));
          cardById[p.id] = card;
        } else if (p.k === 'text') {
          // 与实时视图一致：走整块 markdown 渲染（instant，无逐字动画），
          // 不再用 inline() 拍平 —— 否则代码块/列表在历史里全变成纯文本。
          renderBlocks(ensureA(), p.text || '');
        }
      }
    }
    closeA();
    feed.classList.remove('fo');
    $('#ttl').classList.remove('fo');
    stick = true;
    chat.scrollTop = chat.scrollHeight;
    apply();
    refreshGoalBadge();
    // 从搜索结果跳进来：滚动到命中的那条消息并高亮一下。
    // restamp 是异步的（下标回填要拉一次存储），所以等它跑完再定位。
    await restamp();
    if (focusMsg != null) {
      const hit = feed.querySelector('[data-mi="' + focusMsg + '"]');
      if (hit) {
        hit.scrollIntoView({ block: 'center', behavior: 'smooth' });
        hit.classList.add('flash');
        setTimeout(() => hit.classList.remove('flash'), 1600);
      }
    }
    // 切走期间该会话的 turn 还在跑（SHADOW 记账 / INFLIGHT 在途标记）：
    // 恢复流式 UI——否则 sig 还挂着 stop、curA 是空的，后续 delta 无处追加。
    const sh = SHADOW[id];
    if (sh || INFLIGHT[id]) {
      busy = true;
      sig = { stop: false };
      sync();
      startTurnUI();
      // 先按序重放在途事件：思考块与工具卡片必须回到原位，否则切回来
      // 只剩最后一段正文，思考过程看起来被截断。
      if (sh && sh.events && sh.events.length) {
        for (const e of sh.events) replayEvent(e);
      }
      // 在途文本作为已提交块直接渲染，不逐字动画——逐字会让几百个字符
      // 各自排队 1 秒的 pop，视觉上像卡住。
      if (sh && sh.text.trim()) {
        curStream = null;
        curThinkEl = null;
        renderBlocks(curA.querySelector('.ab'), sh.text);
        curText = sh.text;
        follow();
      }
    }
  } catch (e) {
    toast(e.message);
  }
}

/**
 * Re-derive the store indices of every rendered message.
 *
 * One assistant bubble spans several stored messages (assistant steps plus the
 * merged tool-result messages between them), so each node carries the range
 * [mi, miEnd) and — for assistant bubbles — the concatenated answer text in
 * `raw`. Edit / delete / regenerate all address the store by these stamps,
 * which is why every mutation and every finished turn re-runs this.
 */
async function restamp() {
  if (!conv || !conv.id) return;
  let msgs;
  try {
    msgs = (await api('/sessions/' + conv.id + '/messages')).messages || [];
  } catch (e) { return; }
  const nodes = [...feed.children]
    .filter(n => n.classList.contains('u') || n.classList.contains('a'));
  nodes.forEach(n => { delete n.dataset.mi; delete n.dataset.miEnd; delete n.dataset.raw; });
  // 下标回填成功后重新点亮编辑/删除/重试按钮（渲染时 idx 未知会先挂 .off）
  const light = n => n.querySelectorAll('.ib.off').forEach(b => b.classList.remove('off'));
  let ni = 0;
  for (let i = 0; i < msgs.length && ni < nodes.length; i++) {
    const m = msgs[i];
    const tx = normParts(m.parts).filter(p => p.k === 'text');
    const node = nodes[ni];
    if (m.role === 'user' && tx.length) {
      if (!node.classList.contains('u')) break;   // DOM 与存储脱节，别乱贴
      node.dataset.mi = i;
      node.dataset.miEnd = i + 1;
      light(node);
      ni++;
    } else if (node.classList.contains('a')) {
      if (node.dataset.mi === undefined) {
        node.dataset.mi = i;
        node.dataset.raw = '';
      }
      node.dataset.miEnd = i + 1;
      light(node);
      if (m.role === 'assistant' && tx.length) {
        const add = tx.map(x => x.text).join('\n\n');
        node.dataset.raw = node.dataset.raw ? node.dataset.raw + '\n\n' + add : add;
      }
    } else {
      break;
    }
  }
}

/**
 * turn.end 兜底：以存储为准重渲染最后一个助手气泡的答案文本。
 * 流式期间在途文本只活在 DOM 里——切换会话、SSE 断连重连、渲染中的任何
 * 异常都可能让尾部丢失。收尾时存储已经完整，直接对齐它，保证用户看到的
 * 最终答案不缺尾巴。错误提示（红字）和压缩提示（内联样式）保留不删。
 */
async function reconcileTail() {
  if (!conv || !conv.id) return;
  try {
    const msgs = (await api('/sessions/' + conv.id + '/messages')).messages || [];
    // 从尾部收集最后一条用户提问之后所有 assistant 的文本——
    // 正是最后一个气泡对应的存储范围，不依赖 restamp 的异步回填。
    const txts = [];
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      const parts = normParts(m.parts);
      if (m.role === 'user') {
        if (parts.some(p => p.k === 'text')) break;   // 问句边界，停
        continue;                                     // 工具结果批次，继续向上
      }
      const t = parts.filter(p => p.k === 'text').map(p => p.text).join('\n\n');
      if (t.trim()) txts.unshift(t);
    }
    const want = txts.filter(Boolean).join('\n\n');
    const as = [...feed.querySelectorAll(':scope > .a')];
    const lastA = as[as.length - 1];
    if (!lastA || !want.trim()) return;
    const ab = lastA.querySelector('.ab');
    if (!ab) return;
    [...ab.children].forEach(k => {
      const c = k.classList;
      if (k.style && k.style.color) return;           // 错误/提示行保留
      if (!c.contains('ec') && !c.contains('th') && !c.contains('wf')) k.remove();
    });
    renderBlocks(ab, want);
  } catch (e) { /* 存储读取失败就放弃校正 */ }
}

/**
 * Neutral Msg JSON -> an ordered list of parts.
 * Keeping document order matters: the model interleaves thinking, tool calls
 * and text, and the transcript must reproduce that sequence.
 */
function normParts(v) {
  const out = [];
  if (!v) return out;
  const key = v.User ? 'User' : (v.Assistant ? 'Assistant' : null);
  if (!key) return out;
  for (const p of (v[key] || [])) {
    if (typeof p === 'string') { out.push({ k: 'text', text: p }); continue; }
    if (p.Text !== undefined) out.push({ k: 'text', text: p.Text });
    else if (p.Thinking) {
      out.push({ k: 'think', text: typeof p.Thinking === 'string' ? p.Thinking : (p.Thinking.text || '') });
    } else if (p.ToolUse) {
      out.push({ k: 'tool', id: p.ToolUse.id, name: p.ToolUse.name, args: p.ToolUse.args || {} });
    } else if (p.ToolResult) {
      out.push({
        k: 'result',
        id: p.ToolResult.id,
        text: p.ToolResult.content || '',
        error: !!p.ToolResult.is_error
      });
    }
  }
  return out;
}

/** Short human label for a tool call, derived from its arguments. */
function toolTitle(name, args) {
  if (name === 'bash') return 'Ran `' + String(args.command || '').slice(0, 70) + '`';
  if (name === 'read_file') return String(args.path || '');
  if (name === 'write_file' || name === 'edit_file') return String(args.path || '');
  if (name === 'glob') return String(args.pattern || '');
  if (name === 'grep') return String(args.pattern || '');
  if (name === 'list_dir') return String(args.path || '.');
  if (name === 'web_fetch') return String(args.url || '');
  if (name === 'web_search') return '“' + String(args.query || '') + '”';
  if (name === 'todo_write') return 'plan';
  // 团队工具：标题取最有信息量的那个参数
  if (name === 'spawn_agent') return String(args.label || args.name || '');
  if (name === 'agent_wait') return String(args.agent || '');
  if (name === 'agent_interrupt') return String(args.id || '');
  if (name === 'team_task_create') return String(args.subject || '');
  if (name === 'team_task_get') return String(args.task_id || '');
  if (name === 'team_task_update') return String(args.task_id || '');
  return name || '';
}

function renameChat(c, el) {
  const box = el && el.querySelector('.rct');
  if (!box || box.querySelector('.rc-in')) return;
  const old = c.t, inp = document.createElement('input');
  inp.className = 'rc-in';
  inp.value = old;
  inp.spellcheck = false;
  box.textContent = '';
  box.append(inp);
  inp.focus();
  inp.select();
  let done = false;
  const fin = ok => {
    if (done) return;
    done = true;
    const v = inp.value.trim(), nt = ok && v ? v : old;
    box.textContent = nt;
    if (conv && conv.id === c.id) $('#ttl').textContent = nt;
    if (nt !== old) {
      api('/sessions/' + c.id, { method: 'PATCH', body: { title: nt } })
        .then(() => toast(t('cm_renamed') || 'renamed'))
        .catch(() => {});
    }
  };
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); fin(true); }
    else if (e.key === 'Escape') { e.preventDefault(); fin(false); }
  };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = () => fin(true);
}

function deleteChat(c, el) {
  if (!el) return;
  // 删除会话不可恢复，先轻确认（双语）
  confirmBox(t('cf_del_chat')).then(ok => {
    if (!ok) return;
    el.style.height = el.offsetHeight + 'px';
    void el.offsetHeight;
    el.classList.add('out');
    setTimeout(() => {
      el.style.height = '0px';
      el.style.paddingTop = '0px';
      el.style.paddingBottom = '0px';
    }, A(360));
    setTimeout(() => {
      el.remove();
      sortRcs();
      if (conv && conv.id === c.id) newChat();
    }, A(760));
    api('/sessions/' + c.id, { method: 'DELETE' }).catch(() => {});
  });
}

CM.addEventListener('click', e => {
  if (!cmTarget) return;
  const { c, el } = cmTarget;
  const item = e.target.closest('[data-cm]');
  if (!item) return;
  const k = item.dataset.cm;
  const cp = s => { copyText(s); };
  if (k === 'pin') {
    const on = !el.classList.contains('pin');
    el.classList.toggle('pin', on);
    // Moving the node to the other group restarts its CSS animation in
    // Chromium; drop the entry class first so it does not flash again.
    el.classList.remove('in');
    if (on) { el.dataset.pinAt = Date.now(); $('#rcp').append(el); }
    else { delete el.dataset.pinAt; $('#rcu').append(el); }
    sortRcs();
    api('/sessions/' + c.id, { method: 'PATCH', body: { pinned: on } }).catch(() => {});
  } else if (k === 'arch') {
    // 走专用端点而不是 PATCH：后端会按 dsh 的 session-active 语义
    // 拒绝归档正在运行的会话，归档成功才动 DOM。
    const toArch = !(c.arch || el.classList.contains('arch'));
    closeChatMenu();
    api('/sessions/' + c.id + (toArch ? '/archive' : '/unarchive'), { method: 'POST', body: {} })
      .then(() => {
        c.arch = toArch;
        const cc = CONVS.find(x => x.id === c.id);
        if (cc) cc.arch = toArch;
        // 移动节点会重播 CSS 入场动画，先摘掉 .in（同置顶的处理）
        el.classList.remove('in');
        if (toArch) {
          el.classList.add('arch');
          el.classList.remove('pin');
          delete el.dataset.pinAt;
          $('#rca').append(el);
          // dsh：归档当前打开的会话时清空选中
          if (conv && conv.id === c.id) newChat();
        } else {
          el.classList.remove('arch');
          if (el.classList.contains('pin')) { el.dataset.pinAt = c.pinAt || Date.now(); $('#rcp').append(el); }
          else $('#rcu').append(el);
        }
        sortRcs();
        toast(t(toArch ? 'arch_done' : 'unarch_done'));
      })
      .catch(err => toast(err.message));
    return;
  } else if (k === 'rename') {
    closeChatMenu();
    setTimeout(() => renameChat(c, el), 0);
    return;
  } else if (k === 'delete') {
    closeChatMenu();
    deleteChat(c, el);
    return;
  } else if (k === 'cid') {
    cp(c.id || '');
  } else if (k === 'set') {
    closeChatMenu();
    openSet();
    return;
  }
  closeChatMenu();
});

/* ==================================================================
   export
   ================================================================== */
async function exportChat() {
  if (!conv) { toast(t('export_none')); return; }
  const title = $('#ttl').textContent || 'conversation';
  let md = '# ' + title + '\n\n';
  // 优先用服务端存储拼装（完整、与落盘一致）；失败降级为当前 DOM 快照
  let fromServer = false;
  if (conv.id) {
    try {
      const r = await api('/sessions/' + conv.id + '/messages');
      for (const m of (r.messages || [])) {
        const txt = normParts(m.parts).filter(p => p.k === 'text')
          .map(p => p.text).join('\n\n').trim();
        if (!txt) continue;
        md += (m.role === 'user' ? '## You\n\n' : '## Parable\n\n') + txt + '\n\n';
        fromServer = true;
      }
    } catch (e) { /* 降级 DOM */ }
  }
  if (!fromServer) {
    const walk = feed.querySelectorAll('.u, .a');
    walk.forEach(el => {
      if (el.classList.contains('u')) {
        md += '## You\n\n' + el.querySelector('.ub').innerText + '\n\n';
      } else {
        md += '## Parable\n\n' + el.querySelector('.ab').innerText + '\n\n';
      }
    });
  }
  try {
    const b = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.md';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast(t('exported'));
  } catch (err) { toast(t('toast')); }
}

/* ---- 搜索：会话内消息（服务端全文检索） ---- */
let cmdHits = [], cmdHitTimer = 0, cmdHitSeq = 0;

/** 高亮命中片段（服务端用 \u0001 包住命中段）。 */
function markExcerpt(s) {
  const parts = String(s || '').split('\u0001');
  return parts.map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

/** 拉取消息搜索结果（防抖 + 竞态丢弃）。 */
function cmdSearchMessages(q) {
  const seq = ++cmdHitSeq;
  if (cmdHitTimer) clearTimeout(cmdHitTimer);
  if (!q) { cmdHits = []; renderCmd(); return; }
  cmdHitTimer = setTimeout(async () => {
    try {
      const r = await api('/search/messages?q=' + encodeURIComponent(q));
      if (seq !== cmdHitSeq) return;   // 已有更新的查询，丢弃这次结果
      cmdHits = (r && r.hits) || [];
    } catch (e) {
      if (seq !== cmdHitSeq) return;
      cmdHits = [];
    }
    renderCmd();
  }, 180);
}

function renderCmd() {
  const q = cmdIn.value.trim();
  const ql = q.toLowerCase();
  const acts = cmdActions().filter(a => !ql || a.t.toLowerCase().includes(ql) || a.id.includes(ql));
  const cs = CONVS.filter(c => !c.arch && (!ql || (c.t || '').toLowerCase().includes(ql))).slice(0, 12);
  let html = '';
  cmdItems = [];
  if (acts.length) {
    html += '<div class="cmdg">' + t('actions') + '</div>';
    acts.forEach(a => {
      cmdItems.push({ run: a.run });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic(a.icon) + '</span><span class="tx2">' + esc(a.t) + '</span>' +
        (a.k ? '<span class="kb">' + a.k + '</span>' : '') + '</div>';
    });
  }
  if (cs.length) {
    html += '<div class="cmdg">' + t('rec') + '</div>';
    cs.forEach(c => {
      cmdItems.push({ run: () => openSession(c.id) });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic('chat') + '</span><span class="tx2">' + esc(c.t) + '</span>' +
        '<span class="kb">' + fmtAgo(c.ts) + '</span></div>';
    });
  }
  // 会话内消息命中
  if (ql && cmdHits.length) {
    html += '<div class="cmdg">' + t('in_msgs') + '</div>';
    cmdHits.slice(0, 20).forEach(h => {
      cmdItems.push({ run: () => openSession(h.session_id, h.index) });
      html += '<div class="cmdi" data-ci="' + (cmdItems.length - 1) + '">' +
        '<span class="ic2">' + ic(h.role === 'user' ? 'search' : 'chat') + '</span>' +
        '<span class="tx2"><span class="cmi">' + markExcerpt(h.excerpt) + '</span>' +
        '<span class="cms">' + esc(h.session_title || '') + '</span></span></div>';
    });
  }
  if (!cmdItems.length) html = '<div class="cmdempty">' + t('noresult') + '</div>';
  cmdL.innerHTML = html;
  cmdIdx = 0;
  cmdPaint();
}

function cmdPaint() {
  cmdL.querySelectorAll('.cmdi').forEach(el => el.classList.toggle('on', +el.dataset.ci === cmdIdx));
  const el = cmdL.querySelector('.cmdi.on');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function openCmd() {
  cmdK.classList.add('open');
  cmdIn.value = '';
  cmdIn.focus();
  renderCmd();
}
function closeCmd() { cmdK.classList.remove('open'); cmdIn.blur(); }

cmdIn.addEventListener('input', () => {
  renderCmd();
  cmdSearchMessages(cmdIn.value.trim());
});
cmdIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (cmdItems.length) { cmdIdx = (cmdIdx + 1) % cmdItems.length; cmdPaint(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdItems.length) { cmdIdx = (cmdIdx - 1 + cmdItems.length) % cmdItems.length; cmdPaint(); } }
  else if (e.key === 'Enter') { e.preventDefault(); const it = cmdItems[cmdIdx]; closeCmd(); it && it.run(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmd(); }
});
cmdL.addEventListener('click', e => {
  const el = e.target.closest('[data-ci]');
  if (!el) return;
  const it = cmdItems[+el.dataset.ci];
  closeCmd();

});

function tabIndex(k) {
  const items = (SC[k] || []).map(c => (t(c.l || '') + ' ' + (c.h ? t(c.h) : ''))).join(' ');
  return (t('s_' + k) + ' ' + items + ' ' + (TAB_KW[k] || '')).toLowerCase();

/** 按导航搜索词过滤分类按钮。 */
let navQ = '';
function navFilter() {
  const q = (navQ || '').trim().toLowerCase();
  let shown = 0;
  $('#snav').querySelectorAll('button[data-t]').forEach(b => {
    // 只按分类名过滤会让「搜说明里的词」找不到；用完整索引。
    const hit = !q || tabIndex(b.dataset.t).includes(q);
    b.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  // 每个分组独立显示/隐藏：组内一个都没命中就把组标题也藏起来。
  $('#snav').querySelectorAll('.sgrp').forEach(g => {
    let any = 0;
    let n = g.nextElementSibling;
    while (n && n.tagName === 'BUTTON') {
      if (n.style.display !== 'none') any++;
      n = n.nextElementSibling;
    }
    g.style.display = any ? '' : 'none';
  });
  // 命中的分类自动切过去，免得还要再点一次
  if (q && shown) {
    const first = [...$('#snav').querySelectorAll('button[data-t]')].find(b => b.style.display !== 'none');
    if (first && first.dataset.t !== tab) {
      tab = first.dataset.t;
      $('#snav').querySelectorAll('button[data-t]').forEach(b => b.classList.toggle('on', b === first));
      panel();
    }
  }
  // 面板内的命中项高亮并滚到可见位置
  markHits();
}

/** 面板内命中项高亮 + 滚动定位。 */
function markHits() {
  const p = $('#sp');
  if (!p) return;
  p.querySelectorAll('.sr,.card,.mp-field,.skr,.memc').forEach(e => e.classList.remove('hit'));
  const q = (navQ || '').trim().toLowerCase();
  if (!q) return;
  let first = null;
  p.querySelectorAll('.sr,.card,.mp-field,.skr,.memc').forEach(e => {
    if ((e.textContent || '').toLowerCase().includes(q)) {
      e.classList.add('hit');
      first = first || e;
    }
  });
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* ==================================================================
   使用统计（settings → usage）

const UCH = ['--uch1', '--uch2', '--uch3', '--uch4', '--uch5', '--uch6'];
/** 用量页状态：区间范围、热力图模式、趋势图模式、模型显示名缓存 */
let ugRange = '30d', ugHmMode = 'daily', ugTrendMode = 'stack', ugModelNames = {}, ugSnap = null;

/** 大数字格式化：中文用「万 / 亿」，英文用 K / M / B。 */
function fmtBig(n) {
  n = Number(n) || 0;
  const z = S.lang === 'zh';
  if (n < 1000) return String(n);
  if (z) {
    if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, '') + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' 万';
    return n.toLocaleString();
  }
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
/** 时长格式化（毫秒 → 天/小时/分钟）。 */
function fmtLongMs(ms) {
  ms = Number(ms) || 0;
  const d = Math.floor(ms / 86400000);
  const h = Math.floor(ms % 86400000 / 3600000);
  const m = Math.floor(ms % 3600000 / 60000);
  if (d > 0) return d + (S.lang === 'zh' ? ' 天' : 'd');
  if (h > 0) return h + (S.lang === 'zh' ? ' 小时' : 'h');
  if (m > 0) return m + (S.lang === 'zh' ? ' 分钟' : 'm');
  return Math.floor(ms / 1000) + (S.lang === 'zh' ? ' 秒' : 's');
}
/** 模型显示名：优先用供应商配置里的友好名。 */
function ugModelName(id) {
  if (id === '__legacy__') return t('ug_legacy');
  if (ugModelNames[id]) return ugModelNames[id];
  try {
    for (const p of (MPROV || [])) {
      const m = (p.models || []).find(x => x.id === id);
      if (m) { ugModelNames[id] = m.name || m.id; return ugModelNames[id]; }
    }
  } catch (e) { /* 供应商尚未加载，用裸 id */ }
  return id;
}

/* ------------------------------------------------------------ Token 构成 */

/**
 * Token 构成：输入 / 输出 / 缓存读 / 缓存写 的堆叠条 + 图例。
 * 缓存命中率高时，缓存读那一段会占掉大部分条宽——这正是要让人看见的。
 */
function ugComposition(sum) {
  const parts = [
    { k: 'inputTokens', c: '--uch1', l: 'ug_comp_in' },
    { k: 'outputTokens', c: '--uch2', l: 'ug_comp_out' },
    { k: 'cacheReadTokens', c: '--uch3', l: 'ug_comp_cr' },
    { k: 'cacheCreationTokens', c: '--uch5', l: 'ug_comp_cw' },
  ];
  const vals = parts.map(p => Number(sum[p.k]) || 0);
  const total = vals.reduce((a, b) => a + b, 0);
  if (!total) return '<div class="ug-empty">' + t('ug_comp_none') + '</div>';

  const bar = parts.map((p, i) => vals[i] > 0
    ? '<i style="width:' + (vals[i] / total * 100).toFixed(2) + '%;background:var(' + p.c + ')"></i>'
    : '').join('');

  const leg = parts.map((p, i) =>
    '<div><i style="background:var(' + p.c + ')"></i>' +
    '<span>' + t(p.l) + '</span>' +
    '<b>' + esc(fmtBig(vals[i])) + '</b>' +
    '<em>' + (total ? (vals[i] / total * 100).toFixed(1) : '0.0') + '%</em></div>').join('');

  const hit = Number(sum.cacheHitRate) || 0;
  const rate = '<div class="ug-peaks"><div class="ug-peak">' + t('tk_cache') +
    ' <b>' + (hit * 100).toFixed(1) + '%</b></div>' +
    '<div class="ug-peak">' + t('ug_total') + ' <b>' + esc(fmtBig(total)) + '</b></div></div>';

  return '<div class="ug-comp"><div class="ug-cbar">' + bar + '</div>' +
    '<div class="ug-cleg">' + leg + '</div>' + rate + '</div>';
}

/* ------------------------------------------------------------ 活跃时段 */

/**
 * 活跃时段：24 小时柱状图 + 星期条。
 * 小时轴按本地时间，0 点在最左。
 */
function ugActivity(act) {
  const hours = act.hours || [];
  const wdays = act.weekdays || [];
  if (!hours.length && !wdays.length) return '<div class="ug-empty">' + t('ug_empty') + '</div>';

  const maxH = Math.max(1, ...hours.map(h => Number(h.tokens) || 0));
  const hourBar = hours.map((h, i) => {
    const v = Number(h.tokens) || 0;
    const pct = v / maxH * 100;
    const tip = String(i).padStart(2, '0') + ':00 · ' + fmtBig(v) + ' ' + t('ug_tokens');
    return '<div class="ug-hour' + (v ? '' : ' zero') + '" title="' + esc(tip) + '">' +
      '<b>' + esc(tip) + '</b>' +
      '<i style="height:' + (v ? Math.max(3, pct) : 2) + '%"></i></div>';
  }).join('');

  const maxW = Math.max(1, ...wdays.map(d => Number(d.tokens) || 0));
  const wdNames = S.lang === 'zh'
    ? ['一', '二', '三', '四', '五', '六', '日']
    : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const wdBar = wdays.map((d, i) => {
    const v = Number(d.tokens) || 0;
    const tip = wdNames[i] + ' · ' + fmtBig(v) + ' ' + t('ug_tokens');
    return '<div class="ug-wday" title="' + esc(tip) + '">' +
      '<div class="b"><i style="width:' + (v / maxW * 100).toFixed(1) + '%"></i></div>' +
      '<span>' + esc(wdNames[i]) + '</span>' +
      '<em>' + esc(fmtBig(v)) + '</em></div>';
  }).join('');

  // 最活跃的小时 / 星期。全零时不报「峰值」，否则会把 00:00 / 周一
  // 当成真实结论展示出来。
  const argmax = (arr) => {
    let at = 0, best = -1;
    (arr || []).forEach((x, i) => {
      const v = Number(x && x.tokens) || 0;
      if (v > best) { best = v; at = i; }
    });
    return { at, best };
  };
  const ph = argmax(hours);
  const pw = argmax(wdays);

  const peaks = '<div class="ug-peaks">' +
    (ph.best > 0
      ? '<div class="ug-peak">' + t('ug_peak_hour') + ' <b>' + String(ph.at).padStart(2, '0') + ':00</b>' +
        ' <em>' + esc(fmtBig(ph.best)) + '</em></div>'
      : '') +
    (pw.best > 0
      ? '<div class="ug-peak">' + t('ug_peak_day') + ' <b>' + esc(wdNames[pw.at]) + '</b>' +
        ' <em>' + esc(fmtBig(pw.best)) + '</em></div>'
      : '') +
    '</div>';

  return '<div class="ug-act">' +
    '<div><div class="ug-hours">' + hourBar + '</div>' +
    '<div class="ug-haxis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>' +
    '<div><div class="ug-wdays">' + wdBar + '</div>' + peaks + '</div>' +
    '</div>';
}

/* -------------------------------------------------------- 用量最高的会话 */

/**
 * 用量最高的会话。点一行直接跳到那个会话。
 */
function ugTopSessions(list) {
  if (!list || !list.length) return '<div class="ug-empty">' + t('ug_tops_empty') + '</div>';
  const max = Math.max(1, ...list.map(s => Number(s.totalTokens) || 0));
  const rows = list.map((s, i) => {

    const title = s.title || t('ug_legacy');

      '<span class="rank">' + (i + 1) + '</span>' +
      '<div class="nm"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></div>' +

      '<span class="val">' + esc(fmtBig(s.totalTokens)) + '</span>' +
