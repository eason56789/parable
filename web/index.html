/* ---------------------------------------------------------------- 热力图 */

/**
 * 热力图。服务端给的是「按天」的格子，这里按模式重排：
 * 每天 = 原样；每周 = 每列一周（7 天求和）；累计 = 到该天为止的累计和。
 */
function ugHeatmap(hm) {
  const weeks = hm.weeks || [];
  if (!weeks.length) return '<div class="ug-empty">' + t('ug_empty') + '</div>';
  const mode = ugHmMode;

  // 摊平成「天」的列表：[{date, total, turns, level, void}]
  const cells = [];
  weeks.forEach(w => (w.days || []).forEach(c => {
    if (!c) { cells.push({ date: '', total: 0, turns: 0, level: 0, void: true }); return; }
    cells.push({ date: c.date, total: c.totalTokens || 0, turns: c.turnCount || 0, level: c.level || 0, void: false });
  }));
  const active = cells.filter(c => !c.void && c.total > 0).map(c => c.total).sort((a, b) => a - b);
  const dayMax = hm.maxTokens || (active.length ? active[active.length - 1] : 0);

  // 按模式重算每格的聚合值
  const vals = cells.map(c => c.total);
  if (mode !== 'daily') {
    if (mode === 'weekly') {
      for (let i = 0; i < vals.length; i += 7) {
        let sum = 0, has = false;
        for (let j = i; j < Math.min(i + 7, vals.length); j++) {
          if (cells[j].void) continue;
          has = true; sum += vals[j];
        }
        for (let j = i; j < Math.min(i + 7, vals.length); j++) {
          cells[j].total = has ? sum : 0;
        }
      }
    } else { // cumulative
      let run = 0;
      cells.forEach(c => {
        if (c.void) return;
        run += c.total;
        c.total = run;
      });
    }
  }

  // 色阶必须按「当前模式下聚合后的值」重新分位。拿日分位去比周和，
  // 几乎每一格都会落到最高档，色阶就废了。
  const agg = cells.filter(c => !c.void && c.total > 0).map(c => c.total).sort((a, b) => a - b);
  const q = p => agg.length ? agg[Math.min(agg.length - 1, Math.round((agg.length - 1) * p))] : 0;
  const [q1, q2, q3] = [q(.25), q(.5), q(.75)];
  const lvlOf = v => v <= 0 ? 0 : v <= q1 ? 1 : v <= q2 ? 2 : v <= q3 ? 3 : 4;
  cells.forEach(c => { if (!c.void) c.level = lvlOf(c.total); });
  const maxT = mode === 'daily'
    ? dayMax
    : (agg.length ? agg[agg.length - 1] : 0);

  const cols = Math.ceil(cells.length / 7);
  const grid = [];
  for (let w = 0; w < cols; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const c = cells[w * 7 + d];
      if (!c || c.void) { col.push('<i class="ug-hmc void"></i>'); continue; }
      const tip = mode === 'daily'
        ? t('ug_hm_tip').replace('{d}', c.date).replace('{t}', fmtBig(c.total)).replace('{n}', c.turns)
        : mode === 'weekly'
          ? t('ug_hm_week').replace('{d}', c.date).replace('{t}', fmtBig(c.total))
          : t('ug_hm_total').replace('{d}', c.date).replace('{t}', fmtBig(c.total));
      col.push('<i class="ug-hmc l' + c.level + '" title="' + esc(tip) + '"></i>');
    }
    grid.push('<div class="ug-hmw">' + col.join('') + '</div>');
  }

  // 月份标签：每列的起始日期跨月时打一个标签
  const labels = [];
  let lastMonth = -1;
  for (let w = 0; w < cols; w++) {
    const c = cells[w * 7];
    if (!c || !c.date) { labels.push('<span></span>'); continue; }
    const m = Number(c.date.slice(5, 7));
    if (m !== lastMonth) {
      lastMonth = m;
      labels.push('<span>' + esc(Number(c.date.slice(8, 10)) === 1 ? (m + '月') : (S.lang === 'zh' ? m + '月' : m.toString())) + '</span>');
    } else labels.push('<span></span>');
  }

  return '<div class="ug-hm">' + grid.join('') + '</div>' +
    '<div class="ug-hml">' + labels.join('') + '</div>' +
    '<div style="margin-top:10px;display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:11px">' +
    '<span>' + esc(t('ug_daily')) + '</span>' +
    '<i class="ug-hmc" style="width:10px;height:10px"></i><i class="ug-hmc l1"></i><i class="ug-hmc l2"></i><i class="ug-hmc l3"></i><i class="ug-hmc l4"></i>' +
    '<span>' + esc(fmtBig(maxT)) + '</span></div>';
}

/* ---------------------------------------------------------------- 趋势图 */

/**
 * 每日 Token 趋势图：一个模型一条折线（`line`），或按模型堆叠（`stack`）。
 * 纯 SVG（项目里没有图表库），坐标轴 + 网格线 + 折线。
 *
 * 折线按「该模型有数据的连续段」断开：中间没有数据的那天不连直线，
 * 否则一条稀疏的曲线会被画成横跨整张图的斜线。
 */
function ugTrend(daily) {
  if (!daily || !daily.length) return '<div class="ug-empty">' + t('ug_empty') + '</div>';
  const W = 720, H = 220, PL = 52, PR = 12, PT = 12, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const stack = ugTrendMode === 'stack';

  // 每个模型一条序列
  const series = new Map();
  daily.forEach((d, i) => {
    (d.models || []).forEach(m => {
      const id = m.modelId || '';
      if (!series.has(id)) series.set(id, new Array(daily.length).fill(0));
      series.get(id)[i] = m.totalTokens || 0;
    });
  });
  const ids = [...series.keys()].sort((a, b) => {
    const sa = series.get(a).reduce((x, y) => x + y, 0), sb = series.get(b).reduce((x, y) => x + y, 0);
    return sb - sa;
  });
  const maxV = Math.max(1, ...ids.flatMap(id => series.get(id)));
  const x = i => PL + (daily.length <= 1 ? iw / 2 : iw * i / (daily.length - 1));

  // 堆叠模式下 y 轴按「每日各模型之和」定标。
  const dayTotals = daily.map((_, i) => ids.reduce((s, id) => s + series.get(id)[i], 0));
  const scaleMax = stack ? Math.max(1, ...dayTotals) : maxV;
  const niceMax = niceCeil(scaleMax);
  const y = v => PT + ih - (v / niceMax) * ih;

  // 网格线 + y 轴标签
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = niceMax * k / 4, yy = y(v);
    g += '<line x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + yy.toFixed(1) +
      '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (PL - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--fg2)">' +
      esc(fmtBig(v)) + '</text>';
  }
  // x 轴日期标签（首、中、尾）
  const idxs = [0, Math.floor(daily.length / 2), daily.length - 1].filter((v, i, a) => a.indexOf(v) === i && v >= 0);
  idxs.forEach(i => {
    g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--fg2)">' +
      esc(String(daily[i].date || '').slice(5)) + '</text>';
  });

  // 堆叠时每个模型的 y 偏移是它下面所有模型之和。
  const base = new Array(daily.length).fill(0);
  let paths = '';
  ids.forEach((id, k) => {
    const col = 'var(' + UCH[k % UCH.length] + ')';
    const pts = series.get(id);
    // 拆成若干「连续有数据」的段，每段单独画一条折线。
    const segs = [];
    let cur = [];
    pts.forEach((v, i) => {
      if (v > 0) cur.push(i);
      else if (cur.length) { segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);

    segs.forEach(seg => {
      if (stack) {
        // 堆叠面积：上下沿各自成折线，闭合成一块。
        let up = '', down = '';
        seg.forEach((i, n) => {
          const y0 = y(base[i]), y1 = y(base[i] + pts[i]);
          up += (n ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y1.toFixed(1);
          down = ' L' + x(i).toFixed(1) + ' ' + y0.toFixed(1) + down;
        });
        paths += '<path d="' + up + down + ' Z" fill="' + col + '" fill-opacity=".22" stroke="' + col +
          '" stroke-width="1.5" stroke-linejoin="round"/>';
      } else {
        let d = '';
        seg.forEach((i, n) => {
          d += (n ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(pts[i]).toFixed(1);
        });
        paths += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
      }
    });
    if (stack) for (let i = 0; i < daily.length; i++) base[i] += pts[i];
  });

  const legend = ids.length
    ? '<div class="ug-legend">' + ids.map((id, k) =>
      '<span class="ug-lg"><i style="background:var(' + UCH[k % UCH.length] + ')"></i>' + esc(ugModelName(id)) + '</span>').join('') + '</div>'
    : '';

  return legend + '<svg class="ug-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">' +
    g + paths + '</svg>';
}

/** 取一个「好看」的坐标轴上界。 */
function niceCeil(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / e;
  const n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10;
  return n * e;
}

/* ---------------------------------------------------------------- 模型用量 */

/** 模型用量：环形图 + 排名列表。 */
function ugModelUsage(models) {
  if (!models || !models.length) return '<div class="ug-empty">' + t('ug_empty') + '</div>';
  // 历史会话（模型未知）不是真实模型，排到最后：它只是导入时补的桶，
  // 放在第一位会让人以为它是「最常用的模型」。
  const rank = (m) => (m.modelId === '__legacy__' ? 1 : 0);
  models = models.slice().sort((a, b) =>
    rank(a) - rank(b) || (b.totalTokens || 0) - (a.totalTokens || 0));
  const total = models.reduce((s, m) => s + (m.totalTokens || 0), 0);
  const R = 58, C = 2 * Math.PI * R, ST = 24;
  let off = 0, segs = '';
  models.forEach((m, k) => {
    const frac = total ? (m.totalTokens || 0) / total : 0;
    const len = frac * C;
    const col = 'var(' + UCH[k % UCH.length] + ')';
    segs += '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="' + ST +
      '" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 80 80)"/>';
    off += len;
  });
  const donut = '<svg class="ug-chart" viewBox="0 0 160 160" style="width:160px;height:160px;flex:none">' + segs +
    '<text x="80" y="76" text-anchor="middle" font-size="19" font-weight="600" fill="var(--fg)">' + esc(fmtBig(total)) + '</text>' +
    '<text x="80" y="94" text-anchor="middle" font-size="11" fill="var(--fg2)">' + esc(t('ug_tokens')) + '</text></svg>';

  const list = models.map((m, k) =>
    '<div class="ug-mu-i"><i style="background:var(' + UCH[k % UCH.length] + ')"></i>' +
    '<b>' + esc(ugModelName(m.modelId)) + '</b>' +
    '<span>' + esc((m.share * 100).toFixed(1)) + '%</span>' +
    '<em>' + esc(fmtBig(m.totalTokens)) + ' ' + esc(t('ug_tokens')) + '</em></div>').join('');

  return '<div class="ug-mu">' + donut + '<div class="ug-mu-l"></div><div class="ug-mu-r">' + list + '</div></div>';
}

/* ==================================================================
   SSE
   ================================================================== */
let es = null;
// 重连后 busy 看门狗：断连期间错过 turn.end 会把 busy 卡死。重连成功且仍
// busy 时启动 15s 静默计时，期间本端收到任何事件即解除；到点仍无事件视为
// turn 已死（或从未开始），复位 busy。只在「发生过断连」时武装，正常思考
// 停顿不受影响。
let busyWatchdog = null;
function disarmBusyWatchdog() { clearTimeout(busyWatchdog); busyWatchdog = null; }

/* ---- 事件丢失自愈 --------------------------------------------------
   SSE 走 broadcast：慢客户端会被缓冲甩掉事件（包括 turn.end）。那时
   连接还在、前端却以为还在生成 —— 界面永久停在「思考中」。
   这里主动向服务端核对：/api/turn/running 报告该会话没有 turn 在跑时，
   说明 turn 已经结束（只是收尾事件丢了），按 turn.end 收尾视图。
   与断连看门狗互补：那个依赖断连，这个不依赖。 */
let turnProbeTimer = null;
let turnProbeBusy = false;

function stopTurnProbe() {
  if (turnProbeTimer) { clearInterval(turnProbeTimer); turnProbeTimer = null; }
}

/** 启动轮询核对（每次 turn 开始时调用）。 */
function startTurnProbe() {
  stopTurnProbe();
  turnProbeTimer = setInterval(async () => {
    if (turnProbeBusy || !busy || !conv || !conv.id) return;
    turnProbeBusy = true;
    try {
      const r = await api('/turn/running?session=' + encodeURIComponent(conv.id));
      if (r && r.running === false) {
        // 服务端说没有 turn 在跑：收尾事件丢了，按 turn.end 补收尾。
        if (busy) {
          busy = false;
          if (curStream) sflush(curStream);
          finishThink(curThinkEl);
          curThinkEl = null;
          thinkStart = 0;
          if (curA) {
            stopSpin(curA);
            setActs(curA, true);
            foldFlow(curA, 0);
            reconcileTail();
          }
          sync();
          resetTurn();
          restamp();
        }
        stopTurnProbe();
      }
    } catch (e) {
      // 服务端不可达：等下一次轮询。
    } finally {
      turnProbeBusy = false;
    }
  }, 3000);
}

/** 收到 events.lost：服务端承认丢了事件，立刻重新同步。 */
async function onEventsLost(ev) {
  toast(t('conn_lost'));
  if (!conv || !conv.id) return;
  // 丢掉的事件可能包含整轮内容，用存储里的最终状态校正视图。
  try {
    await reconcileTail();
  } catch (e) { /* 忽略 */ }
}
function connectEvents() {
  if (es) { try { es.close(); } catch (e) {} }
  es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN));
  es.onmessage = e => {
    disarmBusyWatchdog();
    try { dispatch(JSON.parse(e.data)); } catch (err) {}
  };
  es.onopen = () => {
    // 重连成功：清空 seq 去重水位，恢复统计显示与挂起的权限面板；
    // 顺带纠正卡死的 busy（断连期间错过了 turn.end 且本端没有在途标记）。
    lastSeq = 0;
    connectEvents.warned = false;
    loadServerStatus();
    restorePending();
    if (busy && conv && conv.id) {
      if (!INFLIGHT[conv.id]) {
        busy = false;
        stopSpin(curA);
        sync();
        // 不在途却断过连：以存储校正一次收尾视图
        reconcileTail();
      } else {
        // INFLIGHT 还挂着：turn 可能在断连期间已结束。挂看门狗兜底；
        // turn 真还在跑时不动 DOM（reconcileTail 会拆掉在途流式节点）。
        disarmBusyWatchdog();
        busyWatchdog = setTimeout(() => {
          busyWatchdog = null;
          if (busy) {
            busy = false;
            stopSpin(curA);
            sync();
            reconcileTail();
          }
        }, 15000);
      }
    }
  };
  es.onerror = () => {
    // EventSource reconnects on its own; surface it once.
    if (!connectEvents.warned) {
      connectEvents.warned = true;
      toast(t('conn_lost'));
    }
    setTimeout(() => { connectEvents.warned = false; }, 4000);
  };
}

/**
 * 断线重连（以及 boot）后恢复：GET /api/pending 拿回挂起的权限请求，
 * 逐个重建工具卡片 + 权限面板（{id, tool, path, risk, reason, diffPreview}，
 * id 即事件里的 callId）。
 */
async function restorePending() {
  let list = [];
  try {
    const r = await api('/pending');
    list = r.permissions || [];
  } catch (e) { return; }
  for (const p of list) {
    const callId = p.id || p.callId;
    if (!callId || toolEls[callId]) continue;
    if (!curA) startTurnUI();
    const card = toolCard(curA.querySelector('.ab'), callId, p.tool, p.tool);
    toolEls[callId] = card;
    showPermPanel(card, callId, p);
  }
  if (list.length) follow();
}

/**
 * GET /api/status：恢复服务端配置驱动的显示（模型/权限模式/思考强度）。
 * boot 与每次 SSE 重连成功后调用。
 */
async function loadServerStatus() {
  try {
    const r = await api('/status');
    let dirty = false;
    if (r.model && r.model !== S.model) { S.model = r.model; dirty = true; }
    if (r.permissionMode && r.permissionMode !== S.perm) { S.perm = r.permissionMode; dirty = true; }
    if (r.thinkingLevel !== undefined && +r.thinkingLevel !== +S.lvl) { S.lvl = +r.thinkingLevel || 0; dirty = true; }
    if (dirty) apply(false);
  } catch (e) { /* 服务不可达时保持本地值 */ }
}

/* ==================================================================
   side pane — 右侧标签栏面板
   ================================================================== */

/** 侧边栏状态。tabs 是打开的标签,active 是当前标签 id。 */
const SP = { tabs: [], active: null, seq: 0, open: false };

/** 每个面板类型的展示信息：图标、标题键、描述键。 */
const SP_KIND = {
  files:    { ic: 'folder',   t: 'sp_files',    d: 'sp_files_h' },
  browser:  { ic: 'globe',    t: 'sp_browser',  d: 'sp_browser_h' },
  terminal: { ic: 'terminal', t: 'sp_term',     d: 'sp_term_h' },
  review:   { ic: 'git',      t: 'sp_review',   d: 'sp_review_h' },
  deploy:   { ic: 'art',      t: 'sp_deploy',   d: 'sp_deploy_h' },
  sidechat: { ic: 'chat',     t: 'sp_sidechat', d: 'sp_sidechat_h' },
  launcher: { ic: 'panel',    t: 'sp_title',    d: 'sp_title_h' }
};

/** 打开侧边栏（并保证至少有一个标签）。 */
function spShow() {
  document.body.classList.remove('sp0');
  SP.open = true;
  if (!SP.tabs.length) spAddTab();
  else spRender();
}

/** 折叠侧边栏。 */
function spHide() {
  document.body.classList.add('sp0');
  SP.open = false;
}

/** 在全屏与并排之间切换。 */
function spToggleMax() {
  document.body.classList.toggle('spmax');
  const b = $('#spbtn');
  if (b) b.title = document.body.classList.contains('spmax') ? t('sp_unmax') : t('sp_max');
}

/** 打开一个新的「新标签页」启动器标签。 */
function spAddTab() {
  document.body.classList.remove('sp0');
  SP.open = true;
  const tab = { id: 't' + (++SP.seq), kind: 'launcher', title: t('sp_title'), st: {} };
  SP.tabs.push(tab);
  SP.active = tab.id;
  spRender();
}

/** 打开某个面板类型的新标签。 */
function spOpen(kind, opts) {
  document.body.classList.remove('sp0');
  SP.open = true;
  const tab = { id: 't' + (++SP.seq), kind: kind, title: t(SP_KIND[kind].t), st: opts || {} };
  SP.tabs.push(tab);
  SP.active = tab.id;
  spRender();
  if (kind === 'sidechat') spSideChatInit(tab);
  return tab;
}

/** 关闭标签。 */
function spClose(id) {
  const i = SP.tabs.findIndex(x => x.id === id);
  if (i < 0) return;
  const tab = SP.tabs[i];
  // 释放标签占用的资源（终端的流式收集器等）。
  if (tab.st && tab.st.cleanup) { try { tab.st.cleanup(); } catch (e) {} }
  SP.tabs.splice(i, 1);
  if (SP.active === id) {
    SP.active = SP.tabs.length ? SP.tabs[SP.tabs.length - 1].id : null;
  }
  if (!SP.tabs.length) spHide();
  else spRender();
}

/** 切到某个标签。 */
function spSelect(id) {
  if (SP.active === id) return;
  SP.active = id;
  spRender();
}

/** 渲染标签栏与当前面板。 */
function spRender() {
  const tl = $('#sptl'), body = $('#spbody');
  if (!tl || !body) return;
  tl.innerHTML = SP.tabs.map(tb => {
    const k = SP_KIND[tb.kind] || SP_KIND.launcher;
    return '<button class="sptab' + (tb.id === SP.active ? ' on' : '') + '" data-sp="' + tb.id + '">' +
      ic(k.ic) + '<span class="t">' + esc(tb.title) + '</span>' +
      '<span class="x" data-spx="' + tb.id + '">' + ic('x') + '</span></button>';
  }).join('');
  const cur = SP.tabs.find(x => x.id === SP.active);
  body.innerHTML = '';
  if (!cur) return;
  const R = spRenderers[cur.kind];
  if (!R) { body.innerHTML = '<div class="spempty">' + esc(t('sp_empty_fs')) + '</div>'; return; }
  R(body, cur);
}

/** 各面板的渲染函数。 */
const spRenderers = {
  launcher: (host, tab) => spRenderLauncher(host, tab),
  files: (host, tab) => spRenderFiles(host, tab),
  browser: (host, tab) => spRenderBrowser(host, tab),
  terminal: (host, tab) => spRenderTerminal(host, tab),
  review: (host, tab) => spRenderReview(host, tab),
  deploy: (host, tab) => spRenderDeploy(host, tab),
  sidechat: (host, tab) => spRenderSideChat(host, tab)
};

/** 启动器：新标签页的卡片网格。 */
function spRenderLauncher(host) {
  const kinds = ['files', 'browser', 'terminal', 'review', 'deploy', 'sidechat'];
  host.innerHTML = '<div class="spl"><h2>' + esc(t('sp_title')) + '</h2>' +
    '<p>' + esc(t('sp_title_h')) + '</p><div class="splg">' +
    kinds.map(k => {
      const info = SP_KIND[k];
      return '<button class="spcard" data-spo="' + k + '">' +
        '<span class="spic">' + ic(info.ic) + '</span>' +
        '<span class="spcd"><b>' + esc(t(info.t)) + '</b><small>' + esc(t(info.d)) + '</small></span>' +
        '<span class="spop">' + esc(t('sp_open')) + '</span></button>';
    }).join('') + '</div></div>';
  host.querySelectorAll('[data-spo]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.spo;
      // 从启动器打开面板：把启动器标签换成该面板（而不是堆一个新标签）。
      const tab = SP.tabs.find(x => x.id === SP.active);
      if (tab && tab.kind === 'launcher') {
        tab.kind = k;
        tab.title = t(SP_KIND[k].t);
        spRender();
        if (k === 'sidechat') spSideChatInit(tab);
      } else {
        spOpen(k);
      }
    };
  });
}

/* ------------------------------------------------------------ 文件面板 */

function spRenderFiles(host, tab) {
  const st = tab.st;
  st.path = st.path || '';
  host.innerHTML = '<div class="spbar"><input id="spf-q" placeholder="' + esc(t('sp_search_hint')) +
    '" spellcheck="false" autocomplete="off"><button class="spbtn" id="spf-up">↑</button></div>' +
    '<div class="sptree" id="spf-tree"></div><div id="spf-file"></div>';
  const q = host.querySelector('#spf-q');
  q.value = st.q || '';
  q.oninput = () => {
    st.q = q.value;
    clearTimeout(st.qt);
    st.qt = setTimeout(() => spFilesSearch(tab), 220);
  };
  const up = host.querySelector('#spf-up');
  up.onclick = () => {
    st.path = st.path.includes('/') ? st.path.slice(0, st.path.lastIndexOf('/')) : '';
    spFilesTree(tab);
  };
  spFilesTree(tab);
}

async function spFilesTree(tab) {
  const host = $('#spbody');
  if (!host) return;
  const tree = host.querySelector('#spf-tree');
  if (!tree) return;
  if (tab.st.q) return spFilesSearch(tab);
  tree.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/fs/tree?path=' + encodeURIComponent(tab.st.path || ''));
  } catch (e) {
    tree.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const rows = [];
  if (tab.st.path) {
    rows.push('<div class="sprow" data-spup="1">' + ic('back') + '<span class="nm">..</span></div>');
  }
  (res.entries || []).forEach(e => {
    rows.push('<div class="sprow" data-spp="' + esc(e.path) + '" data-dir="' + (e.is_dir ? '1' : '') + '">' +
      ic(e.is_dir ? 'folder' : 'file') +
      '<span class="nm">' + esc(e.name) + '</span>' +
      (e.is_dir ? '' : '<span class="sz">' + fmtBytes(e.size) + '</span>') + '</div>');
  });
  tree.innerHTML = rows.join('') || '<div class="spempty">' + esc(t('sp_no_files')) + '</div>';
  tree.querySelectorAll('[data-spp]').forEach(r => {
    r.onclick = () => {
      const p = r.dataset.spp;
      if (r.dataset.dir) { tab.st.path = p; tab.st.q = ''; spFilesTree(tab); }
      else spFilesOpen(tab, p);
    };
  });
  const upRow = tree.querySelector('[data-spup]');
  if (upRow) upRow.onclick = () => {
    tab.st.path = tab.st.path.includes('/') ? tab.st.path.slice(0, tab.st.path.lastIndexOf('/')) : '';
    spFilesTree(tab);
  };
}

async function spFilesSearch(tab) {
  const host = $('#spbody');
  const tree = host && host.querySelector('#spf-tree');
  if (!tree) return;
  const q = (tab.st.q || '').trim();
  if (!q) return spFilesTree(tab);
  tree.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/fs/search?q=' + encodeURIComponent(q));
  } catch (e) {
    tree.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  tree.innerHTML = (res.matches || []).map(m =>
    '<div class="sprow" data-spp="' + esc(m.path) + '" data-dir="' + (m.is_dir ? '1' : '') + '">' +
    ic(m.is_dir ? 'folder' : 'file') + '<span class="nm">' + esc(m.path) + '</span></div>'
  ).join('') || '<div class="spempty">' + esc(t('sp_no_files')) + '</div>';
  tree.querySelectorAll('[data-spp]').forEach(r => {
    r.onclick = () => {
      if (r.dataset.dir) { tab.st.path = r.dataset.spp; tab.st.q = ''; spFilesTree(tab); }
      else spFilesOpen(tab, r.dataset.spp);
    };
  });
}

async function spFilesOpen(tab, path) {
  const host = $('#spbody');
  const box = host && host.querySelector('#spf-file');
  if (!box) return;
  box.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/fs/file?path=' + encodeURIComponent(path));
  } catch (e) {
    box.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const f = res.file;
  if (!f) { box.innerHTML = '<div class="spempty">' + esc(t('sp_empty_fs')) + '</div>'; return; }
  box.innerHTML = '<div class="spfmeta">' + esc(f.path) + ' · ' + fmtBytes(f.size) +
    (f.total_lines ? ' · ' + f.total_lines + ' 行' : '') + '</div>' +
    '<div class="spfile">' + (f.binary ? '<div class="spempty">' + esc(t('sp_empty_fs')) + '</div>'
      : '<pre>' + esc(f.text) + '</pre>') + '</div>';
}

/* ------------------------------------------------------------ 审查面板 */

async function spRenderReview(host, tab) {
  host.innerHTML = '<div class="spbar"><button class="spbtn" id="spg-ref">↻</button>' +
    '<span style="flex:1;color:var(--fg2);font-size:11.5px" id="spg-branch"></span></div>' +
    '<div class="spgit" id="spg-list"></div><div id="spg-diff"></div>';
  host.querySelector('#spg-ref').onclick = () => spRenderReview(host, tab);
  const list = host.querySelector('#spg-list');
  list.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/git/status');
  } catch (e) {
    list.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  const st = res.status || {};
  if (SP.active !== tab.id) return;
  const branch = host.querySelector('#spg-branch');
  if (branch) branch.textContent = st.is_repo ? st.branch : '';
  if (!st.is_repo) {
    list.innerHTML = '<div class="spempty">' + esc(t('sp_not_repo')) + '</div>';
    return;
  }
  if (!(st.files || []).length) {
    list.innerHTML = '<div class="spempty">' + esc(t('sp_empty_git')) + '</div>';
    return;
  }
  list.innerHTML = st.files.map(f => {
    const cls = f.state === 'untracked' ? 'new' : f.state === 'added' ? 'add'
      : f.state === 'deleted' ? 'del' : 'mod';
    const letter = f.state === 'untracked' ? '?' : f.state === 'added' ? 'A'
      : f.state === 'deleted' ? 'D' : 'M';
    return '<div class="spgf ' + cls + '" data-spgp="' + esc(f.path) + '">' +
      '<span class="st">' + letter + '</span><span class="nm">' + esc(f.path) + '</span></div>';
  }).join('');
  list.querySelectorAll('[data-spgp]').forEach(r => {
    r.onclick = () => spGitDiff(tab, r.dataset.spgp);
  });
}

async function spGitDiff(tab, path) {
  const host = $('#spbody');
  const box = host && host.querySelector('#spg-diff');
  if (!box) return;
  box.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/git/diff?path=' + encodeURIComponent(path));
  } catch (e) {
    box.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const d = res.diff || {};
  if (d.note) {
    box.innerHTML = '<div class="spempty">' + esc(d.note) + '</div>';
    return;
  }
  if (!(d.hunks || []).length) {
    box.innerHTML = '<div class="spempty">' + esc(t('sp_empty_git')) + '</div>';
    return;
  }
  box.innerHTML = '<div style="padding:12px 16px 0"><div class="spfmeta" style="padding:0 0 8px;border:0">' +
    esc(d.path) + '</div></div>' + d.hunks.map(h =>
      '<div class="spdiff"><div class="hh">' + esc(h.header) + '</div>' +
      h.lines.map(l => '<div class="dl ' + (l.sign === '+' ? 'p' : l.sign === '-' ? 'm' : '') + '">' +
        '<span class="sg">' + esc(l.sign) + '</span><span>' + esc(l.text) + '</span></div>').join('') +
      '</div>').join('');
}

/* ------------------------------------------------------------ 浏览器面板 */

function spRenderBrowser(host, tab) {
  host.innerHTML = '<div class="spbar"><input id="spb-url" placeholder="https://" spellcheck="false" autocomplete="off">' +
    '<button class="spbtn pri" id="spb-go">' + esc(t('sp_run')) + '</button></div>' +
    '<div class="spbrow" id="spb-body"><div class="spempty">' + esc(t('sp_empty_browser')) + '</div></div>';
  const url = host.querySelector('#spb-url');
  url.value = tab.st.url || '';
  const go = host.querySelector('#spb-go');
  go.onclick = async () => {
    const u = url.value.trim();
    if (!u) return;
    go.disabled = true;
    try {
      await api('/browser/navigate', { method: 'POST', body: { url: u } });
      tab.st.url = u;
      // 给浏览器一点时间加载页面再取状态。
      setTimeout(() => spBrowserState(tab), 1200);
    } catch (e) {
      toast(e.message);
    }
    go.disabled = false;
  };
  url.onkeydown = e => { if (e.key === 'Enter') go.click(); };
  if (tab.st.url) spBrowserState(tab);
}

async function spBrowserState(tab) {
  const host = $('#spbody');
  const box = host && host.querySelector('#spb-body');
  if (!box) return;
  let res;
  try {
    res = await api('/browser/state');
  } catch (e) {
    box.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const url = res.url || '';
  if (url) {
    const inp = host.querySelector('#spb-url');
    if (inp && !inp.value) inp.value = url;
  }
  const img = res.screenshot
    ? '<img src="data:image/png;base64,' + esc(res.screenshot) + '" alt="">'
    : '';
  box.innerHTML = img + (res.text ? '<pre>' + esc(res.text) + '</pre>' : '');
}

/* ------------------------------------------------------------ 终端面板 */

function spRenderTerminal(host, tab) {
  const st = tab.st;
  st.out = st.out || '';
  st.runId = st.runId || null;
  host.innerHTML = '<div class="spterm"><div class="log" id="spt-log"></div>' +
    '<div class="cmd"><span class="pr">$</span><input id="spt-in" spellcheck="false" autocomplete="off"></div></div>';
  const log = host.querySelector('#spt-log');
  log.textContent = st.out;
  const inp = host.querySelector('#spt-in');
  const run = async () => {
    const cmd = inp.value.trim();
    if (!cmd) return;
    inp.value = '';
    st.out += '$ ' + cmd + '\n';
    log.textContent = st.out;
    log.scrollTop = log.scrollHeight;
    // 客户端自选 id：流式输出在命令结束前就开始了，服务端生成 id 的话
    // 前端来不及订阅，所以由客户端先定下来再发请求。
    const cid = 'term_c' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    st.runId = cid;
    try {
      const res = await api('/term/exec', { method: 'POST', body: { command: cmd, call_id: cid } });
      if (res.error) st.out += res.error + '\n';
      else if (res.stdout) st.out += res.stdout.replace(/\n$/, '') + '\n';
      st.out += '\n';
      st.runId = null;
    } catch (e) {
      st.out += e.message + '\n';
      st.runId = null;
    }
    if (SP.active === tab.id) {
      const l2 = $('#spbody') && $('#spbody').querySelector('#spt-log');
      if (l2) { l2.textContent = st.out; l2.scrollTop = l2.scrollHeight; }
    }
  };
  inp.onkeydown = e => { if (e.key === 'Enter') run(); };
}

/* ------------------------------------------------------------ 部署面板 */

function spRenderDeploy(host) {
  host.innerHTML = '<div class="spl"><h2>' + esc(t('sp_deploy')) + '</h2>' +
    '<p>' + esc(t('sp_deploy_h')) + '</p><div class="spempty" style="text-align:left;padding:14px 0">' +
    esc(t('sp_deploy_note')) + '</div></div>';
}

/* ------------------------------------------------------------ 辅助对话 */

/** 为辅助对话标签创建独立会话。 */
async function spSideChatInit(tab) {
  try {
    const res = await api('/session/new', { method: 'POST', body: { title: t('sp_sidechat') } });
    tab.st.sid = res.session && res.session.id;
  } catch (e) {
    toast(e.message);
  }
}

function spRenderSideChat(host, tab) {
  const st = tab.st;
  st.msgs = st.msgs || [];
  host.innerHTML = '<div class="spsc"><div class="msgs" id="spc-msgs"></div>' +
    '<div id="spc-perm"></div>' +
    '<div class="in"><textarea id="spc-in" rows="1" placeholder="' + esc(t('sp_sidechat_placeholder')) + '"></textarea>' +
    '<button class="spbtn pri" id="spc-send">' + esc(t('sp_run')) + '</button></div></div>';
  const msgs = host.querySelector('#spc-msgs');
  msgs.innerHTML = st.msgs.map(m =>
    '<div class="m ' + (m.role === 'user' ? 'u' : m.role === 'error' ? 'err' : 'a') + '">' +
    esc(m.text) + '</div>').join('');
  msgs.scrollTop = msgs.scrollHeight;

  const inp = host.querySelector('#spc-in');
  const send = host.querySelector('#spc-send');
  const doSend = async () => {
    const text = inp.value.trim();
    if (!text) return;
    if (!st.sid) { toast(t('sp_sidechat_placeholder')); return; }
    inp.value = '';
    st.msgs.push({ role: 'user', text: text });
    st.streaming = true;
    spRenderSideChat(host, tab);
    try {
      await api('/chat', {
        method: 'POST',
        body: {
          session_id: st.sid,
          text: text,
          permission_mode: S.perm,
          thinking_level: S.lvl
        }
      });
    } catch (e) {
      st.streaming = false;
      st.msgs.push({ role: 'error', text: e.message });
      spRenderSideChat(host, tab);
    }
  };
  send.onclick = doSend;
  inp.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  };
}

/**
 * 侧边栏的 SSE 钩子。
 *
 * 主对话区在 dispatch() 里按会话过滤事件；侧边栏需要看到全部事件
 * （尤其是辅助对话自己那个会话的流式输出），所以这个钩子挂在会话过滤
 * 之前。它只往侧边栏自己的标签里写，不会污染主对话区。
 */
function spOnEvent(ev) {
  if (!SP.tabs.length || !ev) return;
  // 辅助对话标签：只处理属于自己会话的事件。
  SP.tabs.forEach(tab => {
    if (tab.kind !== 'sidechat') return;
    const sid = tab.st.sid;
    if (!sid || ev.sessionId !== sid) return;
    if (ev.type === 'text.delta') {
      if (!tab.st.cur) tab.st.cur = { role: 'assistant', text: '' };
      tab.st.cur.text += (ev.text || '');
    } else if (ev.type === 'text.done') {
      if (tab.st.cur) { tab.st.msgs.push(tab.st.cur); tab.st.cur = null; }
    } else if (ev.type === 'turn.end') {
      if (tab.st.cur) { tab.st.msgs.push(tab.st.cur); tab.st.cur = null; }
      tab.st.streaming = false;
    } else if (ev.type === 'permission.request') {
      tab.st.perm = ev;
    } else if (ev.type === 'question') {
      tab.st.question = ev;
    } else if (ev.type === 'error') {
      tab.st.msgs.push({ role: 'error', text: ev.error || ev.message || 'error' });
    }
  });
  // 终端面板：收集本标签发起的命令的流式输出。
  SP.tabs.forEach(tab => {
    if (tab.kind !== 'terminal' || !tab.st.runId) return;
    if (ev.type === 'tool.progress' && ev.callId === tab.st.runId) {
      tab.st.out += (ev.chunk || '') + '\n';
    }
  });
  // 只有当前可见的面板需要重绘。
  const cur = SP.tabs.find(x => x.id === SP.active);
  if (!cur) return;
  if (cur.kind === 'sidechat' && (ev.type === 'text.delta' || ev.type === 'turn.end' ||
      ev.type === 'text.done' || ev.type === 'permission.request' || ev.type === 'question')) {
    spRenderSideChat($('#spbody'), cur);
  } else if (cur.kind === 'terminal' && ev.type === 'tool.progress' && ev.callId === cur.st.runId) {
    const log = $('#spbody') && $('#spbody').querySelector('#spt-log');
    if (log) { log.textContent = cur.st.out; log.scrollTop = log.scrollHeight; }
  }
}

/* ==================================================================
   boot
   ================================================================== */
async function boot() {
  if (innerWidth < 760 || !S.side) document.body.classList.add('sc');

  // Server holds the authoritative config; merge it over the local cache.
  try {
    const c = await api('/config');
    const local = JSON.parse(localStorage.getItem('cd-s') || '{}');
    Object.assign(S, {
      lang: c.lang || S.lang, name: c.name || S.name, theme: c.theme || S.theme,
      font: c.font || S.font, size: c.size || S.size, w: c.width || S.w,
      accent: c.accent || S.accent, speed: c.speed || S.speed, cd: c.cd || S.cd,
      blur: c.blur || S.blur, sf: c.sf || S.sf, anim: c.anim || S.anim,
      stream: c.stream !== undefined ? c.stream : S.stream,
      think: c.think !== undefined ? c.think : S.think,
      side: c.side !== undefined ? c.side : S.side,
      prefs: c.prefs || S.prefs,
      systemPrompt: c.system_prompt || S.systemPrompt,
      systemPromptRaw: c.system_prompt_raw !== undefined ? c.system_prompt_raw : S.systemPromptRaw,
      searchKey: c.search_key !== undefined ? c.search_key : S.searchKey,
      spref: c.search_pref !== undefined ? c.search_pref : S.spref,
      model: c.model || local.model || S.model,
      perm: c.permission_mode || S.perm,
      lvl: c.thinking_level !== undefined ? c.thinking_level : S.lvl
    });
  } catch (e) { /* offline: use local cache */ }

  apply(false);
  sync();
  resetStatus();
  connectEvents();
  greetAnim();
  // 侧栏相对时间每分钟自动刷新（单页应用常驻即可）
  setInterval(refreshTimes, 60000);

  await Promise.all([
    loadSessions(true),
    loadModels(),
    loadServerStatus()
  ]);
}

boot();
