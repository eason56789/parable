    return;
  }
  if (m && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('#cmdk').classList.contains('open') ? closeCmd() : openCmd();
  }
  if (m && e.key === '/') { e.preventDefault(); openKbd(); }
  if (m && e.key === ',') { e.preventDefault(); openSet(); }
  if (m && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newChat(); }
});

/* ==================================================================
   SSE
   ================================================================== */
let es = null;
// 重连后 busy 看门狗：断连期间错过 turn.end 会把 busy 卡死。重连成功且仍
// busy 时启动 15s 静默计时，期间本端收到任何事件即解除；到点仍无事件视为
// turn 已死（或从未开始），复位 busy。只在「发生过断连」时武装，正常思考
// 停顿不受影响。
let busyWatchdog = null;
function disarmBusyWatchdog() { clearTimeout(busyWatchdog); busyWatchdog = null; }

/* ---- 事件丢失自愈 --------------------------------------------------
   SSE 走 broadcast：慢客户端会被缓冲甩掉事件（包括 turn.end）。那时
   连接还在、前端却以为还在生成 —— 界面永久停在「思考中」。
   这里主动向服务端核对：/api/turn/running 报告该会话没有 turn 在跑时，
   说明 turn 已经结束（只是收尾事件丢了），按 turn.end 收尾视图。
   与断连看门狗互补：那个依赖断连，这个不依赖。 */
let turnProbeTimer = null;
let turnProbeBusy = false;

function stopTurnProbe() {
  if (turnProbeTimer) { clearInterval(turnProbeTimer); turnProbeTimer = null; }
}

/** 启动轮询核对（每次 turn 开始时调用）。 */
function startTurnProbe() {
  stopTurnProbe();
  // 冻结发起时的会话：轮询结果只能作用于这一轮，切走之后不能再改 busy / DOM。
  const sid = conv && conv.id;
  const gen = convGen;
  if (!sid) return;
  turnProbeTimer = setInterval(async () => {
    // 会话切走 / 这一轮已经结束：自己停掉。否则 interval 会永久空转，
    // 反复切会话还会叠出好几个。
    if (turnProbeBusy) return;
    if (!busy || !conv || conv.id !== sid || gen !== convGen) { stopTurnProbe(); return; }
    turnProbeBusy = true;
    try {
      const r = await api('/turn/running?session=' + encodeURIComponent(sid));
      if (gen !== convGen || !conv || conv.id !== sid) { stopTurnProbe(); return; }
      if (r && r.running === false) {
        // 服务端说没有 turn 在跑：收尾事件丢了，按 turn.end 补收尾。
        if (busy) {
          busy = false;
          expectBubble = false;
          if (curStream) sflush(curStream);
          finishThink(curThinkEl);
          curThinkEl = null;
          thinkStart = 0;
          if (curA) {
            stopSpin(curA);
            if (foldSafe(curA)) reconcileTail();
          }
          sync();
          resetTurn();
          restamp();
        }
        stopTurnProbe();
      }
    } catch (e) {
      // 服务端不可达：等下一次轮询。
    } finally {
      turnProbeBusy = false;
    }
  }, 3000);
}

/** 收到 events.lost：服务端承认丢了事件，立刻重新同步。 */
async function onEventsLost(ev) {
  toast(t('conn_lost'));
  if (!conv || !conv.id) return;
  // 只同步事件所属的会话；别的会话丢了事件不能拿它的存储来改当前视图。
  if (ev && ev.sessionId && ev.sessionId !== conv.id) return;
  // 丢掉的事件可能包含整轮内容，用存储里的最终状态校正视图。
  try {
    await reconcileTail();
  } catch (e) { /* 忽略 */ }
}
/* ============================================================ 右上角悬浮窗
   参考 ZCode 的 ConversationStatusPanel：收起态是三枚胶囊（各自带计数），
   展开态分「后台智能体 / 后台终端 / 目标与阶段」三块。数据全部来自真实接口：
   - /api/agents?session=  + subagent.start|end 事件
   - /api/term/list|start|kill|clear  + term.start|end 事件 + tool.progress 增量
   - /api/sessions/{id}/goal + goal 事件；任务阶段取最近一次 todo_write 的
     display.todos（只认最新的那份，和 ZCode 的 goal-todo-summary-restore 一致）。 */
const DK = {
  tab: null,          // null = 收起
  agents: [], terms: [], goal: null, todos: [],
  phase: 'idle', tool: '',
  timer: 0, draft: '', dash: '',
};

function dkRunning(s) {
  s = String(s || '').toLowerCase();
  return s.includes('run') || s.includes('work') || s === 'pending' || s === 'starting';
}

function dkCount() {
  const runAg = DK.agents.filter(a => dkRunning(a.status)).length;
  const runTm = DK.terms.filter(x => x.status === 'running').length;
  const done = DK.todos.filter(x => x.status === 'completed').length;
  $('#dk-ag').textContent = DK.agents.length;
  $('#dk-tm').textContent = DK.terms.length;
  $('#dk-gl').textContent = DK.todos.length ? done + '/' + DK.todos.length : (DK.goal ? (DK.goal.rounds || 0) : 0);
  $('#dk-ag').parentElement.classList.toggle('live', runAg > 0);
  $('#dk-tm').parentElement.classList.toggle('live', runTm > 0);
  $('#dk-gl').parentElement.classList.toggle('live', !!DK.goal && DK.goal.status === 'active');
}

let dkAt = 0;
function dkSoon() {
  const now = Date.now();
  if (now - dkAt < 400) { if (!DK.timer) DK.timer = setTimeout(() => { DK.timer = 0; dkLoad(); }, 460); return; }
  dkAt = now;
  clearTimeout(DK.timer);
  DK.timer = 0;
  dkLoad();
}

async function dkLoad() {
  const sid = conv && conv.id ? conv.id : '';
  try {
    if (sid) {
      const a = await api('/agents?session=' + encodeURIComponent(sid));
      DK.agents = a.agents || [];
      try { DK.goal = (await api('/sessions/' + sid + '/goal')).goal || null; } catch (e) {}
    } else { DK.agents = []; DK.goal = null; }
    const tm = await api('/term/list');
    DK.terms = tm.jobs || [];
  } catch (e) { /* 后端暂时不可达：保留上一次的快照，不闪空 */ }
  dkCount();
  if (DK.tab) dkRender();
}

function dkPhaseLabel() {
  const k = DK.phase === 'tool' ? (DK.tool || 'tool') : DK.phase;
  return t('dk_' + k);
}

function dkRow(cls) {
  const d = document.createElement('div');
  d.className = cls || 'drow';
  return d;
}

function dkEmpty(msg) {
  const d = document.createElement('div');
  d.className = 'dempty';
  d.textContent = msg;
  return d;
}

function dkRender() {
  const body = $('#dk-body');
  if (!body || !DK.tab) return;
  $('#dk-title').textContent = t('dk_' + DK.tab);
  body.innerHTML = '';
  const sid = conv && conv.id;

  if (DK.tab === 'agents') {
    if (!sid) { body.append(dkEmpty(t('dk_none_session'))); return; }
    if (!DK.agents.length) { body.append(dkEmpty(t('dk_none_agents'))); return; }
    DK.agents.forEach(a => {
      const row = dkRow('drow dag');
      row.title = t('sp_agent_h');
      row.onclick = () => openAgentChat(a);
      const head = document.createElement('div');
      head.className = 'dt';
      const nm = document.createElement('span');
      nm.className = 'dn';
      nm.textContent = a.name || a.id || '';
      const st = document.createElement('span');
      st.className = 'dm';
      st.textContent = a.status || '';
      head.append(nm, st);
      const sub = document.createElement('div');
      sub.className = 'dsub';
      sub.textContent = a.label || a.task || '';
      row.append(head, sub);
      if (dkRunning(a.status)) {
        const act = document.createElement('div');
        act.className = 'dact';
        const b = document.createElement('button');
        b.textContent = t('dk_kill');
        b.onclick = e => {
          e.stopPropagation();
          api('/agents/' + encodeURIComponent(a.id) + '/interrupt', { method: 'POST', body: {} })
            .then(() => dkLoad()).catch(e => toast(e.message));
        };
        act.append(b);
        row.append(act);
      }
      body.append(row);
    });
    return;
  }

  if (DK.tab === 'terms') {
    // 命令输入常驻顶部；重建后把草稿和焦点还回去，否则每 5 秒就被刷新打断。
    const bar = document.createElement('div');
    bar.className = 'dterm';
    const input = document.createElement('input');
    input.placeholder = t('dk_cmd');
    input.value = DK.draft;
    input.oninput = () => { DK.draft = input.value; };
    input.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); dkRunCmd(input); }
    };
    const run = document.createElement('button');
    run.textContent = t('dk_run');
    run.onclick = () => dkRunCmd(input);
    bar.append(input, run);
    body.append(bar);

    if (!DK.terms.length) { body.append(dkEmpty(t('dk_none_terms'))); return; }
    const headRow = document.createElement('div');
    headRow.style.cssText = 'display:flex;align-items:center;gap:6px;padding:2px';
    const cap = document.createElement('span');
    cap.className = 'dsec';
    cap.style.padding = '0';
    cap.style.flex = '1';
    cap.textContent = t('dk_terms');
    const clr = document.createElement('button');
    clr.textContent = t('dk_clear');
    clr.style.cssText = 'border:.5px solid var(--line);background:none;border-radius:7px;padding:2px 8px;font-size:11px;color:var(--fg2);cursor:pointer';
    clr.onclick = () => api('/term/clear', { method: 'POST', body: {} }).then(dkLoad).catch(e => toast(e.message));
    headRow.append(cap, clr);
    body.append(headRow);

    DK.terms.slice().reverse().forEach(j => {
      const row = dkRow();
      const head = document.createElement('div');
      head.className = 'dt';
      const cmd = document.createElement('span');
      cmd.className = 'dn';
      cmd.style.fontFamily = 'var(--mono)';
      cmd.textContent = '$ ' + (j.command || '');
      const st = document.createElement('span');
      st.className = 'dm';
      st.textContent = j.status === 'running' ? '● running' : (j.status + (j.exit != null ? ' · ' + j.exit : ''));
      st.style.color = j.status === 'running' ? 'var(--accent)' : '';
      head.append(cmd, st);
      row.append(head);
      if (j.output && j.output.trim()) {
        const out = document.createElement('div');
        out.className = 'dsub';
        out.textContent = j.output.length > 1600 ? '…' + j.output.slice(-1600) : j.output;
        row.append(out);
      }
      if (j.status === 'running') {
        const act = document.createElement('div');
        act.className = 'dact';
        const b = document.createElement('button');
        b.textContent = t('dk_kill');
        b.onclick = () => api('/term/kill', { method: 'POST', body: { id: j.id } })
          .then(() => dkLoad()).catch(e => toast(e.message));
        act.append(b);
        row.append(act);
      }
      body.append(row);
    });
    return;
  }

  // goal
  const stage = document.createElement('div');
  stage.className = 'dstage';
  stage.innerHTML = '<span>' + esc(t('dk_stage')) + '</span><b>' + esc(dkPhaseLabel()) + '</b>';
  body.append(stage);

  if (!DK.goal) {
    body.append(dkEmpty(t('dk_none_goal')));
  } else {
    const row = dkRow();
    const g = document.createElement('div');
    g.className = 'dgoal';
    g.textContent = DK.goal.objective || '';
    const meta = document.createElement('div');
    meta.className = 'dmeta';
    const st = t('dk_goal_' + (DK.goal.status || 'active'));
    const rounds = t('dk_round').replace('{n}', DK.goal.rounds || 0).replace('{m}', DK.goal.max_rounds || 0);
    meta.textContent = st + ' · ' + rounds;
    row.append(g, meta);
    if (DK.goal.last_reason) {
      const why = document.createElement('div');
      why.className = 'dsub';
      why.textContent = DK.goal.last_reason;
      row.append(why);
    }
    body.append(row);
  }

  if (DK.todos.length) {
    const cap = document.createElement('div');
    cap.className = 'dsec';
    cap.textContent = t('dk_tasks');
    body.append(cap);
    const list = dkRow();
    list.style.gap = '5px';
    DK.todos.forEach(x => {
      const it = document.createElement('div');
      it.className = 'dtask';
      const box = document.createElement('i');
      const done = x.status === 'completed';
      box.className = done ? 'done' : (x.status === 'in_progress' ? 'run' : '');
      box.textContent = done ? '✓' : '';
      const tx = document.createElement('span');
      tx.className = done ? 'done' : '';
      tx.textContent = x.content || '';
      it.append(box, tx);
      list.append(it);
    });
    body.append(list);
  }
}

async function dkRunCmd(input) {
  const command = String(input.value || '').trim();
  if (!command) return;
  DK.draft = '';
  input.value = '';
  try {
    await api('/term/start', { method: 'POST', body: { command } });
  } catch (e) { toast(e.message); }
  await dkLoad();
}

/** 事件 → 悬浮窗。只更新状态与计数，面板重建有变化才做。 */
function dkEvent(ev) {
  const was = DK.phase + '|' + DK.tool;
  if (ev.type === 'turn.start' || ev.type === 'reasoning.delta') DK.phase = 'thinking';
  else if (ev.type === 'text.delta') { DK.phase = 'writing'; DK.tool = ''; }
  else if (ev.type === 'tool.call') { DK.phase = 'tool'; DK.tool = ev.tool || ''; }
  else if (ev.type === 'turn.end') { DK.phase = 'idle'; DK.tool = ''; }
  else if (ev.type === 'goal') dkSoon();
  else if (ev.type === 'subagent.start' || ev.type === 'subagent.end') dkSoon();
  else if (ev.type === 'term.start' || ev.type === 'term.end') dkSoon();
  else if (ev.type === 'tool.result' && ev.display && ev.display.kind === 'todo') {
    DK.todos = ev.display.todos || [];
  } else if (ev.type === 'tool.progress' && ev.callId) {
    const j = DK.terms.find(x => x.call_id === ev.callId);
    if (j) {
      j.output = ((j.output || '') + (ev.chunk || '')).slice(-24000);
      if (DK.tab === 'terms') dkSoon();
    }
  }
  dkCount();
  if (DK.tab && (DK.phase + '|' + DK.tool) !== was) dkRender();
}

function dkInit() {
  document.querySelectorAll('.dpill').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const k = b.dataset.dk;
      DK.tab = DK.tab === k ? null : k;
      $('#dkpanel').hidden = !DK.tab;
      document.querySelectorAll('.dpill').forEach(x => x.classList.toggle('on', x.dataset.dk === DK.tab));
      if (DK.tab) { dkRender(); dkLoad(); }
    };
  });
  $('#dk-x').onclick = e => {
    e.stopPropagation();
    DK.tab = null;
    $('#dkpanel').hidden = true;
    document.querySelectorAll('.dpill').forEach(x => x.classList.remove('on'));
  };
  // 点面板外收起；面板内的点击（输入框、按钮）不要误收。
  document.addEventListener('click', e => {
    if (!DK.tab || e.target.closest('#dock')) return;
    DK.tab = null;
    $('#dkpanel').hidden = true;
    document.querySelectorAll('.dpill').forEach(x => x.classList.remove('on'));
  });
  // 后台数据 5 秒一刷（页面不可见时省电不刷）。事件路径是实时的，这里只兜底。
  setInterval(() => { if (!document.hidden) dkLoad(); }, 5000);
  dkCount();
  dkLoad();
}

let esRetry = 0;
function connectEvents() {
  if (es) { try { es.close(); } catch (e) {} }
  // 带上已收到的最大 seq：服务端会先把断线期间的事件补发一遍，再进实时流。
  // 没有这一步，断线时丢掉的 turn.end 就永远回不来，界面停在「思考中」。
  const since = lastSeq > 0 ? '&since=' + lastSeq : '';
  es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN) + since);
  es.onmessage = e => {
    disarmBusyWatchdog();
    try { dispatch(JSON.parse(e.data)); } catch (err) {}
  };
  es.onopen = () => {
    // 重连成功。seq 水位不再清零：回放事件就是靠它去重的，清零会把断线
    // 期间补发的事件重复执行一遍。服务端重启（seq 重新从 1 开始）由 hello
    // 的 latest 字段检测后复位。
    esRetry = 0;
    connectEvents.warned = false;
    loadServerStatus();
    restorePending();
    if (busy && conv && conv.id) {
      if (!INFLIGHT[conv.id]) {
        busy = false;
        stopSpin(curA);
        sync();
        // 不在途却断过连：以存储校正一次收尾视图
        reconcileTail();
      } else {
        // INFLIGHT 还挂着：turn 可能在断连期间已结束。挂看门狗兜底；
        // turn 真还在跑时不动 DOM（reconcileTail 会拆掉在途流式节点）。
        disarmBusyWatchdog();
        busyWatchdog = setTimeout(() => {
          busyWatchdog = null;
          if (busy) {
            busy = false;
            stopSpin(curA);
            sync();
            reconcileTail();
          }
        }, 15000);
      }
    }
  };
  es.onerror = () => {
    // EventSource reconnects on its own; surface it once.
    if (!connectEvents.warned) {
      connectEvents.warned = true;
      toast(t('conn_lost'));
    }
    setTimeout(() => { connectEvents.warned = false; }, 4000);
    // 自己接管重连：只有重建 EventSource 才能把新的 since 带上去。退避到
    // 最多 6 秒，避免服务端刚重启时的重连风暴。
    try { es.close(); } catch (e) {}
    esRetry = Math.min(esRetry + 1, 6);
    clearTimeout(connectEvents.timer);
    // 不再判断 document.hidden：隐藏标签页里断线后如果跳过重连，就再也没
    // 有路径把它接回来，切回前台会永久停在断线状态。
    connectEvents.timer = setTimeout(connectEvents, 1000 * esRetry);
  };
}

/** 页面回到前台/获得焦点时，如果连接已关闭就立刻重建。 */
function ensureEvents() {
  clearTimeout(connectEvents.timer);
  if (es && es.readyState !== 2) return;
  esRetry = 0;
  connectEvents();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureEvents(); });
addEventListener('focus', ensureEvents);

/**
 * 断线重连（以及 boot）后恢复：GET /api/pending 拿回挂起的权限请求，
 * 逐个重建工具卡片 + 权限面板（{id, tool, path, risk, reason, diffPreview}，
 * id 即事件里的 callId）。
 */
async function restorePending() {
  let list = [];
  try {
    const r = await api('/pending');
    list = r.permissions || [];
  } catch (e) { return; }
  for (const p of list) {
    const callId = p.id || p.callId;
    if (!callId || toolEls[callId]) continue;
    if (!curA) startTurnUI();
    const card = toolCard(curA.querySelector('.ab'), callId, p.tool, p.tool);
    toolEls[callId] = card;
    showPermPanel(card, callId, p);
  }
  if (list.length) follow();
}

/**
 * GET /api/status：恢复服务端配置驱动的显示（模型/权限模式/思考强度）。
 * boot 与每次 SSE 重连成功后调用。
 */
async function loadServerStatus() {
  try {
    const r = await api('/status');
    let dirty = false;
    if (r.model && r.model !== S.model) { S.model = r.model; dirty = true; }
    if (r.permissionMode && r.permissionMode !== S.perm) { S.perm = r.permissionMode; dirty = true; }
    if (r.thinkingLevel !== undefined && +r.thinkingLevel !== +S.lvl) { S.lvl = +r.thinkingLevel || 0; dirty = true; }
    if (dirty) apply(false);
  } catch (e) { /* 服务不可达时保持本地值 */ }
}

/* ==================================================================
   side pane — 右侧标签栏面板
   ================================================================== */

/** 侧边栏状态。tabs 是打开的标签,active 是当前标签 id。 */
const SP = { tabs: [], active: null, seq: 0, open: false };

/** 每个面板类型的展示信息：图标、标题键、描述键。 */
const SP_KIND = {
  files:    { ic: 'folder',   t: 'sp_files',    d: 'sp_files_h' },
  browser:  { ic: 'globe',    t: 'sp_browser',  d: 'sp_browser_h' },
  terminal: { ic: 'terminal', t: 'sp_term',     d: 'sp_term_h' },
  review:   { ic: 'git',      t: 'sp_review',   d: 'sp_review_h' },
  deploy:   { ic: 'art',      t: 'sp_deploy',   d: 'sp_deploy_h' },
  sidechat: { ic: 'chat',     t: 'sp_sidechat', d: 'sp_sidechat_h' },
  agent:    { ic: 'user',     t: 'sp_agent',    d: 'sp_agent_h' },
  launcher: { ic: 'panel',    t: 'sp_title',    d: 'sp_title_h' }
};

// 换 key 是为了让旧版默认值（420px）不再生效：没拖过的人一进来就是五五分。
const SPW_KEY = 'parable.spw2';

/** 刷新所有侧聊标签的工具条胶囊（模型改名、切语言、选了新模型时调用）。 */
function spChromeAll() {
  SP.tabs.forEach(tb => {
    if (tb.kind !== 'sidechat' || tb.id !== SP.active) return;
    const host = $('#spbody');
    if (host) spSideChrome(host, tb);
  });
}

/** 侧边栏宽度：可拖、记住上次的值，双击复位。 */
function spSetW(w) {
  const max = Math.min(innerWidth * 0.72, 980);
  const v = Math.max(340, Math.min(max, Math.round(w)));
  document.documentElement.style.setProperty('--spw', v + 'px');
  return v;
}

/** 默认宽度：把左侧任务栏以外的地方对半分，侧边栏和主对话一样宽。 */
function spDefaultW() {
  const body = $('#body'), side = $('#side');
  const avail = (body ? body.clientWidth : innerWidth) - (side ? side.offsetWidth : 280);
  return Math.round(avail / 2);
}

function spInitDrag() {
  let saved = 0;
  try { saved = +(localStorage.getItem(SPW_KEY) || 0) || 0; } catch (e) {}
  spSetW(saved || spDefaultW());
  // 没手动拖过的人，窗口变化时继续保持对半；拖过的尊重用户的选择。
  addEventListener('resize', () => {
    let has = 0;
    try { has = +(localStorage.getItem(SPW_KEY) || 0) || 0; } catch (e) {}
    if (!has) spSetW(spDefaultW());
  });
  const h = $('#spdrag');
  if (!h) return;
  let on = false;
  h.addEventListener('mousedown', e => {
    e.preventDefault();
    on = true;
    document.body.classList.add('spdrag');
  });
  addEventListener('mousemove', e => {
    if (!on) return;
    spSetW(innerWidth - e.clientX);
  });
  addEventListener('mouseup', () => {
    if (!on) return;
    on = false;
    document.body.classList.remove('spdrag');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spw')) || spDefaultW();
    try { localStorage.setItem(SPW_KEY, String(w)); } catch (e) {}
    follow();
  });
  h.addEventListener('dblclick', () => {
    try { localStorage.removeItem(SPW_KEY); } catch (e) {}
    spSetW(spDefaultW());
    follow();
  });
}

/** 打开侧边栏（并保证至少有一个标签）。 */
function spShow() {
  // 自动弹出（事件触发）时才保持收起；这里是用户自己点的按钮，给一个启动器标签。
  if (!SP.tabs.length) { spAddTab(); return; }
  document.body.classList.remove('sp0');
  SP.open = true;
  spRender();
}

/** 折叠侧边栏。 */
function spHide() {
  document.body.classList.add('sp0');
  SP.open = false;
}

/** 在全屏与并排之间切换。 */
function spToggleMax() {
  document.body.classList.toggle('spmax');
  const b = $('#spbtn');
  if (b) b.title = document.body.classList.contains('spmax') ? t('sp_unmax') : t('sp_max');
}

/** 打开一个新的「新标签页」启动器标签。 */
function spAddTab() {
  document.body.classList.remove('sp0');
  SP.open = true;
  const tab = { id: 't' + (++SP.seq), kind: 'launcher', title: t('sp_title'), st: {} };
  SP.tabs.push(tab);
  SP.active = tab.id;
  spRender();
}

/** 打开某个面板类型的新标签。 */
function spOpen(kind, opts) {
  document.body.classList.remove('sp0');
  SP.open = true;
  const tab = { id: 't' + (++SP.seq), kind: kind, title: t(SP_KIND[kind].t), st: opts || {} };
  SP.tabs.push(tab);
  SP.active = tab.id;
  spRender();
  if (kind === 'sidechat') spSideChatInit(tab);
  return tab;
}

/**
 * `/side` 命令：打开侧边聊天。
 *
 * 已经开过就聚焦到那个标签（而不是再开一个），没有就新建一个独立会话的
 * 侧聊 tab；它走 /session/new，所以主对话的历史不会被污染。
 */
function openSideChat() {
  const ex = SP.tabs.find(x => x.kind === 'sidechat');
  document.body.classList.remove('sp0');
  SP.open = true;
  if (ex) { SP.active = ex.id; spRender(); }
  else spOpen('sidechat');
  setTimeout(() => { const i = $('#spc-in'); if (i) i.focus(); }, 80);
}

/** 关闭标签。 */
function spClose(id) {
  const i = SP.tabs.findIndex(x => x.id === id);
  if (i < 0) return;
  const tab = SP.tabs[i];
  // 释放标签占用的资源（终端的流式收集器等）。
  if (tab.st && tab.st.cleanup) { try { tab.st.cleanup(); } catch (e) {} }
  // 侧聊关掉后不再收到 turn.end：必须自己清计时器并中断服务端那一轮，
  // 否则 1s 定时器永久空转、后端还在继续烧 token。
  if (tab.kind === 'sidechat' && tab.st) {
    if (tab.st.wkt) { clearInterval(tab.st.wkt); tab.st.wkt = 0; }
    if (tab.st.streaming && tab.st.sid) {
      api('/interrupt', { method: 'POST', body: { session_id: tab.st.sid } }).catch(() => {});
    }
    tab.st.streaming = false;
    tab.st.cur = null;
  }
  SP.tabs.splice(i, 1);
  if (SP.active === id) {
    SP.active = SP.tabs.length ? SP.tabs[SP.tabs.length - 1].id : null;
  }
  if (!SP.tabs.length) spHide();
  else spRender();
}

/** 切到某个标签。 */
function spSelect(id) {
  if (SP.active === id) return;
  SP.active = id;
  spRender();
}

/** 渲染标签栏与当前面板。 */
function spRender() {
  const tl = $('#sptl'), body = $('#spbody');
  if (!tl || !body) return;
  tl.innerHTML = SP.tabs.map(tb => {
    const k = SP_KIND[tb.kind] || SP_KIND.launcher;
    return '<button class="sptab' + (tb.id === SP.active ? ' on' : '') + '" data-sp="' + tb.id + '">' +
      ic(k.ic) + '<span class="t">' + esc(tb.title) + '</span>' +
      '<span class="x" data-spx="' + tb.id + '">' + ic('x') + '</span></button>';
  }).join('');
  const cur = SP.tabs.find(x => x.id === SP.active);
  body.innerHTML = '';
  // 清空后必须把「骨架已建」的标记一并清掉：否则同一个标签再渲染一次时，
  // spRenderSideChat 会以为骨架还在而直接跳过，面板就变成一片空白。
  delete body.dataset.sc;
  if (!cur) return;
  const R = spRenderers[cur.kind];
  if (!R) { body.innerHTML = '<div class="spempty">' + esc(t('sp_empty_fs')) + '</div>'; return; }
  R(body, cur);
}

/** 各面板的渲染函数。 */
const spRenderers = {
  launcher: (host, tab) => spRenderLauncher(host, tab),
  files: (host, tab) => spRenderFiles(host, tab),
  browser: (host, tab) => spRenderBrowser(host, tab),
  terminal: (host, tab) => spRenderTerminal(host, tab),
  review: (host, tab) => spRenderReview(host, tab),
  deploy: (host, tab) => spRenderDeploy(host, tab),
  sidechat: (host, tab) => spRenderSideChat(host, tab),
  agent: (host, tab) => spRenderAgent(host, tab)
};

/** 启动器：新标签页的卡片网格。 */
function spRenderLauncher(host) {
  const kinds = ['files', 'browser', 'terminal', 'review', 'deploy', 'sidechat'];
  host.innerHTML = '<div class="spl"><h2>' + esc(t('sp_title')) + '</h2>' +
    '<p>' + esc(t('sp_title_h')) + '</p><div class="splg">' +
    kinds.map(k => {
      const info = SP_KIND[k];
      return '<button class="spcard" data-spo="' + k + '">' +
        '<span class="spic">' + ic(info.ic) + '</span>' +
        '<span class="spcd"><b>' + esc(t(info.t)) + '</b><small>' + esc(t(info.d)) + '</small></span>' +
        '<span class="spop">' + esc(t('sp_open')) + '</span></button>';
    }).join('') + '</div></div>';
  host.querySelectorAll('[data-spo]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.spo;
      // 从启动器打开面板：把启动器标签换成该面板（而不是堆一个新标签）。
      const tab = SP.tabs.find(x => x.id === SP.active);
      if (tab && tab.kind === 'launcher') {
        tab.kind = k;
        tab.title = t(SP_KIND[k].t);
        spRender();
        if (k === 'sidechat') spSideChatInit(tab);
      } else {
        spOpen(k);
      }
    };
  });
}

/* ------------------------------------------------------------ 文件面板 */

function spRenderFiles(host, tab) {
  const st = tab.st;
  st.path = st.path || '';
  host.innerHTML = '<div class="spbar"><input id="spf-q" placeholder="' + esc(t('sp_search_hint')) +
    '" spellcheck="false" autocomplete="off"><button class="spbtn" id="spf-up">↑</button></div>' +
    '<div class="sptree" id="spf-tree"></div><div id="spf-file"></div>';
  const q = host.querySelector('#spf-q');
  q.value = st.q || '';
  q.oninput = () => {
    st.q = q.value;
    clearTimeout(st.qt);
    st.qt = setTimeout(() => spFilesSearch(tab), 220);
  };
  const up = host.querySelector('#spf-up');
  up.onclick = () => {
    st.path = st.path.includes('/') ? st.path.slice(0, st.path.lastIndexOf('/')) : '';
    spFilesTree(tab);
  };
  spFilesTree(tab);
}

async function spFilesTree(tab) {
  const host = $('#spbody');
  if (!host) return;
  const tree = host.querySelector('#spf-tree');
  if (!tree) return;
  if (tab.st.q) return spFilesSearch(tab);
  tree.innerHTML = '<div class="spempty">…</div>';
  let res;
  try {
    res = await api('/fs/tree?path=' + encodeURIComponent(tab.st.path || ''));
  } catch (e) {
    tree.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const rows = [];
  if (tab.st.path) {
    rows.push('<div class="sprow" data-spup="1">' + ic('back') + '<span class="nm">..</span></div>');
  }
  (res.entries || []).forEach(e => {
    rows.push('<div class="sprow" data-spp="' + esc(e.path) + '" data-dir="' + (e.is_dir ? '1' : '') + '">' +
      ic(e.is_dir ? 'folder' : 'file') +
      '<span class="nm">' + esc(e.name) + '</span>' +
      (e.is_dir ? '' : '<span class="sz">' + fmtBytes(e.size) + '</span>') + '</div>');
  });
  tree.innerHTML = rows.join('') || '<div class="spempty">' + esc(t('sp_no_files')) + '</div>';
  tree.querySelectorAll('[data-spp]').forEach(r => {
    r.onclick = () => {
      const p = r.dataset.spp;
      if (r.dataset.dir) { tab.st.path = p; tab.st.q = ''; spFilesTree(tab); }
      else spFilesOpen(tab, p);
    };
  });
  const upRow = tree.querySelector('[data-spup]');
  if (upRow) upRow.onclick = () => {
    tab.st.path = tab.st.path.includes('/') ? tab.st.path.slice(0, tab.st.path.lastIndexOf('/')) : '';
    spFilesTree(tab);
  };
}

function spRenderBrowser(host, tab) {
  // 工具栏：后退 / 前进 / 刷新 + 药丸地址栏 + 前往
  host.innerHTML = '<div class="spbnav">' +
    '<button class="spnav" id="spb-back" title="' + esc(t('spb_back')) + '">' + ic('back') + '</button>' +
    '<button class="spnav" id="spb-fwd" title="' + esc(t('spb_fwd')) + '">' + ic('fwd') + '</button>' +
    '<button class="spnav" id="spb-rl" title="' + esc(t('spb_rl')) + '">' + ic('refresh') + '</button>' +
    '<input id="spb-url" placeholder="' + esc(t('spb_ph')) + '" spellcheck="false" autocomplete="off">' +
    '<button class="spnav pri" id="spb-go" title="' + esc(t('sp_run')) + '">' + ic('fwd') + '</button>' +
    '</div>' +
    '<div class="spbrow" id="spb-body"><div class="spempty">' + esc(t('sp_empty_browser')) + '</div></div>' +
    '<div class="spbhint">' + esc(t('spb_hint')) + '</div>';
  const url = host.querySelector('#spb-url');
  url.value = tab.st.url || '';
  const nav = async (path, body) => {
    try {
      await api(path, { method: 'POST', body: body || {} });
      setTimeout(() => spBrowserState(tab), 900);
    } catch (e) { toast(e.message); }
  };
  host.querySelector('#spb-back').onclick = () => nav('/browser/back');
  host.querySelector('#spb-fwd').onclick = () => nav('/browser/forward');
  host.querySelector('#spb-rl').onclick = () => nav('/browser/reload');
  const go = host.querySelector('#spb-go');
  const doGo = async () => {
    let u = url.value.trim();
    if (!u) return;
    // 补协议：用户习惯裸域名
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    go.disabled = true;
    try {
      await api('/browser/navigate', { method: 'POST', body: { url: u } });
      tab.st.url = u;
      setTimeout(() => spBrowserState(tab), 1200);
    } catch (e) {
      toast(e.message);
    }
    go.disabled = false;
  };
  go.onclick = doGo;
  url.onkeydown = e => { if (e.key === 'Enter') doGo(); };
  if (tab.st.url) spBrowserState(tab);
  // 实况轮询：内置浏览器是 agent 与用户共用的视图，agent 操作期间面板
  // 跟随刷新。3s 一次（BitBlt + PNG ~100ms，常驻开销可接受）。
  if (tab.st.poll) clearInterval(tab.st.poll);
  tab.st.poll = setInterval(() => {
    if (SP.active !== tab.id || !SP.tabs.some(x => x.id === tab.id)) {
      clearInterval(tab.st.poll);
      tab.st.poll = 0;
      return;
    }
    spBrowserState(tab);
  }, 3000);
}

async function spBrowserState(tab) {
  const host = $('#spbody');
  const box = host && host.querySelector('#spb-body');
  if (!box) return;
  let res;
  try {
    res = await api('/browser/state');
  } catch (e) {
    box.innerHTML = '<div class="spempty">' + esc(e.message) + '</div>';
    return;
  }
  if (SP.active !== tab.id) return;
  const url = res.url || '';
  if (url) {
    const inp = host.querySelector('#spb-url');
    if (inp && !inp.value) inp.value = url;
  }
  const img = res.screenshot
    ? '<img src="data:image/png;base64,' + esc(res.screenshot) + '" alt="">'
    : '';
  box.innerHTML = img + (res.text ? '<details class="spbtxt"><summary>' + esc(t('spb_text')) + '</summary><pre>' + esc(res.text) + '</pre></details>' : '');
  // 点击穿透：截图坐标 → 视口物理坐标（缩放截图按显示尺寸换算）
  const im = box.querySelector('img');
  if (im) im.onclick = async e => {
    const r = im.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * im.naturalWidth;
    const y = (e.clientY - r.top) / r.height * im.naturalHeight;
    im.style.opacity = '.6';
    try {
      await api('/browser/click', { method: 'POST', body: { x, y } });
      setTimeout(() => spBrowserState(tab), 900);
    } catch (e2) { toast(e2.message); }
    im.style.opacity = '';
  };
}

function spRenderTerminal(host, tab) {
  const st = tab.st;
  st.out = st.out || '';
  st.runId = st.runId || null;
  host.innerHTML = '<div class="spterm"><div class="log" id="spt-log"></div>' +
    '<div class="cmd"><span class="pr">$</span><input id="spt-in" spellcheck="false" autocomplete="off"></div></div>';
  const log = host.querySelector('#spt-log');
  log.textContent = st.out;
  const inp = host.querySelector('#spt-in');
  const run = async () => {
    const cmd = inp.value.trim();
    if (!cmd) return;
    inp.value = '';
    st.out += '$ ' + cmd + '\n';
    log.textContent = st.out;
    log.scrollTop = log.scrollHeight;
    // 客户端自选 id：流式输出在命令结束前就开始了，服务端生成 id 的话
    // 前端来不及订阅，所以由客户端先定下来再发请求。
    const cid = 'term_c' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    st.runId = cid;
    try {
      const res = await api('/term/exec', { method: 'POST', body: { command: cmd, call_id: cid } });
      if (res.error) st.out += res.error + '\n';
      else if (res.stdout) st.out += res.stdout.replace(/\n$/, '') + '\n';
      st.out += '\n';
      st.runId = null;
    } catch (e) {
      st.out += e.message + '\n';
      st.runId = null;
    }
    if (SP.active === tab.id) {
      const l2 = $('#spbody') && $('#spbody').querySelector('#spt-log');
      if (l2) { l2.textContent = st.out; l2.scrollTop = l2.scrollHeight; }
    }
  };
  inp.onkeydown = e => { if (e.key === 'Enter') run(); };
}

 * /term/list（后台终端）。没有部署记录时展示的就是真实空态，而不是占位文案。

function spRenderDeploy(host) {

    '<p class="spdhint">' + esc(t('dep_hint')) + '</p></div>';
  spDeployLoad(host);

async function spDeployLoad(host) {
  const box = host.querySelector('#spdep');
  if (!box) return;
  let gs = null, jobs = [], entries = [];
  try {
    const [g, tm, tr] = await Promise.all([
      api('/git/status').catch(() => ({ status: null })),
      api('/term/list').catch(() => ({ jobs: [] })),
      api('/fs/tree?path=').catch(() => ({ entries: [] })),
    ]);
    gs = g.status;
    jobs = tm.jobs || [];
    entries = tr.entries || [];
  } catch (e) { /* 离线：下面按空态渲染 */ }
  if (!box.isConnected) return;
  const rows = [];
  const row = (k, v) => '<div class="spdr"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>';
  if (gs && gs.is_repo) {
    rows.push(row(t('dep_branch'), gs.branch || 'HEAD'));
    rows.push(row(t('dep_changes'), String((gs.files || []).length)));
  } else {
    rows.push(row(t('dep_branch'), t('dep_not_repo')));
  }
  const names = entries.map(e => e.name || e.path || '');
  const build = names.includes('Cargo.toml') ? 'cargo build --release'
    : names.includes('package.json') ? 'npm run build'
    : names.includes('Makefile') ? 'make'
    : names.includes('pyproject.toml') ? 'python -m build'
    : '';
  rows.push(row(t('dep_build'), build || t('dep_build_none')));
  const running = jobs.filter(j => j.status === 'running').length;
  rows.push(row(t('dep_terms'), running + ' / ' + jobs.length));
  box.innerHTML = rows.join('') + (build ? '<div class="spdcmd">$ ' + esc(build) + '</div>' : '');
}

/** 消息列表增量渲染：只补/改节点，不重建容器，也不重复追加正文。 */
function spSideSync(host, tab) {
  const st = tab.st;
  if (!host || !tab || !st) return;
  // host 指向当前打开的面板；异步操作（保存/删除）期间用户可能切到别的标签，
  // 这时不能把后台标签的内容写进用户正在看的那个面板。
  if (host.id === 'spbody' && tab.id !== SP.active) return;
  const box = host.querySelector('#spc-msgs');
  if (!box) return;
  const list = st.msgs;
  while (box.children.length > list.length) box.lastElementChild.remove();
  list.forEach((m, i) => {
    let n = box.children[i];
    if (!n) { n = document.createElement('div'); box.append(n); }
    const cls = 'm ' + (m.role === 'user' ? 'u' : m.role === 'error' ? 'err' : 'a');
    if (n.className !== cls) n.className = cls;
    // 节点可能被下一条消息复用（重新生成会 splice 掉旧消息，新消息正好落到
    // 同一个 DOM 节点上）。身份变了必须整块重建，否则 .arow 的 onclick 闭包
    // 还抓着旧消息对象，「编辑/复制/删除」会作用到已经不存在的那条上——编辑
    // 尤其危险：PATCH 打的是新下标，内容却是旧答案。
    if (n.__m !== m) {
      n.__m = m;
      n.innerHTML = '';
      delete n.dataset.init;
      delete n.dataset.tx;
      delete n.dataset.editing;
    }
    // 就地编辑中：跳过这个节点，别把 textarea 和保存/取消按钮冲掉。
    if (n.dataset.editing === '1') return;
    if (m.role === 'assistant') {
      // 骨架一次建好：工具卡片区 + 正文区。之后只增量更新，不再整块重画，
      // 否则每来一个 text.delta 都会把工具卡片重建一遍。
      // 也要检查子节点是否真的存在：spSideEdit 会清空 innerHTML，如果只信
      // dataset.init，后面 querySelector('.sab') 会拿到 null 并抛异常。
      if (!n.dataset.init || !n.querySelector('.stools') || !n.querySelector('.sab')) {
        n.innerHTML = '<div class="stools"></div><div class="sab"></div>';
        n.dataset.init = '1';
        delete n.dataset.tx;
      }
      const toolsBox = n.querySelector('.stools');
      const ab = n.querySelector('.sab');
      // 工具卡片：按 callId 复用节点；结果到达后 fillToolCard 整体重写。
      (m.tools || []).forEach(t => {
        let card = [...toolsBox.querySelectorAll('[data-call]')]
          .find(el => el.dataset.call === t.id);
        if (!card) {
          card = toolCard(toolsBox, t.id, t.name, toolDesc(t.name, t.args || {}));
          card.dataset.args = JSON.stringify(t.args || {});
          card.classList.remove('msg');
        }
        if (t.display) fillToolCard(card, t.display, t.ok !== false, t.title);
      });
      if (ab.dataset.tx !== m.text) {
        ab.dataset.tx = m.text;
        ab.innerHTML = '';
        renderBlocks(ab, m.text || '');
      }
      // 用时行：生成中「工作中 x 秒」，结束后定格「已工作 x 秒」
      let wk = n.querySelector('.wk');
      if (st.streaming && m === st.msgs[st.msgs.length - 1]) {
        if (!wk) { wk = document.createElement('div'); wk.className = 'wk on'; wk.innerHTML = '<i class="wd"></i><span class="wtx"></span>'; n.append(wk); }
        const tx = wk.querySelector('.wtx');
        if (tx) tx.textContent = t('working') + ' ' + fmtDur(Date.now() - (st.t0 || Date.now()));
        wk.classList.add('on');
        wk.classList.remove('done');
      } else if (m.doneMs) {
        if (!wk) { wk = document.createElement('div'); wk.className = 'wk'; wk.innerHTML = '<i class="wd"></i><span class="wtx"></span>'; n.append(wk); }
        const tx = wk.querySelector('.wtx');
        if (tx) tx.textContent = t('worked').replace('{t}', fmtDur(m.doneMs));
        wk.classList.add('done');
        wk.classList.remove('on');
      }
      // 操作行：按钮靠左、时间靠右（和主对话一致），只有结束后的消息才有
      let ar = n.querySelector('.arow');
      if (m.ts) {
        if (!ar) {
          ar = document.createElement('div');
          ar.className = 'arow';
          ar.innerHTML = '<div class="acts show">' +
            '<button class="ib" data-sa="copy" title="' + t('copy') + '">' + ic('copy') + '</button>' +
            '<button class="ib" data-sa="re" title="' + t('regen') + '">' + ic('retry') + '</button>' +
            '<button class="ib" data-sa="edit" title="' + t('editmsg') + '">' + ic('edit') + '</button>' +
            '<button class="ib danger" data-sa="del" title="' + t('delmsg') + '">' + ic('trash') + '</button>' +
            '</div>' +
            '<span class="ts">' + esc(fmtWhen(m.ts)) + '</span>';
          // 四按钮的语义和主对话一致：复制 / 重新生成 / 编辑正文 / 删除。
          // 侧聊会话是 fork 出来的，服务端下标 = fork 前历史条数 + 本地非错误消息序号。
          ar.onclick = ev => {
            const b = ev.target.closest('[data-sa]');
            if (!b) return;
            const k = b.dataset.sa;
            if (k === 'copy') { copyText(m.text || ''); return; }
            const at = spSideIdx(tab, i);
            if (k === 're') spSideRegen(tab, i, at);
            else if (k === 'edit') spSideEdit(tab, i, at, n, m);
            else if (k === 'del') spSideDel(tab, i, at);
          };
          n.append(ar);
        } else {
          const ts = ar.querySelector('.ts');
          if (ts) ts.textContent = fmtWhen(m.ts);
        }
      }
    } else if (n.textContent !== m.text) {
      n.textContent = m.text;
    }
  });
  spSidePending(host, tab);
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 80;
  if (atBottom || st.streaming) box.scrollTop = box.scrollHeight;
}

/** 输入框外观与主输入框一致：权限胶囊、模型胶囊、发送键。 */
function spSideChrome(host, tab) {
  if (!host || !tab) return;
  if (host.id === 'spbody' && tab.id !== SP.active) return;   // 别写到别的标签上
  const st = tab.st;
  const pml = host.querySelector('#spc-pml');
  if (pml) pml.textContent = t('p_' + S.perm);
  const mtx = host.querySelector('#spc-mltx');
  if (mtx) {
    mtx.textContent = modelLabel();
    mtx.parentElement.classList.toggle('todo', !modelOk());
  }
  const lvx = host.querySelector('#spc-lvl');
  if (lvx) lvx.textContent = t('l' + S.lvl);
  const sd = host.querySelector('#spc-send');
  const inp = host.querySelector('#spc-in');
  if (sd && inp) {
    sd.innerHTML = ic(st.streaming ? 'stop' : 'send');
    sd.disabled = !st.streaming && !inp.value.trim() && !(st.atts || []).length;
  }
}

function spSideBind(host, tab) {
  const st = tab.st;
  const inp = host.querySelector('#spc-in');
  const fit = () => { inp.style.height = 'auto'; inp.style.height = Math.min(150, inp.scrollHeight || 24) + 'px'; };
  inp.addEventListener('input', () => { fit(); spSideChrome(host, tab); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); spSideSend(host, tab); }
  });
  host.querySelector('#spc-send').onclick = () => spSideSend(host, tab);
  // ZCode 的模型选择是分组下拉、思考强度是独立档位控件；这里用同一套浮动菜单实现。
  host.querySelector('#spc-ml').onclick = ev => {
    ev.stopPropagation();
    pkRenderInto(floatMenu(ev.currentTarget));
  };
  host.querySelector('#spc-pm').onclick = ev => {
    ev.stopPropagation();
    pickMenu(ev.currentTarget, [{
      title: t('permT'),
      items: PK.map(k => ({ v: k, label: t('p_' + k), sub: t('d_' + k), on: S.perm === k }))
    }], v => {
      S.perm = v;
      apply();
      tpRender();
      renderMM();
      spSideChrome(host, tab);
    });
  };
  host.querySelector('#spc-lv').onclick = ev => {
    ev.stopPropagation();
    pickMenu(ev.currentTarget, [{
      title: t('lvlT'),
      items: [0, 1, 2, 3].map(n => ({ v: n, label: t('l' + n), on: S.lvl === n }))
    }], v => {
      S.lvl = +v;
      apply();
      renderMM();
      spSideChrome(host, tab);
    });
  };
  // 附件走与主输入框同一个上传接口，落在本标签自己的 st.atts 里。
  const fi = document.createElement('input');
  fi.type = 'file'; fi.multiple = true; fi.style.display = 'none';
  host.append(fi);
  host.querySelector('#spc-att').onclick = () => fi.click();
  fi.onchange = () => { spSideAddFiles(host, tab, fi.files); fi.value = ''; };
  fit();
}

async function spSideAddFiles(host, tab, files) {
  const st = tab.st;
  for (const f of [...files]) {
    if ((st.atts || []).length >= 6) break;
    const att = { name: f.name, size: f.size, path: '', loading: true };
    st.atts.push(att);
    spSideAtts(host, tab);
    try {
      const res = await fetch('/api/attachments?name=' + encodeURIComponent(f.name), {
        method: 'POST', headers: { 'X-Parable-Token': TOKEN }, body: f
      });
      const d = await res.json().catch(() => null);
      if (!res.ok || !d || !d.path) throw new Error((d && d.error) || (res.status + ' ' + res.statusText));
      att.path = d.path;
      att.loading = false;
    } catch (e) {
      const k = st.atts.indexOf(att);
      if (k >= 0) st.atts.splice(k, 1);
      toast(t('att_fail') + e.message);
    }
    spSideAtts(host, tab);
  }
  spSideChrome(host, tab);
}

function spSideAtts(host, tab) {
  if (!host || !tab) return;
  if (host.id === 'spbody' && tab.id !== SP.active) return;
  const el = host.querySelector('#spc-atts');
  if (!el) return;
  const st = tab.st;
  el.innerHTML = (st.atts || []).map((a, i) =>
    '<span class="att' + (a.loading ? ' upl' : '') + '">' + ic('file') + '<b>' + esc(a.name) + '</b>' +
    (a.loading ? '<span class="upltxt">…</span>' : '') +
    '<span class="x" data-sx="' + i + '">×</span></span>').join('');
  el.querySelectorAll('[data-sx]').forEach(x => {
    x.onclick = () => { st.atts.splice(+x.dataset.sx, 1); spSideAtts(host, tab); spSideChrome(host, tab); };
  });
}

async function spSideSend(host, tab) {
  const st = tab.st;
  if (!modelOk()) { toast(t('select_model')); spSideChrome(host, tab); return; }
  const inp = host.querySelector('#spc-in');
  const text = (inp.value || '').trim();
  if (st.streaming) { sigStopSide(tab); return; }
  if (!text && !(st.atts || []).length) return;
  if (!st.sid) { toast(t('sp_sidechat_placeholder')); return; }
  inp.value = '';
  inp.style.height = '24px';
  const userMsg = { role: 'user', text: text };
  const aiMsg = { role: 'assistant', text: '' };
  st.msgs.push(userMsg, aiMsg);
  st.cur = aiMsg;
  st.streaming = true;
  st.t0 = Date.now();
  if (st.wkt) clearInterval(st.wkt);
  st.wkt = setInterval(() => {
    if (!st.streaming) { clearInterval(st.wkt); st.wkt = 0; return; }
    const curTab = SP.tabs.find(x => x.id === SP.active);
    if (curTab && curTab.id === tab.id) spSideSync($('#spbody'), tab);
  }, 1000);
  spSideSync(host, tab);
  spSideChrome(host, tab);
  try {
    await api('/chat', {
      method: 'POST',
      body: {
        session_id: st.sid,
        text: text,
        attachments: (st.atts || []).filter(a => a.path).map(a => ({ path: a.path, name: a.name, size: a.size })),
        model: S.model,
        permission_mode: S.perm,
        thinking_level: Math.max(0, Math.min(3, +S.lvl || 0))
      }
    });
    st.atts = [];
    spSideAtts(host, tab);
  } catch (e) {
    st.streaming = false;
    st.cur = null;
    if (st.wkt) { clearInterval(st.wkt); st.wkt = 0; }
    // 请求失败就回滚两条乐观消息，并把文字还给输入框；附件还在 st.atts 里。
    const ai = st.msgs.indexOf(aiMsg);
    if (ai >= 0 && !(aiMsg.text || '').trim()) st.msgs.splice(ai, 1);
    const ui = st.msgs.indexOf(userMsg);
    if (ui >= 0) st.msgs.splice(ui, 1);
    if (inp && !inp.value.trim()) {
      inp.value = text;
      inp.dispatchEvent(new Event('input'));
    }
    st.msgs.push({ role: 'error', text: e.message });
    spSideSync(host, tab);
    spSideChrome(host, tab);
  }
}

/** 贴着触发胶囊往上弹的选择菜单（模型 / 思考强度共用）。 */
function floatMenu(anchor) {
  document.querySelectorAll('.pickm').forEach(x => x.remove());
  document.querySelectorAll('.pop.open').forEach(p => p.classList.remove('open'));
  const box = document.createElement('div');
  box.className = 'pop open pickm';
  // position:absolute + 只给 left 时宽度是 shrink-to-fit，会被右侧剩余空间挤扁；
  // 让它按内容撑开，再由 place() 往左让位。
  box.style.width = 'max-content';
  box.style.maxWidth = 'calc(100vw - 16px)';
  document.body.append(box);
  const off = () => { box.remove(); document.removeEventListener('click', off, true); };
  setTimeout(() => document.addEventListener('click', off, true), 0);
  box.addEventListener('click', ev => ev.stopPropagation());
  const place = () => {
    const r = anchor.getBoundingClientRect();
    const w = box.offsetWidth || 560, h = box.offsetHeight || 300;
    box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    box.style.top = Math.max(8, r.top - h - 8) + 'px';
  };
  box.__place = place;
  place();
  requestAnimationFrame(place);
  // 内容（供应商/模型列表）是异步填进来的：宽度一变就重新贴回胶囊，别让它跑出屏幕。
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => place());
    ro.observe(box);
    setTimeout(() => { try { ro.disconnect(); } catch (e) {} }, 1200);
  }
  addEventListener('resize', place, { once: true });
  return box;
}

function pickMenu(anchor, groups, onPick) {
  const box = floatMenu(anchor);
  box.innerHTML = groups.map(g =>
    '<div class="gl">' + esc(g.title) + '</div>' +
    g.items.map(it =>
      '<div class="mi" data-pv="' + esc(String(it.v)) + '"><div><div>' + esc(it.label) + '</div>' +
      (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</div>' +
      (it.on ? ic('check') : '') + '</div>'
    ).join('')
  ).join('');
  box.addEventListener('click', ev => {
    const it = ev.target.closest('[data-pv]');
    if (!it) return;
    onPick(it.dataset.pv);
    box.remove();
  });
  const r = anchor.getBoundingClientRect();
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - box.offsetWidth - 8)) + 'px';
  box.style.top = Math.max(8, r.top - box.offsetHeight - 8) + 'px';
}

/** 侧聊的停止：和主对话同一个中断接口，只是不碰主对话的 busy 状态。 */
function sigStopSide(tab) {
  const sid = tab && tab.st && tab.st.sid;
  if (tab && tab.st) {
    tab.st.streaming = false;
    tab.st.cur = null;
    if (tab.st.wkt) { clearInterval(tab.st.wkt); tab.st.wkt = 0; }
  }
  if (!sid) return;
  api('/interrupt', { method: 'POST', body: { session_id: sid } }).catch(() => {});
}

/**
 * 点悬浮窗里的子智能体：在侧栏打开它的对话。
 *
 * 只读 —— 这里没有输入框，也不会调用 /chat。子智能体本来就各有自己的
 * session，所以直接复用它落库的消息（/sessions/{id}/messages），并套用
 * 主对话同一套消息 DOM，视觉与历史会话一致。
 */
function openAgentChat(a) {
  const sid = a && (a.sessionId || a.session_id);
  if (!sid) return;
  document.body.classList.remove('sp0');
  SP.open = true;
  let tab = SP.tabs.find(x => x.kind === 'agent' && x.st.sid === sid);
  if (!tab) {
    tab = {
      id: 't' + (++SP.seq),
      kind: 'agent',
      title: a.name || a.id || t('sp_agent'),
      st: { sid: sid, name: a.name || a.id || '', task: a.label || a.task || '', status: a.status || '' }
    };
    SP.tabs.push(tab);
  } else {
    if (a.name) tab.st.name = a.name;
    if (a.label || a.task) tab.st.task = a.label || a.task;
    if (a.status) tab.st.status = a.status;
    tab.title = tab.st.name || tab.title;
    tab.st.msgs = null;
  }
  SP.active = tab.id;
  spRender();
  // 收起悬浮窗：它正好压在侧栏上方。
  if (DK.tab) {
    DK.tab = null;
    $('#dkpanel').hidden = true;
    document.querySelectorAll('.dpill').forEach(x => x.classList.remove('on'));
  }
}

/** 拉一次该智能体的消息并重绘（保持滚动位置，贴底时继续贴底）。 */
async function spAgentFetch(tab) {
  const st = tab.st;
  if (!st.sid || st.busy) return;
  st.busy = true;
  let msgs = null, err = '';
  try {
    const res = await api('/sessions/' + encodeURIComponent(st.sid) + '/messages');
    msgs = res.messages || [];
  } catch (e) { err = e.message; }
  st.busy = false;
  if (msgs) st.msgs = msgs;
  st.err = err;
  const cur = SP.tabs.find(x => x.id === SP.active);
  if (!cur || cur.id !== tab.id) return;
  const host = $('#spbody');
  if (!host) return;
  const rl = host.querySelector('.spag .rl');
  if (rl) rl.textContent = st.status || '';
  const body = host.querySelector('.spagm');
  if (!body) return;
  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
  const keep = body.scrollTop;
  if (err && !st.msgs) body.innerHTML = '<div class="spempty">' + esc(err) + '</div>';
  else spAgentTranscript(body, st.msgs || []);
  body.scrollTop = atBottom ? body.scrollHeight : keep;
}

/** 侧栏里的智能体对话：头部信息 + 只读消息流。 */
function spRenderAgent(host, tab) {
  const st = tab.st;
  host.innerHTML = '<div class="spag"><div class="spagh">' +
    '<span class="nm"></span><span class="rl"></span><span class="ro"></span>' +
    '<div class="tk"></div></div><div class="spagm"></div></div>';
  host.querySelector('.spag .nm').textContent = st.name || st.sid;
  host.querySelector('.spag .rl').textContent = st.status || '';
  host.querySelector('.spag .ro').textContent = t('sp_agent_ro');
  host.querySelector('.spag .tk').textContent = st.task || '';
  const body = host.querySelector('.spagm');
  if (st.msgs) {
    spAgentTranscript(body, st.msgs);
    body.scrollTop = body.scrollHeight;
  } else {
    body.innerHTML = '<div class="spempty">' + esc(st.err || t('sp_agent_empty')) + '</div>';
    spAgentFetch(tab);
  }
}

/**
 * 把消息数组铺成主对话那套 DOM：用户气泡 / 思考块 / 工具卡片 / markdown 正文。
 * 与 openSession() 的重放逻辑一致，区别只是写进侧栏容器、不带编辑删除按钮。
 */
function spAgentTranscript(host, msgs) {
  host.innerHTML = '';
  const cardById = {};
  let a = null, ab = null;
  const ensureA = () => {
    if (!a) {
      a = document.createElement('div');
      a.className = 'a msg';
      a.innerHTML = '<div class="ab"></div>';
      host.append(a);
      ab = a.querySelector('.ab');
    }
    return ab;
  };
  for (const m of msgs) {
    const parts = normParts(m.parts);
    const results = parts.filter(p => p.k === 'result');
    const texts = parts.filter(p => p.k === 'text');
    if (m.role === 'user') {
      if (texts.length) {
        a = null; ab = null;
        const d = document.createElement('div');
        d.className = 'u msg';
        const b = document.createElement('div');
        b.className = 'ub';
        const tx = document.createElement('div');
        tx.textContent = noEmoji(texts.map(x => x.text).join('\n\n'));
        b.append(tx);
        d.append(b);
        host.append(d);
      }
      results.forEach((r, i) => {
        const display = (m.displays && m.displays[i]) || { kind: 'plain', text: r.text || '' };
        let card = cardById[r.id];
        if (!card) { card = toolCard(ensureA(), r.id, 'tool', ''); cardById[r.id] = card; }
        fillToolCard(card, display, !r.error, card.querySelector('.fi b').textContent);
      });
      continue;
    }
    for (const p of parts) {
      if (p.k === 'think') {
        const th = document.createElement('div');
        th.className = 'th';
        th.innerHTML = '<button class="thh"><span></span>' + ic('chev') +
          '</button><div class="thb"><div class="thbody"></div></div>';
        bindThink(th);
        th.querySelector('.thh span').textContent = t('thought').replace('{n}', 1);
        th.querySelector('.thbody').textContent = p.text || '';
        fitThink(th);
        ensureA().append(th);
      } else if (p.k === 'tool') {
        cardById[p.id] = toolCard(ensureA(), p.id, p.name, toolTitle(p.name, p.args));
      } else if (p.k === 'text') {
        renderBlocks(ensureA(), p.text || '');
      }
    }
  }
}

/**
 * 侧边栏的 SSE 钩子。
 *
 * 主对话区在 dispatch() 里按会话过滤事件；侧边栏需要看到全部事件
 * （尤其是辅助对话自己那个会话的流式输出），所以这个钩子挂在会话过滤
 * 之前。它只往侧边栏自己的标签里写，不会污染主对话区。
 */
/** 侧聊本地消息 → 服务端消息下标（fork 时的历史条数 + 之前的非错误消息数）。 */
function spSideIdx(tab, i) {
  const m = tab.st.msgs[i];
  if (m && m.si != null) return m.si;
  const base = tab.st.forked || 0;
  let n = 0;
  for (let k = 0; k < i; k++) if (tab.st.msgs[k] && tab.st.msgs[k].role !== 'error') n++;
  return base + n;
}

/** 从存储消息里提取正文（用于把本地气泡对齐到服务端下标）。 */
function spSideText(m) {
  return normParts(m && m.parts).filter(p => p.k === 'text')
    .map(p => p.text).join('\n\n').trim();
}

/**
 * 重新把本地气泡映射到服务端下标。
 *
 * 旧实现只给最后一条钉 si = length-1，前面的消息靠“本地条数”推算——服务端
 * 每次工具调用都会多插一条 ToolResult user 消息，只要用过工具，后面的编辑/
 * 删除/重跑就会整体偏移，删错消息。这里从尾部按 role + 正文回溯对齐，工具
 * 结果消息会被自然跳过。
 */
async function spSideRemap(tab) {
  const st = tab && tab.st;
  if (!st || !st.sid) return;
  let msgs;
  try {
    const r = await api('/sessions/' + st.sid + '/messages');
    msgs = r.messages || [];
  } catch (e) { return; }
  if (!SP.tabs.includes(tab)) return;
  st.srvCount = msgs.length;
  // 先清掉上一轮的映射：本次没匹配上的消息必须退回「未知」，留着过期 si 会
  // 让编辑/删除打到别的消息上。
  st.msgs.forEach(m => { if (m && m.si != null) delete m.si; });
  // 正向配对：本地顺序和服务端顺序一致，从上一条命中的位置继续往后找。
  // 倒序搜索在多段正文/工具结果交错时会命中更靠后的分片。
  let from = 0;
  for (let i = 0; i < st.msgs.length; i++) {
    const m = st.msgs[i];
    if (!m || m.role === 'error') continue;
    const want = String(m.text || '').trim();
    if (!want) continue;
    let found = -1;
    for (let k = from; k < msgs.length; k++) {
      const sm = msgs[k];
      if (!sm || sm.role !== m.role) continue;
      const tx = spSideText(sm);
      if (!tx) continue;
      const hit = m.role === 'user'
        ? tx === want
        : (tx === want || tx.startsWith(want) || want.startsWith(tx));
      if (hit) { found = k; break; }
    }
    if (found >= 0) { m.si = found; from = found + 1; }
  }
}

/** 侧聊：删掉这条回答，让模型带着同样的上下文重跑一遍（和主对话的 ↻ 同义）。 */
async function spSideRegen(tab, i, at) {
  const st = tab.st;
  if (!st.sid || st.streaming) return;
  if (at == null) { toast(t('toast')); return; }
  try {
    await api('/sessions/' + st.sid + '/messages', { method: 'DELETE', body: { from: at } });
  } catch (e) { toast(e.message); return; }
  // DELETE 期间标签可能被关掉：再发 /chat 会让后端白烧一轮 token，
  // 前端却已经没有任何状态在跟踪它。
  if (!SP.tabs.includes(tab)) return;
  st.msgs.splice(i);
  st.cur = { role: 'assistant', text: '' };
  st.msgs.push(st.cur);
  st.streaming = true;
  st.t0 = Date.now();
  if (st.wkt) clearInterval(st.wkt);
  st.wkt = setInterval(() => {
    if (!st.streaming) { clearInterval(st.wkt); st.wkt = 0; return; }
    const curTab = SP.tabs.find(x => x.id === SP.active);
    if (curTab && curTab.id === tab.id) spSideSync($('#spbody'), tab);
  }, 1000);
  spSideSync($('#spbody'), tab);
  spSideChrome($('#spbody'), tab);
  api('/chat', {
    method: 'POST',
    body: { session_id: st.sid, text: '', retry: true, model: S.model, permission_mode: S.perm, thinking_level: Math.max(0, Math.min(3, +S.lvl || 0)) }
  }).catch(e => {
    st.streaming = false;
    st.cur = null;
    if (st.wkt) { clearInterval(st.wkt); st.wkt = 0; }
    toast(e.message);
    spSideSync($('#spbody'), tab);
    spSideRemap(tab).then(() => { if (SP.active === tab.id) spSideSync($('#spbody'), tab); });
  });
}

/** 侧聊：就地改这段回答的正文并落库（执行过程不属于可编辑范围，这里只有正文）。 */
function spSideEdit(tab, i, at, node, m) {
  if (tab.st.streaming) return;
  const box = document.createElement('textarea');
  box.className = 'tx';
  box.value = m.text || '';
  box.style.cssText = 'width:100%;font:13px/1.6 var(--sans);margin:6px 0;resize:vertical;min-height:44px';
  const bar = document.createElement('div');
  bar.className = 'macts';
  bar.style.cssText = 'opacity:1;transform:none;justify-content:flex-start';
  bar.innerHTML = '<button class="btn" data-save>' + t('save') + '</button>' +
                  '<button class="btn" data-cancel>' + t('close') + '</button>';
  // 关键：骨架标记必须一起清掉。否则 spSideSync 会以为 .stools/.sab 还在，
  // 直接去取 ab.dataset.tx 时抛 TypeError，整个侧聊从此不再刷新。
  node.innerHTML = '';
  delete node.dataset.init;
  delete node.dataset.tx;
  // 标记为「正在就地编辑」：期间来的 status / permission 事件会触发重绘，
  // 不挡住的话骨架检查会把 textarea 整个冲掉，用户打的字就没了。
  node.dataset.editing = '1';
  node.append(box, bar);
  box.focus();
  bar.querySelector('[data-cancel]').onclick = () => {
    delete node.dataset.editing;
    spSideSync($('#spbody'), tab);
  };
  bar.querySelector('[data-save]').onclick = async () => {
    const v = box.value;
    try {
      await api('/sessions/' + tab.st.sid + '/messages/' + at, { method: 'PATCH', body: { text: v } });
      m.text = v;
      delete node.dataset.editing;
      spSideSync($('#spbody'), tab);
    } catch (e) {
      delete node.dataset.editing;
      spSideSync($('#spbody'), tab);
      toast(e.message);
    }
  };
}

/** 侧聊：删掉这条回答（本地 + 服务端），之前的上下文保留。 */
async function spSideDel(tab, i, at) {
  if (tab.st.streaming) return;
  if (at == null) { toast(t('toast')); return; }
  if (!(await confirmBox(S.lang === 'zh' ? '确定删除这条消息？' : 'Delete this message?'))) return;
  // 一个气泡可能横跨 assistant + 多条 ToolResult user 消息：删除范围要取
  // 下一条已知服务端下标，而不是永远 at+1（旧代码会把工具结果留在库里）。
  const next = tab.st.msgs.slice(i + 1).find(x => x && x.si != null && x.si > at);
  const to = next ? next.si
    : (tab.st.srvCount && tab.st.srvCount > at ? tab.st.srvCount : at + 1);
  tab.st.msgs.splice(i, 1);
  tab.st.msgs.forEach(x => { if (x && x.si != null && x.si >= to) x.si -= (to - at); });
  if (tab.st.srvCount) tab.st.srvCount -= (to - at);
  spSideSync($('#spbody'), tab);
  api('/sessions/' + tab.st.sid + '/messages', { method: 'DELETE', body: { from: at, to } })
    .catch(e => toast(e.message));
}

/** 侧聊底部三块统计（会话 / token / 上下文），口径与主对话一致。 */
function spSideStats(tab) {
  // 只在当前激活的标签上写：这些 id 是全局的，后台标签的 status 事件
  // 不能覆盖用户正在看的那个面板。
  if (!tab || tab.id !== SP.active) return;
  const host = $('#spbody');
  if (!host || !tab || !tab.st) return;
  const s = tab.st.status || {};
  const set = (id, v) => { const e = host.querySelector('#' + id); if (e) e.textContent = v; };
  const turns = s.turns || 0, steps = s.steps || 0, tps = s.tps || 0;
  set('spc-stats-tx', turns + ' ' + t('u_turns') + ' ' + steps + ' ' + t('u_steps') + ' · ' + tps + ' tok/s');
  const tk = s.tokens || {};
  set('spc-token-tx', kfmt(tk.total || 0) + ' tok · ' + t('cache_hit') + ' ' + (tk.cacheHit || 0) + '%');
  const cx = s.context || {};
  set('spc-ctx-tx', (cx.limit ? Math.round((cx.used || 0) / cx.limit * 100) : 0) + '%');
}

/**
 * 侧聊内联的权限/提问面板。
 *
 * 主对话有底部 qsurf 接管，侧聊以前只把事件存进 st.perm / st.question 却
 * 从不渲染——permission_mode=ask 或 ask_user 时整轮永久挂起。这里给侧聊
 * 一个最小的批准/回答入口，复用同一组 /permission、/answer 接口。
 */
function spSidePending(host, tab) {
  if (!host || !tab) return;
  if (host.id === 'spbody' && tab.id !== SP.active) return;
  const st = tab.st;
  const el = host.querySelector('#spc-perm');
  if (!el) return;
  const key = st.perm ? 'p:' + (st.perm.callId || '') : (st.question ? 'q:' + (st.question.callId || '') : '');
  // 流式 delta 每秒都会调 spSideSync；内容没变就不要重建，否则正在输入的
  // 回答会被 innerHTML 清掉。
  if (el.dataset.k === key) return;
  el.dataset.k = key;
  if (st.perm) {
    const p = st.perm;
    el.innerHTML = '<div style="margin:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)">' +
      '<div style="font:12px/1.6 var(--sans)"><b>' + esc(p.tool || '') + '</b> ' + riskChip(p.risk) +
      (p.path ? '<div style="font-family:var(--mono);word-break:break-all;opacity:.8">' + esc(p.path) + '</div>' : '') +
      (p.reason ? '<div style="opacity:.8">' + esc(p.reason) + '</div>' : '') +
      '<div style="opacity:.6">' + esc(t('wp')) + '</div></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">' +
      '<button class="btn" data-pd="once">' + esc(t('a1')) + '</button>' +
      '<button class="btn ghost" data-pd="always">' + esc(t('aa')) + '</button>' +
      '<button class="btn ghost" data-pd="deny">' + esc(t('dy')) + '</button>' +
      '</div></div>';
    el.querySelectorAll('[data-pd]').forEach(b => {
      b.onclick = async () => {
        b.disabled = true;
        try {
          await api('/permission', { method: 'POST', body: { call_id: p.callId, decision: b.dataset.pd } });
          st.perm = null;
          // 必须删掉而不是置空：下一个 key 也是 ''，置空会命中早退分支，
          // 面板永远清不掉，剩下的按钮还能再点一次。
          delete el.dataset.k;
          spSidePending(host, tab);
          spSideSync(host, tab);
        } catch (e) { b.disabled = false; toast(e.message); }
      };
    });
    return;
  }
  if (st.question) {
    const q = st.question;
    const opts = (q.options || []).map(o => String(o == null ? '' : o).trim()).filter(Boolean);
    el.innerHTML = '<div style="margin:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)">' +
      '<div style="font:12px/1.6 var(--sans);white-space:pre-wrap">' + esc(q.question || '') + '</div>' +
      (opts.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
        opts.map((o, i) => '<button class="btn ghost" data-qo="' + i + '">' + esc(o) + '</button>').join('') + '</div>' : '') +
      '<div style="display:flex;gap:6px;margin-top:8px"><input class="spq-in" style="flex:1;min-width:0" placeholder="' +
      esc(t('q_hint')) + '"><button class="btn" data-qs>' + esc(t('send_answer')) + '</button></div></div>';
    const inp = el.querySelector('.spq-in');
    const send = async v => {
      const val = String(v == null ? inp.value : v).trim();
      if (!val) { toast(t('q_need')); inp.focus(); return; }
      el.querySelectorAll('button,input').forEach(x => { x.disabled = true; });
      try {
        const r = await api('/answer', { method: 'POST', body: { call_id: q.callId, answer: val } });
        if (!r || !r.answered) toast(t('q_closed'));
        st.question = null;
        delete el.dataset.k;   // 同上：置空会命中早退，面板清不掉
        spSidePending(host, tab);
        spSideSync(host, tab);
      } catch (e) {
        el.querySelectorAll('button,input').forEach(x => { x.disabled = false; });
        toast(e.message);
      }
    };
    el.querySelectorAll('[data-qo]').forEach(b => {
      b.onclick = () => send(opts[+b.dataset.qo]);
    });
    el.querySelector('[data-qs]').onclick = () => send();
    inp.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); send(); }
    };
    setTimeout(() => { if (el.dataset.k === key) inp.focus(); }, 30);
    return;
  }
  el.innerHTML = '';
}

function spOnEvent(ev) {
  if (!SP.tabs.length || !ev) return;
  // 辅助对话标签：只处理属于自己会话的事件。
  SP.tabs.forEach(tab => {
    if (tab.kind !== 'sidechat') return;
    const sid = tab.st.sid;
    if (!sid || ev.sessionId !== sid) return;
    // 停止后（或还没开始时）迟到的正文/工具增量一律丢弃；收尾和状态事件
    // 仍要处理，否则计时器/状态会卡住。
    if (!tab.st.streaming && ev.type !== 'turn.end' && ev.type !== 'status' &&
        ev.type !== 'permission.request' && ev.type !== 'question' &&
        ev.type !== 'permission.resolved' && ev.type !== 'error') return;
    if (ev.type === 'text.delta') {
      // 空气泡已在发送时就挂进 msgs 了：这里只往里追加，收尾不清数组。
      if (!tab.st.cur) { tab.st.cur = { role: 'assistant', text: '' }; tab.st.msgs.push(tab.st.cur); }
      tab.st.cur.text += (ev.text || '');
    } else if (ev.type === 'tool.call') {
      // 工具调用：在同一个气泡里记一条，spSideSync 负责画成和主对话一样的卡片。
      if (!tab.st.cur) { tab.st.cur = { role: 'assistant', text: '' }; tab.st.msgs.push(tab.st.cur); }
      const cur = tab.st.cur;
      cur.tools = cur.tools || [];
      if (!cur.tools.find(x => x.id === ev.callId)) {
        cur.tools.push({ id: ev.callId, name: ev.tool, args: ev.args || {}, title: ev.title || '', display: null, ok: true });
      }
    } else if (ev.type === 'tool.result') {
      const cur = tab.st.cur;
      const tl = cur && cur.tools && cur.tools.find(x => x.id === ev.callId);
      if (tl) {
        tl.display = ev.display;
        tl.ok = ev.ok !== false;
        if (ev.title) tl.title = ev.title;
      }
    } else if (ev.type === 'text.done') {
      tab.st.cur = null;
    } else if (ev.type === 'turn.end') {
      // 收尾：最后一条助手消息定格用时与时间（侧聊的消息条和主对话同构）
      const last = tab.st.msgs[tab.st.msgs.length - 1];
      if (last && last.role === 'assistant') {
        last.doneMs = tab.st.t0 ? Date.now() - tab.st.t0 : 0;
        last.ts = last.ts || Date.now();
      }
      tab.st.cur = null;
      tab.st.streaming = false;
      if (tab.st.wkt) { clearInterval(tab.st.wkt); tab.st.wkt = 0; }
      // 工具调用会在服务端额外落 ToolResult user 消息，本地数组条数不等于
      // 服务端下标。整段重新对齐，而不是只给最后一条钉 length-1。
      spSideRemap(tab).then(() => {
        if (SP.active === tab.id) spSideSync($('#spbody'), tab);
      });
    } else if (ev.type === 'status') {
      tab.st.status = ev;
      spSideStats(tab);
    } else if (ev.type === 'permission.request') {
      tab.st.perm = ev;
    } else if (ev.type === 'permission.resolved') {
      const id = ev.id || ev.callId;
      if (tab.st.perm && (!id || id === tab.st.perm.callId)) tab.st.perm = null;
    } else if (ev.type === 'question') {
      tab.st.question = ev;
    } else if (ev.type === 'error') {
      tab.st.msgs.push({ role: 'error', text: ev.error || ev.message || 'error' });
      // 致命错误后不会再有 turn.end：不停掉流式状态的话发送键会永远停在
      // 「停止」，1 秒计时器也一直空转。
      if (ev.fatal) {
        tab.st.streaming = false;
        tab.st.cur = null;
        if (tab.st.wkt) { clearInterval(tab.st.wkt); tab.st.wkt = 0; }
      }
    }
  });
  // 终端面板：收集本标签发起的命令的流式输出。
  SP.tabs.forEach(tab => {
    if (tab.kind !== 'terminal' || !tab.st.runId) return;
    if (ev.type === 'tool.progress' && ev.callId === tab.st.runId) {
      tab.st.out += (ev.chunk || '') + '\n';
    }
  });
  // 智能体对话：子智能体跑起来时实时刷新（400ms 合并一次，避免每 token 一次请求）。
  SP.tabs.forEach(tab => {
    if (tab.kind !== 'agent' || ev.sessionId !== tab.st.sid) return;
    if (ev.type !== 'text.delta' && ev.type !== 'reasoning.delta' &&
        ev.type !== 'tool.result' && ev.type !== 'turn.end' && ev.type !== 'error') return;
    if (ev.type === 'turn.end') tab.st.status = 'completed';
    clearTimeout(tab.st.t);
    tab.st.t = setTimeout(() => {
      const cur = SP.tabs.find(x => x.id === SP.active);
      if (cur && cur.id === tab.id) spAgentFetch(tab);
      else tab.st.msgs = null; // 不在前台：标脏，切回来再拉
    }, 400);
  });
  // 只有当前可见的面板需要重绘。
  const cur = SP.tabs.find(x => x.id === SP.active);
  if (!cur) return;
  if (cur.kind === 'sidechat' && (ev.type === 'text.delta' || ev.type === 'turn.end' ||
      ev.type === 'tool.call' || ev.type === 'tool.result' ||
      ev.type === 'text.done' || ev.type === 'permission.request' || ev.type === 'question' ||
      ev.type === 'permission.resolved' || ev.type === 'error')) {
    // 只增量刷消息节点，不重建整块，输入框不会闪。
    spSideSync($('#spbody'), cur);
    spSideChrome($('#spbody'), cur);
  } else if (cur.kind === 'terminal' && ev.type === 'tool.progress' && ev.callId === cur.st.runId) {
    const log = $('#spbody') && $('#spbody').querySelector('#spt-log');
    if (log) { log.textContent = cur.st.out; log.scrollTop = log.scrollHeight; }
  }
}

/* ===== 自定义下拉：全站原生 select 统一增强（触发器 + 浮层，原生 select 保留在 DOM） ===== */
(function(){
  if (window.__selxReady) return;
  window.__selxReady = true;

  var CHEV = '<svg class="selx-ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHECK = '<svg class="selx-ov" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function labelOf(sel){
    var o = sel.options[sel.selectedIndex];
    return o ? (o.textContent || '').trim() : '';
  }

  function closePanel(w, focusBack){
    if (!w) return;
    var sel = w._sel, pop = w._pop, trg = w._trg;
    // MutationObserver 会对 pop 的 class 变化回调本函数；Chromium 在 class
    // token 已经不存在时仍可能派发一条属性记录。这里必须幂等，否则
    // 「remove('open') -> observer -> closePanel -> remove('open')」会自激成死循环，
    // 表现就是下拉一展开/一关闭整个页面卡死。
    if (pop && pop.classList.contains('open')) pop.classList.remove('open');
    if (w.classList.contains('open')) w.classList.remove('open');
    if (trg && trg.getAttribute('aria-expanded') === 'true') trg.setAttribute('aria-expanded', 'false');
    if (sel && sel.getAttribute('aria-expanded') === 'true') sel.setAttribute('aria-expanded', 'false');
    if (focusBack && trg) trg.focus();
  }

  function closeAll(except){
    Array.prototype.slice.call(document.querySelectorAll('.selx-pop.open')).forEach(function(pop){
      if (pop === except) return;
      closePanel(pop._selx, false);
    });
  }

  function rebuildOptions(w){
    var sel = w._sel, pop = w._pop;
    pop.innerHTML = '';
    Array.prototype.slice.call(sel.options).forEach(function(o, i){
      var d = document.createElement('div');
      d.className = 'mi selx-opt' + (o.selected ? ' selx-on' : '') + (o.disabled ? ' selx-dis' : '');
      d.setAttribute('role', 'option');
      d.setAttribute('aria-selected', o.selected ? 'true' : 'false');
      d.dataset.i = i;
      var txt = document.createElement('span');
      txt.className = 'selx-ot';
      txt.textContent = o.textContent;
      d.appendChild(txt);
      d.insertAdjacentHTML('beforeend', CHECK);
      pop.appendChild(d);
    });
  }

  function syncLabel(w){
    var sel = w._sel, trg = w._trg;
    if (!sel || !trg) return;
    trg.querySelector('.selx-txt').textContent = labelOf(sel);
  }

  function positionPanel(w){
    var pop = w._pop, trg = w._trg;
    var r = trg.getBoundingClientRect();
    var vw = innerWidth, vh = innerHeight;
    pop.style.left = '0px';
    pop.style.top = '0px';
    // 触发器是整行宽度时，min-width 不能跟着撑满：否则 min-width 会压过
    // max-width，下拉变成一整块盖住页面。上限固定 280，窄屏再收缩。
    var capW = Math.min(280, vw - 16);
    pop.style.minWidth = Math.min(Math.max(r.width, 140), capW) + 'px';
    pop.style.maxWidth = capW + 'px';
    var availBelow = vh - r.bottom - 8;
    var availAbove = r.top - 8;
    var ph = Math.min(pop.scrollHeight, 260);
    var openUp = ph > availBelow && availAbove > availBelow;
    pop.style.maxHeight = Math.min(260, Math.max(80, openUp ? availAbove : availBelow)) + 'px';
    ph = Math.min(pop.scrollHeight, 260);
    var top = openUp ? r.top - ph - 6 : r.bottom + 6;
    top = Math.max(8, Math.min(top, vh - ph - 8));
    var left = Math.max(8, Math.min(r.left, vw - pop.offsetWidth - 8));
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }

  function openPanel(w){
    closeAll(w._pop);
    rebuildOptions(w);
    w.classList.add('open');
    w._pop.classList.add('open');
    w._trg.setAttribute('aria-expanded', 'true');
    w._sel.setAttribute('aria-expanded', 'true');
    positionPanel(w);
    var on = w._pop.querySelector('.selx-on');
    if (on) on.scrollIntoView({block: 'nearest'});
  }

  function toggle(w){
    if (w._pop.classList.contains('open')) closePanel(w, true);
    else openPanel(w);
  }

  function commit(w, i, focusBack){
    var sel = w._sel;
    if (i < 0 || i >= sel.options.length) return;
    var old = sel.value;
    sel.selectedIndex = i;
    rebuildOptions(w);
    syncLabel(w);
    if (sel.value !== old) sel.dispatchEvent(new Event('change', {bubbles: true}));
    closePanel(w, false);
    if (focusBack) w._trg.focus();
  }

  function onTrgKey(ev, w){
    var pop = w._pop, open = pop.classList.contains('open');
    var k = ev.key;
    if (!open){
      if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Enter' || k === ' '){ ev.preventDefault(); openPanel(w); }
      return;
    }
    if (k === 'Escape'){ ev.preventDefault(); closePanel(w, true); return; }
    if (k === 'Enter'){
      ev.preventDefault();
      var on = pop.querySelector('.selx-on');
      if (on) commit(w, +on.dataset.i, true);
      return;
    }
    if (k === 'ArrowDown' || k === 'ArrowUp'){
      ev.preventDefault();
      var opts = Array.prototype.slice.call(pop.querySelectorAll('.selx-opt'));
      if (!opts.length) return;
      var idx = opts.findIndex(function(o){ return o.classList.contains('selx-on'); });
      idx = k === 'ArrowDown' ? (idx + 1) % opts.length : (idx - 1 + opts.length) % opts.length;
      opts.forEach(function(o){ o.classList.remove('selx-on'); o.setAttribute('aria-selected', 'false'); });
      opts[idx].classList.add('selx-on');
      opts[idx].setAttribute('aria-selected', 'true');
      opts[idx].scrollIntoView({block: 'nearest'});
    }
  }

  function enhance(sel){
    if (!sel || sel.nodeType !== 1 || sel.tagName !== 'SELECT' || sel.dataset.selx) return;
    var w = document.createElement('span');
    w.className = 'selx' + (sel.classList.contains('mp-in') ? ' mp-in' : '');
    var trg = document.createElement('button');
    trg.type = 'button';
    trg.className = 'selx-trg';
    trg.setAttribute('role', 'combobox');
    trg.setAttribute('aria-haspopup', 'listbox');
    trg.setAttribute('aria-expanded', 'false');
    var txt = document.createElement('span');
    txt.className = 'selx-txt';
    trg.appendChild(txt);
    trg.insertAdjacentHTML('beforeend', CHEV);
    var pop = document.createElement('div');
    pop.className = 'pop selx-pop';
    pop.setAttribute('role', 'listbox');
    pop.tabIndex = -1;

    sel.parentNode.insertBefore(w, sel);
    w.appendChild(sel);
    w.appendChild(trg);
    document.body.appendChild(pop);

    w._sel = sel; w._trg = trg; w._pop = pop; pop._selx = w;
    sel.dataset.selx = '1';
    sel.tabIndex = -1;

    // 程序化赋值（sel.value = x / sel.selectedIndex = i）时同步触发器文案
    var proto = HTMLSelectElement.prototype;
    var vDesc = Object.getOwnPropertyDescriptor(proto, 'value');
    var iDesc = Object.getOwnPropertyDescriptor(proto, 'selectedIndex');
    if (vDesc && vDesc.set){
      Object.defineProperty(sel, 'value', {
        configurable: true, enumerable: true,
        get: function(){ return vDesc.get.call(sel); },
        set: function(v){ vDesc.set.call(sel, v); syncLabel(w); }
      });
    }
    if (iDesc && iDesc.set){
      Object.defineProperty(sel, 'selectedIndex', {
        configurable: true, enumerable: true,
        get: function(){ return iDesc.get.call(sel); },
        set: function(i){ iDesc.set.call(sel, i); syncLabel(w); }
      });
    }

    syncLabel(w);
    rebuildOptions(w);

    trg.addEventListener('click', function(ev){ ev.stopPropagation(); toggle(w); });
    trg.addEventListener('keydown', function(ev){ onTrgKey(ev, w); });
    pop.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });
    pop.addEventListener('click', function(ev){
      var d = ev.target.closest('.selx-opt');
      if (!d || d.classList.contains('selx-dis')) return;
      ev.stopPropagation();
      commit(w, +d.dataset.i, true);
    });

    // 全局「关掉所有 .pop」的逻辑可能只移除 open 类：监听 class 变化，复位触发器状态
    new MutationObserver(function(muts){
      muts.forEach(function(m){
        if (m.type === 'attributes' && m.attributeName === 'class' && !pop.classList.contains('open')){
          closePanel(w, false);
        }
      });
    }).observe(pop, {attributes: true, attributeFilter: ['class']});
  }

  function enhanceAll(root){
    if (root.querySelectorAll) root.querySelectorAll('select').forEach(enhance);
    if (root.tagName === 'SELECT') enhance(root);
  }

  // 新增节点里的未增强 select；被移除的包装节点连带清理挂在 body 的浮层
  var obs = new MutationObserver(function(muts){
    muts.forEach(function(m){
      Array.prototype.slice.call(m.addedNodes).forEach(function(n){
        if (n.nodeType !== 1) return;
        if (n.tagName === 'SELECT') enhance(n);
        if (n.querySelectorAll) n.querySelectorAll('select').forEach(enhance);
      });
      Array.prototype.slice.call(m.removedNodes).forEach(function(n){
        if (n.nodeType !== 1) return;
        var wraps = n.querySelectorAll ? n.querySelectorAll('.selx') : [];
        Array.prototype.slice.call(wraps).forEach(function(ww){ if (ww._pop) ww._pop.remove(); });
        if (n.matches && n.matches('.selx') && n._pop) n._pop.remove();
      });
    });
  });
  obs.observe(document.body, {childList: true, subtree: true});

  document.addEventListener('click', function(ev){
    if (!(ev.target.closest && ev.target.closest('.selx'))) closeAll(null);
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){
      var open = document.querySelector('.selx-pop.open');
      if (open){ closePanel(open._selx, true); ev.stopPropagation(); }
    }
  });
  addEventListener('scroll', function(){ closeAll(null); }, true);
  addEventListener('resize', function(){ closeAll(null); });

  enhanceAll(document);
})();
spInitDrag();

async function boot() {
  // Server holds the authoritative config; merge it over the local cache.
  // 用 ?? 而不是 ||：服务端明确下发的 false / 0 / 空字符串也是有效值，
  // 用 || 会把“关闭侧栏”“字号 0”这类设置静默改回本地缓存。
  try {
    const c = (await api('/config')) || {};
    const local = JSON.parse(localStorage.getItem('cd-s') || '{}');
    Object.assign(S, {
      lang: c.lang ?? S.lang, name: c.name ?? S.name, theme: c.theme ?? S.theme,
      font: c.font ?? S.font, size: c.size ?? S.size, w: c.width ?? S.w,
      accent: c.accent ?? S.accent, speed: c.speed ?? S.speed, cd: c.cd ?? S.cd,
      blur: c.blur ?? S.blur, sf: c.sf ?? S.sf, anim: c.anim ?? S.anim,
      stream: c.stream ?? S.stream,
      think: c.think ?? S.think,
      side: c.side ?? S.side,
      prefs: c.prefs ?? S.prefs,
      systemPrompt: c.system_prompt ?? S.systemPrompt,
      systemPromptRaw: c.system_prompt_raw ?? S.systemPromptRaw,
      searchKey: c.search_key ?? S.searchKey,
      spref: c.search_pref ?? S.spref,
      followupMode: c.followup_mode ?? S.followupMode,
      model: c.model ?? local.model ?? S.model,
      perm: c.permission_mode ?? S.perm,
      lvl: c.thinking_level ?? S.lvl,
      uiSize: c.ui_size ?? S.uiSize,
      lineHeight: c.line_height ?? S.lineHeight,
      codeSize: c.code_size ?? S.codeSize,
      density: c.density ?? S.density,
      compactionEnabled: c.compaction_enabled ?? S.compactionEnabled,
      compactionPct: c.compaction_pct ?? S.compactionPct,
      maxSteps: c.max_steps ?? S.maxSteps,
      askAutoResolve: c.ask_auto_resolve ?? S.askAutoResolve,
      keepAwake: c.keep_awake ?? S.keepAwake,
      ctxWarnPct: c.ctx_warn_pct ?? S.ctxWarnPct,
      notify: c.notify ?? S.notify,
      notifySound: c.notify_sound ?? S.notifySound,
      autoArchiveDays: c.auto_archive_days ?? S.autoArchiveDays,
      codeLineNumbers: c.code_line_numbers ?? S.codeLineNumbers,
      codeWrap: c.code_wrap ?? S.codeWrap,
      httpProxy: c.http_proxy ?? S.httpProxy,
      httpNoProxy: c.http_no_proxy ?? S.httpNoProxy,
      modelIoLog: c.model_io_log ?? S.modelIoLog,
      enterMode: c.enter_mode ?? S.enterMode,
      sessionRetentionDays: c.session_retention_days ?? S.sessionRetentionDays,
      hooks: c.hooks ?? S.hooks,
      profiles: c.profiles ?? S.profiles,
      activeProfile: c.active_profile ?? S.activeProfile
    });
  } catch (e) { /* offline: use local cache */ }

  // 合并完才知道服务端的 side 偏好，挪到这里判断，否则“默认收起”会在
  // S.side=true 时仍然生效。
  if (innerWidth < 760 || !S.side) document.body.classList.add('sc');

  // 历史配置里的 anysearch 已不可用（那个接口返回的是裁判文书，不是网络搜索），迁到 multi
  if (S.spref === 'anysearch') { S.spref = 'multi'; apply(); }
  if (S.followupMode !== 'queue' && S.followupMode !== 'steer') S.followupMode = 'queue';

  apply(false);
  sync();
  resetStatus();
  dkInit();
  connectEvents();
  greetAnim();
  // 侧栏相对时间每分钟自动刷新（单页应用常驻即可）
  setInterval(refreshTimes, 60000);

  await Promise.all([
    loadSessions(true),
    loadModels(),
    loadServerStatus()
  ]);

  // 侧边栏：有标签就恢复渲染，没有就保持收起（空面板不该占 420px）
  if (SP.tabs.length) spRender();
  else spHide();
}

boot();

</script>
