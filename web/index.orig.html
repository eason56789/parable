<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#faf9f5;--side:#f5f4ed;--fg:#141413;--fg2:#73726c;--line:rgba(31,30,29,.14);--input:#fff;--bubble:#f0eee6;--hov:rgba(31,30,29,.06);--accent:#d97757;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--serif:"Source Serif 4",ui-serif,Georgia,"Songti SC","Noto Serif CJK SC",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;--chat:var(--serif);--fs:16px;--w:760px;--blur:8px;--sf:1.5;--cd:calc(.65s * var(--animd));--animd:1;--anim:1;--code-bg:#1e1e1e;--code-fg:#d4d4d4;--code-ln:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--side:#1f1e1d;--fg:#faf9f5;--fg2:#9c9a92;--line:rgba(222,220,209,.15);--input:#30302e;--bubble:#141413;--hov:rgba(222,220,209,.08)}}
:root[data-theme="dark"]{--bg:#262624;--side:#1f1e1d;--fg:#faf9f5;--fg2:#9c9a92;--line:rgba(222,220,209,.15);--input:#30302e;--bubble:#141413;--hov:rgba(222,220,209,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);background:var(--side);color:var(--fg);overflow:hidden;transition:background-color calc(.6s * var(--animd)),color calc(.6s * var(--animd));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg{display:block}
#win{height:100%;display:flex;flex-direction:column}
#tb{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 14px;position:relative;user-select:none}
.lights{display:flex;gap:8px;margin-right:12px}.lights i{width:12px;height:12px;border-radius:50%}
.ib{width:30px;height:30px;border:0;background:none;color:var(--fg2);border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd)),transform calc(.25s * var(--animd))}
.ib:hover{background:var(--hov);color:var(--fg)}.ib:active{transform:scale(.92)}.ib svg{width:18px;height:18px}
.ib.off{opacity:.4;pointer-events:none}
.tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--hov);border-radius:10px;padding:3px;gap:2px}
.tabs b{font-weight:500;padding:4px 16px;border-radius:8px;color:var(--fg2);cursor:pointer;transition:background-color calc(.35s * var(--animd)),color calc(.35s * var(--animd)),box-shadow calc(.35s * var(--animd))}
.tabs b.on{color:var(--fg);background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#body{flex:1;display:flex;min-height:0}
#side{width:280px;flex:none;overflow:hidden;transition:width calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),transform calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1)}
#sin{width:280px;height:100%;display:flex;flex-direction:column;padding:4px 10px 10px;transition:opacity calc(.4s * var(--animd));position:relative}
body.sc #side{width:0}body.sc #sin{opacity:0}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd))}
.nav:hover{background:var(--hov)}.nav svg{width:18px;height:18px;color:var(--fg2)}
.nav .np{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 -2px 0 -1px}.nav .np svg{color:#fff;width:14px;height:14px}
.sh{padding:18px 10px 6px;color:var(--fg2);font-size:12px}
#rcs{flex:1;overflow-y:auto;overflow-x:hidden}
.rcg{display:flex;flex-direction:column}
#rcp[hidden]{display:none}
.rch{padding:10px 10px 4px;color:var(--fg2);font-size:12px}
.rc{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;overflow:hidden;cursor:pointer;transition:background-color calc(.2s * var(--animd)),height calc(.3s * var(--animd)) cubic-bezier(.4,0,.2,1),padding calc(.3s * var(--animd)) cubic-bezier(.4,0,.2,1),opacity calc(.3s * var(--animd)),transform calc(.38s * var(--animd)) cubic-bezier(.4,0,.2,1);animation:slin calc(.55s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.rc:hover,.rc.on,.rc.menu{background:var(--hov)}
.rc.pin{box-shadow:inset 2px 0 0 var(--accent)}
.rc .rci{display:none;width:14px;height:14px;flex:none;color:var(--fg2)}
.rc.pin .rci{display:block}
.rc .rci svg{width:14px;height:14px}
.rc .rct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc.unread .rct{font-weight:600}
.rc .rcmeta{display:flex;align-items:center;gap:5px;flex:none;margin-left:auto}
.rc .rcdt{display:none;width:6px;height:6px;border-radius:50%;background:#e5534b}
.rc.unread .rcdt{display:block}
.rc .rcd{color:var(--fg2);font-size:11px;white-space:nowrap}
.rc.out{transform:translateX(120%);opacity:0}
.rc-in{width:100%;padding:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:0}
#cm{position:fixed;z-index:100;min-width:232px;max-width:290px;padding:5px;background:var(--input);color:var(--fg);border:.5px solid var(--line);border-radius:12px;box-shadow:0 18px 52px rgba(0,0,0,.3);opacity:0;transform:scale(.96);transform-origin:top left;pointer-events:none;transition:opacity calc(.16s * var(--animd)),transform calc(.2s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
#cm.open{opacity:1;transform:none;pointer-events:auto}
.cmi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font:13px var(--sans);line-height:1.25;cursor:pointer;white-space:nowrap;position:relative}
.cmi:hover{background:var(--hov)}
.cmi.dis{opacity:.38;pointer-events:none}
.cmi .arr{margin-left:auto;width:14px;height:14px;color:var(--fg2)}
.cmi.danger{color:#e5534b}
.cmi.danger:hover{background:color-mix(in srgb,#e5534b 16%,transparent)}
.csep{height:.5px;margin:5px 7px;background:var(--line)}
.cms{position:absolute;left:calc(100% + 4px);top:0;min-width:150px;padding:5px;background:var(--input);border:.5px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.24);display:none}
.cmi.sub:hover>.cms,.cmi.sub.subopen>.cms{display:block}
@keyframes slin{from{opacity:0;transform:translateX(-12px)}}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background-color calc(.2s * var(--animd))}.me:hover{background:var(--hov)}
.av{width:32px;height:32px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:600;flex:none}
.av svg{width:18px;height:18px}
.me small{display:block;color:var(--fg2);font-size:12px}
.pop{position:absolute;background:var(--input);border:.5px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 32px rgba(0,0,0,.14);opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom;pointer-events:none;transition:opacity calc(.25s * var(--animd)),transform calc(.4s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:40}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop.open>*{animation:miIn calc(.45s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.pop.open>*:nth-child(2){animation-delay:calc(.03s * var(--animd))}.pop.open>*:nth-child(3){animation-delay:calc(.06s * var(--animd))}
.pop.open>*:nth-child(4){animation-delay:calc(.09s * var(--animd))}.pop.open>*:nth-child(5){animation-delay:calc(.12s * var(--animd))}
.pop.open>*:nth-child(6){animation-delay:calc(.15s * var(--animd))}.pop.open>*:nth-child(7){animation-delay:calc(.18s * var(--animd))}
@keyframes miIn{from{opacity:0;transform:translateY(-5px);filter:blur(3px)}}
.mi{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd)),transform calc(.25s * var(--animd)) cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.mi:hover{background:var(--hov)}.mi:active{transform:scale(.98)}
.mi small{display:block;color:var(--fg2);font-size:12px}.mi svg{width:16px;height:16px;color:var(--accent);flex:none}
#um{left:10px;right:10px;bottom:62px}
#main{flex:1;position:relative;background:var(--bg);border-radius:12px 0 0 0;box-shadow:0 0 0 .5px var(--line);overflow:hidden;transition:background-color calc(.6s * var(--animd))}
#mh{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:4px;z-index:2;opacity:0;transition:opacity calc(.5s * var(--animd));pointer-events:none}
#ttl{max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
body.chat #mh{opacity:1}
#chat{position:absolute;inset:0;overflow-y:auto;padding:56px 20px calc(var(--ch,150px) + 8px);opacity:0;pointer-events:none;transition:opacity calc(.6s * var(--animd))}
body.chat #chat{opacity:1;pointer-events:auto}
.col{max-width:var(--w);margin:0 auto}
.msg{animation:rise calc(.7s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(5px)}}
.u{display:flex;justify-content:flex-end;align-items:flex-start;gap:6px;margin:20px 0 8px}
.ub{background:var(--bubble);border-radius:14px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.55;transition:background-color calc(.6s * var(--animd))}
.uacts{display:flex;gap:1px;padding-top:3px;opacity:0;transform:translateY(2px);transition:opacity calc(.25s * var(--animd)),transform calc(.3s * var(--animd));flex:none}
.u:hover .uacts{opacity:1;transform:none}
.uacts .ib{width:26px;height:26px}.uacts .ib svg{width:15px;height:15px}
.uatt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.uatt .att{background:var(--input);border:.5px solid var(--line)}
.a{margin:14px 0 26px;font-family:var(--chat);font-size:var(--fs);line-height:1.7}
.ab p{margin:0 0 .9em}.ab ul{margin:0 0 .9em;padding-left:1.4em}.ab li{margin:.25em 0}
.ab strong{font-weight:600}
.ab code{font-family:var(--mono);font-size:.85em;background:var(--hov);border-radius:5px;padding:.1em .38em}
.cb{border:.5px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 .9em;background:var(--side);transition:background-color calc(.6s * var(--animd))}
.ch2{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font:12px var(--sans);color:var(--fg2)}
.cbh{display:flex;gap:2px}
.cp{background:none;border:0;cursor:pointer;color:inherit;padding:3px 8px;border-radius:6px;font:12px var(--sans);transition:background-color calc(.2s * var(--animd))}.cp:hover{background:var(--hov)}
.cb pre{counter-reset:cl;margin:0;padding:4px 0 12px;overflow-x:auto;font:13.5px/1.6 var(--mono);color:var(--code-fg);background:var(--code-bg)}
.cb pre .cl{display:flex;counter-increment:cl;padding-right:14px}
.cb pre .cl::before{content:counter(cl);flex:none;width:2.6em;padding-right:1em;text-align:right;color:var(--code-ln);user-select:none}
.cb pre .cl>span{white-space:pre}
.cb pre.wrapit .cl>span{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.c{display:inline-block;white-space:pre;transform-origin:50% 60%;animation:pop var(--cd) cubic-bezier(.16,.84,.3,1) both}
.w{white-space:nowrap}
@keyframes pop{from{opacity:0;filter:blur(var(--blur));transform:scale(var(--sf))}to{opacity:1;filter:blur(0);transform:scale(1)}}
.th{margin:0 0 10px;font:14px var(--sans);color:var(--fg2)}
.thh{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:4px 0;color:inherit}
.thh svg{width:14px;height:14px;transition:transform calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1)}.th.open .thh svg{transform:rotate(180deg)}
.shim{background:linear-gradient(90deg,var(--fg2) 35%,var(--fg) 50%,var(--fg2) 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim calc(1.8s * var(--animd)) linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.thb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.45s * var(--animd))}
.th.open .thb{grid-template-rows:1fr;opacity:1}
.thb>div{overflow:hidden;border-left:2px solid var(--line);padding-left:12px;margin-left:4px;line-height:1.6}
.wf{margin:0 0 12px}
.wfh{display:flex;align-items:center;gap:5px;padding:3px 0;border:0;background:none;color:var(--fg2);font:13px var(--sans);cursor:pointer;transition:color calc(.2s * var(--animd))}
.wfh:hover{color:var(--fg)}
.wfh svg{width:14px;height:14px;transition:transform calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.wf.open .wfh svg{transform:rotate(180deg)}
.wfb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.45s * var(--animd))}
.wf.open .wfb{grid-template-rows:1fr;opacity:1}
.wfb>div{overflow:hidden}
.wfb .th{margin:8px 0 6px}
.wfb .ec{margin:6px 0}
.arow{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:30px}
.sp{width:22px;height:22px;color:var(--accent);flex:none}
.sp.spin{animation:spin calc(2.6s * var(--animd)) linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.acts{display:flex;gap:2px;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity calc(.5s * var(--animd)),transform calc(.5s * var(--animd))}
.acts.show{opacity:1;transform:none;pointer-events:auto}.acts .ib{width:28px;height:28px}.acts .ib svg{width:16px;height:16px}
.dn svg{transform:rotate(180deg)}
#comp{position:absolute;left:0;right:0;bottom:50%;transform:translateY(50%);padding:0 20px 14px;isolation:isolate;transition:bottom calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1),transform calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1)}
body.chat #comp{bottom:0;transform:none}
#comp::before{content:"";position:absolute;left:0;right:0;top:-26px;bottom:0;background:linear-gradient(transparent,var(--bg) 26px);opacity:0;transition:opacity calc(.6s * var(--animd));z-index:-1}
body.chat #comp::before{opacity:1}
.gr{display:flex;align-items:center;justify-content:center;gap:14px;font:400 40px/1.25 var(--serif);max-height:130px;margin-bottom:28px;overflow:hidden;transition:max-height calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.5s * var(--animd)),margin calc(.8s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.gr .sp{width:36px;height:36px}
body.chat .gr{max-height:0;opacity:0;margin-bottom:0}
.box{position:relative;max-width:var(--w);margin:0 auto;background:var(--input);border:.5px solid var(--line);border-radius:20px;padding:14px 12px 10px 14px;box-shadow:0 4px 24px rgba(0,0,0,.05);transition:box-shadow calc(.4s * var(--animd)),border-color calc(.4s * var(--animd)),background-color calc(.6s * var(--animd))}
.box:focus-within{box-shadow:0 6px 32px rgba(0,0,0,.09);border-color:var(--fg2);border-color:color-mix(in srgb,var(--fg2) 45%,transparent)}
textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;color:inherit;font:16px/1.5 var(--sans);height:24px;max-height:200px;padding:0 4px}
textarea::placeholder{color:var(--fg2)}
.tools{display:flex;align-items:center;gap:2px;margin-top:8px}.tools .fl{flex:1}
.ms{display:flex;gap:4px;align-items:center;border:0;background:none;color:var(--fg2);padding:6px 8px;border-radius:8px;cursor:pointer;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.ms:hover{background:var(--hov);color:var(--fg)}.ms svg{width:14px;height:14px}
#mm{right:0;bottom:calc(100% + 6px);min-width:280px;transform-origin:bottom right}
.send{width:32px;height:32px;border-radius:8px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;margin-left:4px;transition:opacity calc(.3s * var(--animd)),transform calc(.3s * var(--animd)),filter calc(.2s * var(--animd))}
.send svg{width:18px;height:18px}.send:disabled{opacity:.35;cursor:default}
.send:not(:disabled):hover{filter:brightness(1.08)}.send:not(:disabled):active{transform:scale(.9)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-height:90px;margin-top:18px;overflow:hidden;transition:max-height calc(.7s * var(--animd)),opacity calc(.45s * var(--animd)),margin calc(.7s * var(--animd))}
.chips button{background:none;border:.5px solid var(--line);color:var(--fg2);border-radius:10px;padding:7px 14px;cursor:pointer;transition:background-color calc(.25s * var(--animd)),color calc(.25s * var(--animd)),transform calc(.3s * var(--animd))}
.chips button:hover{background:var(--hov);color:var(--fg);transform:translateY(-1px)}
body.chat .chips{max-height:0;opacity:0;margin-top:0}

/* —— 底部状态栏 —— */
#sbar{display:flex;justify-content:center;gap:8px;margin-top:0;opacity:0;transform:translateY(8px);pointer-events:none;transition:margin calc(.5s * var(--animd)),opacity calc(.4s * var(--animd)),transform calc(.4s * var(--animd))}
body.chat #sbar{margin-top:10px;opacity:1;transform:none;pointer-events:auto}
.sbtn{position:relative;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;background:var(--hov);border:.5px solid transparent;color:var(--fg2);font:12px var(--sans);cursor:pointer;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd)),border-color calc(.2s * var(--animd))}
.sbtn:hover,.sbtn.active{background:var(--input);border-color:var(--line);color:var(--fg)}
.sbtn svg{width:14px;height:14px;flex:none}
.spanel{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(6px);min-width:260px;background:var(--input);border:.5px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:12px 14px;opacity:0;pointer-events:none;transition:opacity calc(.2s * var(--animd)),transform calc(.3s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:100;text-align:left}
#sbtn-ctx .spanel{left:auto;right:0;transform:translateY(6px)}
.sbtn.active .spanel,.sbtn:hover .spanel{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#sbtn-ctx.active .spanel,#sbtn-ctx:hover .spanel{transform:translateY(0)}
.sph{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--fg);margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid var(--line);font-size:13px;white-space:nowrap}
.sph svg{width:16px;height:16px;color:var(--fg2);flex:none}
.sph span:last-child{margin-left:auto;color:var(--fg2);font-weight:400;font-size:12px}
.sph .sph-r{margin-left:auto;display:flex;gap:8px;color:var(--fg2);font-size:12px;font-weight:400}
.spr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;color:var(--fg2);font-size:12.5px;white-space:nowrap}
.spr span:last-child{color:var(--fg);font-family:var(--mono);font-size:12px;margin-left:16px}
.spbar{height:6px;border-radius:3px;background:var(--line);margin:8px 0 12px;display:flex;overflow:hidden}
.spbar i{display:block;height:100%;transition:width .4s cubic-bezier(.32,.72,0,1)}
.spbar .b1{background:#c5c5c5}.spbar .b2{background:#a78bfa}.spbar .b3{background:#60a5fa}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.disc{text-align:center;color:var(--fg2);font-size:12px;max-height:0;opacity:0;overflow:hidden;transition:max-height calc(.7s * var(--animd)),opacity calc(.7s * var(--animd)),margin calc(.7s * var(--animd))}
body.chat .disc{max-height:30px;opacity:1;margin-top:8px}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,0);pointer-events:none;transition:background-color calc(.5s * var(--animd)),backdrop-filter calc(.5s * var(--animd))}
#modal.open{background:rgba(0,0,0,.42);backdrop-filter:blur(4px);pointer-events:auto}
#card{width:min(820px,94vw);height:min(600px,86vh);background:var(--bg);border-radius:18px;display:flex;overflow:hidden;opacity:0;transform:translateY(16px) scale(.96);box-shadow:0 24px 80px rgba(0,0,0,.3);transition:opacity calc(.45s * var(--animd)),transform calc(.6s * var(--animd)) cubic-bezier(.16,.84,.3,1),background-color calc(.6s * var(--animd)),width calc(.55s * var(--animd)) cubic-bezier(.32,.72,0,1)}
#card.wide{width:min(1080px,94vw)}
#modal.open #card{opacity:1;transform:none}
#snav{width:200px;flex:none;background:var(--side);padding:20px 12px;display:flex;flex-direction:column;gap:2px;transition:background-color calc(.6s * var(--animd))}
#snav h3{margin:0 10px 14px;font:600 18px var(--serif)}
#snav button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--fg2);cursor:pointer;transition:background-color calc(.25s * var(--animd)),color calc(.25s * var(--animd))}
#snav button.on{background:var(--hov);color:var(--fg)}
#sp{flex:1;overflow-y:auto;padding:22px 30px}
.pn{animation:rise calc(.5s * var(--animd)) cubic-bezier(.16,.84,.3,1) both}
.sr{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:.5px solid var(--line);animation:rise calc(.55s * var(--animd)) cubic-bezier(.16,.84,.3,1) both;animation-delay:calc(var(--i)*calc(40ms * var(--animd)))}
.sr.stk{flex-direction:column;align-items:stretch;gap:10px}
.sr small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.sr .ct{flex:none;width:210px}.sr.stk .ct{width:auto}
.seg{display:flex;background:var(--hov);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--fg2);border-radius:7px;padding:5px 6px;cursor:pointer;transition:background-color calc(.3s * var(--animd)),color calc(.3s * var(--animd)),box-shadow calc(.3s * var(--animd))}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sws{display:flex;gap:10px;justify-content:flex-end}.sws button{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;transition:transform calc(.35s * var(--animd)) cubic-bezier(.34,1.56,.64,1),box-shadow calc(.3s * var(--animd))}
.sws button:hover{transform:scale(1.15)}.sws button.on{transform:scale(1.18);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg2)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tx{width:100%;background:var(--input);border:.5px solid var(--line);border-radius:9px;color:inherit;font:inherit;padding:8px 10px;outline:0;resize:vertical;transition:border-color calc(.3s * var(--animd))}.tx:focus{border-color:var(--accent)}
.tg{width:40px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;cursor:pointer;transition:background-color calc(.35s * var(--animd))}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform calc(.45s * var(--animd)) cubic-bezier(.34,1.56,.64,1)}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(16px)}
.tcs{display:flex;gap:12px}.tc{flex:1;background:none;border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:border-color calc(.3s * var(--animd)),transform calc(.3s * var(--animd))}
.tc:hover{transform:translateY(-2px)}.tc.on{border-color:var(--accent)}.tc i{display:block;height:52px;border-radius:7px;margin-bottom:6px;border:.5px solid var(--line)}
.btn{background:none;border:.5px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;transition:background-color calc(.25s * var(--animd))}.btn:hover{background:var(--hov)}
#pv{min-height:3.4em;background:var(--side);border-radius:10px;padding:10px 14px;font:16px/1.6 var(--serif)}
#feed,#ttl,#sp{transition:opacity calc(.3s * var(--animd)) ease,transform calc(.4s * var(--animd)) cubic-bezier(.4,0,.2,1),filter calc(.3s * var(--animd))}
.fo{opacity:0!important;transform:translateY(8px);filter:blur(5px)}
#pg{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity calc(.4s * var(--animd)) ease,background-color calc(.6s * var(--animd))}
#pg.on{opacity:1;pointer-events:auto}
#pg>div{max-width:420px;padding:0 24px;transition:opacity calc(.3s * var(--animd)) ease,transform calc(.5s * var(--animd)) cubic-bezier(.16,.84,.3,1),filter calc(.3s * var(--animd))}
#pg.sw>div{opacity:0;transform:translateY(10px);filter:blur(6px)}
#pg .sp{width:44px;height:44px;margin:0 auto 18px}
#pg h2{font:400 32px/1.25 var(--serif);margin:0 0 10px}
#pg p{color:var(--fg2);margin:0;line-height:1.6}
#scr{display:none}
#tp{left:0;bottom:calc(100% + 6px);min-width:248px;transform-origin:bottom left}
.gl{padding:8px 10px 4px;font-size:12px;color:var(--fg2)}
.rd{display:flex;align-items:center;gap:6px;font:13px var(--sans);color:var(--fg2);margin:0 0 8px}.rd svg{width:14px;height:14px;color:#5a8f5a;flex:none}.rd b{font-weight:500;color:var(--fg)}

/* —— 文档轻量行 —— */
.ec{display:flex;flex-direction:column;margin:2px 0;font:14px/1.5 var(--sans);width:100%}
.eh{display:flex;align-items:center;gap:6px;padding:6px;margin-left:-6px;border-radius:8px;cursor:pointer;user-select:none;transition:background-color calc(.2s * var(--animd));background:transparent}
.eh:hover{background:var(--hov)}
.st-ic{display:grid;place-items:center;color:var(--fg2);flex:none}
.st-ic svg{width:16px;height:16px}
.st-tx{color:var(--fg2);font-size:14px;white-space:nowrap}
.fi{display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--fg);overflow:hidden;white-space:nowrap;margin-left:2px}
.fi b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.fi svg{width:15px;height:15px;flex:none;color:var(--fg2)}
.fi [data-is=react] svg{color:#61dafb}
.diff{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;line-height:1.2;margin-left:4px;white-space:nowrap;flex:none}
.diff .add{color:#34d399}
.diff .del{color:#f87171}
.ech{margin-left:auto;color:var(--fg2);display:grid;place-items:center;transition:color calc(.25s * var(--animd));padding-right:2px}
.eh:hover .ech{color:var(--fg)}
.ech svg{width:16px;height:16px;transition:transform calc(.4s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.ec.collapsed .ech svg{transform:rotate(-90deg)}
.ec .dc{display:grid;grid-template-rows:1fr;opacity:1;overflow:hidden;transition:grid-template-rows calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.3s * var(--animd)),margin calc(.4s * var(--animd));margin-top:6px;background:var(--code-bg);border-radius:10px;box-shadow:inset 0 0 0 .5px var(--line)}
.ec.collapsed .dc{grid-template-rows:0fr;opacity:0;margin-top:0;box-shadow:none}
.dc>.df{min-height:0}
.df{font:12.5px/1.6 var(--mono);padding:10px 0;overflow-x:auto;color:var(--code-fg);transition:padding calc(.45s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.ec.collapsed .df{padding-top:0;padding-bottom:0}
.df div{display:flex;padding:0 14px 0 0;position:relative;white-space:pre}
.df .ln{width:2.6em;flex:none;text-align:right;padding-right:1em;color:var(--code-ln);user-select:none;border-right:1px solid rgba(255,255,255,.1);margin-right:1em}
.df .ad{background:rgba(52,211,153,.15)}
.df .ad .ln{color:#34d399;border-right-color:#34d399}
.df .rm{background:rgba(248,113,113,.15)}
.df .rm .ln{color:#f87171;border-right-color:#f87171}
.pm{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows calc(.5s * var(--animd)) cubic-bezier(.32,.72,0,1),opacity calc(.4s * var(--animd))}
.pm>div{overflow:hidden;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px;transition:padding calc(.5s * var(--animd)) cubic-bezier(.32,.72,0,1)}
.ec[data-st=wait] .pm{grid-template-rows:1fr;opacity:1}.ec[data-st=wait] .pm>div{padding:10px 12px;margin-top:6px;border-radius:8px;box-shadow:inset 0 .5px 0 var(--line);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.pm span{color:var(--fg2);margin-right:auto;font-size:13px}
.pm button{border:.5px solid var(--line);background:var(--input);border-radius:8px;padding:5px 12px;cursor:pointer;transition:background-color calc(.25s * var(--animd)),transform calc(.3s * var(--animd)) cubic-bezier(.34,1.56,.64,1),box-shadow calc(.25s * var(--animd))}
.pm button:hover{background:var(--hov);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pm button:active{transform:scale(.95)}
.pm button[data-d=always]{background:var(--accent);border-color:transparent;color:#fff}

.rl{display:grid;gap:8px}.ro{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color calc(.3s * var(--animd)),background-color calc(.3s * var(--animd)),transform calc(.3s * var(--animd))}
.ro:hover{transform:translateX(2px)}
.ro::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--fg2);transition:border calc(.3s * var(--animd)),border-width calc(.3s * var(--animd))}
.ro.on{border-color:var(--accent);background:var(--hov)}.ro.on::before{border:4.5px solid var(--accent)}.ro small{display:block;color:var(--fg2);font-size:12.5px}
.mseg{display:flex;gap:2px;background:var(--hov);border-radius:8px;padding:3px;margin:2px 6px 6px}
.mseg button{flex:1;border:0;background:none;color:var(--fg2);font:13px var(--sans);padding:5px 0;border-radius:6px;cursor:pointer;transition:background-color calc(.3s * var(--animd)),color calc(.3s * var(--animd)),box-shadow calc(.3s * var(--animd)),transform calc(.3s * var(--animd)) cubic-bezier(.34,1.56,.64,1)}
.mseg button:hover{color:var(--fg)}
.mseg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mseg button:active{transform:scale(.93)}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity calc(.35s * var(--animd)),transform calc(.5s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:110}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* —— 模型设置 —— */
.mp{display:flex;flex-direction:column;gap:16px;min-height:100%}
.mp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.mp-h h2{margin:0;font:600 24px/1.2 var(--serif)}
.mp-h p{margin:5px 0 0;color:var(--fg2);font-size:13px;line-height:1.5}
.mp-ha{display:flex;align-items:center;gap:8px;flex:none}
.mp-add{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--fg);color:var(--bg);border-radius:9px;padding:8px 12px;font:500 13px var(--sans);cursor:pointer;transition:transform calc(.3s * var(--animd)) cubic-bezier(.34,1.56,.64,1),filter calc(.2s * var(--animd))}
.mp-add:hover{filter:brightness(1.1)}.mp-add:active{transform:scale(.95)}
.mp-add svg{width:14px;height:14px}
.mp-shell{display:flex;flex:1;min-height:380px;border:.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.mp-list{width:212px;flex:none;padding:10px 8px;border-right:.5px solid var(--line);background:color-mix(in srgb,var(--side) 55%,var(--bg));overflow-y:auto}
.mp-gl{padding:10px 8px 4px;color:var(--fg2);font-size:11.5px}
.mp-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;color:var(--fg);font:13px var(--sans);text-align:left;cursor:pointer;transition:background-color calc(.2s * var(--animd))}
.mp-item:hover,.mp-item.on{background:var(--hov)}
.mp-item b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-ic{width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:5px;color:#fff;font:600 10px/1 var(--sans)}
.mp-dot{width:6px;height:6px;flex:none;margin-left:auto;border-radius:50%;background:var(--fg2)}
.mp-dot.on{background:#34c759}.mp-dot.off{background:#f5a623}
.mp-detail{flex:1;min-width:0;padding:18px 20px 20px;overflow-y:auto}
.mp-ph{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mp-ph .mp-ic{width:24px;height:24px;border-radius:6px;font-size:11px}
.mp-ph h3{flex:1;min-width:0;margin:0;font:600 17px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-ph .ib{width:26px;height:26px}
.mp-field{margin-bottom:14px}
.mp-field label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;color:var(--fg2);font-size:12.5px}
.mp-field label a{color:var(--accent);text-decoration:none;font-size:12px}
.mp-field label a:hover{text-decoration:underline}
.mp-in{display:block;width:100%;padding:9px 11px;border:.5px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);font:13px var(--sans);outline:0;transition:border-color calc(.2s * var(--animd)),box-shadow calc(.2s * var(--animd))}
.mp-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
select.mp-in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.mp-key{position:relative}
.mp-key .mp-in{padding-right:40px;font-family:var(--mono);letter-spacing:.04em}
.mp-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:7px;background:none;color:var(--fg2);cursor:pointer;transition:background-color calc(.2s * var(--animd)),color calc(.2s * var(--animd))}
.mp-eye:hover{background:var(--hov);color:var(--fg)}
.mp-eye svg{width:16px;height:16px}
.mp-models{margin-top:18px}
.mp-mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--fg2);font-size:12.5px}
.mp-mh button{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:.5px solid var(--line);border-radius:7px;background:none;color:var(--fg);font:12px var(--sans);cursor:pointer;transition:background-color calc(.2s * var(--animd))}
.mp-mh button:hover{background:var(--hov)}
.mp-mh button svg{width:12px;height:12px}
.mp-rows{display:flex;flex-direction:column;gap:6px}
.mp-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border:.5px solid var(--line);border-radius:9px;background:var(--input);transition:background-color calc(.2s * var(--animd))}
.mp-row:hover{background:var(--hov)}
.mp-mn{font:12.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .fl{flex:1}
.mp-badge{flex:none;padding:1px 5px;border:.5px solid var(--line);border-radius:4px;color:var(--fg2);font:10.5px var(--sans)}
.mp-row .ib{width:26px;height:26px}
.mp-row .ib svg{width:14px;height:14px}
.mp-row .tg{width:34px;height:20px;border-radius:10px}
.mp-row .tg::after{top:3px;left:3px;width:14px;height:14px}
.mp-row .tg.on::after{transform:translateX(14px)}
.mp-empty{padding:10px 2px;color:var(--fg2);font-size:12.5px}
@media(max-width:1000px){.mp-shell{flex-direction:column;min-height:0}.mp-list{width:auto;flex:none;display:flex;gap:4px;padding:8px;border-right:0;border-bottom:.5px solid var(--line);overflow-x:auto;overflow-y:hidden}.mp-gl{padding:0 4px;align-self:center;white-space:nowrap}.mp-item{width:auto;flex:none;padding:6px 9px}.mp-detail{padding:16px}.mp-mn{max-width:160px}}
@media(max-width:760px){.mp-h{flex-direction:column;gap:10px}.mp-ha{align-self:flex-end}.mp-detail{padding:14px}}

@media(max-width:760px){.tabs,.lights{display:none}#body{position:relative}#side{position:absolute;z-index:30;top:0;bottom:0;left:0;width:280px!important;background:var(--side);box-shadow:0 0 40px rgba(0,0,0,.2)}#scr{display:block;position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.35);transition:opacity calc(.5s * var(--animd))}body.sc #scr{opacity:0;pointer-events:none}body.sc #side{transform:translateX(-102%)}body.sc #sin{opacity:1}.gr{font-size:30px}#card{flex-direction:column}#snav{width:auto;flex-direction:row;padding:12px;overflow-x:auto}#snav h3{display:none}.sr .ct{width:150px}}
@media(prefers-reduced-motion:reduce){.msg,.pn,.sr,.rc,.c,.sp.spin,.shim,.pop.open>*,.es.fx{animation:none}}

/* ============ 命令面板 ============ */
#cmdk{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;padding:11vh 20px 20px;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#cmdk.open{display:flex}
.cmdb{width:min(600px,100%);background:var(--input);border:.5px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform calc(.3s * var(--animd)) cubic-bezier(.16,.84,.3,1)}
#cmdk.open .cmdb{transform:none}
.cmdin{width:100%;border:0;background:none;outline:0;color:var(--fg);font:16px var(--sans);padding:16px 18px;border-bottom:.5px solid var(--line)}
.cmdl{max-height:min(420px,52vh);overflow-y:auto;padding:6px}
.cmdg{padding:8px 10px 4px;font-size:11.5px;color:var(--fg2);letter-spacing:.02em}
.cmdi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmdi:hover{background:var(--hov)}
.cmdi.on{background:var(--hov)}
.cmdi .ic2{width:20px;height:20px;display:grid;place-items:center;color:var(--fg2);flex:none}
.cmdi .ic2 svg{width:16px;height:16px}
.cmdi .tx2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdi .kb{flex:none;font:11px var(--mono);color:var(--fg2);border:.5px solid var(--line);border-radius:5px;padding:1px 6px}
.cmdempty{padding:28px;text-align:center;color:var(--fg2);font-size:13px}
.cmdf{padding:8px 14px;border-top:.5px solid var(--line);display:flex;gap:14px;color:var(--fg2);font-size:11.5px}
.cmdf b{font:11px var(--mono);border:.5px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}

/* ============ 斜杠菜单 ============ */
#sl{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--input);border:.5px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.22);padding:6px;display:none;max-height:284px;overflow-y:auto;z-index:20}
#sl.open{display:block}
#sl .cmdi{font-size:13px;padding:8px 10px}
#sl .kb{font:11px var(--mono);color:var(--fg2)}

/* ============ 附件 ============ */
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#atts:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--hov);border-radius:8px;padding:4px 8px;font:12.5px var(--sans);max-width:230px}
.att svg{width:14px;height:14px;color:var(--fg2);flex:none}
.att b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{cursor:pointer;color:var(--fg2);display:grid;place-items:center;border-radius:4px;padding:0 1px;font-size:13px;line-height:1}
.att .x:hover{color:var(--fg);background:var(--line)}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-8px}

/* ============ 回到最新 ============ */
#jump{position:absolute;right:20px;bottom:calc(var(--ch,150px) + 16px);width:34px;height:34px;border-radius:50%;background:var(--input);border:.5px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.16);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity calc(.3s * var(--animd)),transform calc(.35s * var(--animd)) cubic-bezier(.16,.84,.3,1);z-index:6;color:var(--fg2)}
#jump.on{opacity:1;pointer-events:auto;transform:none}
#jump:hover{color:var(--fg)}

 md:['Fast and smart','For complex tasks','Fastest and cheapest'],dc:[{t:'Batch rename script in Python',q:'Write a Python script that renames images in a folder by date.',a:'Sure. This script sorts the `.jpg` files in the current folder by modification time and renames them like `2026-11-12_001.jpg`.\n\n**How to use**\n\n- Save it as `rename.py` inside the image folder\n- Back up the originals, or preview with a dry run first\n- It only touches the current folder, not subfolders\n\n```python\nfrom pathlib import Path\nfrom datetime import datetime\n\nfor i, f in enumerate(sorted(Path(".").glob("*.jpg")), 1):\n    ts = datetime.fromtimestamp(f.stat().st_mtime)\n    f.rename(f"{ts:%Y-%m-%d}_{i:03d}{f.suffix}")\n    print(f)\n```\n\nIf you want to keep the original name, or sort by capture time instead of modification time, I can add that too.'},{t:'Polish my weekly report',q:'Polish this week’s report and make it sound more professional.',a:'Sure. Here is a tighter, results-first version:\n\n**Done this week**\n\n- Shipped the provider list, Base URL and model toggles on the model settings page\n- Fixed spacing around tool cards in multi-turn chats\n- Checked contrast in both light and dark themes\n\n**Next week**\n\n- Add the search settings page\n- Finish the mobile layout pass\n- Put together a regression checklist\n\nThe tone now leads with results instead of a task log. Send me the original text and I can rewrite it directly in this structure.'},{t:'React state management compared',q:'How should I choose React state management: Redux, Zustand or Jotai?',a:'Pick based on team size and the shape of your data:\n\n**Zustand**\n\n- Quick to learn and very little boilerplate\n- A good fit for small and mid-sized apps\n- Reach for it when you need shared state without a heavy architecture\n\n**Jotai**\n\n- Atom-based, great for fine-grained updates and derived state\n- Works well for forms and editors with frequent updates\n- The team needs to get comfortable splitting async function think(a,sg){
  const th=a.querySelector('.th');th.hidden=!S.think;
  th.innerHTML='<button class="thh"><span class="shim">'+t('thinking')+'</span>'+ic('chev')+'</button><div class="thb"><div>'+[t('tt'),t('tt2'),t('tt3')].slice(0,S.lvl).join('<br>')+'</div></div>';
  th.querySelector('.thh').onclick=()=>th.classList.toggle('open');
  const t0=Date.now(),d=[0,600,1400,2600][S.lvl]+Math.random()*500;while(Date.now()-t0<d&&!sg.stop)await sleep(60);
  const s=th.querySelector('span');s.className='';s.textContent=t('thought').replace('{n}',Math.max(1,Math.round((Date.now()-t0)/1000)));
}
function setActs(a,on){a.querySelector('.sp').classList.toggle('spin',!on);a.querySelector('.acts').classList.toggle('show',on)}
function fmtDur(ms){
  const s=Math.max(1,Math.round(ms/1000)),m=Math.floor(s/60),r=s%60;
  return m?t('dur_m').replace('{n}',m)+' '+t('dur_s').replace('{n}',r):t('dur_s').replace('{n}',s);
}
function foldFlow(a,ms){
  if(ms==null)return;
  const th=a.querySelector('.th');
  let w=a.querySelector('.wf');
  if(w){if(th&&w.contains(th))w.before(th);w.remove()}
  const ab=a.querySelector('.ab'),ecs=ab?[...ab.querySelectorAll('.ec')]:[];
  if(!th&&!ecs.length)return;
  w=document.createElement('div');w.className='wf';
  w.innerHTML='<button class="wfh"><span class="wft"></span>'+ic('chev')+'</button><div class="wfb"><div></div></div>';
  w.querySelector('.wft').textContent=t('worked').replace('{t}',fmtDur(ms));
  const body=w.querySelector('.wfb>div');
  if(th)body.append(th);
  ecs.forEach(c=>body.append(c));
  a.insertBefore(w,a.firstChild);
  w.querySelector('.wfh').onclick=()=>w.classList.toggle('open');
}
async function run(q){
  if(busy)return;busy=true;const sg={stop:false};sig=sg;sync();
  const atts=ATTS.slice();ATTS=[];renderAtts();
  const title=q?q.slice(0,28):(atts[0]?atts[0].name:'附件');
  if(!conv){conv={t:title,m:[],ts:Date.now()};document.body.classList.add('chat');$('#ttl').textContent=conv.t;addRc(conv);apply()}
  const c=conv;c.m.push({r:'u',v:q,a:atts});uMsg(q,c.m.length-1,atts);stick=true;follow();
  const a=aMsg(c.m.length),key=pick(q),ab=a.querySelector('.ab');let st='ok';
  const t0=Date.now()-58000;
  if(S.lvl)await think(a,sg);
  if(!sg.stop)st=await edit(ab,key,sg);
  const rep=(st==='no'?t('dn')+'\n\n':'')+t('r')[key];
  await paint(ab,rep,sg,false);
  const d=Date.now()-t0;
  c.m.push({r:'a',v:rep,k:key,s:st,d});foldFlow(a,d);setActs(a,true);
  if(sig===sg){busy=false;sync();
    STATS.turns++;STATS.steps+=4;STATS.totalTok+=Math.round(1500+Math.random()*3000);STATS.ctxMsgs+=Math.round(1200+Math.random()*2000);updateStatus();
  }
}

/* —— 最近列表 —— */
function fmtAgo(ts){
  const s=Math.max(0,Math.floor((Date.now()-(ts||0))/1000));
  if(s<60)return t('ago_now');
  if(s<3600)return t('ago_m').replace('{n}',Math.floor(s/60));
  if(s<86400)return t('ago_h').replace('{n}',Math.floor(s/3600));
  return t('ago_d').replace('{n}',Math.floor(s/86400));
}
function sortRcs(){
  const p=$('#rcp'),u=$('#rcu');if(!p||!u)return;
  const key=e=>+(e.dataset.pinAt||e.dataset.ts||0);
  [...p.querySelectorAll('.rc')].sort((a,b)=>key(b)-key(a)).forEach(e=>p.append(e));
  [...u.querySelectorAll('.rc')].sort((a,b)=>+(b.dataset.ts||0)-(+a.dataset.ts||0)).forEach(e=>u.append(e));
  p.hidden=!p.querySelector('.rc');
}
function refreshTimes(){document.querySelectorAll('#rcs .rc').forEach(el=>{if(el.dataset.ts)el.querySelector('.rcd').textContent=fmtAgo(+el.dataset.ts)})}
function addRc(c,decoy){
  const d=document.createElement('div');d.className='rc';
  c.id=c.id||('c'+Math.random().toString(36).slice(2,10));
  c.ts=c.ts||Date.now();d.dataset.ts=c.ts;
  d.innerHTML='<span class="rci">'+ic('pin')+'</span><span class="rct"></span><span class="rcmeta"><span class="rcdt"></span><span class="rcd"></span></span>';
  d.querySelector('.rct').textContent=c.t;
  d.querySelector('.rcd').textContent=fmtAgo(c.ts);
  if(decoy)d.dataset.toast='';
  else{c.el=d;document.querySelectorAll('.rc.on').forEach(e=>e.classList.remove('on'));d.classList.add('on');d.onclick=()=>open(c)}
  d.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();openChatMenu(c,d,e.clientX,e.clientY)};
  if(c.pin){d.classList.add('pin');d.dataset.pinAt=c.pinAt||Date.now();$('#rcp').append(d)}
  else $('#rcu').append(d);
  if(!decoy&&!CONVS.includes(c))CONVS.unshift(c);
  sortRcs();
  return d;
}

async function open(c){
  if(!c.m)return;
  go(null);if(busy&&sig)sig.stop=true;busy=false;
  if(document.body.classList.contains('chat')){feed.classList.add('fo');$('#ttl').classList.add('fo');await sleep(A(300))}
  conv=c;feed.innerHTML='';document.body.classList.add('chat');apply();$('#ttl').textContent=c.t;
  document.querySelectorAll('.rc.on').forEach(e=>e.classList.remove('on'));
  if(c.el)c.el.classList.add('on');
  for(let i=0;i<c.m.length;i++){
    const m=c.m[i];
    if(m.r==='u')uMsg(m.v,i,m.a);
    else{
      const a=aMsg(i),ab=a.querySelector('.ab');
      if(m.k)cards(ab,m.k,m.s);
      await paint(ab,m.v,{stop:false},true);
      setActs(a,true);if(m.d)foldFlow(a,m.d);
    }
  }
  stick=true;chat.scrollTop=chat.scrollHeight;sync();updateStatus();
  requestAnimationFrame(()=>{feed.classList.remove('fo');$('#ttl').classList.remove('fo')});
}
function newChat(){
  go(null);
  if(sig)sig.stop=true;busy=false;conv=null;document.body.classList.remove('chat');apply();
  setTimeout(()=>{if(!conv)feed.innerHTML=''},A(600));
  document.querySelectorAll('.rc.on').forEach(e=>e.classList.remove('on'));
  ATTS=[];renderAtts();
  ta.value='';fit();sync();updateStatus();ta.focus();greetAnim();
}

function sync(){
  sd.innerHTML=ic(busy?'stop':'send');
  sd.disabled=!busy&&!ta.value.trim()&&!ATTS.length;
}
function send(){
  if(busy){sig&&(sig.stop=true);return}
  const q=ta.value.trim();if(!q&&!ATTS.length)return;
  ta.value='';fit();slClose();run(q);
}
ta.addEventListener('input',()=>{fit();sync();slRender()});
ta.addEventListener('keydown',e=>{
  if(SLOPEN){
    if(e.key==='ArrowDown'){e.preventDefault();slIdx=(slIdx+1)%slItems.length;slPaint();return}
    if(e.key==='ArrowUp'){e.preventDefault();slIdx=(slIdx-1+slItems.length)%slItems.length;slPaint();return}
    if(e.key==='Tab'||(e.key==='Enter'&&!e.shiftKey&&!e.isComposing)){e.preventDefault();slPick(slItems[slIdx]);return}
    if(e.key==='Escape'){e.preventDefault();slClose();return}
  }
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});

let STATS = {
  turns: 2, steps: 8, tps: 41,
  totalTok: 251022, cacheHit: 71, uncachedIn: 71640, cacheRead: 175360, outTok: 4022,
  ctxLimit: 1000000, ctxSys: 7400, ctxTools: 8800, ctxMsgs: 28200
};
function updateStatus(){
  if(!STATS)return;
  const k=v=>v<1000?String(v):(v/1000).toFixed(v<10000?1:0)+'K';
  
  // 栏 1: 统计
  $('#sb-stats-tx').textContent = `${STATS.turns} 轮 ${STATS.steps} 步 · ${STATS.tps} tok/s`;
  $('#p-stats-top').textContent = `${STATS.turns} 轮 ${STATS.steps} 步`;
  $('#p-tps').textContent = `${STATS.tps} tok/s`;
  
  // 栏 2: Token
  $('#sb-token-tx').textContent = `${k(STATS.totalTok)} tok · 缓存命中 ${STATS.cacheHit}%`;
  $('#p-token-top').textContent = STATS.totalTok.toLocaleString()+' tok';
  $('#p-cache-hit').textContent = `${STATS.cacheHit}%`;
  $('#p-uncached').textContent = STATS.uncachedIn.toLocaleString()+' tok';
  $('#p-cache-read').textContent = STATS.cacheRead.toLocaleString()+' tok';
  $('#p-output').textContent = STATS.outTok.toLocaleString()+' tok';

  // 栏 3: 上下文
  const ctxUsed = STATS.ctxSys + STATS.ctxTools + STATS.ctxMsgs;
  const ctxPct = (ctxUsed / STATS.ctxLimit) * 100;
  $('#sb-ctx-tx').textContent = `${Math.round(ctxPct)}%`;
  $('#p-ctx-pct').textContent = `${Math.round(ctxPct)}%`;
  $('#p-ctx-val').textContent = `~${k(ctxUsed)} / ${k(STATS.ctxLimit)}`;
  
  const pSys = (STATS.ctxSys / ctxUsed) * 100;
  const pTools = (STATS.ctxTools / ctxUsed) * 100;
  const pMsgs = (STATS.ctxMsgs / ctxUsed) * 100;
  $('#p-bar-sys').style.width = pSys+'%';
  $('#p-bar-tools').style.width = pTools+'%';
  $('#p-bar-msgs').style.width = pMsgs+'%';
  
  $('#p-sys').textContent = `~${k(STATS.ctxSys)}`;
  $('#p-tools').textContent = `~${k(STATS.ctxTools)}`;
  $('#p-msgs').textContent = `~${k(STATS.ctxMsgs)}`;
}

/* —— 导出 —— */
function exportChat(){
  if(!conv||!conv.m.length){toast(t('export_none'));return}
  let md='# '+conv.t+'\n\n';
  conv.m.forEach(m=>{
    md+=(m.r==='u'?'## You\n\n':'## Parable\n\n')+(m.v||'')+'\n\n';
  });
  try{
    const b=new Blob([md],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=(conv.t||'conversation').replace(/[\\/:*?"<>|]/g,'_')+'.md';
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    toast(t('exported'));
  }catch(err){toast(t('toast'))}
}

    {k:'clear',ic:'trash',t:z?'清空当前对话':'Clear conversation',run:()=>{

    }},
    {k:'export',ic:'dl',t:z?'导出为 Markdown':'Export as Markdown',run:()=>exportChat()},
    {k:'theme',ic:'art',t:z?'切换浅色 / 深色':'Toggle light / dark',run:()=>{S.theme=S.theme==='dark'?'light':'dark';apply()}},
    {k:'model',ic:'tune',t:z?'切换模型':'Cycle model',run:()=>{S.model=(S.model+1)%MN.length;apply();toast(MN[S.model])}},
    {k:'think',ic:'tune',t:z?'调整思考强度':'Cycle thinking effort',run:()=>{S.lvl=(S.lvl+1)%4;apply();toast(t('lvlT')+' · '+t('l'+S.lvl))}},

function slRender(){
  const v=ta.value;
  if(!v.startsWith('/')||/\s/.test(v)){slClose();return}
  const q=v.slice(1).toLowerCase();
  const all=slashList().filter(x=>!q||x.k.includes(q)||x.t.toLowerCase().includes(q));
  if(!all.length){slClose();return}
  slItems=all;if(slIdx>=slItems.length)slIdx=0;SLOPEN=true;
  SL.innerHTML=slItems.map((x,i)=>'<div class="cmdi'+(i===slIdx?' on':'')+'" data-si="'+i+'"><span class="ic2">'+ic(x.ic)+'</span><span class="tx2">'+esc(x.t)+'</span><span class="kb">/'+x.k+'</span></div>').join('');
  SL.classList.add('open');

function slPaint(){
  SL.querySelectorAll('.cmdi').forEach(el=>el.classList.toggle('on',+el.dataset.si===slIdx));
  const el=SL.querySelector('.cmdi.on');if(el)el.scrollIntoView({block:'nearest'});
}
function slClose(){SLOPEN=false;SL.classList.remove('open')}
function slPick(it){
  if(!it)return;slClose();ta.value='';fit();sync();it.run();
}
SL.addEventListener('mousedown',e=>{
  const el=e.target.closest('[data-si]');if(!el)return;
  e.preventDefault();slPick(slItems[+el.dataset.si]);
});

/* —— 命令面板 —— */
const cmdK=$('#cmdk'),cmdIn=$('#cmdin'),cmdL=$('#cmdl');
let cmdItems=[],cmdIdx=0;
function cmdActions(){
  const z=S.lang==='zh';
  return [
    {id:'new',icon:'plus',t:z?'新建对话':'New chat',k:'Ctrl ⇧ O',run:()=>newChat()},
    {id:'set',icon:'tune',t:z?'打开设置':'Open settings',k:'Ctrl ,',run:()=>openSet()},
    {id:'theme',icon:'art',t:(z?'切换配色模式 · 当前 ':'Toggle theme · ')+t(S.theme),run:()=>{S.theme=S.theme==='dark'?'light':S.theme==='light'?'auto':'dark';apply();renderCmd()}},
    {id:'think',icon:'tune',t:(z?'思考强度 · ':'Thinking · ')+t('l'+S.lvl),run:()=>{S.lvl=(S.lvl+1)%4;apply();renderCmd()}},
    {id:'perm',icon:'check',t:(z?'权限模式 · ':'Permission · ')+t('p_'+S.perm),run:()=>{S.perm=PK[(PK.indexOf(S.perm)+1)%3];apply();renderCmd()}},
    {id:'model',icon:'tune',t:(z?'切换模型 · ':'Model · ')+MN[S.model],run:()=>{S.model=(S.model+1)%MN.length;apply();renderCmd()}},
    {id:'export',icon:'dl',t:z?'导出当前对话':'Export conversation',run:()=>exportChat()},
    {id:'kbd',icon:'help',t:z?'键盘快捷键':'Keyboard shortcuts',k:'Ctrl /',run:()=>openKbd()}
  ];
}
function renderCmd(){
  const q=cmdIn.value.trim().toLowerCase();
  const acts=cmdActions().filter(a=>!q||a.t.toLowerCase().includes(q)||a.id.includes(q));
  const cs=CONVS.filter(c=>!q||(c.t||'').toLowerCase().includes(q)).slice(0,12);
  let html='';cmdItems=[];
  if(acts.length){
    html+='<div class="cmdg">'+t('actions')+'</div>';
    acts.forEach(a=>{
      cmdItems.push({run:a.run});
      html+='<div class="cmdi" data-ci="'+(cmdItems.length-1)+'"><span class="ic2">'+ic(a.icon)+'</span><span class="tx2">'+esc(a.t)+'</span>'+(a.k?'<span class="kb">'+a.k+'</span>':'')+'</div>';
    });
  }
  if(cs.length){
    html+='<div class="cmdg">'+t('rec')+'</div>';
    cs.forEach(c=>{
      cmdItems.push({run:()=>open(c)});
      html+='<div class="cmdi" data-ci="'+(cmdItems.length-1)+'"><span class="ic2">'+ic('chat')+'</span><span class="tx2">'+esc(c.t)+'</span><span class="kb">'+fmtAgo(c.ts)+'</span></div>';
    });
  }
  if(!cmdItems.length)html='<div class="cmdempty">'+t('noresult')+'</div>';
  cmdL.innerHTML=html;
  cmdIdx=0;cmdPaint();
}
function cmdPaint(){
  cmdL.querySelectorAll('.cmdi').forEach(el=>el.classList.toggle('on',+el.dataset.ci===cmdIdx));
  const el=cmdL.querySelector('.cmdi.on');if(el)el.scrollIntoView({block:'nearest'});
}
function openCmd(){
  cmdK.classList.add('open');cmdIn.value='';cmdIn.focus();renderCmd();
}
function closeCmd(){cmdK.classList.remove('open');cmdIn.blur()}
cmdIn.addEventListener('input',renderCmd);
cmdIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(cmdItems.length){cmdIdx=(cmdIdx+1)%cmdItems.length;cmdPaint()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(cmdItems.length){cmdIdx=(cmdIdx-1+cmdItems.length)%cmdItems.length;cmdPaint()}}
  else if(e.key==='Enter'){e.preventDefault();const it=cmdItems[cmdIdx];closeCmd();it&&it.run()}
  else if(e.key==='Escape'){e.preventDefault();closeCmd()}
});
cmdL.addEventListener('click',e=>{
  const el=e.target.closest('[data-ci]');if(!el)return;
  const it=cmdItems[+el.dataset.ci];closeCmd();it&&it.run();
});
cmdK.addEventListener('click',e=>{if(e.target===cmdK)closeCmd()});
$('#cmdbtn').onclick=openCmd;
$('#navsearch').onclick=openCmd;

  const del=e.target.closest('[data-mpdel]');
  if(del){mpCur().models.splice(+del.dataset.mpdel,1);mpDetail();toast(t('mp_deleted'));return}
  if(e.target.closest('[data-mpedit]')){toast(t('mp_edit'));return}
  const mt=e.target.closest('[data-mpm]');
  if(mt){const m=mpCur().models[+mt.dataset.mpm];m.on=!m.on;mt.classList.toggle('on',m.on);return}
  const pt=e.target.closest('[data-mpp]');
  if(pt){const p=mpCur();p.on=!p.on;pt.classList.toggle('on',p.on);mpList();return}
  if(e.target.closest('[data-mpaddm]')){const p=mpCur();let n=1;while(p.models.some(m=>m.n==='new-model-'+n))n++;p.models.push({n:'new-model-'+n,ctx:'128K',vis:false,on:true});mpDetail();toast(t('mp_addedm'));return}
  if(e.target.closest('[data-mpaddp]')){const p={id:'p'+Date.now(),n:'',c:'#64748b',s:'+',on:true,base:'',api:'anthropic',key:'',models:[]};MPROV.push(p);mpSel=p.id;mpList();mpDetail();toast(t('mp_addedp'));return}
  if(e.target.closest('[data-mprefresh]')){toast(t('mp_refreshed'));return}
  const gk=e.target.closest('[data-mpgetkey]');
  if(gk){e.preventDefault();toast(t('mp_getkeytoast'));return}
  if(e.target.closest('[data-mpmore]')){toast(t('mp_moretoast'));return}
});
$('#sp').addEventListener('input',e=>{
  if(tab!=='m')return;
  const f=e.target.closest('[data-mpf]');if(!f)return;
  const p=mpCur(),k=f.dataset.mpf;
  if(k==='name'){p.n=f.value;const h=$('#mpname');if(h)h.textContent=f.value||t('mp_newp');mpList()}
  else p[k]=f.value;
});
$('#sp').addEventListener('change',e=>{
  if(tab!=='m')return;
  const f=e.target.closest('[data-mpf]');if(!f)return;
  mpCur()[f.dataset.mpf]=f.value;
});

/* —— 全局快捷键 —— */
addEventListener('keydown',e=>{
  const m=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){
    if($('#cmdk').classList.contains('open')){closeCmd();return}
    if($('#kbd').classList.contains('open')){$('#kbd').classList.remove('open');return}
    if(SLOPEN){slClose();return}
    if($('#modal').classList.contains('open'))closeSet();
    else if(busy&&sig)sig.stop=true;
  }
  if(m&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmdk').classList.contains('open')?closeCmd():openCmd()}
  if(m&&e.key==='/'){e.preventDefault();openKbd()}
  if(m&&e.key===','){e.preventDefault();openSet()}
  if(m&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();newChat()}
});

/* —— 启动 —— */
if(innerWidth<760||!S.side)document.body.classList.add('sc');
const dcAgo=[6,19,24,288];
t('dc').forEach((x,i)=>addRc({t:x.t,m:[{r:'u',v:x.q},{r:'a',v:x.a}],ts:Date.now()-dcAgo[i]*3600e3}));
document.querySelectorAll('.rc.on').forEach(e=>e.classList.remove('on'));
apply();sync();greetAnim();updateStatus();
</script>
